function fmt(n){return (Number(n)||0).toLocaleString('fr-FR');}
function unlimited(n){return n===-1||n===null||n===undefined?'Illimité':fmt(n);}
function formatTime(s){if(!s||!isFinite(s))return '0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function timeAgo(value){
  const seconds=Math.floor((Date.now()-new Date(value).getTime())/1000);
  if(seconds<60)return "à l'instant";
  if(seconds<3600)return Math.floor(seconds/60)+' min';
  if(seconds<86400)return Math.floor(seconds/3600)+' h';
  return Math.floor(seconds/86400)+' j';
}
async function hashFile(file){
  try{
    const data=await file.arrayBuffer();
    const hash=await crypto.subtle.digest('SHA-256',data);
    return Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }catch(e){return null;}
}
function pdfSafe(value){
  return String(value===null||value===undefined?'':value)
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[’‘]/g,"'").replace(/[“”]/g,'"')
    .replace(/[–—]/g,'-').replace(/[•·]/g,'-');
}

async function downloadContract(contractNo,toast){
  try{
    if(!window.jspdf||!window.jspdf.jsPDF)throw new Error('PDF non chargé. Vérifie ta connexion internet puis recharge.');
    const result=await sb.rpc('get_contract',{p_no:contractNo});
    if(result.error)throw result.error;
    const d=result.data;
    if(!d)throw new Error('Contrat introuvable.');

    const PDF=window.jspdf.jsPDF;
    const doc=new PDF({unit:'mm',format:'a4'});
    let y=38;

    function newPage(){
      doc.addPage();
      header();
      y=38;
    }
    function header(){
      doc.setFillColor(5,5,8);doc.rect(0,0,210,27,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(17);doc.setTextColor(226,176,83);
      doc.text('213WAVE',16,14);
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(200,200,200);
      doc.text('CONTRAT DE LICENCE MUSICALE',16,21);
      doc.setDrawColor(226,176,83);doc.line(16,29,194,29);
    }
    function ensure(height){
      if(y+height>270)newPage();
    }
    function section(text){
      ensure(12);
      doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(20,20,20);
      doc.text(pdfSafe(text),16,y);
      y+=3;doc.setDrawColor(218,218,218);doc.line(16,y,194,y);y+=6;
    }
    function row(label,value){
      const val=pdfSafe(value||'-');
      doc.setFont('helvetica','normal');doc.setFontSize(8.5);
      const lines=doc.splitTextToSize(val,105);
      const height=Math.max(5,lines.length*4);
      ensure(height+1);
      doc.setTextColor(95,95,95);doc.text(pdfSafe(label),18,y);
      doc.setFont('helvetica','bold');doc.setTextColor(30,30,30);doc.text(lines,82,y);
      y+=height+1;
    }
    function paragraph(text){
      const lines=doc.splitTextToSize(pdfSafe(text),174);
      const height=lines.length*4;
      ensure(height+2);
      doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(55,55,55);
      doc.text(lines,18,y);y+=height+2;
    }

    header();
    doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(20,20,20);
    doc.text('REFERENCE : '+pdfSafe(d.no),16,y);y+=8;
    paragraph('Document généré le '+new Date().toLocaleString('fr-FR')+'.');

    section('1. PARTIES');
    row('Producteur',d.seller_name);
    if(d.license==='exclusive')row('Nom légal du producteur',d.seller_legal);
    row('Acheteur',d.buyer_name);
    if(d.license==='exclusive')row('Nom légal de l acheteur',d.buyer_legal);

    section('2. OEUVRE CONCERNEE');
    row('Titre',d.title);
    row('Type',d.type==='vst'?'Plugin VST':'Beat');
    if(d.type!=='vst')row('Genre / BPM / gamme',(d.genre||'-')+' / '+(d.bpm||'-')+' / '+(d.musickey||'-'));
    row('Publiée le',d.created?new Date(d.created).toLocaleString('fr-FR'):'-');
    if(d.hash)row('Empreinte SHA-256',d.hash);

    section('3. LICENCE ACCORDEE');
    row('Licence',LICENSE_NAMES[d.license]||d.license);
    const limits=d.limits||{};
    if(d.type==='vst'){
      row('Activations','3 machines maximum');
      row('Partage de clé','Interdit');
    }else{
      row('Streams autorisés',unlimited(limits.streams));
      row('Copies vendues',unlimited(limits.copies));
      row('Clips vidéo',unlimited(limits.videos));
      row('Stations radio',limits.radio===-1?'Illimitées':(Number(limits.radio)>0?limits.radio+' stations':'Non autorisé'));
      row('Concerts payants',limits.shows?'Autorisés':'Non autorisés');
      row('Tag producteur',limits.tag?'À conserver':'Retiré');
      row('Crédit Prod. by','Obligatoire');
      row('Durée',limits.years===-1?'Illimitée':(limits.years||'-')+' ans');
      row('Exclusivité',d.license==='exclusive'?'Oui — beat retiré du catalogue':'Non');
    }

    section('4. CONDITIONS FINANCIERES');
    row('Prix payé',fmt(d.amount)+' DZD');
    row('Part producteur',fmt(d.seller_amount)+' DZD');
    row('Commission ('+d.rate+'%)',fmt(d.fee)+' DZD');
    row('Paiement','Virement CCP / BaridiMob vérifié par la plateforme');

    if(d.vst_key){
      section('5. CLE VST');
      row('Clé d activation',d.vst_key);
    }

    section((d.vst_key?'6.':'5.')+' ENGAGEMENTS');
    paragraph('Le Producteur déclare être l auteur original du contenu et garantit qu il ne porte atteinte à aucun droit de tiers.');
    paragraph('L Acheteur s engage à respecter les limites décrites dans ce contrat. La licence ne transfère pas la propriété du beat et n autorise pas la revente ou la redistribution du fichier source.');
    paragraph('Le crédit Producteur doit être indiqué comme prévu par la licence. Les droits et obligations sont régis par les conditions acceptées au moment de la commande.');
    paragraph('YANrecords agit comme intermédiaire technique et n est pas partie à la licence conclue entre le Vendeur et l Acheteur. Le présent document ne remplace pas un conseil juridique.');

    section((d.vst_key?'7.':'6.')+' ACCEPTATION ET LIVRAISON');
    row('Acceptation horodatée',d.accepted_at?new Date(d.accepted_at).toLocaleString('fr-FR'):'-');
    row('Livraison validée',d.date?new Date(d.date).toLocaleString('fr-FR'):'-');
    if(d.terms_version)row('Version des conditions',d.terms_version);

    const pages=doc.getNumberOfPages();
    for(let i=1;i<=pages;i++){
      doc.setPage(i);
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,120,120);
      doc.text('213WAVE · Contrat '+pdfSafe(d.no)+' · Page '+i+'/'+pages,16,287);
    }
    doc.save('Contrat-'+pdfSafe(d.no)+'.pdf');
    toast('Contrat PDF téléchargé.');
  }catch(error){toast(error.message||'Impossible de créer le contrat PDF.','error');}
}

function Icon(props){
  const filled=props.name==='play'||props.name==='pause';
  return <svg className={props.className||''} width={props.size||20} height={props.size||20} viewBox="0 0 24 24"
    fill={filled?'currentColor':'none'} stroke={filled?'none':'currentColor'} strokeWidth="2"
    strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{ICONS[props.name]||null}</svg>;
}

class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return {error:error};}
  render(){
    if(this.state.error)return <div className="min-h-screen flex items-center justify-center p-5"><div className="card max-w-md p-8 rounded-2xl text-center">
      <h2 className="text-2xl font-black mb-3">Erreur d'affichage</h2>
      <p className="text-sm text-gray-400 mb-5">{String(this.state.error.message||this.state.error)}</p>
      <button onClick={function(){location.reload();}} className="bg-cyanNeon text-black font-black px-6 py-3 rounded-xl">Recharger</button>
    </div></div>;
    return this.props.children;
  }
}

function Toasts(props){
  return <div className="fixed top-20 right-4 z-[200] flex flex-col gap-3 max-w-sm">
    {props.items.map(function(item){
      return <div key={item.id} className="toast card rounded-xl p-4 flex items-center gap-3 border-l-4" style={{borderLeftColor:item.type==='error'?'#ef4444':'#10b981'}}>

function AuthPage(props){
  const [mode,setMode]=React.useState('login');
  const [email,setEmail]=React.useState('');
  const [password,setPassword]=React.useState('');
  const [name,setName]=React.useState('');
  const [error,setError]=React.useState('');
  const [busy,setBusy]=React.useState(false);
  const [accepted,setAccepted]=React.useState(false);

  async function submit(e){
    e.preventDefault();setError('');
    if(mode==='register'&&!accepted){setError('Accepte les CGU pour continuer.');return;}
    setBusy(true);
    try{
      if(mode==='login'){
        const r=await sb.auth.signInWithPassword({email:email,password:password});
        if(r.error)throw r.error;
        props.toast('Connecté !');
      }else{
        const r=await sb.auth.signUp({email:email,password:password,options:{data:{full_name:name||email.split('@')[0]}}});
        if(r.error)throw r.error;
        if(r.data.user&&!r.data.session)props.toast('Vérifie ton email pour activer ton compte.');
        else props.toast('Compte créé !');
      }
    }catch(ex){setError(ex.message);}
    setBusy(false);
  }
  async function google(){
    const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin}});
    if(r.error)props.toast(r.error.message,'error');
  }

  return <div className="min-h-screen flex items-center justify-center p-4 relative">
    <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1600&q=80')] bg-cover bg-center"></div>
    <div className="absolute inset-0 bg-obsidian/90 backdrop-blur-md"></div>
    <div className="relative z-10 w-full max-w-5xl grid lg:grid-cols-2 gap-10 items-center fade">
      <div className="space-y-6 text-center lg:text-left">
        <BrandLogo/>
        <h1 className="text-4xl md:text-5xl font-black leading-tight">LE SON<br/><span className="tgold">ALGÉRIEN</span></h1>
        <p className="text-gray-400 text-lg">Beats, plugins VST, licences et contrats.</p>
      </div>
      <div className="card p-8 rounded-[2rem]">
        <div className="flex bg-obsidian rounded-xl p-1 mb-7 border border-borderDark">
          <button onClick={function(){setMode('login');setError('');}} className={'flex-1 py-3 rounded-lg text-sm font-bold '+(mode==='login'?'bg-cyanNeon text-black':'text-gray-400')}>Connexion</button>
          <button onClick={function(){setMode('register');setError('');}} className={'flex-1 py-3 rounded-lg text-sm font-bold '+(mode==='register'?'bg-goldAccent text-black':'text-gray-400')}>Créer un compte</button>
        </div>
        <form onSubmit={submit} className="space-y-4">
          {mode==='register'?<div><label className="text-xs text-gray-400 block mb-1">Nom d'artiste</label><input required maxLength="50" value={name} onChange={function(e){setName(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"/></div>:null}
          <div><label className="text-xs text-gray-400 block mb-1">Email</label><input type="email" required value={email} onChange={function(e){setEmail(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"/></div>
          <div><label className="text-xs text-gray-400 block mb-1">Mot de passe (6+)</label><input type="password" required minLength="6" value={password} onChange={function(e){setPassword(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"/></div>
          {mode==='register'?<label className="flex items-start gap-3 text-xs text-gray-400"><input type="checkbox" checked={accepted} onChange={function(e){setAccepted(e.target.checked);}} className="mt-1 accent-goldAccent"/>J'accepte les <a href="infos.html#cgu" target="_blank" className="text-goldAccent underline">CGU</a>.</label>:null}
          {error?<p className="text-sm text-red-400">{error}</p>:null}
          <button disabled={busy} className={'w-full py-4 rounded-xl font-black disabled:opacity-50 '+(mode==='login'?'bg-cyanNeon text-black':'bg-goldAccent text-black')}>{busy?'...':mode==='login'?'SE CONNECTER':"S'INSCRIRE"}</button>
        </form>
        <div className="flex items-center gap-3 my-5 text-xs text-gray-500"><div className="h-px bg-borderDark flex-1"></div>OU<div className="h-px bg-borderDark flex-1"></div></div>
        <button onClick={google} className="w-full bg-white text-black font-bold py-3 rounded-xl">Continuer avec Google</button>
      </div>
    </div>
  </div>;
}

function ProducerPage(props){
  const [producer,setProducer]=React.useState(null);
  const [tab,setTab]=React.useState('beat');
  const [busy,setBusy]=React.useState(false);

  React.useEffect(function(){
    let active=true;setProducer(null);
    sb.rpc('get_producer',{p_id:props.id}).then(function(r){if(active)setProducer(r.data||null);});
    return function(){active=false;};
  },[props.id]);

  const mine=props.tracks.filter(function(t){return t.producer_id===props.id;});
  const beats=mine.filter(function(t){return t.type==='beat';});
  const vsts=mine.filter(function(t){return t.type==='vst';});

  async function follow(){
    setBusy(true);
    const r=await sb.rpc('toggle_follow',{p_id:props.id});
    if(r.error)props.toast(r.error.message,'error');
    else{
      setProducer(Object.assign({},producer,{
        is_following:r.data.following,
        notify:r.data.notify,
        followers:(producer.followers||0)+(r.data.following?1:-1)
      }));
      props.toast(r.data.following?'Abonné !':'Désabonné.');
    }
    setBusy(false);
  }

  async function bell(){
    const r=await sb.rpc('toggle_bell',{p_id:props.id});
    if(r.error){props.toast(r.error.message,'error');return;}
    setProducer(Object.assign({},producer,{notify:r.data.notify}));
    props.toast(r.data.notify?'Notifications activées.':'Notifications coupées.');
  }

  if(!producer)return <div className="flex justify-center py-20"><div className="loader"></div></div>;
  const list=tab==='beat'?beats:vsts;

  return <section className="fade space-y-6">
    <div className="banner card rounded-[2rem] p-7 md:p-10">
      <div className="flex flex-col md:flex-row items-center md:items-end gap-6">
        <div className="ringg w-28 h-28"><img src={producer.avatar_url||DEFAULT_AVATAR} className="w-full h-full rounded-full object-cover" alt=""/></div>
        <div className="flex-1 text-center md:text-left">
          <p className="text-[10px] uppercase font-black text-goldAccent tracking-widest">Producteur · Algérie</p>
          <h1 className="text-3xl md:text-5xl font-black">{producer.name}</h1>
          <p className="text-sm text-gray-300 mt-2">{producer.bio||'Pas encore de bio.'}</p>
          {producer.instagram?<a href={'https://instagram.com/'+String(producer.instagram).replace('@','')} target="_blank" rel="noreferrer" className="text-xs text-pinkNeon inline-flex items-center gap-1 mt-2"><Icon name="instagram" size={15}/>@{String(producer.instagram).replace('@','')}</a>:null}
        </div>
        <div className="flex gap-2 flex-wrap justify-center">
          {props.me===props.id
            ?<button onClick={function(){props.setView('settings');}} className="bg-white text-black font-black px-5 py-3 rounded-xl">Modifier mon profil</button>
            :<React.Fragment>
              <button disabled={busy} onClick={follow} className={'px-5 py-3 rounded-xl text-sm font-black '+(producer.is_following?'bg-cardDark border border-greenPro text-greenPro':'bg-pinkNeon text-black')}>
                {producer.is_following?'Abonné':"S'abonner"}
              </button>
              {producer.is_following?<button onClick={bell} className="w-12 h-12 rounded-xl border border-borderDark text-goldAccent flex items-center justify-center"><Icon name={producer.notify?'bell':'bellOff'}/></button>:null}
              <button onClick={function(){props.openChat(props.id,producer.name);}} className="w-12 h-12 rounded-xl border border-cyanNeon text-cyanNeon flex items-center justify-center"><Icon name="chat"/></button>
            </React.Fragment>}
          <button onClick={props.share} className="w-12 h-12 rounded-xl border border-borderDark flex items-center justify-center"><Icon name="share"/></button>
        </div>
      </div>
      <div className="grid grid-cols-4 gap-2 mt-7">
        <div className="bg-black/40 rounded-xl p-3 text-center"><p className="font-black text-goldAccent text-xl">{producer.beats_count||0}</p><p className="text-[9px] text-gray-400">BEATS</p></div>
        <div className="bg-black/40 rounded-xl p-3 text-center"><p className="font-black text-cyanNeon text-xl">{producer.vsts_count||0}</p><p className="text-[9px] text-gray-400">VST</p></div>
        <div className="bg-black/40 rounded-xl p-3 text-center"><p className="font-black text-xl">{fmt(producer.plays||0)}</p><p className="text-[9px] text-gray-400">ÉCOUTES</p></div>
        <div className="bg-black/40 rounded-xl p-3 text-center"><p className="font-black text-pinkNeon text-xl">{fmt(producer.followers||0)}</p><p className="text-[9px] text-gray-400">ABONNÉS</p></div>
      </div>
    </div>

    <div className="flex gap-6 border-b border-borderDark">
      <button onClick={function(){setTab('beat');}} className={'tab pb-3 text-xs font-black '+(tab==='beat'?'on text-white':'text-gray-500')}>BEATS ({beats.length})</button>
      <button onClick={function(){setTab('vst');}} className={'tab pb-3 text-xs font-black '+(tab==='vst'?'on text-white':'text-gray-500')}>VST ({vsts.length})</button>
    </div>

    {list.length===0?<p className="text-center text-gray-500 py-10">Aucune publication dans cette catégorie.</p>:
    <div className="grid md:grid-cols-3 gap-5">{list.map(function(t){
      return <div key={t.id} className="card rounded-2xl p-4 lift">
        <img src={t.cover_url||DEFAULT_COVER} className="w-full h-40 rounded-xl object-cover mb-3" alt=""/>
        <h3 className="font-black truncate">{t.title}</h3>
        <p className="text-xs text-gray-400">{t.type==='vst'?'Plugin VST':t.genre+' · '+t.bpm+' BPM'}</p>

        </div>
      </div>;
    })}</div>}
  </section>;

function BeatsView(props){
  const [query,setQuery]=React.useState('');
  const [genre,setGenre]=React.useState('Tous');
  const [sort,setSort]=React.useState('recent');
  const [limit,setLimit]=React.useState(15);

  let list=props.tracks.filter(function(t){
    if(t.type!=='beat')return false;
    if(genre!=='Tous'&&t.genre!==genre)return false;
    if(query){
      const q=query.toLowerCase();
      if(!(t.title||'').toLowerCase().includes(q)&&!(t.producer_name||'').toLowerCase().includes(q))return false;
    }
    return true;
  });
  if(sort==='popular')list=list.slice().sort(function(a,b){return (b.plays||0)-(a.plays||0);});
  if(sort==='cheap')list=list.slice().sort(function(a,b){return (a.price_mp3||0)-(b.price_mp3||0);});
  const matched=query?props.producers.filter(function(p){return (p.name||'').toLowerCase().includes(query.toLowerCase());}).slice(0,4):[];

  return <section className="fade space-y-4">
    <div className="flex flex-col md:flex-row justify-between gap-3">
      <h2 className="text-3xl font-black border-l-4 border-goldAccent pl-4">BEATSTORE</h2>
      <div className="flex gap-2">
        <input value={query} onChange={function(e){setQuery(e.target.value);setLimit(15);}} placeholder="Beat ou beatmaker..." className="bg-cardDark border border-borderDark rounded-xl px-4 py-2.5 text-xs outline-none focus:border-goldAccent"/>
        <select value={sort} onChange={function(e){setSort(e.target.value);}} className="bg-cardDark border border-borderDark rounded-xl px-3 text-xs text-white"><option value="recent">Récent</option><option value="popular">Populaire</option><option value="cheap">Prix bas</option></select>
      </div>
    </div>
    {matched.length>0?<div className="card p-4 rounded-xl">
      <p className="text-[10px] font-black text-pinkNeon uppercase mb-3">Producteurs trouvés</p>
      <div className="flex gap-2 overflow-x-auto">{matched.map(function(p){
        return <button key={p.id} onClick={function(){props.openProducer(p.id);}} className="flex items-center gap-2 p-2 bg-obsidian border border-borderDark rounded-xl flex-shrink-0">
          <img src={p.avatar_url||DEFAULT_AVATAR} className="w-8 h-8 rounded-full object-cover" alt=""/><span className="text-xs font-bold">{p.name}</span>
        </button>;
      })}</div>
    </div>:null}
    <div className="flex gap-2 overflow-x-auto pb-2">{GENRES.map(function(g){
      return <button key={g} onClick={function(){setGenre(g);setLimit(15);}} className={'px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap '+(genre===g?'bg-goldAccent text-black':'bg-cardDark text-gray-400 border border-borderDark')}>{g}</button>;
    })}</div>
    {list.length===0?<p className="text-center text-gray-400 py-12">Aucun beat trouvé.</p>:

/* ---------- MESSAGERIE ---------- */
function MessagesView(props){
  const [conversations,setConversations]=React.useState([]);
  const [peer,setPeer]=React.useState(props.initialPeer||null);
  const [peerName,setPeerName]=React.useState(props.initialName||'');
  const [messages,setMessages]=React.useState([]);
  const [text,setText]=React.useState('');
  const [busy,setBusy]=React.useState(false);
  const endRef=React.useRef(null);

  async function loadConversations(){
    const r=await sb.rpc('my_conversations');
    if(r.data)setConversations(r.data);
  }
  async function loadThread(id){
    const filter='and(sender_id.eq.'+props.userId+',recipient_id.eq.'+id+'),and(sender_id.eq.'+id+',recipient_id.eq.'+props.userId+')';
    const r=await sb.from('messages').select('*').or(filter).order('created_at',{ascending:true}).limit(200);
    if(r.error){props.toast(r.error.message,'error');return;}
    if(r.data)setMessages(r.data);
    const mark=await sb.rpc('mark_msgs_read',{p_peer:id});
    if(mark.error)console.warn(mark.error.message);
    props.refreshUnread();
  }

  React.useEffect(function(){loadConversations();},[]);
  React.useEffect(function(){
    if(props.initialPeer){setPeer(props.initialPeer);setPeerName(props.initialName||'');}
  },[props.initialPeer,props.initialName]);
  React.useEffect(function(){if(peer)loadThread(peer);},[peer]);
  React.useEffect(function(){if(endRef.current)endRef.current.scrollIntoView({behavior:'smooth'});},[messages]);

  React.useEffect(function(){
    const channel=sb.channel('messages-'+props.userId)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(payload){
        const m=payload.new;
        if(m.sender_id===props.userId||m.recipient_id===props.userId){
          if(peer&&(m.sender_id===peer||m.recipient_id===peer)){
            setMessages(function(old){return old.some(function(x){return x.id===m.id;})?old:old.concat([m]);});
          }
          loadConversations();props.refreshUnread();
        }
      }).subscribe();
    return function(){sb.removeChannel(channel);};
  },[peer,props.userId]);

  async function send(e){
    e.preventDefault();
    if(!text.trim()||!peer)return;
    setBusy(true);
    const body=text.trim();
    const r=await sb.from('messages').insert({sender_id:props.userId,recipient_id:peer,body:body});
    if(r.error)props.toast(r.error.message,'error');
    else{setText('');await loadThread(peer);loadConversations();}
    setBusy(false);
  }

  return <section className="fade">
    <h2 className="text-3xl font-black border-l-4 border-cyanNeon pl-4 mb-5">MESSAGES</h2>
    <div className="grid md:grid-cols-3 gap-4 h-[560px]">
      <div className={'card rounded-2xl p-3 overflow-y-auto '+(peer?'hidden md:block':'')}>
        <p className="text-[10px] font-black text-gray-500 uppercase px-2 py-2">Conversations</p>
        {conversations.length===0?<p className="text-xs text-gray-500 text-center py-10">Aucune conversation.<br/>Ouvre un profil et clique sur 💬.</p>:
        conversations.map(function(c){
          return <button key={c.peer_id} onClick={function(){setPeer(c.peer_id);setPeerName(c.peer_name);}} className={'w-full flex items-center gap-3 p-2.5 rounded-xl text-left '+(peer===c.peer_id?'bg-cyanNeon/10 border border-cyanNeon/40':'hover:bg-white/5')}>
            <img src={c.peer_avatar||DEFAULT_AVATAR} className="w-10 h-10 rounded-full object-cover" alt=""/>
            <div className="min-w-0 flex-1"><p className="text-sm font-bold truncate">{c.peer_name}</p><p className="text-[11px] text-gray-500 truncate">{c.last_body}</p></div>
            {Number(c.unread)>0?<span className="bg-pinkNeon text-black text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center">{c.unread}</span>:null}
          </button>;
        })}
      </div>
      <div className={'md:col-span-2 card rounded-2xl flex flex-col '+(peer?'':'hidden md:flex')}>
        {!peer?<div className="flex-1 flex items-center justify-center text-sm text-gray-500">Choisis une conversation.</div>:
        <React.Fragment>
          <div className="flex items-center gap-3 p-4 border-b border-borderDark">
            <button onClick={function(){setPeer(null);}} className="md:hidden"><Icon name="back"/></button>
            <p className="font-black flex-1">{peerName}</p>
            <button onClick={function(){props.openProducer(peer);}} className="text-xs text-cyanNeon">Voir le profil</button>
          </div>
          <div className="flex-1 overflow-y-auto p-4 space-y-2">
            {messages.length===0?<p className="text-center text-xs text-gray-500 py-10">Démarre la conversation 👋</p>:
            messages.map(function(m){
              const mine=m.sender_id===props.userId;
              return <div key={m.id} className={'flex '+(mine?'justify-end':'justify-start')}>
                <div className={'bubble '+(mine?'bubble-me':'bubble-peer')}>{m.body}<p className={'text-[9px] mt-1 '+(mine?'text-black/50':'text-gray-500')}>{timeAgo(m.created_at)}</p></div>
              </div>;
            })}
            <div ref={endRef}></div>
          </div>
          <form onSubmit={send} className="p-3 border-t border-borderDark flex gap-2">
            <input value={text} maxLength="1000" onChange={function(e){setText(e.target.value);}} placeholder="Écris ton message..." className="flex-1 bg-obsidian border border-borderDark rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-cyanNeon"/>
            <button disabled={busy||!text.trim()} className="bg-cyanNeon text-black font-black px-4 rounded-xl disabled:opacity-40"><Icon name="send"/></button>
          </form>
        </React.Fragment>}
      </div>
    </div>
  </section>;
}

function App(){
  const [loading,setLoading]=React.useState(true);
  const [session,setSession]=React.useState(null);
  const [profile,setProfile]=React.useState(null);
  const [profileError,setProfileError]=React.useState('');
  const [tracks,setTracks]=React.useState([]);
  const [producers,setProducers]=React.useState([]);
  const [purchases,setPurchases]=React.useState([]);
  const [myOrders,setMyOrders]=React.useState([]);
  const [adminOrders,setAdminOrders]=React.useState([]);
  const [withdrawals,setWithdrawals]=React.useState([]);
  const [notifications,setNotifications]=React.useState([]);
  const [followers,setFollowers]=React.useState(0);
  const [messageUnread,setMessageUnread]=React.useState(0);
  const [toasts,setToasts]=React.useState([]);
  const [view,setViewRaw]=React.useState('home');
  const [buyItem,setBuyItem]=React.useState(null);
  const [producerId,setProducerId]=React.useState(null);
  const [chatPeer,setChatPeer]=React.useState(null);
  const [chatName,setChatName]=React.useState('');
  const [current,setCurrent]=React.useState(null);
  const [playing,setPlaying]=React.useState(false);
  const [progress,setProgress]=React.useState(0);
  const [duration,setDuration]=React.useState(0);
  const [currentTime,setCurrentTime]=React.useState(0);
  const [volume,setVolume]=React.useState(1);
  const [muted,setMuted]=React.useState(false);
  const audioRef=React.useRef(null);
  if(!audioRef.current)audioRef.current=new Audio();

  function setView(value){setViewRaw(value);window.scrollTo({top:0,behavior:'smooth'});}
  function toast(message,type){
    const id=Date.now()+Math.random();
    setToasts(function(old){return old.concat([{id:id,message:message,type:type||'success'}]);});
    setTimeout(function(){setToasts(function(old){return old.filter(function(item){return item.id!==id;});});},4000);
  }
  async function copy(text){
    try{await navigator.clipboard.writeText(text);toast('Copié !');}
    catch(e){toast('Sélectionne le texte puis copie-le.','error');}
  }
  function pdf(number){downloadContract(number,toast);}
  function openProducer(id){if(!id)return;setProducerId(id);setView('producer');}
  function openChat(id,name){setChatPeer(id);setChatName(name||'');setView('messages');}

  React.useEffect(function(){
    let alive=true;
    async function initialize(){
      try{
        const auth=await sb.auth.getSession();
        if(auth.error)throw auth.error;
        if(!alive)return;
        const currentSession=auth.data.session;
        setSession(currentSession);
        if(currentSession){
          loadProfile(currentSession.user.id);
          loadPurchases(currentSession.user.id);
          loadMyOrders(currentSession.user.id);
          loadNotifications(currentSession.user.id);
          loadFollowers(currentSession.user.id);
          loadMessageUnread();
        }
        await loadTracks();
      }catch(error){
        console.error('Initialisation Supabase :',error);
        toast('Impossible de joindre Supabase. Vérifie la configuration.','error');
      }finally{if(alive)setLoading(false);}
    }
    initialize();

    const authListener=sb.auth.onAuthStateChange(function(event,newSession){
      setSession(newSession);
      setProfileError('');
      if(newSession){
        loadProfile(newSession.user.id);
        loadPurchases(newSession.user.id);
        loadMyOrders(newSession.user.id);
        loadNotifications(newSession.user.id);
        loadFollowers(newSession.user.id);
        loadMessageUnread();
      }else{
        setProfile(null);setPurchases([]);setMyOrders([]);setAdminOrders([]);setNotifications([]);
      }
    });

    const audio=audioRef.current;
    function ended(){setPlaying(false);setProgress(0);}
    function updateTime(){setCurrentTime(audio.currentTime);setProgress((audio.currentTime/audio.duration)*100||0);}
    function metadata(){setDuration(audio.duration);}
    function audioError(){if(audio.src){setPlaying(false);toast('Impossible de lire ce fichier audio.','error');}}
    audio.addEventListener('ended',ended);
    audio.addEventListener('timeupdate',updateTime);
    audio.addEventListener('loadedmetadata',metadata);
    audio.addEventListener('error',audioError);

    return function(){
      alive=false;
      authListener.data.subscription.unsubscribe();
      audio.removeEventListener('ended',ended);
      audio.removeEventListener('timeupdate',updateTime);
      audio.removeEventListener('loadedmetadata',metadata);
      audio.removeEventListener('error',audioError);
    };
  },[]);

  React.useEffect(function(){
    if(profile&&profile.is_admin){loadAdminOrders();loadWithdrawals();}
  },[profile&&profile.is_admin]);

  React.useEffect(function(){
    if(!session)return;
    const channel=sb.channel('213wave-live-'+session.user.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+session.user.id},function(payload){
        setNotifications(function(old){return [payload.new].concat(old).slice(0,40);});
        toast('Nouvelle notification : '+payload.new.title);
      })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient_id=eq.'+session.user.id},function(){
        loadMessageUnread();
        if(view!=='messages')toast('Nouveau message reçu.');
      }).subscribe();
    return function(){sb.removeChannel(channel);};
  },[session&&session.user.id,view]);

  async function loadTracks(){
    const result=await sb.from('tracks').select('*').order('created_at',{ascending:false});
    if(result.error){console.error('Chargement des produits :',result.error.message);return;}
    const data=result.data||[];
    setTracks(data);
    const publicProfiles=await sb.from('public_profiles').select('id,name,avatar_url,bio,instagram');
    if(publicProfiles.error){console.warn('Profils publics :',publicProfiles.error.message);return;}
    const counts={};
    data.forEach(function(track){
      if(!track.producer_id)return;
      if(!counts[track.producer_id])counts[track.producer_id]={count:0,plays:0};
      counts[track.producer_id].count++;
      counts[track.producer_id].plays+=Number(track.plays)||0;
    });
    setProducers((publicProfiles.data||[]).map(function(p){
      return Object.assign({},p,counts[p.id]||{count:0,plays:0});
    }).filter(function(p){return p.count>0;}).sort(function(a,b){return b.count-a.count;}));
  }

  async function loadProfile(id,attempt){
    attempt=attempt||0;
    const result=await sb.from('profiles').select('*').eq('id',id).single();
    if(result.data){setProfile(result.data);setProfileError('');return;}
    if(attempt<4){
      setTimeout(function(){loadProfile(id,attempt+1);},1000);
    }else{
      setProfileError(result.error?result.error.message:'Profil introuvable');
    }
  }

  async function loadPurchases(id){
    const result=await sb.from('sales').select('*').eq('buyer_id',id).order('created_at',{ascending:false});
    if(result.error){console.warn('Achats :',result.error.message);return;}
    const ids=(result.data||[]).map(function(item){return item.track_id;}).filter(Boolean);
    const map={};
    if(ids.length){
      const products=await sb.from('tracks').select('id,title,cover_url,type,file_path').in('id',ids);
      (products.data||[]).forEach(function(track){map[track.id]=track;});
    }
    setPurchases((result.data||[]).map(function(item){return Object.assign({},item,{track:map[item.track_id]||null});}));
  }

  async function loadMyOrders(id){
    const result=await sb.from('orders').select('*').eq('buyer_id',id).order('created_at',{ascending:false});
    if(result.error){console.warn('Commandes :',result.error.message);return;}
    const ids=(result.data||[]).map(function(item){return item.track_id;});
    const map={};
    if(ids.length){
      const products=await sb.from('tracks').select('id,title,cover_url').in('id',ids);
      (products.data||[]).forEach(function(track){map[track.id]=track;});
    }
    setMyOrders((result.data||[]).map(function(item){return Object.assign({},item,{track:map[item.track_id]||null});}));
  }

  async function loadAdminOrders(){
    const result=await sb.from('orders').select('*').order('created_at',{ascending:false});
    if(result.error){console.warn('Commandes admin :',result.error.message);return;}
    const buyerIds=(result.data||[]).map(function(item){return item.buyer_id;});
    const trackIds=(result.data||[]).map(function(item){return item.track_id;});
    const buyers={},titles={};
    if(buyerIds.length){
      const r=await sb.from('public_profiles').select('id,name').in('id',buyerIds);
      (r.data||[]).forEach(function(item){buyers[item.id]=item.name;});
    }
    if(trackIds.length){
      const r=await sb.from('tracks').select('id,title').in('id',trackIds);
      (r.data||[]).forEach(function(item){titles[item.id]=item.title;});
    }
    setAdminOrders((result.data||[]).map(function(item){
      return Object.assign({},item,{buyer_name:buyers[item.buyer_id]||'Client',track_title:titles[item.track_id]||'—'});
    }));
  }

  async function loadWithdrawals(){
    const result=await sb.from('withdrawals').select('*').order('created_at',{ascending:false});
    if(result.data)setWithdrawals(result.data);
  }
  async function loadNotifications(id){
    const result=await sb.from('notifications').select('*').eq('user_id',id).order('created_at',{ascending:false}).limit(40);
    if(result.data)setNotifications(result.data);
  }
  async function loadFollowers(id){
    const result=await sb.rpc('get_producer',{p_id:id});
    if(result.data)setFollowers(result.data.followers||0);
  }
  async function loadMessageUnread(){
    const result=await sb.rpc('my_conversations');
    if(result.data)setMessageUnread(result.data.reduce(function(sum,item){return sum+Number(item.unread||0);},0));
  }
  async function markNotificationsRead(){
    const result=await sb.rpc('mark_notifications_read');
    if(result.error){console.warn(result.error.message);return;}
    setNotifications(function(old){return old.map(function(item){return Object.assign({},item,{is_read:true});});});
  }

  async function logout(){
    audioRef.current.pause();setPlaying(false);
    await sb.auth.signOut();setView('home');toast('Déconnecté.');
  }

  async function play(track){
    if(!track.audio_url){toast("Pas d'audio disponible.",'error');return;}
    if(current&&current.id===track.id){
      if(playing){audioRef.current.pause();setPlaying(false);}
      else{audioRef.current.play().catch(function(){});setPlaying(true);}
      return;
    }
    setCurrent(track);
    audioRef.current.src=track.audio_url;
    audioRef.current.volume=muted?0:volume;
    audioRef.current.play().catch(function(){});
    setPlaying(true);
    const count=await sb.rpc('increment_plays',{track_id:track.id});
    if(count.error)console.warn('Compteur d’écoutes :',count.error.message);
  }

  function seek(event){
    if(duration>0)audioRef.current.currentTime=(Number(event.target.value)/100)*duration;
  }
  function changeVolume(event){
    const value=parseFloat(event.target.value);
    setVolume(value);audioRef.current.volume=value;setMuted(value===0);
  }
  function toggleMute(){
    if(muted){audioRef.current.volume=volume||0.5;setMuted(false);}
    else{audioRef.current.volume=0;setMuted(true);}
  }

  async function submitOrder(item,license,amount,rate,proof,buyerLegal,termsAccepted){
    if(!proof){toast('Ajoute la capture du paiement.','error');return;}
    if(proof.size>5*1024*1024){toast('La capture ne doit pas dépasser 5 Mo.','error');return;}
    if(!termsAccepted){toast('Accepte les conditions de la licence.','error');return;}

    try{
      const sellerAmount=Math.floor(amount*(1-rate/100));
      const fee=amount-sellerAmount;
      const safeName=proof.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const path=session.user.id+'/'+Date.now()+'-'+safeName;
      const uploaded=await sb.storage.from('payment-proofs').upload(path,proof);
      if(uploaded.error)throw uploaded.error;

      const result=await sb.from('orders').insert({
        buyer_id:session.user.id,
        seller_id:item.producer_id,
        track_id:item.id,
        product_type:item.type,
        license_type:license,
        amount:amount,
        seller_amount:sellerAmount,
        platform_fee:fee,
        rate_percent:rate,
        proof_url:path,
        buyer_legal_name:license==='exclusive'?buyerLegal:null,
        terms_accepted:true,
        terms_version:'3.0'
      });
      if(result.error)throw result.error;

      toast('Commande envoyée. Le PDF sera créé après validation du paiement.');
      setBuyItem(null);
      loadMyOrders(session.user.id);
      if(profile&&profile.is_admin)loadAdminOrders();
    }catch(error){toast(error.message||'Impossible d’envoyer la commande.','error');}
  }

  async function openProof(path){
    if(!path){toast('Preuve introuvable.','error');return;}
    if(/^https?:\/\//i.test(path)){window.open(path,'_blank','noopener');return;}
    const result=await sb.storage.from('payment-proofs').createSignedUrl(path,180);
    if(result.error){toast(result.error.message,'error');return;}
    window.open(result.data.signedUrl,'_blank','noopener');
  }

  async function validateOrder(id){
    if(!confirm('Valide uniquement si tu as vérifié que l’argent est arrivé. Continuer ?'))return;
    const result=await sb.rpc('validate_order',{p_order_id:id,p_admin_id:session.user.id});
    if(result.error){toast(result.error.message,'error');return;}
    if(result.data&&result.data.ok){
      toast('Commande validée · contrat '+result.data.contract);
      loadAdminOrders();loadTracks();loadPurchases(session.user.id);loadMyOrders(session.user.id);
    }else toast((result.data&&result.data.msg)||'La commande n’a pas été livrée.','error');
  }

  async function refuseOrder(id){
    const reason=prompt('Motif du refus :');
    if(reason===null)return;
    const result=await sb.rpc('refuse_order',{p_order_id:id,p_reason:reason||'Paiement non vérifié'});
    if(result.error){toast(result.error.message,'error');return;}
    toast('Commande refusée.');loadAdminOrders();
  }

  async function payWithdrawal(id){
    if(!confirm('Confirme que le virement au vendeur a été effectué.'))return;
    const result=await sb.rpc('pay_withdrawal',{p_id:id});
    if(result.error){toast(result.error.message,'error');return;}
    toast('Retrait marqué payé.');loadWithdrawals();
  }

  async function requestWithdrawal(amount){
    const value=parseInt(amount,10);
    if(!value){toast('Montant invalide.','error');return;}
    const result=await sb.rpc('request_withdrawal',{p_amount:value});
    if(result.error){toast(result.error.message,'error');return;}
    toast('Demande de retrait envoyée.');loadProfile(session.user.id);loadWithdrawals();
  }

  async function downloadVst(purchase){
    if(!purchase.track||!purchase.track.file_path){toast('Fichier VST indisponible.','error');return;}
    const result=await sb.storage.from('vst-files').createSignedUrl(purchase.track.file_path,120,{download:true});
    if(result.error){toast(result.error.message,'error');return;}
    window.open(result.data.signedUrl,'_blank','noopener');
  }

  async function saveProfile(details){
    try{
      let avatarUrl=profile.avatar_url;
      if(details.avatar){
        if(details.avatar.size>5*1024*1024)throw new Error('Photo : maximum 5 Mo.');
        const filename=profile.id+'-'+Date.now()+'.'+(details.avatar.name.split('.').pop()||'jpg');
        const uploaded=await sb.storage.from('avatars').upload(filename,details.avatar,{upsert:true});
        if(uploaded.error)throw uploaded.error;
        avatarUrl=sb.storage.from('avatars').getPublicUrl(filename).data.publicUrl;
      }
      const result=await sb.from('profiles').update({
        name:details.name,
        legal_name:details.legal_name.trim()||null,
        rip:details.rip,
        bio:details.bio,
        instagram:details.instagram,
        avatar_url:avatarUrl
      }).eq('id',profile.id).select().single();

      if(result.error)throw result.error;
      setProfile(result.data);toast('Profil enregistré !');setView('dashboard');
    }catch(error){toast(error.message,'error');}
  }

  async function uploadTrack(details){
    try{
      if(!details.title.trim())throw new Error('Le titre est obligatoire.');
      if(details.type==='vst'&&!details.file)throw new Error('Ajoute le fichier du plugin VST.');
      if(details.file&&details.file.size>50*1024*1024)throw new Error('Fichier trop lourd : 50 Mo maximum.');
      if(details.cover&&details.cover.size>5*1024*1024)throw new Error('Pochette trop lourde : 5 Mo maximum.');
      if(details.type==='beat'&&(Number(details.bpm)<40||Number(details.bpm)>300))throw new Error('Le BPM doit être entre 40 et 300.');
      if([details.p1,details.p2,details.p3,details.p4].some(function(v){return Number(v)<0||!Number.isFinite(Number(v));}))throw new Error('Vérifie les prix.');

      let coverUrl=DEFAULT_COVER;
      let audioUrl='';
      let filePath=null;
      let fileHash=null;

      if(details.cover){
        const filename=profile.id+'-'+Date.now()+'-cover.'+(details.cover.name.split('.').pop()||'jpg');
        const uploaded=await sb.storage.from('covers').upload(filename,details.cover);
        if(uploaded.error)throw uploaded.error;
        coverUrl=sb.storage.from('covers').getPublicUrl(filename).data.publicUrl;
      }

      if(details.file){
        fileHash=await hashFile(details.file);
        const safeName=details.file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        if(details.type==='vst'){
          filePath=profile.id+'/'+Date.now()+'-'+safeName;
          const uploaded=await sb.storage.from('vst-files').upload(filePath,details.file);
          if(uploaded.error)throw new Error('Upload VST échoué : '+uploaded.error.message);
        }else{
          const filename=profile.id+'-'+Date.now()+'-audio.'+(details.file.name.split('.').pop()||'mp3');
          const uploaded=await sb.storage.from('audio').upload(filename,details.file);
          if(uploaded.error)throw new Error('Upload audio échoué : '+uploaded.error.message);
          audioUrl=sb.storage.from('audio').getPublicUrl(filename).data.publicUrl;
        }
      }

      const row={
        title:details.title.trim(),
        type:details.type,
        genre:details.genre,
        bpm:parseInt(details.bpm,10)||140,
        key:details.key,
        producer_id:profile.id,
        producer_name:profile.name,
        cover_url:coverUrl,
        audio_url:audioUrl,
        price_mp3:parseInt(details.p1,10)||0,
        price_wav:parseInt(details.p2,10)||0,
        price_stems:parseInt(details.p3,10)||0,
        price_exclusive:parseInt(details.p4,10)||0,
        description:details.description.trim()||(details.type==='vst'?'Plugin VST':'Beat '+details.genre)
      };
      if(filePath)row.file_path=filePath;
      if(fileHash)row.file_hash=fileHash;
      if(details.limits)row.limits=details.limits;

      const result=await sb.from('tracks').insert(row);
      if(result.error)throw result.error;
      toast(fileHash?'Publié ! Empreinte du fichier enregistrée.':'Publié avec succès !');
      await loadTracks();setView('dashboard');return true;
    }catch(error){toast(error.message||'Publication impossible.','error');return false;}
  }

  async function removeTrack(id){
    if(!confirm('Supprimer cette publication ?'))return;
    const result=await sb.from('tracks').delete().eq('id',id);
    if(result.error){toast(result.error.code==='23503'?'Une publication ayant généré une vente ne peut plus être supprimée.':result.error.message,'error');return;}
    toast('Publication supprimée.');loadTracks();
  }

  function buy(item){
    if(!session){toast('Connecte-toi pour acheter.','error');return;}
    if(item.producer_id===session.user.id){toast('Tu ne peux pas acheter ta propre publication.','error');return;}
    setBuyItem(item);
  }

  async function share(){
    try{await navigator.clipboard.writeText(window.location.href);toast('Lien copié !');}
    catch(error){toast('Copie le lien depuis la barre d’adresse.','error');}
  }

  if(loading)return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;

  if(!session)return <React.Fragment>
    <Toasts items={toasts} remove={function(id){setToasts(function(old){return old.filter(function(t){return t.id!==id;});});}}/>
    <AuthPage toast={toast}/>
  </React.Fragment>;

  if(!profile){
    return <div className="min-h-screen flex items-center justify-center p-5">
      <div className="card max-w-md p-7 rounded-2xl text-center">
        {profileError?<React.Fragment>
          <h2 className="text-xl font-black">Profil non chargé</h2>
          <p className="text-xs text-gray-400 mt-3">{profileError}</p>
          <button onClick={function(){setProfileError('');loadProfile(session.user.id);}} className="mt-5 bg-cyanNeon text-black px-4 py-2 rounded-lg font-bold">Réessayer</button>
        </React.Fragment>:<React.Fragment><div className="loader mx-auto"></div><p className="text-xs text-gray-400 mt-4">Chargement du profil...</p></React.Fragment>}
      </div>
    </div>;
  }

  const myKeys=purchases.filter(function(p){return p.license_type==='vst'&&p.vst_key;});
  const pendingCount=adminOrders.filter(function(o){return o.status==='pending';}).length+withdrawals.filter(function(w){return w.status==='pending';}).length;
  const unread=notifications.filter(function(n){return !n.is_read;}).length;

  return <div className="relative">
    <Toasts items={toasts} remove={function(id){setToasts(function(old){return old.filter(function(t){return t.id!==id;});});}}/>
    <NavBar view={view} setView={setView} profile={profile} pending={pendingCount} notifications={notifications} unread={unread}
      markRead={markNotificationsRead} msgUnread={messageUnread} openProducer={openProducer} logout={logout}/>
    <MobileNav view={view} setView={setView} hasPlayer={!!current}/>

    <main className="pt-28 pb-10 px-4 md:px-6 max-w-7xl mx-auto">
      {view!=='home'?<button onClick={function(){setView('home');}} className="mb-6 flex items-center gap-2 text-sm font-bold text-gray-400 hover:text-white"><Icon name="back" size={16}/>Retour</button>:null}

      {view==='home'?<HomeView setView={setView} producers={producers} openProducer={openProducer}/>:null}
      {view==='artists'?<ArtistsView producers={producers} openProducer={openProducer}/>:null}
      {view==='beats'?<BeatsView tracks={tracks} producers={producers} current={current} playing={playing} play={play} buy={buy} openProducer={openProducer}/>:null}
      {view==='vsts'?<VstsView tracks={tracks} keys={myKeys} buy={buy} setView={setView} openProducer={openProducer}/>:null}
      {view==='producer'&&producerId?<ProducerPage id={producerId} me={profile.id} tracks={tracks} buy={buy} toast={toast} setView={setView} share={share} openChat={openChat}/>:null}
      {view==='me'?<ProducerPage id={profile.id} me={profile.id} tracks={tracks} buy={buy} toast={toast} setView={setView} share={share} openChat={openChat}/>:null}
      {view==='dashboard'?<DashboardView profile={profile} email={session.user.email} tracks={tracks} followers={followers} setView={setView}
        openProducer={openProducer} withdraw={requestWithdrawal} remove={removeTrack} pdf={pdf}/>:null}
      {view==='upload'?<UploadView upload={uploadTrack}/>:null}
      {view==='settings'?<SettingsView profile={profile} save={saveProfile}/>:null}
      {view==='myorders'?<OrdersView orders={myOrders} pdf={pdf}/>:null}
      {view==='keys'?<KeysView purchases={purchases} pdf={pdf} copy={copy} download={downloadVst}/>:null}
      {view==='messages'?<MessagesView userId={session.user.id} initialPeer={chatPeer} initialName={chatName} toast={toast}
        openProducer={openProducer} refreshUnread={loadMessageUnread}/>:null}
      {view==='verify'?<VerifyView/>:null}
      {view==='admin'&&profile.is_admin?<AdminView orders={adminOrders} withdrawals={withdrawals} validate={validateOrder} refuse={refuseOrder}
        payWithdrawal={payWithdrawal} pdf={pdf} openProof={openProof}/>:null}
    </main>

    {buyItem?<BuyModal item={buyItem} close={function(){setBuyItem(null);}} submit={submitOrder}/>:null}
    {current?<Player track={current} playing={playing} play={play} progress={progress} duration={duration} time={currentTime}
      seek={seek} volume={volume} muted={muted} setVolume={changeVolume} toggleMute={toggleMute} buy={buy} openProducer={openProducer}/>:null}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
