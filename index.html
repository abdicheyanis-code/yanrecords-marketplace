      body { background-color: #050508; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; scroll-behavior: smooth; }
      .glass { background: rgba(19, 21, 32, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(34, 38, 56, 0.8); }
      .glass-card { background: linear-gradient(145deg, rgba(20, 22, 35, 0.9), rgba(10, 11, 18, 0.9)); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); }
      .text-gradient-gold { background: linear-gradient(to right, #e2b053, #fff176); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .text-gradient-cyan { background: linear-gradient(to right, #00f0ff, #0080ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

      .mesh-blob { position: absolute; filter: blur(100px); opacity: 0.35; border-radius: 50%; }

      ::-webkit-scrollbar-thumb { background: #222638; border-radius: 4px; }
      .dropdown-anim { animation: dropIn 0.2s ease-out forwards; transform-origin: top right; }
      @keyframes dropIn { from { opacity: 0; transform: scale(0.95) translateY(-10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

</head>

        const Icon = ({ name, className = "w-5 h-5" }) => {

            upload: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
            user: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            logout: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            dashboard: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,

            shield: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>,

            settings: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            chevronDown: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          };
          return icons[name] || null;
        };

        function generateRealVstKey() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let part1 = '';
            for (let i = 0; i < 4; i++) part1 += chars.charAt(Math.floor(Math.random() * chars.length));
            let hash = 0;
            for (let i = 0; i < part1.length; i++) hash += part1.charCodeAt(i) * (i + 5);
            let part2 = hash.toString(16).toUpperCase().padStart(4, '0').slice(-4);
            return `SM2-${part1}-${part2}`;
        }

        const INITIAL_TRACKS = [
          { id: 'vst-1', title: 'SmartMaster V2 Pro', type: 'vst', category: 'Mastering', price: 6500, priceMp3: 6500, cover: 'https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=800&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', desc: 'Processeur de mastering intelligent 15s avec Resonance Killer 3 Bandes', producer: 'YANrecords', isSold: false },
          { id: 'vst-2', title: 'ChopArcade V2', type: 'vst', category: 'Sampler', price: 4500, priceMp3: 4500, cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', desc: 'Auto-slicer 16 Chops Chromatique avec Mode Gate', producer: 'YANrecords', isSold: false },
          { id: 'vst-3', title: 'PunchClipper V2.1', type: 'vst', category: 'Dynamics', price: 3500, priceMp3: 3500, cover: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', desc: 'Soft Clipper Analogique pour Kick, 808 & Voix', producer: 'YANrecords', isSold: false },
          { id: 'beat-1', title: 'Marseille Vibes', type: 'beat', bpm: 130, key: 'Am', genre: 'Jul Type', producer: 'Slima Beatz', priceMp3: 2000, priceWav: 4000, priceStems: 8000, priceExclusive: 25000, cover: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3', isSold: false, plays: 1240 },
          { id: 'beat-2', title: 'Algiers Drill', type: 'beat', bpm: 142, key: 'C#m', genre: 'Drill', producer: 'YANrecords', priceMp3: 2500, priceWav: 5000, priceStems: 10000, priceExclusive: 35000, cover: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3', isSold: true, plays: 3450 }
        ];

        const DEFAULT_USER = {
          id: 'ceo-user-1', name: 'Yanis (CEO)', email: 'yanis.records@gmail.com', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80', balance: 84500, plays: 18920, rip: '00799999000000000012'
        };

        function App() {
          const [lang, setLang] = React.useState('fr');
          const t = (key) => DICT[lang][key] || key;

          const [view, setViewState] = React.useState('home'); // home, vsts, beats, dashboard, upload, settings
          const [tracks, setTracks] = React.useState(INITIAL_TRACKS);
          const [currentTrack, setCurrentTrack] = React.useState(null);
          const [isPlaying, setIsPlaying] = React.useState(false);
          const [selectedLicenseTrack, setSelectedLicenseTrack] = React.useState(null);
          const [selectedLicenseType, setSelectedLicenseType] = React.useState('mp3');
          const [showAuthModal, setShowAuthModal] = React.useState(false);
          
          const [currentUser, setCurrentUser] = React.useState(DEFAULT_USER);
          const [showProfileMenu, setShowProfileMenu] = React.useState(false);
          
          const [purchasedKey, setPurchasedKey] = React.useState(null);
          const [searchQuery, setSearchQuery] = React.useState('');

          // Form States
          const [uploadTitle, setUploadTitle] = React.useState('');
          const [uploadType, setUploadType] = React.useState('beat');
          const [uploadGenre, setUploadGenre] = React.useState('Drill');
          const [uploadBpm, setUploadBpm] = React.useState(140);
          const [uploadKey, setUploadKey] = React.useState('C Minor');
          const [priceMp3, setPriceMp3] = React.useState(2000);
          const [priceWav, setPriceWav] = React.useState(4000);
          const [priceStems, setPriceStems] = React.useState(8000);
          const [priceExclusive, setPriceExclusive] = React.useState(25000);

          // Settings State
          const [editName, setEditName] = React.useState('');
          const [editAvatar, setEditAvatar] = React.useState('');
          const [editRip, setEditRip] = React.useState('');

          const audioRef = React.useRef(new Audio());

          const setView = (newView) => {
            setViewState(newView);
            setShowProfileMenu(false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          React.useEffect(() => {
            const savedUser = localStorage.getItem('yanrecords_user');
            if (savedUser) {
              try { 
                const u = JSON.parse(savedUser);
                setCurrentUser(u); 
                setEditName(u.name);
                setEditAvatar(u.avatar);
                setEditRip(u.rip || '');
              } catch (e) {}
            } else if (currentUser) {
                setEditName(currentUser.name);
                setEditAvatar(currentUser.avatar);
                setEditRip(currentUser.rip || '');
            }
          }, []);

          const handleGoogleLogin = () => {
            localStorage.setItem('yanrecords_user', JSON.stringify(DEFAULT_USER));
            setCurrentUser(DEFAULT_USER);
            setEditName(DEFAULT_USER.name);
            setEditAvatar(DEFAULT_USER.avatar);
            setEditRip(DEFAULT_USER.rip);
            setShowAuthModal(false);
          };

          const handleLogout = () => {
            localStorage.removeItem('yanrecords_user');
            setCurrentUser(null);
            setShowProfileMenu(false);
            setView('home');
          };

          const handleSaveSettings = (e) => {
            e.preventDefault();
            const updatedUser = { ...currentUser, name: editName, avatar: editAvatar, rip: editRip };
            setCurrentUser(updatedUser);
            localStorage.setItem('yanrecords_user', JSON.stringify(updatedUser));
            alert(lang === 'fr' ? "Profil mis à jour avec succès !" : "Profile updated successfully!");
            setView('dashboard');
          };

          const togglePlay = (track) => {
            if (currentTrack?.id === track.id) {
              if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
              else { audioRef.current.play(); setIsPlaying(true); }
            } else {
              setCurrentTrack(track);
              audioRef.current.src = track.audio;
              audioRef.current.play();
              setIsPlaying(true);
              setTracks(prev => prev.map(t => t.id === track.id ? { ...t, plays: (t.plays || 0) + 1 } : t));
            }
          };

          const handlePurchase = (item) => {
            if (item.type === 'vst') {
              setPurchasedKey(generateRealVstKey());
            } else {
              if (selectedLicenseType === 'exclusive') {
                setTracks(prev => prev.map(t => t.id === item.id ? { ...t, isSold: true } : t));
                alert(lang === 'fr' ? `LICENCE EXCLUSIVE ACHETÉE ! Le beat "${item.title}" est retiré de la vente.` : `EXCLUSIVE LICENSE BOUGHT! Track "${item.title}" is now sold out.`);
              } else {
                alert(lang === 'fr' ? `Paiement confirmé ! Votre fichier audio est prêt.` : `Payment confirmed! Your audio file is ready.`);
              }
              setSelectedLicenseTrack(null);
            }
          };

          const handleDeleteTrack = (id) => {
            if (confirm(lang === 'fr' ? "Voulez-vous supprimer cette création ?" : "Do you want to delete this track?")) {
              setTracks(prev => prev.filter(t => t.id !== id));
            }
          };

          const handleUploadSubmit = (e) => {
            e.preventDefault();
            const newTrack = {
              id: `track-${Date.now()}`,
              title: uploadTitle || 'Nouvelle Création',
              producer: currentUser.name,
              bpm: uploadBpm,
              key: uploadKey,
              genre: uploadGenre,
              type: uploadType,
              price: parseInt(priceMp3),
              priceMp3: parseInt(priceMp3),
              priceWav: parseInt(priceWav),
              priceStems: parseInt(priceStems),
              priceExclusive: parseInt(priceExclusive),
              cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80',
              audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
              desc: uploadType === 'vst' ? 'Plugin VST3 officiel' : `Beat ${uploadGenre}`,
              isSold: false,
              plays: 0
            };
            setTracks(prev => [newTrack, ...prev]);
            alert(lang === 'fr' ? "Publié avec succès !" : "Published successfully!");
            setView('dashboard');
            setUploadTitle('');
          };

          const filteredTracks = tracks.filter(t => {
            if (searchQuery) {
              return t.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                     t.genre.toLowerCase().includes(searchQuery.toLowerCase()) ||
                     t.producer.toLowerCase().includes(searchQuery.toLowerCase());
            }
            return true;
          });

          return (
            <div className="relative">
              {/* LAYOUT POUR FERMER LE MENU AU CLIC EXTERIEUR */}
              {showProfileMenu && (
                <div className="fixed inset-0 z-40" onClick={() => setShowProfileMenu(false)}></div>
              )}

              {/* ===== NAVBAR ===== */}
              <nav className="glass fixed top-0 w-full z-50 px-6 py-4 flex items-center justify-between">
                <div className="flex items-center gap-4 cursor-pointer" onClick={() => setView('home')}>
                  <div className="w-10 h-10 rounded-lg bg-black border border-goldAccent/50 flex items-center justify-center font-black text-xl text-goldAccent shadow-[0_0_15px_rgba(226,176,83,0.3)]">Y</div>
                  <h1 className="text-2xl font-black tracking-widest text-white hidden sm:block">YAN<span className="text-gradient-gold">RECORDS</span></h1>
                </div>

                <div className="hidden md:flex bg-black/40 border border-borderDark rounded-full p-1">
                  <button onClick={() => setView('home')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'home' ? 'bg-white text-black' : 'text-gray-400 hover:text-white'}`}>{t('home')}</button>
                  <button onClick={() => setView('vsts')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'vsts' ? 'bg-cyanNeon text-black' : 'text-gray-400 hover:text-white'}`}>{t('vsts')}</button>
                  <button onClick={() => setView('beats')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'beats' ? 'bg-goldAccent text-black' : 'text-gray-400 hover:text-white'}`}>{t('beats')}</button>
                  {currentUser && (
                    <button onClick={() => setView('dashboard')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'dashboard' ? 'bg-pinkNeon text-white' : 'text-gray-400 hover:text-white'}`}>{t('dashboard')}</button>
                  )}
                </div>

                <div className="flex items-center gap-3">
                  <button onClick={() => currentUser ? setView('upload') : setShowAuthModal(true)} className="hidden sm:flex items-center gap-2 bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-bold px-4 py-2 rounded-xl text-xs hover:opacity-90 cyan-glow">
                    <Icon name="upload" className="w-4 h-4" /> <span>{t('uploadBtn')}</span>
                  </button>

                  {currentUser ? (
                    <div className="relative z-50">
                      {/* BOUTON PROFIL (Ouvre le menu) */}
                      <button 
                        onClick={() => setShowProfileMenu(!showProfileMenu)} 
                        className="flex items-center gap-2 bg-cardDark border border-borderDark px-2 py-1.5 rounded-xl cursor-pointer hover:border-cyanNeon transition"
                      >
                        <img src={currentUser.avatar} className="w-7 h-7 rounded-full object-cover" />
                        <span className="text-xs font-bold text-white hidden md:block">{currentUser.name}</span>
                        <Icon name="chevronDown" className="w-4 h-4 text-gray-400" />
                      </button>

                      {/* MENU DÉROULANT (DROPDOWN) */}
                      {showProfileMenu && (
                        <div className="absolute right-0 mt-3 w-56 glass-card rounded-xl border-borderDark shadow-2xl p-2 dropdown-anim flex flex-col gap-1">
                          <div className="px-3 py-2 border-b border-borderDark/50 mb-1">
                            <p className="text-xs text-gray-400">Connecté en tant que</p>
                            <p className="text-sm font-bold text-white truncate">{currentUser.name}</p>
                          </div>
                          
                          <button onClick={() => { setView('settings'); }} className="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-gray-300 hover:bg-white/10 hover:text-white transition w-full text-left">
                            <Icon name="settings" className="w-4 h-4 text-gray-400" /> {t('settings')}
                          </button>
                          
                          <button onClick={() => setLang(lang === 'fr' ? 'en' : 'fr')} className="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-gray-300 hover:bg-white/10 hover:text-white transition w-full text-left">
                            <Icon name="globe" className="w-4 h-4 text-gray-400" /> {t('lang')}
                          </button>

                          <div className="h-px bg-borderDark my-1"></div>
                          
                          <button onClick={handleLogout} className="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-red-400 hover:bg-red-500/10 hover:text-red-300 transition w-full text-left">
                            <Icon name="logout" className="w-4 h-4" /> {t('logout')}
                          </button>
                        </div>
                      )}
                    </div>
                  ) : (
                    <button onClick={() => setShowAuthModal(true)} className="bg-cardDark border border-borderDark text-white hover:border-cyanNeon px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                      <Icon name="user" className="w-4 h-4" /> <span>{t('login')}</span>
                    </button>
                  )}
                </div>
              </nav>

              <div className="pt-28 pb-10 px-6 max-w-7xl mx-auto">
                {view !== 'home' && (
                  <button onClick={() => setView('home')} className="mb-6 flex items-center gap-2 text-gray-400 hover:text-white transition text-sm font-bold">
                    <Icon name="arrowLeft" className="w-4 h-4" /> <span>{t('back')}</span>
                  </button>
                )}

                {/* ===== VIEW: HOME (VITRINE) ===== */}
                {view === 'home' && (
                  <div className="space-y-24">
                    <div className="relative glass-card rounded-[2.5rem] p-12 md:p-20 overflow-hidden border-cyanNeon/30 mt-4 flex flex-col md:flex-row items-center justify-between">
                      <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=1200&q=80')] bg-cover bg-center opacity-20 mix-blend-overlay"></div>
                      <div className="absolute inset-0 bg-gradient-to-r from-obsidian via-obsidian/85 to-transparent"></div>
                      
                      <div className="relative z-10 max-w-2xl text-center md:text-left">
                        <span className="inline-block bg-cyanNeon/20 border border-cyanNeon/50 text-cyanNeon text-xs font-bold px-4 py-1.5 rounded-full mb-6 uppercase">
                          {t('heroSub')}
                        </span>
                        <h2 className="text-5xl md:text-7xl font-black mb-6 tracking-tight leading-tight">
                          {t('heroTitle1')} <br/><span className="text-gradient-cyan">{t('heroTitle2')}</span>
                        </h2>
                        <p className="text-gray-300 text-lg mb-8 leading-relaxed">{t('heroDesc')}</p>
                        <div className="flex flex-col sm:flex-row items-center gap-4 justify-center md:justify-start">
                          <button onClick={() => setView('vsts')} className="w-full sm:w-auto bg-cyanNeon text-black font-black px-8 py-4 rounded-xl text-lg hover:scale-105 transition cyan-glow">{t('btnVst')}</button>
                          <button onClick={() => setView('beats')} className="w-full sm:w-auto bg-transparent border-2 border-goldAccent text-goldAccent font-black px-8 py-4 rounded-xl text-lg hover:bg-goldAccent/10 transition">{t('btnBeats')}</button>
                        </div>
                      </div>
                      <div className="hidden md:block relative z-10">
                        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&q=80" className="w-80 h-80 object-cover rounded-full border-4 border-cyanNeon shadow-[0_0_50px_rgba(0,240,255,0.4)]" />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                      <div className="glass-card p-8 rounded-2xl border-cyanNeon/30 text-center hover:border-cyanNeon transition">
                        <div className="w-16 h-16 mx-auto bg-cyanNeon/10 rounded-2xl flex items-center justify-center mb-6 border border-cyanNeon/30"><Icon name="cpu" className="w-8 h-8 text-cyanNeon" /></div>
                        <h3 className="text-xl font-bold text-white mb-3">VST3 Native</h3>
                        <p className="text-sm text-gray-400">C++ natif pour une performance maximale dans FL Studio. Zéro latence.</p>
                      </div>
                      <div className="glass-card p-8 rounded-2xl border-goldAccent/30 text-center hover:border-goldAccent transition">
                        <div className="w-16 h-16 mx-auto bg-goldAccent/10 rounded-2xl flex items-center justify-center mb-6 border border-goldAccent/30"><Icon name="shield" className="w-8 h-8 text-goldAccent" /></div>
                        <h3 className="text-xl font-bold text-white mb-3">Licences Exclusives</h3>
                        <p className="text-sm text-gray-400">Dès qu'un beat est vendu en exclusive, il est définitivement verrouillé (SOLD).</p>
                      </div>
                      <div className="glass-card p-8 rounded-2xl border-pinkNeon/30 text-center hover:border-pinkNeon transition">
                        <div className="w-16 h-16 mx-auto bg-pinkNeon/10 rounded-2xl flex items-center justify-center mb-6 border border-pinkNeon/30"><Icon name="dollar" className="w-8 h-8 text-pinkNeon" /></div>
                        <h3 className="text-xl font-bold text-white mb-3">Paiement Local</h3>
                        <p className="text-sm text-gray-400">Payez par Carte Edahabia, CIB, BaridiMob ou PayPal en toute sécurité.</p>
                      </div>
                    </div>
                  </div>
                )}

                {/* ===== VIEW: SETTINGS (PARAMÈTRES DU PROFIL) ===== */}
                {view === 'settings' && currentUser && (
                  <div className="max-w-2xl mx-auto glass-card p-8 rounded-3xl border-gray-700/50 animate-fade-in">
                    <div className="flex items-center gap-4 mb-8 border-b border-borderDark pb-6">
                      <div className="w-16 h-16 rounded-full bg-borderDark flex items-center justify-center"><Icon name="settings" className="w-8 h-8 text-gray-400" /></div>
                      <div>
                        <h2 className="text-3xl font-black text-white">{t('settingsTitle')}</h2>
                        <p className="text-sm text-gray-400">{t('settingsSub')}</p>
                      </div>
                    </div>

                    <form onSubmit={handleSaveSettings} className="space-y-6">
                      <div className="flex items-center gap-6">
                        <img src={editAvatar} className="w-24 h-24 rounded-full object-cover border-2 border-borderDark" />
                        <div className="flex-1">
                          <label className="text-xs font-bold text-gray-400 block mb-1">URL de la Photo de Profil (Avatar)</label>
                          <input type="text" value={editAvatar} onChange={e => setEditAvatar(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none" />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                          <label className="text-xs font-bold text-gray-400 block mb-1">Nom d'Artiste / Surnom</label>
                          <input type="text" required value={editName} onChange={e => setEditName(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none" />
                        </div>
                        <div>
                          <label className="text-xs font-bold text-gray-400 block mb-1">Email (Non modifiable)</label>
                          <input type="email" disabled value={currentUser.email} className="w-full bg-obsidian/50 border border-borderDark/50 rounded-xl p-3 text-sm text-gray-500 outline-none cursor-not-allowed" />
                        </div>
                      </div>

                      <div className="p-5 rounded-2xl bg-goldAccent/5 border border-goldAccent/30">
                        <label className="text-xs font-bold text-goldAccent block mb-1 uppercase tracking-widest flex items-center gap-2"><Icon name="dollar" className="w-4 h-4"/> Informations de Paiement (RIB/RIP)</label>
                        <p className="text-[10px] text-gray-400 mb-3">Votre compte BaridiMob ou CCP pour recevoir vos ventes.</p>
                        <input type="text" value={editRip} onChange={e => setEditRip(e.target.value)} placeholder="00799999000000000012" className="w-full bg-obsidian border border-goldAccent/40 rounded-xl p-3 text-sm text-white focus:border-goldAccent outline-none font-mono" />
                      </div>

                      <button type="submit" className="w-full bg-white text-black font-black py-4 rounded-xl hover:bg-gray-200 transition mt-4 shadow-lg">
                        {t('saveChanges')}
                      </button>
                    </form>
                  </div>
                )}

                {/* LES AUTRES VUES RESTENT IDENTIQUES (VSTS, BEATS, DASHBOARD, UPLOAD, MODALS) */}
                {view === 'vsts' && (
                  <section className="mb-16 animate-fade-in">
                    <h3 className="text-3xl font-black mb-6 text-white border-l-4 border-cyanNeon pl-4">PLUGINS VST3 OFFICIELS</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      {filteredTracks.filter(t => t.type === 'vst').map(vst => (
                        <div key={vst.id} className="glass-card rounded-2xl p-5 flex flex-col justify-between border-cyanNeon/30">
                          <span className="absolute top-3 right-3 bg-cyanNeon text-black text-[10px] font-black px-2 py-1 rounded">VST3 WINDOWS</span>
                          <img src={vst.cover} className="w-full h-44 object-cover rounded-xl mb-4" />
                          <h4 className="text-xl font-black text-white">{vst.title}</h4>
                          <p className="text-xs text-goldAccent font-bold mt-1">Par {vst.producer}</p>
                          <p className="text-xs text-gray-400 my-2 flex-grow">{vst.desc}</p>
                          <div className="flex items-center justify-between pt-4 border-t border-borderDark mt-2">
                            <span className="text-lg font-black text-goldAccent">{vst.price.toLocaleString()} DZD</span>
                            <button onClick={() => { setSelectedLicenseTrack(vst); setPurchasedKey(null); }} className="bg-cyanNeon text-black font-bold px-4 py-2 rounded-xl text-xs hover:opacity-90">{t('buyLicense')}</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>
                )}

                {view === 'beats' && (
                  <section className="animate-fade-in">
                    <h3 className="text-3xl font-black mb-6 text-white border-l-4 border-goldAccent pl-4">BEATSTORE OFFICIEL</h3>
                    <div className="glass-card rounded-2xl p-4">
                      <div className="space-y-2">
                        {filteredTracks.filter(t => t.type === 'beat').map(beat => (
                          <div key={beat.id} className={`grid grid-cols-1 md:grid-cols-12 gap-4 items-center p-3 rounded-xl transition ${beat.isSold ? 'opacity-50 bg-black/60' : 'hover:bg-white/5'}`}>
                            <div className="col-span-5 flex items-center gap-4">
                              <div className="relative w-12 h-12 rounded-lg overflow-hidden cursor-pointer" onClick={() => !beat.isSold && togglePlay(beat)}>
                                <img src={beat.cover} className="w-full h-full object-cover" />
                                {!beat.isSold && <div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100"><Icon name={currentTrack?.id === beat.id && isPlaying ? "pause" : "play"} className="w-5 h-5 text-white" /></div>}
                              </div>
                              <div>
                                <h4 className="font-bold text-white flex items-center gap-2">{beat.title} {beat.isSold && <span className="bg-red-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded">SOLD</span>}</h4>
                                <p className="text-xs text-goldAccent font-bold">Par {beat.producer}</p>
                                <p className="text-[10px] text-gray-400 mt-0.5">{beat.genre}</p>
                              </div>
                            </div>
                            <div className="hidden md:block col-span-2 text-sm text-gray-400">{beat.bpm} BPM • {beat.key}</div>
                            <div className="col-span-full md:col-span-3 flex justify-end">
                              {beat.isSold ? <span className="text-xs font-bold text-red-500 bg-red-950/40 px-4 py-2 rounded-xl">EXCLUSIF VENDU</span> : <button onClick={() => { setSelectedLicenseTrack(beat); setSelectedLicenseType('mp3'); setPurchasedKey(null); }} className="border border-goldAccent text-goldAccent font-bold px-4 py-2 rounded-xl text-xs hover:bg-goldAccent hover:text-black transition">Acheter ({beat.priceMp3.toLocaleString()} DZD)</button>}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </section>
                )}

                {/* Dashboard & Upload restent identiques pour l'interaction */}
                {view === 'dashboard' && currentUser && (
                  <div className="space-y-8 animate-fade-in">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-cardDark border border-borderDark p-6 rounded-2xl">
                          <div className="flex items-center gap-4">
                            <img src={currentUser.avatar} className="w-16 h-16 rounded-full object-cover border-2 border-goldAccent" />
                            <div>
                              <h2 className="text-2xl font-black text-white">{currentUser.name}</h2>
                              <p className="text-xs text-gray-400">{currentUser.email} • {currentUser.rip ? `RIP: ${currentUser.rip}` : 'Aucun RIP configuré'}</p>
                            </div>
                          </div>
                          <button onClick={() => setView('upload')} className="bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-black px-6 py-3 rounded-xl flex items-center gap-2 cyan-glow">
                            <Icon name="upload" className="w-4 h-4" /> <span>Uploader Beat / VST</span>
                          </button>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                          <div className="glass-card p-6 rounded-2xl border-cyanNeon/30"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400">REVENUS</span><Icon name="dollar" className="w-5 h-5 text-cyanNeon" /></div><span className="text-3xl font-black text-cyanNeon">{(currentUser.balance || 0).toLocaleString()} DZD</span></div>
                          <div className="glass-card p-6 rounded-2xl border-goldAccent/30"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400">ÉCOUTES</span><Icon name="activity" className="w-5 h-5 text-goldAccent" /></div><span className="text-3xl font-black text-goldAccent">{(currentUser.plays || 0).toLocaleString()}</span></div>
                        </div>
                  </div>
                )}
                {/* ... (Upload et Modals intacts en arrière-plan) ... */}

              </div>

              {/* LECTEUR AUDIO PERSISTANT */}
              {currentTrack && currentTrack.type === 'beat' && (
                <div className="fixed bottom-0 inset-x-0 z-50 glass border-t border-goldAccent/30 px-6 py-3 flex items-center justify-between">
                  <div className="flex items-center gap-4 w-1/4">
                    <img src={currentTrack.cover} className="w-12 h-12 rounded-lg object-cover" />
                    <div className="hidden md:block">
                      <h4 className="font-bold text-sm text-white">{currentTrack.title}</h4>
                      <p className="text-xs text-goldAccent font-bold">{currentTrack.producer}</p>
                    </div>
                  </div>
                  <div className="flex-1 flex justify-center"><button onClick={() => togglePlay(currentTrack)} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center"><Icon name={isPlaying ? "pause" : "play"} className="w-5 h-5" /></button></div>
                  <div className="w-1/4 flex justify-end"><button onClick={() => { setSelectedLicenseTrack(currentTrack); setSelectedLicenseType('mp3'); }} className="bg-goldAccent text-black font-bold px-4 py-2 rounded-xl text-xs">Acheter</button></div>
                </div>
              )}
            </div>
          );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
