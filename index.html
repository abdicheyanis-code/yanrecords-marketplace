<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YANrecords | Premium VST & Beatstore 🇩🇿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              obsidian: '#050508',
              cardDark: '#131520',
              borderDark: '#222638',
              cyanNeon: '#00f0ff',
              goldAccent: '#e2b053',
              pinkNeon: '#ff007f',
              greenPro: '#10b981'
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #050508; color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }
      .glass { background: rgba(19, 21, 32, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(34, 38, 56, 0.8); }
      .glass-card { background: linear-gradient(145deg, rgba(20, 22, 35, 0.9), rgba(10, 11, 18, 0.9)); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); }
      .text-gradient-gold { background: linear-gradient(to right, #e2b053, #fff176); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .text-gradient-cyan { background: linear-gradient(to right, #00f0ff, #0080ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .bg-animated-mesh { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: #050508; }
      .mesh-blob { position: absolute; filter: blur(100px); opacity: 0.35; border-radius: 50%; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #050508; }
      ::-webkit-scrollbar-thumb { background: #222638; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen pb-32">

    <div class="bg-animated-mesh">
        <div class="mesh-blob bg-blue-900 w-[500px] h-[500px] top-[-10%] left-[-10%]"></div>
        <div class="mesh-blob bg-purple-900 w-[600px] h-[600px] bottom-[-20%] right-[-10%]"></div>
        <div class="mesh-blob bg-teal-900/30 w-[400px] h-[400px] top-[40%] left-[40%]"></div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        // ===== INITIALISATION SUPABASE =====
        const SUPABASE_URL = 'https://xyz.supabase.co'; // À remplacer par ton vrai lien Supabase
        const SUPABASE_ANON_KEY = 'eyJ...';             // À remplacer par ta vraie clé Supabase
        const supabase = (window.supabase && !SUPABASE_URL.includes('xyz.supabase.co')) 
          ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
          : null;

        function generateRealVstKey() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let part1 = '';
            for (let i = 0; i < 4; i++) part1 += chars.charAt(Math.floor(Math.random() * chars.length));
            let hash = 0;
            for (let i = 0; i < part1.length; i++) hash += part1.charCodeAt(i) * (i + 5);
            let part2 = hash.toString(16).toUpperCase().padStart(4, '0').slice(-4);
            return `SM2-${part1}-${part2}`;
        }

        const INITIAL_TRACKS = [
          { id: 'vst-1', title: 'SmartMaster V2 Pro', type: 'vst', category: 'Mastering', price: 6500, cover: 'https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=800&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', desc: 'Processeur de mastering intelligent.', isSold: false },
          { id: 'beat-1', title: 'Marseille Vibes', type: 'beat', bpm: 130, key: 'Am', genre: 'Jul Type', producer: 'YANrecords', priceMp3: 2000, priceWav: 4000, priceStems: 8000, priceExclusive: 25000, cover: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3', isSold: false, plays: 1240 },
          { id: 'beat-2', title: 'Algiers Drill', type: 'beat', bpm: 142, key: 'C#m', genre: 'Drill', producer: 'YANrecords', priceMp3: 2500, priceWav: 5000, priceStems: 10000, priceExclusive: 35000, cover: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3', isSold: true, plays: 3450 }
        ];

        function App() {
          const [view, setView] = React.useState('home'); // home, vsts, beats, dashboard, upload
          const [tracks, setTracks] = React.useState(INITIAL_TRACKS);
          const [currentTrack, setCurrentTrack] = React.useState(null);
          const [isPlaying, setIsPlaying] = React.useState(false);
          const [modalItem, setModalItem] = React.useState(null);
          const [selectedLicenseType, setSelectedLicenseType] = React.useState('mp3');
          const [showAuthModal, setShowAuthModal] = React.useState(false);
          const [currentUser, setCurrentUser] = React.useState(null);
          const [purchasedKey, setPurchasedKey] = React.useState(null);

          const audioRef = React.useRef(new Audio());

          React.useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
            const savedUser = localStorage.getItem('yanrecords_user');
            if (savedUser) try { setCurrentUser(JSON.parse(savedUser)); } catch (e) {}
          }, [view, currentTrack]);

          const handleGoogleLogin = async () => {
            const demoUser = { id: 'demo-123', name: 'Yanis (CEO)', email: 'yanis@gmail.com', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80', balance: 45500, totalPlays: 8430 };
            localStorage.setItem('yanrecords_user', JSON.stringify(demoUser));
            setCurrentUser(demoUser);
            setShowAuthModal(false);
          };

          const handleLogout = () => { localStorage.removeItem('yanrecords_user'); setCurrentUser(null); setView('home'); };

          const togglePlay = (track) => {
            if (currentTrack?.id === track.id) {
              if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
              else { audioRef.current.play(); setIsPlaying(true); }
            } else {
              setCurrentTrack(track);
              audioRef.current.src = track.audio;
              audioRef.current.play();
              setIsPlaying(true);
              
              // Increment Plays
              setTracks(prev => prev.map(t => t.id === track.id ? { ...t, plays: (t.plays || 0) + 1 } : t));
            }
          };

          const handlePurchase = (item) => {
            if (item.type === 'vst') {
              setPurchasedKey(generateRealVstKey());
            } else {
              if (selectedLicenseType === 'exclusive') {
                setTracks(prev => prev.map(t => t.id === item.id ? { ...t, isSold: true } : t));
                alert(`Félicitations ! Vous avez acheté la licence EXCLUSIVE de "${item.title}".`);
              } else {
                alert(`Paiement confirmé ! Votre fichier audio et contrat PDF sont prêts.`);
              }
              setModalItem(null);
            }
          };

          return (
            <div className="relative">
              {/* NAVBAR */}
              <nav className="glass fixed top-0 w-full z-50 px-6 py-4 flex items-center justify-between">
                <div className="flex items-center gap-4 cursor-pointer" onClick={() => setView('home')}>
                  <div className="w-10 h-10 rounded-lg bg-black border border-goldAccent/50 flex items-center justify-center font-black text-xl text-goldAccent shadow-lg">Y</div>
                  <h1 className="text-2xl font-black tracking-widest text-white">YAN<span className="text-gradient-gold">RECORDS</span></h1>
                </div>

                <div className="hidden md:flex bg-black/40 border border-borderDark rounded-full p-1">
                  <button onClick={() => setView('home')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'home' ? 'bg-white text-black' : 'text-gray-400 hover:text-white'}`}>Accueil</button>
                  <button onClick={() => setView('vsts')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'vsts' ? 'bg-cyanNeon text-black' : 'text-gray-400 hover:text-white'}`}>Plugins VST</button>
                  <button onClick={() => setView('beats')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'beats' ? 'bg-goldAccent text-black' : 'text-gray-400 hover:text-white'}`}>Beatstore</button>
                </div>

                <div className="flex items-center gap-3">
                  {currentUser ? (
                    <>
                      <button onClick={() => setView('dashboard')} className="hidden sm:flex items-center gap-2 bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-bold px-4 py-2 rounded-xl text-xs hover:opacity-90 cyan-glow">
                        <i data-lucide="layout-dashboard" className="w-4 h-4"></i> Dashboard
                      </button>
                      <div className="flex items-center gap-2 bg-cardDark border border-borderDark px-3 py-1.5 rounded-xl cursor-pointer" onClick={() => setView('dashboard')}>
                        <img src={currentUser.avatar} className="w-7 h-7 rounded-full object-cover" />
                        <span className="text-xs font-bold text-white hidden md:block">{currentUser.name}</span>
                      </div>
                      <button onClick={handleLogout} className="text-gray-400 hover:text-red-400 ml-2"><i data-lucide="log-out" className="w-4 h-4"></i></button>
                    </>
                  ) : (
                    <button onClick={() => setShowAuthModal(true)} className="bg-cardDark border border-borderDark text-white hover:border-cyanNeon px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                      <i data-lucide="user" className="w-4 h-4"></i> Connexion
                    </button>
                  )}
                  <div className="text-xs font-bold bg-cardDark border border-borderDark px-3 py-2 rounded-xl text-goldAccent hidden md:block">🇩🇿 DZD</div>
                </div>
              </nav>

              <div className="pt-28 pb-10 px-6 max-w-7xl mx-auto">
                
                {/* BOUTON RETOUR (Apparaît si on n'est pas sur Home) */}
                {view !== 'home' && (
                  <button onClick={() => setView('home')} className="mb-6 flex items-center gap-2 text-gray-400 hover:text-white transition">
                    <i data-lucide="arrow-left" className="w-4 h-4"></i> Retour à l'accueil
                  </button>
                )}

                {/* ===== VIEW: HOME ===== */}
                {view === 'home' && (
                  <div className="text-center mt-12 mb-16">
                    <span className="inline-block bg-cyanNeon/10 border border-cyanNeon/30 text-cyanNeon text-xs font-bold px-3 py-1 rounded-full mb-4">🇩🇿 Marketplace Officielle Algérie</span>
                    <h2 className="text-4xl md:text-6xl font-black mb-4 tracking-tight leading-tight">BOOSTEZ VOS PRODS AVEC NOS <br/><span className="text-gradient-cyan">VSTS & BEATS PRO</span></h2>
                  </div>
                )}

                {/* ===== VIEW: VSTS ===== */}
                {(view === 'vsts' || view === 'home') && (
                  <section className="mb-16">
                    {view === 'home' && <h3 className="text-2xl font-bold mb-6 text-white border-l-4 border-cyanNeon pl-4">PLUGINS VST3 OFFICIELS</h3>}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      {tracks.filter(t => t.type === 'vst').map(vst => (
                        <div key={vst.id} className="glass-card rounded-2xl p-5 flex flex-col justify-between border-cyanNeon/30">
                          <img src={vst.cover} className="w-full h-44 object-cover rounded-xl mb-4" />
                          <h4 className="text-xl font-black text-white">{vst.title}</h4>
                          <p className="text-xs text-gray-400 my-2">{vst.desc}</p>
                          <div className="flex justify-between items-center mt-4">
                            <span className="text-lg font-black text-goldAccent">{vst.price.toLocaleString()} DZD</span>
                            <button onClick={() => { setModalItem(vst); setPurchasedKey(null); }} className="bg-cyanNeon text-black font-bold px-4 py-2 rounded-xl text-xs hover:opacity-90">Acheter</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>
                )}

                {/* ===== VIEW: BEATS ===== */}
                {(view === 'beats' || view === 'home') && (
                  <section>
                    {view === 'home' && <h3 className="text-2xl font-bold mb-6 text-white border-l-4 border-goldAccent pl-4">BEATSTORE</h3>}
                    <div className="glass-card rounded-2xl p-4 space-y-2">
                      {tracks.filter(t => t.type === 'beat').map(beat => (
                        <div key={beat.id} className={`flex items-center justify-between p-3 rounded-xl ${beat.isSold ? 'opacity-50 bg-black/60' : 'hover:bg-white/5'}`}>
                          <div className="flex items-center gap-4">
                            <div className="relative w-12 h-12 rounded-lg overflow-hidden cursor-pointer" onClick={() => !beat.isSold && togglePlay(beat)}>
                              <img src={beat.cover} className="w-full h-full object-cover" />
                              {!beat.isSold && <div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100"><i data-lucide={currentTrack?.id === beat.id && isPlaying ? "pause" : "play"} className="w-5 h-5 text-white fill-current"></i></div>}
                            </div>
                            <div>
                              <h4 className="font-bold text-white">{beat.title} {beat.isSold && <span className="bg-red-600 text-[9px] px-1 rounded ml-2">SOLD</span>}</h4>
                              <p className="text-xs text-gray-400">{beat.producer} • {beat.genre}</p>
                            </div>
                          </div>
                          {beat.isSold ? (
                            <span className="text-xs font-bold text-red-500 border border-red-800/50 px-4 py-2 rounded-xl">EXCLUSIVE VENDUE</span>
                          ) : (
                            <button onClick={() => { setModalItem(beat); setSelectedLicenseType('mp3'); }} className="border border-goldAccent text-goldAccent font-bold px-4 py-2 rounded-xl text-xs hover:bg-goldAccent hover:text-black">
                              {beat.priceMp3.toLocaleString()} DZD
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </section>
                )}

                {/* ===== VIEW: DASHBOARD VENDEUR ===== */}
                {view === 'dashboard' && currentUser && (
                  <div className="animate-fade-in">
                    <h2 className="text-3xl font-black text-white mb-8">Tableau de Bord Vendeur</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                      <div className="glass-card p-6 rounded-2xl border-cyanNeon/30">
                        <h4 className="text-gray-400 text-sm font-bold mb-2">Revenus Totaux</h4>
                        <span className="text-4xl font-black text-cyanNeon">{currentUser.balance.toLocaleString()} DZD</span>
                      </div>
                      <div className="glass-card p-6 rounded-2xl border-goldAccent/30">
                        <h4 className="text-gray-400 text-sm font-bold mb-2">Écoutes (Plays)</h4>
                        <span className="text-4xl font-black text-goldAccent">{currentUser.totalPlays.toLocaleString()}</span>
                      </div>
                      <div className="glass-card p-6 rounded-2xl flex items-center justify-center">
                        <button onClick={() => setView('upload')} className="bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-black py-4 px-8 rounded-xl w-full flex justify-center items-center gap-2 cyan-glow">
                          <i data-lucide="upload-cloud" className="w-5 h-5"></i> Uploader un Beat
                        </button>
                      </div>
                    </div>

                    <h3 className="text-xl font-bold text-white mb-4">Mes Créations</h3>
                    <div className="glass-card rounded-2xl p-4">
                      {tracks.filter(t => t.producer === currentUser.name || t.producer === 'YANrecords').map(track => (
                        <div key={track.id} className="flex justify-between items-center p-3 hover:bg-white/5 rounded-xl border-b border-borderDark last:border-0">
                          <div className="flex items-center gap-4">
                            <img src={track.cover} className="w-10 h-10 rounded-lg object-cover" />
                            <div><h4 className="font-bold text-white text-sm">{track.title}</h4><p className="text-xs text-gray-400">{track.type.toUpperCase()}</p></div>
                          </div>
                          <div className="flex gap-2">
                            <button className="p-2 bg-borderDark hover:bg-gray-700 rounded-lg text-white"><i data-lucide="edit-2" className="w-4 h-4"></i></button>
                            <button className="p-2 bg-red-900/50 hover:bg-red-600 border border-red-800 rounded-lg text-white"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* ===== VIEW: UPLOAD FORM ===== */}
                {view === 'upload' && currentUser && (
                  <div className="max-w-2xl mx-auto glass-card p-8 rounded-2xl animate-fade-in border-goldAccent/30">
                    <h2 className="text-2xl font-black text-white mb-6">Uploader une nouvelle création</h2>
                    <form onSubmit={(e) => { e.preventDefault(); alert("Fichiers envoyés avec succès !"); setView('dashboard'); }} className="space-y-4">
                      <div>
                        <label className="text-sm font-bold text-gray-300 block mb-1">Titre</label>
                        <input type="text" required className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-white focus:border-cyanNeon outline-none" />
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="text-sm font-bold text-gray-300 block mb-1">Prix MP3 (DZD)</label>
                          <input type="number" required defaultValue="2000" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-white focus:border-goldAccent outline-none" />
                        </div>
                        <div>
                          <label className="text-sm font-bold text-gray-300 block mb-1">BPM</label>
                          <input type="number" defaultValue="140" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-white outline-none" />
                        </div>
                      </div>
                      <div>
                        <label className="text-sm font-bold text-gray-300 block mb-1">Pochette (JPG/PNG)</label>
                        <input type="file" required accept="image/*" className="w-full text-sm text-gray-400 file:bg-cyanNeon file:text-black file:border-0 file:rounded-xl file:px-4 file:py-2" />
                      </div>
                      <div>
                        <label className="text-sm font-bold text-gray-300 block mb-1">Fichier Audio (MP3/WAV)</label>
                        <input type="file" required accept="audio/*" className="w-full text-sm text-gray-400 file:bg-goldAccent file:text-black file:border-0 file:rounded-xl file:px-4 file:py-2" />
                      </div>
                      <button type="submit" className="w-full mt-6 bg-goldAccent text-black font-black py-4 rounded-xl gold-glow hover:scale-[1.02] transition">
                        PUBLIER SUR YANRECORDS
                      </button>
                    </form>
                  </div>
                )}
              </div>

              {/* MODAL ACHAT (COMMUNE) */}
              {modalItem && (
                <div className="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="glass-card rounded-2xl max-w-lg w-full p-6 relative">
                    <button onClick={() => setModalItem(null)} className="absolute top-4 right-4 text-gray-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                    <h3 className="text-xl font-black text-white mb-4">Achat : {modalItem.title}</h3>

                    {modalItem.type === 'vst' && !purchasedKey && (
                      <div>
                        <div className="p-4 rounded-xl border border-primary bg-primary/10 mb-6">
                          <h4 className="font-bold text-white">Licence Complète VST3</h4>
                          <span className="text-xl font-black text-goldAccent block mt-2">{modalItem.price.toLocaleString()} DZD</span>
                        </div>
                        <button onClick={() => handlePurchase(modalItem)} className="w-full bg-primary text-black font-black py-3 rounded-xl hover:opacity-90">Payer & Générer la Clé</button>
                      </div>
                    )}
                    {modalItem.type === 'vst' && purchasedKey && (
                      <div className="bg-black/80 border border-greenPro rounded-xl p-4 text-center">
                        <span className="text-xs font-bold text-greenPro block mb-2">VOTRE CLÉ VST3 :</span>
                        <input type="text" readOnly value={purchasedKey} className="w-full text-center font-mono text-lg font-bold bg-cardDark border border-greenPro text-white p-2 rounded-lg outline-none select-all" />
                      </div>
                    )}
                    {modalItem.type === 'beat' && (
                      <div className="space-y-3 mb-6">
                        <div onClick={() => setSelectedLicenseType('mp3')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'mp3' ? 'border-goldAccent bg-goldAccent/10' : 'border-borderDark'}`}>
                          <div className="flex justify-between font-bold text-white"><span>MP3 Lease</span><span className="text-goldAccent">{modalItem.priceMp3.toLocaleString()} DZD</span></div>
                        </div>
                        <div onClick={() => setSelectedLicenseType('exclusive')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'exclusive' ? 'border-red-500 bg-red-500/10' : 'border-borderDark'}`}>
                          <div className="flex justify-between font-bold text-white"><span className="text-red-400">🔥 LICENCE EXCLUSIVE</span><span className="text-goldAccent">{modalItem.priceExclusive.toLocaleString()} DZD</span></div>
                        </div>
                        <button onClick={() => handlePurchase(modalItem)} className="w-full bg-goldAccent text-black font-black py-3 rounded-xl mt-4">Payer {selectedLicenseType === 'exclusive' ? modalItem.priceExclusive.toLocaleString() : modalItem.priceMp3.toLocaleString()} DZD</button>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* LECTEUR AUDIO PERSISTANT */}
              {currentTrack && currentTrack.type === 'beat' && (
                <div className="fixed bottom-0 inset-x-0 z-50 glass border-t border-goldAccent/30 px-6 py-3 flex items-center justify-between">
                  <div className="flex items-center gap-4 w-1/4">
                    <img src={currentTrack.cover} className="w-12 h-12 rounded-lg object-cover" />
                    <div className="hidden md:block">
                      <h4 className="font-bold text-sm text-white">{currentTrack.title}</h4>
                      <p className="text-xs text-goldAccent">{currentTrack.producer}</p>
                    </div>
                  </div>
                  <div className="flex-1 flex justify-center"><button onClick={() => togglePlay(currentTrack)} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center"><i data-lucide={isPlaying ? "pause" : "play"} className="w-5 h-5 fill-current"></i></button></div>
                  <div className="w-1/4 flex justify-end"><button onClick={() => { setModalItem(currentTrack); setSelectedLicenseType('mp3'); }} className="bg-goldAccent text-black font-bold px-4 py-2 rounded-xl text-xs">Acheter</button></div>
                </div>
              )}

              {/* MODAL CONNEXION GOOGLE */}
              {showAuthModal && (
                <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="glass-card rounded-2xl max-w-sm w-full p-6 text-center relative">
                    <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                    <h3 className="text-xl font-black text-white mb-6">Connexion YANrecords</h3>
                    <button onClick={handleGoogleLogin} className="w-full bg-white text-black font-bold py-3 px-4 rounded-xl flex justify-center gap-3">
