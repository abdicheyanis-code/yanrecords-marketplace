class Boundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err)return <div className="min-h-screen flex items-center justify-center p-4"><div className="card p-8 rounded-2xl text-center max-w-md"><h2 className="text-2xl font-black text-white mb-2">Erreur</h2><p className="text-xs text-gray-400 mb-4">{String(this.state.err.message||this.state.err)}</p><button onClick={function(){location.reload();}} className="bg-cyanNeon text-black px-6 py-3 rounded-xl font-bold">Recharger</button></div></div>;
    return this.props.children;
  }
}

function Toasts(props){
  return <div className="fixed top-20 right-4 z-[200] flex flex-col gap-3 max-w-xs">
    {props.items.map(function(t){
      return <div key={t.id} className="card rounded-xl p-4 flex items-center gap-3 border-l-4 pop" style={{borderLeftColor:t.type==='error'?'#ef4444':'#10b981'}}>
        <p className="text-sm font-bold text-white flex-1">{t.msg}</p>
        <button onClick={function(){props.remove(t.id);}} className="text-gray-500"><Icon n="x" c="w-4 h-4"/></button>
      </div>;
    })}
  </div>;
}

function buildContract(d,toast){
  const L=LIC[d.license_type]||null;
  const isVst=d.product_type==='vst';
  const rows=L?[
    ['Fichiers livrés',L.fichier],['Streams autorisés',L.streams],['Copies vendues',L.copies],
    ['Clips vidéo',L.videos],['Diffusion radio',L.radio],['Prestations live',L.live],
    ['Tag producteur',L.tag],['Exclusivité',L.excl],['Droits d\u2019édition',L.pub],['Durée',L.duree]
  ]:[];
  let tb='';
  rows.forEach(function(r){tb+='<tr><td class="k">'+r[0]+'</td><td>'+r[1]+'</td></tr>';});

  const vstBloc=isVst?'<div class="box"><h3>LICENCE LOGICIELLE VST</h3><table>'+
    '<tr><td class="k">Clé de licence</td><td class="mono">'+(d.vst_key||'— en attente de validation')+'</td></tr>'+
    '<tr><td class="k">Machines autorisées</td><td>3 ordinateurs maximum</td></tr>'+
    '<tr><td class="k">Usage</td><td>Personnel et commercial, productions illimitées</td></tr>'+
    '<tr><td class="k">Interdictions</td><td>Partage, revente, diffusion ou décompilation de la clé et du logiciel</td></tr>'+

/* ============ CGU ============ */
function CguText(){
  const A=function(p){return <div className="mb-4"><p className="font-black text-goldAccent text-sm mb-1">{p.t}</p><div className="text-sm text-gray-300 space-y-1">{p.children}</div></div>;};
  return <div>
    <p className="text-xs text-gray-500 mb-6">Version 2.0 &middot; Derni&egrave;re mise &agrave; jour : {new Date().toLocaleDateString('fr-FR')}</p>
    <A t="ARTICLE 1 — OBJET ET CHAMP D'APPLICATION"><p>YANrecords est une plateforme en ligne algérienne mettant en relation des producteurs de musique (vendeurs) et des artistes, labels ou créateurs (acheteurs), pour la cession de licences d'utilisation d'instrumentales et de logiciels audio (VST). Les présentes CGU régissent l'intégralité des relations entre la plateforme et ses utilisateurs. Toute utilisation du site vaut acceptation sans réserve.</p></A>
    <A t="ARTICLE 2 — INSCRIPTION ET COMPTE"><p>L'inscription est gratuite et requiert un email valide. L'utilisateur garantit l'exactitude des informations fournies. Un seul compte par personne est autorisé. L'utilisateur est seul responsable de la confidentialité de son mot de passe et de toute activité effectuée depuis son compte. Les comptes créés avec de fausses informations peuvent être suspendus sans préavis.</p></A>
    <A t="ARTICLE 3 — QUALITÉ DE VENDEUR"><p>Tout utilisateur peut devenir vendeur. Pour vendre, il doit renseigner un nom légal complet et des coordonnées bancaires valides (CCP ou BaridiMob). Le vendeur agit en son nom propre et reste seul responsable fiscalement de ses revenus auprès des administrations compétentes.</p></A>
    <A t="ARTICLE 4 — PROPRIÉTÉ INTELLECTUELLE DES CONTENUS"><p>En publiant une œuvre, le vendeur déclare et garantit : être l'auteur original et exclusif ; détenir l'intégralité des droits nécessaires ; que l'œuvre ne contient aucun échantillon (sample) non libéré ni élément protégé par un tiers. Le vendeur garantit YANrecords et les acheteurs contre toute réclamation. Toute violation entraîne la suppression immédiate du contenu, la clôture du compte et la retenue des fonds en litige.</p></A>
    <A t="ARTICLE 5 — LES QUATRE LICENCES BEATS"><p>Chaque beat est proposé sous quatre niveaux de licence, détaillés sur la page Infos et dans le contrat généré à chaque achat :</p>
      <p><b className="text-white">MP3 Lease</b> — non exclusif, 50 000 streams, 2 000 copies, 1 clip, tag obligatoire, 2 ans.</p>
      <p><b className="text-white">WAV Standard</b> — non exclusif, 150 000 streams, 5 000 copies, 2 clips, radio limitée, 5 ans.</p>
      <p><b className="text-white">Trackout Stems</b> — non exclusif, 500 000 streams, 10 000 copies, pistes séparées, 10 ans.</p>
      <p><b className="text-white">Exclusive</b> — droits exclusifs, limites illimitées, tag retiré, beat définitivement retiré du catalogue, durée illimitée.</p>
      <p>Les licences non exclusives délivrées avant une vente exclusive demeurent valables jusqu'à leur terme.</p></A>
    <A t="ARTICLE 6 — LICENCES VST ET CLÉS D'ACTIVATION"><p>Chaque achat de plugin génère une clé unique au format YAN-XXXX-XXXX-XXXX, valable sur trois ordinateurs maximum. La clé est personnelle et incessible. Le partage, la revente, la publication ou toute tentative de contournement entraîne la révocation définitive de la clé sans remboursement. La décompilation, l'ingénierie inverse et la modification du logiciel sont interdites.</p></A>
    <A t="ARTICLE 7 — CRÉDIT ET MENTION DU PRODUCTEUR"><p>Sauf licence exclusive prévoyant le contraire, l'acheteur doit mentionner « Prod. by [nom du producteur] » dans le titre du morceau, la description et les métadonnées, sur toutes les plateformes de diffusion. Le tag vocal du producteur doit être conservé pour les licences MP3 et WAV.</p></A>
    <A t="ARTICLE 8 — DROITS D'ÉDITION (PUBLISHING)"><p>Sauf accord écrit distinct, les droits d'édition sont répartis à parts égales : 50 % pour le producteur (compositeur) et 50 % pour l'artiste (auteur-interprète). Chaque partie est responsable de sa propre déclaration auprès de l'ONDA ou de tout autre organisme de gestion collective.</p></A>
    <A t="ARTICLE 9 — PRIX ET COMMISSIONS"><p>Les prix sont fixés librement par les vendeurs et affichés en dinars algériens, toutes taxes comprises. YANrecords prélève une commission de 5 % sur les beats et 8 % sur les VST, déduite de la part du vendeur. L'acheteur paie exactement le prix affiché. Ces taux peuvent être modifiés avec un préavis de trente jours.</p></A>
    <A t="ARTICLE 10 — PAIEMENT ET VALIDATION"><p>Le paiement s'effectue par virement CCP, BaridiMob ou Edahabia directement vers le compte du vendeur. L'acheteur transmet obligatoirement une preuve de virement lisible. La commande est examinée manuellement et validée sous vingt-quatre heures ouvrées. Une preuve falsifiée entraîne le refus de la commande et la clôture immédiate du compte.</p></A>
    <A t="ARTICLE 11 — LIVRAISON"><p>Après validation, les fichiers et la clé éventuelle sont accessibles dans l'espace « Mes commandes ». Les liens de téléchargement sont sécurisés et temporaires. L'acheteur est responsable de la sauvegarde de ses fichiers et de sa clé.</p></A>
    <A t="ARTICLE 12 — DROIT DE RÉTRACTATION ET REMBOURSEMENT"><p>S'agissant de contenus numériques fournis immédiatement, aucun droit de rétractation ne s'applique après livraison. Un remboursement est accordé uniquement en cas de fichier corrompu, manquant ou non conforme à l'annonce, sur réclamation motivée adressée dans les quarante-huit heures suivant la livraison.</p></A>
    <A t="ARTICLE 13 — RETRAIT DES GAINS"><p>Le solde du vendeur correspond au montant net de commission. Le retrait minimum est de 1 000 DZD. Une seule demande peut être en cours à la fois. Le versement est effectué sous sept jours ouvrés sur le compte CCP ou BaridiMob renseigné. Les coordonnées erronées sont de la responsabilité exclusive du vendeur.</p></A>
    <A t="ARTICLE 14 — LIMITES D'UTILISATION DE LA PLATEFORME"><p>Sont interdits : la publication de contenus illicites, haineux ou contrefaits ; la manipulation artificielle des compteurs d'écoutes ; le contournement de la plateforme pour conclure une vente hors du site ; l'utilisation de robots ou scripts automatisés. Les publications sont limitées à dix par période de vingt-quatre heures et par compte.</p></A>
    <A t="ARTICLE 15 — DONNÉES PERSONNELLES"><p>Sont collectés : adresse email, nom d'artiste, nom légal, photo, biographie et coordonnées bancaires. Ces données servent exclusivement au fonctionnement du service et ne sont jamais revendues. L'adresse email, le solde et les coordonnées bancaires ne sont jamais affichés publiquement ; les coordonnées bancaires sont révélées à un acheteur uniquement au moment du paiement. Chaque utilisateur peut demander la rectification ou la suppression de ses données.</p></A>
    <A t="ARTICLE 16 — RESPONSABILITÉ"><p>YANrecords agit en qualité d'intermédiaire technique. La plateforme n'est pas partie aux contrats conclus entre vendeurs et acheteurs. Elle ne peut être tenue responsable de la qualité des œuvres, de l'usage qui en est fait, des litiges entre membres, ni des interruptions de service. Sa responsabilité éventuelle est en tout état de cause limitée au montant de la commission perçue sur la transaction concernée.</p></A>
    <A t="ARTICLE 17 — MODÉRATION ET SANCTIONS"><p>YANrecords se réserve le droit de retirer tout contenu, suspendre ou supprimer tout compte en cas de violation des présentes conditions, sans préavis ni indemnité. Les sommes issues de transactions frauduleuses peuvent être gelées.</p></A>
    <A t="ARTICLE 18 — MODIFICATION, DROIT APPLICABLE ET LITIGES"><p>YANrecords peut modifier les présentes CGU à tout moment ; les utilisateurs en sont informés et la poursuite de l'utilisation vaut acceptation. Les présentes conditions sont régies par le droit algérien. En cas de litige, les parties s'engagent à rechercher une solution amiable avant toute action. À défaut, compétence est attribuée aux juridictions algériennes compétentes.</p></A>
    <div className="mt-6 p-4 rounded-xl bg-yellow-500/10 border border-yellow-500/30">
      <p className="text-xs text-yellow-300"><b>Avertissement.</b> Ce document est un modèle inspiré des pratiques standards de l'industrie musicale. Il ne constitue pas un conseil juridique. Pour les cessions importantes, faites-le valider par un avocat spécialisé en propriété intellectuelle.</p>
    </div>
  </div>;
}

/* ============ AUTH ============ */
function AuthPage(props){
  const [mode,setMode]=React.useState('login');
  const [email,setEmail]=React.useState('');
  const [pass,setPass]=React.useState('');
  const [name,setName]=React.useState('');
  const [err,setErr]=React.useState('');
  const [busy,setBusy]=React.useState(false);
  const [cgu,setCgu]=React.useState(false);
  const [showCgu,setShowCgu]=React.useState(false);
  async function submit(e){
    e.preventDefault(); setErr('');
    if(mode==='register'&&!cgu){setErr('Vous devez accepter les CGU.');return;}
    setBusy(true);
    try{
      if(mode==='login'){const r=await sb.auth.signInWithPassword({email:email,password:pass});if(r.error)throw r.error;props.toast('Connecté !');}
      else{const r=await sb.auth.signUp({email:email,password:pass,options:{data:{full_name:name||email.split('@')[0]}}});if(r.error)throw r.error;
        if(r.data.user&&!r.data.session)props.toast('Vérifie ton email pour activer ton compte');else props.toast('Compte créé !');}
    }catch(ex){setErr(ex.message);}
    setBusy(false);
  }
  async function google(){const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin}});if(r.error)props.toast(r.error.message,'error');}
  return <div className="min-h-screen flex items-center justify-center p-4 relative">
    <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1600&q=80')] bg-cover bg-center"></div>
    <div className="absolute inset-0 bg-obsidian/90 backdrop-blur-md"></div>
    <div className="relative z-10 w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-12 items-center fade">
      <div className="text-center lg:text-left space-y-6">
        <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-black border border-goldAccent/50 font-black text-3xl text-goldAccent gg">Y</div>
        <h1 className="text-4xl md:text-5xl font-black text-white leading-tight">BIENVENUE SUR<br/><span className="tgold">YANRECORDS</span></h1>
        <p className="text-gray-400 text-lg">La marketplace musicale n°1 en Algérie.</p>
        <div className="hidden lg:block space-y-3 pt-4">
          <p className="text-sm font-bold text-white">✅ Beats avec 4 niveaux de licence</p>
          <p className="text-sm font-bold text-white">🔑 Plugins VST avec clés uniques</p>
          <p className="text-sm font-bold text-white">📄 Contrat PDF pour chaque vente</p>
        </div>
      </div>
      <div className="card p-8 rounded-[2rem] border-cyanNeon/20">
        <div className="flex bg-obsidian rounded-xl p-1 mb-8 border border-borderDark">
          <button onClick={function(){setMode('login');setErr('');}} className={'flex-1 py-2.5 text-sm font-bold rounded-lg transition '+(mode==='login'?'bg-cyanNeon text-black':'text-gray-400')}>Se connecter</button>
          <button onClick={function(){setMode('register');setErr('');}} className={'flex-1 py-2.5 text-sm font-bold rounded-lg transition '+(mode==='register'?'bg-goldAccent text-black':'text-gray-400')}>Créer un compte</button>
        </div>
        <form onSubmit={submit} className="space-y-4">
          {mode==='register'?<div><label className="text-xs font-bold text-gray-400 block mb-1">Nom d'Artiste</label><input type="text" required maxLength="50" value={name} onChange={function(e){setName(e.target.value);}} placeholder="DJ Yanis" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none focus:border-cyanNeon"/></div>:null}
          <div><label className="text-xs font-bold text-gray-400 block mb-1">Email</label><input type="email" required value={email} onChange={function(e){setEmail(e.target.value);}} placeholder="contact@studio.com" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none focus:border-cyanNeon"/></div>
          <div><label className="text-xs font-bold text-gray-400 block mb-1">Mot de passe (6+)</label><input type="password" required minLength="6" value={pass} onChange={function(e){setPass(e.target.value);}} placeholder="••••••••" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none focus:border-cyanNeon"/></div>
          {mode==='register'?<div className="flex items-start gap-3"><input type="checkbox" checked={cgu} onChange={function(e){setCgu(e.target.checked);}} className="mt-1 accent-goldAccent"/><label className="text-xs text-gray-400">J'accepte les <span onClick={function(){setShowCgu(true);}} className="text-goldAccent cursor-pointer font-bold hover:underline">CGU</span>.</label></div>:null}
          {err?<div className="bg-red-500/10 border border-red-500/40 text-red-400 text-xs p-3 rounded-xl">{err}</div>:null}
          <button type="submit" disabled={busy} className={'w-full font-black py-3.5 rounded-xl mt-4 disabled:opacity-50 '+(mode==='login'?'bg-cyanNeon text-black gc':'bg-goldAccent text-black gg')}>{busy?'...':(mode==='login'?'CONNEXION':"S'INSCRIRE")}</button>
        </form>
        <div className="flex items-center gap-4 my-6"><div className="h-px bg-borderDark flex-1"></div><span className="text-xs font-bold text-gray-500">OU</span><div className="h-px bg-borderDark flex-1"></div></div>
        <button onClick={google} className="w-full bg-white text-black font-bold py-3.5 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-200 transition">
          <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continuer avec Google
        </button>
      </div>
    </div>
    {showCgu?<div className="fixed inset-0 z-[150] bg-black/90 flex items-center justify-center p-4"><div className="card rounded-2xl max-w-3xl w-full p-8 max-h-[85vh] flex flex-col pop"><h3 className="text-2xl font-black text-goldAccent mb-4">CGU YANrecords</h3><div className="flex-1 overflow-y-auto pr-3"><CguText/></div><button onClick={function(){setCgu(true);setShowCgu(false);}} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl mt-6">J'ACCEPTE</button></div></div>:null}
  </div>;
}

    return function(){alive=false;};

/* ============ VERIFY ============ */
function VerifyView(props){
  const [key,setKey]=React.useState('');
  const [machine,setMachine]=React.useState('PC-'+Math.random().toString(36).substring(2,8).toUpperCase());
  const [result,setResult]=React.useState(null);
  const [busy,setBusy]=React.useState(false);
  async function run(e){
    e.preventDefault(); if(!key.trim())return;
    setBusy(true); setResult(null);
    const r=await sb.rpc('verify_vst_key',{p_key:key.trim().toUpperCase(),p_machine_id:machine.trim()||null});
    if(r.error)setResult({valid:false,reason:r.error.message}); else setResult(r.data);
    setBusy(false);
  }
  return <div className="max-w-2xl mx-auto card p-8 rounded-3xl fade border-cyanNeon/30">
    <div className="flex items-center gap-4 mb-6 border-b border-borderDark pb-6">
      <div className="w-16 h-16 rounded-full bg-cyanNeon/10 flex items-center justify-center"><Icon n="key" c="w-8 h-8 text-cyanNeon"/></div>
      <div><h2 className="text-3xl font-black text-white">Vérifier une clé</h2><p className="text-sm text-gray-400">Simule ce que fait le plugin.</p></div>
    </div>
    <form onSubmit={run} className="space-y-4">
      <div><label className="text-xs font-bold text-gray-400 block mb-1">Clé de licence</label><input type="text" value={key} onChange={function(e){setKey(e.target.value.toUpperCase());}} maxLength="24" placeholder="YAN-XXXX-XXXX-XXXX" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-lg text-white font-mono text-center outline-none"/></div>
      <div><label className="text-xs font-bold text-gray-400 block mb-1">ID Machine</label>
        <div className="flex gap-2">
          <input type="text" value={machine} onChange={function(e){setMachine(e.target.value);}} className="flex-1 bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white font-mono outline-none"/>
          <button type="button" onClick={function(){setMachine('PC-'+Math.random().toString(36).substring(2,8).toUpperCase());}} className="bg-cardDark border border-borderDark text-white font-bold px-4 rounded-xl text-xs">Autre PC</button>
        </div>
        <p className="text-[11px] text-gray-500 mt-1">Chaque ID différent compte pour 1 activation (3 max).</p>
      </div>
      <button type="submit" disabled={busy} className="w-full bg-cyanNeon text-black font-black py-4 rounded-xl gc disabled:opacity-50">{busy?'VÉRIFICATION...':'VÉRIFIER'}</button>
    </form>
    {result?<div className={'mt-6 p-5 rounded-2xl border pop '+(result.valid?'border-greenPro bg-greenPro/10':'border-red-500 bg-red-500/10')}>
      <h4 className={'font-black text-xl mb-2 '+(result.valid?'text-greenPro':'text-red-400')}>{result.valid?'✅ CLÉ VALIDE':'❌ CLÉ REFUSÉE'}</h4>
      {result.product?<p className="text-sm text-gray-300">Produit : <b>{result.product}</b></p>:null}
      {result.reason?<p className="text-sm text-red-300">{result.reason}</p>:null}
      {(result.max_activations!==undefined&&result.max_activations!==null)?<p className="text-sm text-gray-300">Activations : <b>{result.activations}/{result.max_activations}</b></p>:null}
    </div>:null}
    {props.myKeys.length>0?<div className="mt-8 pt-6 border-t border-borderDark">
      <p className="text-xs font-bold text-gray-400 mb-3">Tester avec mes clés :</p>
      <div className="flex flex-wrap gap-2">
        {props.myKeys.map(function(k){return <button key={k.vst_key} onClick={function(){setKey(k.vst_key);setResult(null);}} className="font-mono text-xs bg-obsidian border border-greenPro/40 text-greenPro px-3 py-1.5 rounded-lg">{k.vst_key}</button>;})}
        <button onClick={function(){setKey('YAN-FAKE-1234-ABCD');setResult(null);}} className="font-mono text-xs bg-obsidian border border-red-500/40 text-red-400 px-3 py-1.5 rounded-lg">Fausse clé</button>
      </div>
    </div>:null}
  </div>;
}

/* ============ UPLOAD ============ */
function UploadView(props){
  const [title,setTitle]=React.useState('');
  const [type,setType]=React.useState('beat');
  const [genre,setGenre]=React.useState('Drill');
  const [bpm,setBpm]=React.useState(140);
  const [mkey,setMkey]=React.useState('Am');
  const [p1,setP1]=React.useState(2000);
  const [p2,setP2]=React.useState(4000);
  const [p3,setP3]=React.useState(8000);
  const [p4,setP4]=React.useState(25000);
  const [desc,setDesc]=React.useState('');
  const [cover,setCover]=React.useState(null);
  const [file,setFile]=React.useState(null);
  const [busy,setBusy]=React.useState(false);
  async function submit(e){
    e.preventDefault(); setBusy(true);
    const ok=await props.upload({title:title,type:type,genre:genre,bpm:bpm,key:mkey,p1:p1,p2:p2,p3:p3,p4:p4,desc:desc,cover:cover,file:file});
    if(ok){setTitle('');setDesc('');setCover(null);setFile(null);}
    setBusy(false);
  }
  return <div className="max-w-2xl mx-auto card p-8 rounded-2xl border-goldAccent/40 fade">
    <h2 className="text-2xl font-black text-white mb-2">Nouvelle création</h2>
    <p className="text-xs text-gray-400 mb-6">Par <span className="text-goldAccent font-bold">{props.profile.name}</span> · tes abonnés seront notifiés 🔔</p>
    <form onSubmit={submit} className="space-y-4">
      <div><label className="text-xs font-bold text-gray-300 block mb-1">Titre</label><input type="text" required maxLength="100" value={title} onChange={function(e){setTitle(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none"/></div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div><label className="text-xs font-bold text-gray-300 block mb-1">Type</label><select value={type} onChange={function(e){setType(e.target.value);setFile(null);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"><option value="beat">Beat</option><option value="vst">VST</option></select></div>
        {type==='beat'?<React.Fragment>

function BuyModal(props){
  const item=props.item;
  const [license,setLicense]=React.useState(item.type==='vst'?'vst':'mp3');

  const [seller,setSeller]=React.useState(null);
  const [accept,setAccept]=React.useState(false);
  const [detail,setDetail]=React.useState(false);
  const [busy,setBusy]=React.useState(false);
  React.useEffect(function(){
    sb.rpc('get_seller_payment',{p_track_id:item.id}).then(function(r){if(r.data)setSeller(r.data);});
  },[item.id]);
  function price(l){
    if(item.type==='vst')return item.price_mp3||0;
    if(l==='wav')return item.price_wav||0;
    if(l==='stems')return item.price_stems||0;
    if(l==='exclusive')return item.price_exclusive||0;
    return item.price_mp3||0;
  }
  const rate=item.type==='vst'?8:5;

  async function send(){setBusy(true);await props.submit(item,license,price(license),rate,proof);setBusy(false);}

    <div className="card rounded-2xl max-w-lg w-full p-6 relative my-8 pop">

            <div className="flex justify-between font-bold text-white"><span style={{color:on?d.coul:'#fff'}}>{d.nom}</span><span className="text-goldAccent">{fmt(price(l))} DZD</span></div>
            <p className="text-[11px] text-gray-400 mt-0.5">{d.streams} · {d.copies} · {d.videos}</p>
          </div>;
        })}
      </div>:null}

      {L?<div className="mb-4">
        <button onClick={function(){setDetail(!detail);}} className="w-full flex items-center justify-between p-3 rounded-xl bg-obsidian border border-borderDark text-left">
          <span className="text-xs font-bold text-white">Voir tous les droits de cette licence</span>
          <span className={'text-gray-400 transition-transform '+(detail?'rotate-180':'')}><Icon n="chev" c="w-4 h-4"/></span>
        </button>
        <div className={'acc '+(detail?'on':'')}>
          <table className="lic-tbl mt-2">

              <tr><td>Fichiers</td><td className="text-white">{L.fichier}</td></tr>
              <tr><td>Streams</td><td className="text-white">{L.streams}</td></tr>
              <tr><td>Copies</td><td className="text-white">{L.copies}</td></tr>
              <tr><td>Clips</td><td className="text-white">{L.videos}</td></tr>
              <tr><td>Radio</td><td className="text-white">{L.radio}</td></tr>
              <tr><td>Concerts</td><td className="text-white">{L.live}</td></tr>
              <tr><td>Tag</td><td className="text-white">{L.tag}</td></tr>
              <tr><td>Exclusivité</td><td className="text-white">{L.excl}</td></tr>
              <tr><td>Édition</td><td className="text-white">{L.pub}</td></tr>
              <tr><td>Durée</td><td className="text-white">{L.duree}</td></tr>
            </tbody>
          </table>
        </div>
      </div>:null}

      {item.type==='vst'?<div className="p-3 rounded-xl bg-obsidian border border-borderDark mb-4">
        <p className="text-xs font-bold text-cyanNeon mb-1">Licence logicielle VST</p>
        <p className="text-[11px] text-gray-400">Clé unique · 3 machines maximum · productions commerciales illimitées · partage interdit sous peine de révocation.</p>

      <div className="p-4 rounded-xl bg-goldAccent/10 border border-goldAccent/30 mb-4 flex justify-between items-center"><span className="font-bold text-white">Total à payer</span><span className="text-xl font-black text-goldAccent">{fmt(price(license))} DZD</span></div>

      <div className="p-4 rounded-xl bg-cyanNeon/10 border border-cyanNeon/30 mb-4">
        <h4 className="font-bold text-white text-sm mb-2">Paiement CCP / BaridiMob</h4>
        {(seller&&seller.rip)?<React.Fragment><p className="font-mono text-base text-greenPro font-bold select-all">{seller.rip}</p><p className="text-xs text-gray-400 mt-1">Bénéficiaire : {seller.name}</p></React.Fragment>
        :<p className="text-sm text-yellow-400">Le vendeur n'a pas encore configuré son CCP.</p>}
        <p className="text-[11px] text-gray-500 mt-2">Commission plateforme : {rate} % (prélevée au vendeur)</p>
      </div>

      <div className="mb-4"><label className="text-xs font-bold text-gray-300 block mb-1">Capture d'écran du paiement (obligatoire)</label><input type="file" accept="image/*" onChange={function(e){setProof(e.target.files[0]);}} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-cyanNeon file:text-black"/></div>

      <p className="text-[11px] text-gray-500 text-center mt-2">Suivi dans « Mes commandes ». Livraison sous 24 h.</p>
    </div>
  </div>;

function App(){
  const [loading,setLoading]=React.useState(true);
  const [session,setSession]=React.useState(null);
  const [profile,setProfile]=React.useState(null);
  const [tracks,setTracks]=React.useState([]);
  const [purchases,setPurchases]=React.useState([]);
  const [myOrders,setMyOrders]=React.useState([]);
  const [adminOrders,setAdminOrders]=React.useState([]);
  const [withdrawals,setWithdrawals]=React.useState([]);
  const [notifications,setNotifications]=React.useState([]);
  const [myFollowers,setMyFollowers]=React.useState(0);
  const [toasts,setToasts]=React.useState([]);
  const [view,setViewRaw]=React.useState('home');
  const [buyItem,setBuyItem]=React.useState(null);
  const [producerId,setProducerId]=React.useState(null);
  const [current,setCurrent]=React.useState(null);
  const [playing,setPlaying]=React.useState(false);
  const [progress,setProgress]=React.useState(0);
  const [duration,setDuration]=React.useState(0);
  const [time,setTime]=React.useState(0);
  const [volume,setVolume]=React.useState(1);
  const [muted,setMuted]=React.useState(false);
  const audio=React.useRef(null);
  if(!audio.current)audio.current=new Audio();

  function setView(v){setViewRaw(v);window.scrollTo({top:0,behavior:'smooth'});}
  function toast(msg,type){
    const id=Date.now()+Math.random();
    setToasts(function(p){return p.concat([{id:id,msg:msg,type:type||'success'}]);});
    setTimeout(function(){setToasts(function(p){return p.filter(function(t){return t.id!==id;});});},4000);
  }
  async function copy(txt){try{await navigator.clipboard.writeText(txt);toast('Copié !');}catch(e){toast('Copie manuelle','error');}}
  function openProducer(id){if(!id)return;setProducerId(id);setViewRaw('producer');window.scrollTo({top:0,behavior:'smooth'});}

  async function openContract(orderId){
    const r=await sb.rpc('get_contract',{p_order_id:orderId});
