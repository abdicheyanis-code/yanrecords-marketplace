<button onClick={sendOrder} disabled={oL||!prf} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl gg disabled:opacity-50">{oL?'ENVOI...':'📱 ENVOYER LA COMMANDE'}</button>
<p className="text-[11px] text-gray-500 text-center mt-2">Suivi dans "Mes commandes". Livraison sous 24h après vérification.</p></div></div>}

{/* MODAL AVIS */}
{showRev&&<div className="fixed inset-0 z-[110] bg-black/90 flex items-center justify-center p-4">
<div className="glass-card rounded-2xl max-w-md w-full p-6 relative">
<button onClick={()=>setShowRev(null)} className="absolute top-4 right-4 text-gray-400"><I n="x" c="w-5 h-5"/></button>
<h3 className="text-xl font-black text-white mb-4">⭐ Laisser un avis</h3>
<div className="flex justify-center mb-4"><Stars v={rRate} set={setRRate} sz="w-8 h-8"/></div>
<textarea maxLength="300" rows="3" value={rCom} onChange={e=>setRCom(e.target.value)} placeholder="Ton commentaire (optionnel)" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white resize-none mb-4"/>
<button onClick={sendRev} className="w-full bg-goldAccent text-black font-black py-3 rounded-xl">PUBLIER MON AVIS</button></div></div>}

{/* PLAYER */}
{cur&&<div className="fixed bottom-0 inset-x-0 z-50 glass border-t border-goldAccent/30 px-4 md:px-6 py-3 flex flex-col gap-2 sb">
<div className="w-full flex items-center gap-3 text-xs text-gray-400 font-mono">
<span>{ft(tm)}</span>
<input type="range" min="0" max="100" value={prg} onChange={e=>{aR.current.currentTime=(e.target.value/100)*dur;setPrg(e.target.value)}} className="flex-1 h-1 rounded-lg cursor-pointer" style={{background:`linear-gradient(to right,#00f0ff ${prg}%,#222638 ${prg}%)`}}/>
<span>{ft(dur)}</span></div>
<div className="flex items-center justify-between">
<div className="flex items-center gap-3 w-1/3 min-w-0"><img loading="lazy" src={cur.cover_url||DC} className="w-11 h-11 rounded-lg object-cover" alt=""/>
<div className="min-w-0 hidden md:block"><h4 className="font-bold text-sm text-white truncate">{cur.title}</h4><p className="text-xs text-goldAccent font-bold truncate">{cur.producer_name}</p></div></div>
<div className="flex items-center gap-3">
<button onClick={()=>{if(mu){aR.current.volume=vl||.5;setMu(false)}else{aR.current.volume=0;setMu(true)}}} className="text-gray-400 hover:text-white"><I n={mu?'mt':'vo'} c="w-5 h-5"/></button>
<input type="range" min="0" max="1" step="0.1" value={mu?0:vl} onChange={e=>{const v=parseFloat(e.target.value);setVl(v);aR.current.volume=v;setMu(v===0)}} className="w-20 hidden md:block"/>
<button onClick={()=>play(cur)} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-110 transition"><I n={pl?'pause':'play'} c="w-5 h-5"/></button></div>
<div className="w-1/3 flex justify-end"><button onClick={()=>{setSel(cur);setLic('mp3');setPrf(null)}} className="bg-goldAccent text-black font-bold px-3 md:px-4 py-2 rounded-xl text-xs">Acheter</button></div></div></div>}
</div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrB><App/></ErrB>);
</script>
</body>
</html>
