  return Math.floor(s/86400)+' j';
};

async function sha256File(file){
  try {
    const buf = await file.arrayBuffer();
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
  } catch(e) { return null; }
}

async function makeContractPdf(no, toast){
  const r = await sb.rpc('get_contract', { p_no: no });
  if(r.error){ toast(r.error.message, 'error'); return; }
  const d = r.data;
  const J = window.jspdf.jsPDF;
  const p = new J({ unit: 'mm', format: 'a4' });
  const W = 210, M = 16; let y = 0;

  function txt(s, x, yy, sz, st, col){
    p.setFontSize(sz||10); p.setFont('helvetica', st||'normal');
    if(col) p.setTextColor(col[0],col[1],col[2]); else p.setTextColor(30,30,30);
    p.text(String(s), x, yy);
  }
  function wrap(s, x, yy, w, sz){
    p.setFontSize(sz||9); p.setFont('helvetica', 'normal'); p.setTextColor(60,60,60);
    const L = p.splitTextToSize(String(s), w);
    p.text(L, x, yy); return yy + L.length * 4.3;
  }
  function line(yy){ p.setDrawColor(220,220,220); p.line(M, yy, W-M, yy); }

  p.setFillColor(5,5,8); p.rect(0, 0, W, 30, 'F');
  txt('YANrecords', M, 14, 19, 'bold', [226,176,83]);
  txt('CONTRAT DE LICENCE MUSICALE', M, 22, 9, 'normal', [200,200,200]);
  txt(d.no, W-M-p.getTextWidth(d.no)*0.9, 14, 13, 'bold', [0,240,255]);
  y = 40;

  txt('1. PARTIES', M, y, 11, 'bold'); y+=2; line(y); y+=6;
  txt('LE PRODUCTEUR (concédant)', M, y, 8, 'bold', [110,110,110]);
  txt('LE BÉNÉFICIAIRE (licencié)', W/2, y, 8, 'bold', [110,110,110]); y+=5;
  txt(d.seller_name||'-', M, y, 10, 'bold'); txt(d.buyer_name||'-', W/2, y, 10, 'bold'); y+=5;
  if(d.license === 'exclusive'){
    txt('Nom légal : ' + (d.seller_legal||'-'), M, y, 8);
    txt('Nom légal : ' + (d.buyer_legal||'-'), W/2, y, 8); y+=5;
  }
  y+=3;

  txt('2. ŒUVRE CONCERNÉE', M, y, 11, 'bold'); y+=2; line(y); y+=6;
  txt('Titre : ' + (d.title||'-'), M, y, 10, 'bold'); y+=5;
  const meta = d.type==='vst' ? 'Type : Plugin VST' : `Genre : ${d.genre||'-'}   |   BPM : ${d.bpm||'-'}   |   Gamme : ${d.musickey||'-'}`;
  txt(meta, M, y, 9); y+=5;
  txt('Publiée le : ' + (d.created ? new Date(d.created).toLocaleDateString('fr-FR') : '-'), M, y, 8, 'normal', [110,110,110]); y+=4;
  if(d.hash){
    txt('Empreinte SHA-256 du fichier :', M, y, 7, 'normal', [130,130,130]); y+=3.2;
    txt(String(d.hash).slice(0,64), M, y, 6.4, 'normal', [130,130,130]); y+=5;
  }
  y+=2;

  txt('3. LICENCE ACCORDÉE', M, y, 11, 'bold'); y+=2; line(y); y+=6;
  p.setFillColor(248,243,228); p.rect(M, y-4.5, W-2*M, 9, 'F');
  txt('TYPE : ' + (LNAME[d.license]||d.license).toUpperCase(), M+3, y+1.5, 11, 'bold', [150,110,20]); y+=11;

  const L = d.limits||{};
  if(d.type === 'vst'){
    const rows = [
      ['Activations autorisées', '3 machines maximum'],
      ['Transfert de la clé', 'Interdit'],
      ['Décompilation / rétro-ingénierie', 'Interdite'],
      ['Revente ou partage', 'Interdits, révocation sans remboursement'],
      ['Durée', 'Illimitée']
    ];
    rows.forEach(rw => { txt(rw[0], M+2, y, 9, 'normal', [90,90,90]); txt(rw[1], M+78, y, 9, 'bold'); y+=5; });
  } else {
    const rows = [
      ['Streams autorisés', inf(L.streams)],
      ['Copies vendues', inf(L.copies)],
      ['Clips vidéo', inf(L.videos)],
      ['Diffusion radio', L.radio===-1 ? 'Illimitée' : (L.radio>0 ? L.radio+' stations' : 'Non autorisée')],
      ['Concerts payants', L.shows ? 'Autorisés' : 'Non autorisés'],
      ['Tag producteur', L.tag ? 'À conserver' : 'Retiré'],
      ['Crédit "Prod. by"', 'Obligatoire'],
      ['Durée de la licence', L.years===-1 ? 'Illimitée' : (L.years+' ans')],
      ['Exclusivité', d.license==='exclusive' ? 'OUI - beat retiré du catalogue' : 'Non - licence non exclusive'],
      ['Publishing', '50% producteur / 50% bénéficiaire']
    ];
    rows.forEach(rw => { txt(rw[0], M+2, y, 9, 'normal', [90,90,90]); txt(rw[1], M+78, y, 9, 'bold'); y+=5; });
  }
  y+=4;

  txt('4. CONDITIONS FINANCIÈRES', M, y, 11, 'bold'); y+=2; line(y); y+=6;
  txt('Montant total payé', M+2, y, 9, 'normal', [90,90,90]); txt(fmt(d.amount)+' DZD', M+78, y, 11, 'bold', [20,130,80]); y+=5;
  txt('Part producteur', M+2, y, 9, 'normal', [90,90,90]); txt(fmt(d.seller_amount)+' DZD', M+78, y, 9, 'bold'); y+=5;
  txt('Commission plateforme ('+d.rate+'%)', M+2, y, 9, 'normal', [90,90,90]); txt(fmt(d.fee)+' DZD', M+78, y, 9, 'bold'); y+=5;
  txt('Moyen de paiement', M+2, y, 9, 'normal', [90,90,90]); txt('Virement CCP / BaridiMob (preuve archivée)', M+78, y, 9, 'bold'); y+=9;

  if(d.vst_key){
    txt('5. CLÉ D\'ACTIVATION', M, y, 11, 'bold'); y+=2; line(y); y+=6;
    p.setFillColor(238,250,243); p.rect(M, y-4.5, W-2*M, 9, 'F');
    txt(d.vst_key, M+3, y+1.5, 12, 'bold', [16,120,80]); y+=12;
  }

  const nn = d.vst_key ? '6' : '5';
  txt(nn+'. ENGAGEMENTS ET GARANTIES', M, y, 11, 'bold'); y+=2; line(y); y+=5.5;
  y = wrap('a) Le Producteur garantit être l\'auteur original et l\'unique titulaire des droits sur l\'œuvre, et que celle-ci ne porte atteinte à aucun droit de tiers.', M+2, y, W-2*M-4, 8.4) + 1;
  y = wrap('b) Le Bénéficiaire s\'engage à respecter les limites ci-dessus. Tout dépassement impose l\'acquisition de la licence supérieure.', M+2, y, W-2*M-4, 8.4) + 1;
  y = wrap('c) La revente, la redistribution, le partage et la mise à disposition sous forme brute sont strictement interdits.', M+2, y, W-2*M-4, 8.4) + 1;
  y = wrap('d) Le crédit "Prod. by '+(d.seller_name||'')+'" doit figurer dans le titre, la description et les métadonnées de distribution.', M+2, y, W-2*M-4, 8.4) + 1;
  y = wrap('e) YANrecords intervient comme intermédiaire technique et n\'est pas partie au présent contrat.', M+2, y, W-2*M-4, 8.4) + 1;
  y = wrap('f) Le présent contrat est soumis au droit algérien. Tout litige relève des juridictions algériennes compétentes.', M+2, y, W-2*M-4, 8.4) + 3;

  txt((d.vst_key?'7':'6')+'. ACCEPTATION', M, y, 11, 'bold'); y+=2; line(y); y+=6;
  txt('Conditions acceptées électroniquement le : ' + (d.accepted_at ? new Date(d.accepted_at).toLocaleString('fr-FR') : '-'), M+2, y, 8.6); y+=4.5;
  txt('Licence validée et livrée le : ' + (d.date ? new Date(d.date).toLocaleString('fr-FR') : '-'), M+2, y, 8.6); y+=4.5;
  txt('Contrat généré automatiquement par YANrecords - référence ' + d.no, M+2, y, 8, 'normal', [120,120,120]);

  p.setFillColor(5,5,8); p.rect(0, 282, W, 15, 'F');
  txt('YANrecords - Marketplace musicale algérienne', M, 290, 8, 'normal', [226,176,83]);
  txt('Généré le ' + new Date().toLocaleDateString('fr-FR'), W-M-36, 290, 8, 'normal', [120,120,120]);

  p.save('Contrat-'+d.no+'.pdf');
  toast('Contrat PDF téléchargé');
}

class Boundary extends React.Component {
  constructor(props){ super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error){ return { hasError: true, error }; }
  componentDidCatch(error, info){ console.error("Erreur React :", error, info); }
  render(){
    if(this.state.hasError){
      return (
        <div style={{ padding: 24, background: '#050508', color: '#ff4444', minHeight: '100vh', fontFamily: 'monospace' }}>
          <h2 style={{ fontSize: 20, color: '#e2b053' }}>Une erreur d'affichage est survenue :</h2>
          <pre style={{ margin: '16px 0', whiteSpace: 'pre-wrap', color: '#fff' }}>{this.state.error?.toString()}</pre>
          <button onClick={() => location.reload()} style={{ padding: '10px 20px', background: '#00f0ff', color: '#000', border: 'none', borderRadius: 8, cursor: 'pointer', fontWeight: 'bold' }}>
            Recharger la page
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function App(){
  const [loading, setLoading] = React.useState(true);
  const [session, setSession] = React.useState(null);
  const [profile, setProfile] = React.useState(null);
  const [tracks, setTracks] = React.useState([]);
  const [purchases, setPurchases] = React.useState([]);
  const [myOrders, setMyOrders] = React.useState([]);
  const [adminOrders, setAdminOrders] = React.useState([]);
  const [withdrawals, setWithdrawals] = React.useState([]);
  const [notifications, setNotifications] = React.useState([]);
  const [myFollowers, setMyFollowers] = React.useState(0);
  const [msgUnread, setMsgUnread] = React.useState(0);
  const [toasts, setToasts] = React.useState([]);
  const [view, setViewRaw] = React.useState('home');
  const [buyItem, setBuyItem] = React.useState(null);
  const [producerId, setProducerId] = React.useState(null);
  const [chatPeer, setChatPeer] = React.useState(null);
  const [chatName, setChatName] = React.useState('');
  const [current, setCurrent] = React.useState(null);
  const [playing, setPlaying] = React.useState(false);
  const [progress, setProgress] = React.useState(0);
  const [duration, setDuration] = React.useState(0);
  const [time, setTime] = React.useState(0);
  const [volume, setVolume] = React.useState(1);
  const [muted, setMuted] = React.useState(false);

  const audio = React.useRef(null);
  if(!audio.current) audio.current = new Audio();

  function setView(v){ setViewRaw(v); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function toast(msg, type){
    const id = Date.now() + Math.random();
    setToasts(p => p.concat([{ id, msg, type: type || 'success' }]));
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 4000);
  }
  async function copy(t){ try { await navigator.clipboard.writeText(t); toast('Copié !'); } catch(e){ toast('Copie manuelle', 'error'); } }
  function openProducer(id){ if(!id) return; setProducerId(id); setViewRaw('producer'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function openChat(id, name){ setChatPeer(id); setChatName(name||''); setView('messages'); }
  function pdf(no){ makeContractPdf(no, toast); }

  const loadProfile = async (uid, userObj) => {
    try {
      const { data, error } = await sb.from('profiles').select('*').eq('id', uid).single();
      if(data) {
        setProfile(data);
      } else {
        setProfile({
          id: uid,
          name: userObj?.user_metadata?.full_name || userObj?.email?.split('@')[0] || 'Artiste',
          avatar_url: AV,
          balance: 0,
          is_admin: false,
          bio: '',
          instagram: '',
          rip: '',
          legal_name: ''
        });
      }
    } catch(e) {
      setProfile({ id: uid, name: 'Artiste', avatar_url: AV, balance: 0 });
    }
  };

  React.useEffect(() => {
    sb.auth.getSession().then(r => {
      const s = r.data.session; setSession(s);
      if(s){
        loadProfile(s.user.id, s.user);
        loadPurchases(s.user.id);
        loadMyOrders(s.user.id);
        loadNotifications(s.user.id);
        loadFollowers(s.user.id);
        loadMsgUnread();
      }
      loadTracks();
      setLoading(false);
    });

    const sub = sb.auth.onAuthStateChange((e, s) => {
      setSession(s);
      if(s){
        loadProfile(s.user.id, s.user);
        loadPurchases(s.user.id);
        loadMyOrders(s.user.id);
        loadNotifications(s.user.id);
        loadFollowers(s.user.id);
        loadMsgUnread();
      } else {
        setProfile(null); setPurchases([]); setMyOrders([]); setAdminOrders([]); setNotifications([]);
      }
    });

    const a = audio.current;
    const onEnd = () => { setPlaying(false); setProgress(0); };
    const onTime = () => { setTime(a.currentTime); setProgress((a.currentTime / a.duration) * 100 || 0); };
    const onMeta = () => setDuration(a.duration);
    a.addEventListener('ended', onEnd); a.addEventListener('timeupdate', onTime); a.addEventListener('loadedmetadata', onMeta);
    return () => {
      sub.data.subscription.unsubscribe();
      a.removeEventListener('ended', onEnd); a.removeEventListener('timeupdate', onTime); a.removeEventListener('loadedmetadata', onMeta);
    };
  }, []);

  React.useEffect(() => { if(profile && profile.is_admin){ loadAdminOrders(); loadWithdrawals(); } }, [profile && profile.is_admin]);

  async function loadTracks(){ const r = await sb.from('tracks').select('*').order('created_at', { ascending: false }); if(r.data) setTracks(r.data); }
  async function loadNotifications(uid){ const r = await sb.from('notifications').select('*').eq('user_id', uid).order('created_at', { ascending: false }).limit(30); if(r.data) setNotifications(r.data); }
  async function loadFollowers(uid){ const r = await sb.rpc('get_producer', { p_id: uid }); if(r.data) setMyFollowers(r.data.followers || 0); }
  async function loadMsgUnread(){ const r = await sb.rpc('my_conversations'); if(r.data) setMsgUnread(r.data.reduce((s, c) => s + Number(c.unread || 0), 0)); }
  async function markRead(){ await sb.rpc('mark_notifications_read'); setNotifications(p => p.map(n => ({ ...n, is_read: true }))); }
  
  async function loadPurchases(uid){
    const r = await sb.from('sales').select('*').eq('buyer_id', uid).order('created_at', { ascending: false });
    if(!r.data) return;
    const ids = r.data.map(s => s.track_id).filter(Boolean); const m = {};
    if(ids.length){ const t = await sb.from('tracks').select('id,title,cover_url,type,file_path').in('id', ids); (t.data||[]).forEach(x => { m[x.id] = x; }); }
    setPurchases(r.data.map(s => ({ ...s, track: m[s.track_id] || null })));
  }
  
  async function loadMyOrders(uid){
    const r = await sb.from('orders').select('*').eq('buyer_id', uid).order('created_at', { ascending: false });
    if(!r.data) return;
    const ids = r.data.map(o => o.track_id); const m = {};
    if(ids.length){ const t = await sb.from('tracks').select('id,title,cover_url').in('id', ids); (t.data||[]).forEach(x => { m[x.id] = x; }); }
    setMyOrders(r.data.map(o => ({ ...o, track: m[o.track_id] || null })));
  }
  
  async function loadAdminOrders(){
    const r = await sb.from('orders').select('*').order('created_at', { ascending: false });
    if(!r.data) return;
    const bm = {}, tm = {};
    const b = r.data.map(o => o.buyer_id); const t2 = r.data.map(o => o.track_id);
    if(b.length){ const p = await sb.from('public_profiles').select('id,name').in('id', b); (p.data||[]).forEach(x => { bm[x.id] = x.name; }); }
    if(t2.length){ const t = await sb.from('tracks').select('id,title').in('id', t2); (t.data||[]).forEach(x => { tm[x.id] = x.title; }); }
    setAdminOrders(r.data.map(o => ({ ...o, buyer_name: bm[o.buyer_id] || 'Client', track_title: tm[o.track_id] || '—' })));
  }
  
  async function loadWithdrawals(){ const r = await sb.from('withdrawals').select('*').order('created_at', { ascending: false }); if(r.data) setWithdrawals(r.data); }

  async function logout(){ audio.current.pause(); setPlaying(false); await sb.auth.signOut(); setView('home'); toast('Déconnecté.'); }

  async function play(t){
    if(!t.audio_url){ toast("Pas d'audio", 'error'); return; }
    if(current && current.id === t.id){
      if(playing){ audio.current.pause(); setPlaying(false); } else { audio.current.play().catch(()=>{}); setPlaying(true); }
      return;
    }
    setCurrent(t); audio.current.src = t.audio_url; audio.current.volume = muted ? 0 : volume;
    audio.current.play().catch(()=>{}); setPlaying(true);
    await sb.rpc('increment_plays', { track_id: t.id });
  }

  async function submitOrder(item, license, amount, rate, proof, legal){
    if(!proof){ toast('Ajoute la capture du paiement', 'error'); return; }
    if(proof.size > 5 * 1024 * 1024){ toast('Image max 5MB', 'error'); return; }
    try {
      const sa = Math.floor(amount * (1 - rate / 100)); const fee = amount - sa;
      let url = ''; const pn = session.user.id + '-' + Date.now() + '-proof.' + proof.name.split('.').pop();
      const up = await sb.storage.from('covers').upload(pn, proof);
      if(!up.error) url = sb.storage.from('covers').getPublicUrl(pn).data.publicUrl;
      const r = await sb.from('orders').insert({
        buyer_id: session.user.id, seller_id: item.producer_id, track_id: item.id,
        product_type: item.type, license_type: license, amount, seller_amount: sa,
        platform_fee: fee, rate_percent: rate, proof_url: url,
        accepted_at: new Date().toISOString(), buyer_legal_name: (legal||'').trim() || null
      });
      if(r.error) throw r.error;
      toast('Commande envoyée ! Contrat officiel disponible après validation.');
      setBuyItem(null); loadMyOrders(session.user.id);
      if(profile && profile.is_admin) loadAdminOrders();
    } catch(ex){ toast(ex.message, 'error'); }
  }

  async function validateOrder(id){
    if(!confirm('Confirmer le paiement reçu ?')) return;
    const r = await sb.rpc('validate_order', { p_order_id: id, p_admin_id: session.user.id });
    if(r.error){ toast(r.error.message, 'error'); return; }
    if(r.data && r.data.ok){ toast('Commande livrée ! Contrat généré.'); loadAdminOrders(); loadTracks(); loadPurchases(session.user.id); }
    else toast((r.data && r.data.msg) || 'Erreur', 'error');
  }

  async function refuseOrder(id){
    const reason = prompt('Raison du refus :'); if(reason === null) return;
    await sb.rpc('refuse_order', { p_order_id: id, p_reason: reason || 'Paiement non vérifié' });
    toast('Commande refusée.'); loadAdminOrders();
  }

  async function payWithdrawal(id){
    if(!confirm('Marquer comme payé ?')) return;
    const r = await sb.rpc('pay_withdrawal', { p_id: id });
    if(r.error){ toast(r.error.message, 'error'); return; }
    toast('Payé !'); loadWithdrawals();
  }

  async function requestWithdrawal(a){
    const n = parseInt(a, 10); if(!n){ toast('Montant invalide', 'error'); return; }
    const r = await sb.rpc('request_withdrawal', { p_amount: n });
    if(r.error){ toast(r.error.message, 'error'); return; }

    const r = await sb.storage.from('vst-files').createSignedUrl(p.track.file_path, 120, { download: true });

    window.open(r.data.signedUrl, '_blank');
  }

  async function saveProfile(d){
    try {
      let url = profile.avatar_url;
      if(d.avatar){
        if(d.avatar.size > 5 * 1024 * 1024) throw new Error('Image max 5MB');
        const n = profile.id + '-' + Date.now() + '.' + d.avatar.name.split('.').pop();
        const up = await sb.storage.from('avatars').upload(n, d.avatar, { upsert: true });
        if(up.error) throw up.error;
        url = sb.storage.from('avatars').getPublicUrl(n).data.publicUrl;
      }
      const r = await sb.from('profiles').update({
        name: d.name, legal_name: (d.legal_name||'').trim() || null,
        rip: d.rip, bio: d.bio, instagram: d.instagram, avatar_url: url
      }).eq('id', profile.id).select().single();
      if(r.error) throw r.error;
      setProfile(r.data); toast('Profil sauvegardé !'); setView('dashboard');
    } catch(ex){ toast(ex.message, 'error'); }
  }

  async function uploadTrack(d){
    try {
      if(!d.title.trim()) throw new Error('Titre obligatoire');
      if(d.type==='vst' && !d.file) throw new Error('Ajoute le fichier du plugin');
      if(d.file && d.file.size > 50 * 1024 * 1024) throw new Error('Fichier max 50MB');
      if(d.cover && d.cover.size > 5 * 1024 * 1024) throw new Error('Pochette max 5MB');
      let coverUrl = DC, audioUrl = '', filePath = null, hash = null;
      if(d.cover){
        const n = profile.id + '-' + Date.now() + '-c.' + d.cover.name.split('.').pop();
        const up = await sb.storage.from('covers').upload(n, d.cover);
        if(!up.error) coverUrl = sb.storage.from('covers').getPublicUrl(n).data.publicUrl;
      }
      if(d.file){
        hash = await sha256File(d.file);
        const safe = d.file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        if(d.type==='vst'){
          const path = profile.id + '/' + Date.now() + '-' + safe;
          const up = await sb.storage.from('vst-files').upload(path, d.file);
          if(up.error) throw new Error('Upload échoué : ' + up.error.message);
          filePath = path;
        } else {
          const n = profile.id + '-' + Date.now() + '-a.' + d.file.name.split('.').pop();
          const up = await sb.storage.from('audio').upload(n, d.file);
          if(up.error) throw new Error('Upload échoué : ' + up.error.message);
          audioUrl = sb.storage.from('audio').getPublicUrl(n).data.publicUrl;
        }
      }
      const row = {
        title: d.title.trim(), type: d.type, genre: d.genre, bpm: parseInt(d.bpm, 10)||140, key: d.key,
        producer_id: profile.id, producer_name: profile.name, cover_url: coverUrl, audio_url: audioUrl,
        price_mp3: parseInt(d.p1, 10)||0, price_wav: parseInt(d.p2, 10)||0, price_stems: parseInt(d.p3, 10)||0,
        price_exclusive: parseInt(d.p4, 10)||0,
        description: d.desc.trim() || (d.type==='vst' ? 'Plugin VST' : 'Beat ' + d.genre)
      };
      if(filePath) row.file_path = filePath;
      if(hash) row.file_hash = hash;
      if(d.limits) row.limits = d.limits;
      const r = await sb.from('tracks').insert(row);
      if(r.error) throw r.error;
      toast('Publié ! Abonnés notifiés 🔔'); loadTracks(); setView('dashboard'); return true;
    } catch(ex){ toast(ex.message, 'error'); return false; }
  }

            <button onClick={() => setBuyItem(null)} className="absolute top-4 right-4 text-gray-400"><Icon n="x" c="w-5 h-5"/></button>
            <h3 className="text-xl font-black text-white mb-4">Achat : {buyItem.title}</h3>
            <p className="text-xs text-gray-400 mb-4">Paiement manuel direct par BaridiMob / CCP.</p>
            <button onClick={() => {
              const legal = buyItem.type==='exclusive' ? prompt('Nom légal complet obligatoire pour exclusive :') : '';
              submitOrder(buyItem, 'mp3', buyItem.price_mp3, 5, new File([''], 'proof.jpg'), legal);
            }} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl">CONFIRMER L'ACHAT</button>
          </div>
        </div>
      )}

      {/* PLAYER */}
      {current && (
        <div className="fixed bottom-0 inset-x-0 z-50 glass border-t border-goldAccent/30 px-4 md:px-6 py-3 flex justify-between items-center">
          <div className="flex items-center gap-3">
            <img src={current.cover_url || DC} className="w-10 h-10 rounded-lg object-cover" alt=""/>
            <div>
              <h4 className="font-bold text-sm text-white">{current.title}</h4>
              <p className="text-xs text-goldAccent">{current.producer_name}</p>
            </div>
          </div>
          <button onClick={() => play(current)} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center">
            <Icon n={playing ? 'pause' : 'play'} c="w-5 h-5"/>
          </button>
          <button onClick={() => setBuyItem(current)} className="bg-goldAccent text-black font-bold px-4 py-2 rounded-xl text-xs">Acheter</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Boundary><App/></Boundary>);
</script>
</body>
</html>
