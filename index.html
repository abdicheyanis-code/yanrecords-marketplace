        function generateRealVstKey() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let part1 = '';
            for (let i = 0; i < 4; i++) part1 += chars.charAt(Math.floor(Math.random() * chars.length));
            let hash = 0;
            for (let i = 0; i < part1.length; i++) hash += part1.charCodeAt(i) * (i + 5);
            let part2 = hash.toString(16).toUpperCase().padStart(4, '0').slice(-4);
            let part3 = '';
            for (let i = 0; i < 4; i++) part3 += chars.charAt(Math.floor(Math.random() * chars.length));
            return `YAN-${part1}-${part2}-${part3}`;

            <div className="fixed top-24 right-4 z-[200] flex flex-col gap-3 max-w-sm">
              {toasts.map(toast => (
                <div key={toast.id} className={`${toast.removing ? 'toast-exit' : 'toast-enter'} glass-card rounded-xl p-4 flex items-center gap-3 border-l-4 ${toast.type === 'success' ? 'border-greenPro' : toast.type === 'error' ? 'border-red-500' : 'border-cyanNeon'}`}>
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center ${toast.type === 'success' ? 'bg-greenPro/20 text-greenPro' : toast.type === 'error' ? 'bg-red-500/20 text-red-400' : 'bg-cyanNeon/20 text-cyanNeon'}`}>
                    <Icon name={toast.type === 'success' ? 'check' : toast.type === 'error' ? 'x' : 'activity'} className="w-4 h-4" />
                  </div>
                  <p className="text-sm font-bold text-white flex-1">{toast.message}</p>
                  <button onClick={() => removeToast(toast.id)} className="text-gray-500 hover:text-white"><Icon name="x" className="w-4 h-4" /></button>
                </div>
              ))}
            </div>
          );
        }

        // ============================================
        // 🎵 PLAYER AUDIO AVANCÉ
        // ============================================
        function AudioPlayer({ track, isPlaying, onToggle, onClose, onBuy, t }) {
          const audioRef = React.useRef(new Audio());
          const [progress, setProgress] = React.useState(0);
          const [duration, setDuration] = React.useState(0);
          const [currentTime, setCurrentTime] = React.useState(0);
          const [volume, setVolume] = React.useState(0.7);
          const [isMuted, setIsMuted] = React.useState(false);

          React.useEffect(() => {
            if (!track?.audio) return;
            const audio = audioRef.current;
            audio.src = track.audio;
            audio.volume = volume;
            if (isPlaying) audio.play().catch(() => {});
            
            const onTime = () => { setCurrentTime(audio.currentTime); setProgress(audio.duration ? (audio.currentTime / audio.duration) * 100 : 0); };
            const onMeta = () => setDuration(audio.duration);
            const onEnd = () => onToggle(track);
            
            audio.addEventListener('timeupdate', onTime);
            audio.addEventListener('loadedmetadata', onMeta);
            audio.addEventListener('ended', onEnd);
            return () => { audio.removeEventListener('timeupdate', onTime); audio.removeEventListener('loadedmetadata', onMeta); audio.removeEventListener('ended', onEnd); };
          }, [track?.id]);

          React.useEffect(() => {
            const audio = audioRef.current;
            if (isPlaying) audio.play().catch(() => {});
            else audio.pause();
          }, [isPlaying]);

          React.useEffect(() => {
            audioRef.current.volume = isMuted ? 0 : volume;
          }, [volume, isMuted]);

          const formatTime = (s) => { if (!s || isNaN(s)) return '0:00'; const m = Math.floor(s / 60); const sec = Math.floor(s % 60); return `${m}:${sec.toString().padStart(2, '0')}`; };

          const seek = (e) => {
            const audio = audioRef.current;
            const rect = e.target.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pct * audio.duration;
          };

          if (!track) return null;

          return (
            <div className="fixed bottom-0 inset-x-0 z-50 glass border-t border-goldAccent/20">
              {/* Progress bar clickable */}
              <div className="w-full h-1 bg-borderDark cursor-pointer group" onClick={seek}>
                <div className="h-full bg-gradient-to-r from-cyanNeon to-blue-500 transition-all relative" style={{ width: `${progress}%` }}>
                  <div className="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-cyanNeon rounded-full opacity-0 group-hover:opacity-100 transition shadow-lg shadow-cyanNeon/50"></div>
                </div>
              </div>
              <div className="px-4 md:px-6 py-3 flex items-center justify-between gap-4">
                {/* Track info */}
                <div className="flex items-center gap-3 w-1/3 min-w-0">
                  <img src={track.cover} className="w-11 h-11 rounded-lg object-cover shadow-lg" />
                  <div className="min-w-0">
                    <h4 className="font-bold text-sm text-white truncate">{track.title}</h4>
                    <p className="text-xs text-goldAccent font-bold truncate">{track.producer}</p>
                  </div>
                </div>

                {/* Controls */}
                <div className="flex items-center gap-3 md:gap-4">
                  <span className="text-[10px] text-gray-500 font-mono hidden sm:block">{formatTime(currentTime)}</span>
                  <button onClick={() => onToggle(track)} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-110 transition shadow-lg">
                    <Icon name={isPlaying ? "pause" : "play"} className="w-5 h-5" />
                  </button>
                  <span className="text-[10px] text-gray-500 font-mono hidden sm:block">{formatTime(duration)}</span>
                </div>

                {/* Volume + Buy */}
                <div className="flex items-center gap-3 w-1/3 justify-end">
                  <button onClick={() => setIsMuted(!isMuted)} className="hidden md:block text-gray-400 hover:text-white">
                    <Icon name={isMuted ? "volumeMute" : "volume"} className="w-4 h-4" />
                  </button>
                  <input type="range" min="0" max="1" step="0.01" value={isMuted ? 0 : volume} onChange={e => { setVolume(parseFloat(e.target.value)); setIsMuted(false); }} className="progress-bar w-16 hidden md:block" />
                  <button onClick={() => onBuy(track)} className="bg-goldAccent text-black font-bold px-3 md:px-4 py-2 rounded-xl text-xs hover:scale-105 transition glow-gold whitespace-nowrap">{t('buyBeat')}</button>
                </div>
              </div>
            </div>
          );
        }
