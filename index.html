<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YANrecords | Premium VST & Beatstore 🇩🇿</title>
    <!-- Tailwind CSS, React 18, Babel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              obsidian: '#050508',
              cardDark: '#131520',
              borderDark: '#222638',
              cyanNeon: '#00f0ff',
              goldAccent: '#e2b053',
              pinkNeon: '#ff007f',
              greenPro: '#10b981'
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #050508; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; scroll-behavior: smooth; }
      .glass { background: rgba(19, 21, 32, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(34, 38, 56, 0.8); }
      .glass-card { background: linear-gradient(145deg, rgba(20, 22, 35, 0.9), rgba(10, 11, 18, 0.9)); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); }
      .text-gradient-gold { background: linear-gradient(to right, #e2b053, #fff176); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .text-gradient-cyan { background: linear-gradient(to right, #00f0ff, #0080ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .bg-animated-mesh { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: #050508; }
      .mesh-blob { position: absolute; filter: blur(100px); opacity: 0.35; border-radius: 50%; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #050508; }
      ::-webkit-scrollbar-thumb { background: #222638; border-radius: 4px; }
      .dropdown-anim { animation: dropIn 0.2s ease-out forwards; transform-origin: top right; }
      @keyframes dropIn { from { opacity: 0; transform: scale(0.95) translateY(-10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- FOND ANIMÉ -->
    <div class="bg-animated-mesh">
        <div class="mesh-blob bg-blue-900 w-[500px] h-[500px] top-[-10%] left-[-10%]"></div>
        <div class="mesh-blob bg-purple-900 w-[600px] h-[600px] bottom-[-20%] right-[-10%]"></div>
        <div class="mesh-blob bg-teal-900/30 w-[400px] h-[400px] top-[40%] left-[40%]"></div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        // ===== INITIALISATION SUPABASE =====
        const SUPABASE_URL = 'https://xyz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJ...'; 
        const supabase = (window.supabase && !SUPABASE_URL.includes('xyz.supabase.co')) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        function generateRealVstKey() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let part1 = '';
            for (let i = 0; i < 4; i++) part1 += chars.charAt(Math.floor(Math.random() * chars.length));
            let hash = 0;
            for (let i = 0; i < part1.length; i++) hash += part1.charCodeAt(i) * (i + 5);
            let part2 = hash.toString(16).toUpperCase().padStart(4, '0').slice(-4);
            return `SM2-${part1}-${part2}`;
        }

        const Icon = ({ name, className = "w-5 h-5" }) => {
          const icons = {
            play: <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>,
            pause: <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>,
            search: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            upload: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
            user: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            logout: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            dashboard: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
            arrowLeft: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
            x: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            trash: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            dollar: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
            activity: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            check: <svg className={className} fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          };
          return icons[name] || null;
        };

        const INITIAL_TRACKS = [
          { id: 'vst-1', title: 'SmartMaster V2 Pro', type: 'vst', category: 'Mastering', price: 6500, priceMp3: 6500, cover: 'https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=800&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', desc: 'Processeur de mastering intelligent 15s avec Resonance Killer 3 Bandes', producer: 'YANrecords', isSold: false },
          { id: 'vst-2', title: 'ChopArcade V2', type: 'vst', category: 'Sampler', price: 4500, priceMp3: 4500, cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', desc: 'Auto-slicer 16 Chops Chromatique avec Mode Gate', producer: 'YANrecords', isSold: false },
          { id: 'beat-1', title: 'Marseille Vibes', type: 'beat', bpm: 130, key: 'Am', genre: 'Jul Type', producer: 'Slima Beatz', priceMp3: 2000, priceWav: 4000, priceStems: 8000, priceExclusive: 25000, cover: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3', isSold: false, plays: 1240 },
          { id: 'beat-2', title: 'Algiers Drill', type: 'beat', bpm: 142, key: 'C#m', genre: 'Drill', producer: 'YANrecords', priceMp3: 2500, priceWav: 5000, priceStems: 10000, priceExclusive: 35000, cover: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3', isSold: true, plays: 3450 }
        ];

        const DEFAULT_USER = {
          id: 'ceo-user-1', name: 'Yanis (CEO)', email: 'yanis.records@gmail.com', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80', balance: 84500, plays: 18920, rip: '00799999000000000012'
        };

        function App() {
          const [view, setViewState] = React.useState('gate'); // LA PAGE PAR DEFAUT EST LE PORTAIL
          const [tracks, setTracks] = React.useState(INITIAL_TRACKS);
          const [currentTrack, setCurrentTrack] = React.useState(null);
          const [isPlaying, setIsPlaying] = React.useState(false);
          const [selectedLicenseTrack, setSelectedLicenseTrack] = React.useState(null);
          const [selectedLicenseType, setSelectedLicenseType] = React.useState('mp3');
          
          const [currentUser, setCurrentUser] = React.useState(null);
          const [showProfileMenu, setShowProfileMenu] = React.useState(false);
          const [purchasedKey, setPurchasedKey] = React.useState(null);

          // Auth States (Gate)
          const [authMode, setAuthMode] = React.useState('login'); // 'login' ou 'register'
          const [authEmail, setAuthEmail] = React.useState('');
          const [authPassword, setAuthPassword] = React.useState('');
          const [acceptCGU, setAcceptCGU] = React.useState(false);
          const [showCGU, setShowCGU] = React.useState(false);

          const audioRef = React.useRef(new Audio());

          const setView = (newView) => {
            setViewState(newView);
            setShowProfileMenu(false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          React.useEffect(() => {
            const savedUser = localStorage.getItem('yanrecords_user');
            if (savedUser) {
              try { 
                const u = JSON.parse(savedUser);
                setCurrentUser(u); 
                if(view === 'gate') setView('home'); // S'il est connecté, on passe la gate
              } catch (e) {}
            }
          }, []);

          // SIMULATION CONNEXION (Avant Supabase)
          const handleAuthSubmit = (e) => {
            e.preventDefault();
            if (authMode === 'register' && !acceptCGU) {
              alert("Vous devez accepter les Conditions Générales d'Utilisation pour vous inscrire.");
              return;
            }
            // Connexion réussie
            const user = { ...DEFAULT_USER, email: authEmail };
            localStorage.setItem('yanrecords_user', JSON.stringify(user));
            setCurrentUser(user);
            setView('home');
          };

          const handleGoogleLogin = () => {
            if (authMode === 'register' && !acceptCGU) {
              alert("Vous devez accepter les CGU avant de continuer avec Google.");
              return;
            }
            localStorage.setItem('yanrecords_user', JSON.stringify(DEFAULT_USER));
            setCurrentUser(DEFAULT_USER);
            setView('home');
          };

          const handleLogout = () => {
            localStorage.removeItem('yanrecords_user');
            setCurrentUser(null);
            setShowProfileMenu(false);
            setView('gate'); // DECONNEXION = RETOUR AU PORTAIL
          };

          const togglePlay = (track) => {
            if (currentTrack?.id === track.id) {
              if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
              else { audioRef.current.play(); setIsPlaying(true); }
            } else {
              setCurrentTrack(track);
              audioRef.current.src = track.audio;
              audioRef.current.play();
              setIsPlaying(true);
            }
          };

          const handlePurchase = (item) => {
            if (item.type === 'vst') {
              setPurchasedKey(generateRealVstKey());
            } else {
              if (selectedLicenseType === 'exclusive') {
                setTracks(prev => prev.map(t => t.id === item.id ? { ...t, isSold: true } : t));
                alert(`LICENCE EXCLUSIVE ACHETÉE ! Le beat "${item.title}" est retiré de la vente.`);
              } else {
                alert(`Paiement confirmé ! Votre fichier audio est prêt.`);
              }
              setSelectedLicenseTrack(null);
            }
          };

          // ==========================================
          // VUE 1 : PORTAIL D'ENTRÉE (GATE)
          // ==========================================
          if (view === 'gate') {
            return (
              <div className="min-h-screen flex items-center justify-center p-4 relative">
                {/* Background image avec filtre dark */}
                <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=1600&q=80')] bg-cover bg-center"></div>
                <div className="absolute inset-0 bg-obsidian/90 backdrop-blur-md"></div>
                
                <div className="relative z-10 w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                  
                  {/* Côté Gauche : Bienvenue et Arguments */}
                  <div className="text-center lg:text-left space-y-6">
                    <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-black border border-goldAccent/50 font-black text-3xl text-goldAccent shadow-[0_0_30px_rgba(226,176,83,0.3)] mb-2">Y</div>
                    <h1 className="text-4xl md:text-5xl font-black text-white leading-tight">
                      BIENVENUE SUR <br/>
                      <span className="text-gradient-gold">YANRECORDS</span>
                    </h1>
                    <p className="text-gray-400 text-lg">La plateforme n°1 en Algérie réservée aux artistes et producteurs professionnels.</p>
                    
                    <div className="hidden lg:flex flex-col gap-4 mt-8">
                      <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-greenPro/20 text-greenPro"><Icon name="check" className="w-4 h-4"/></div> Vendez et achetez des prods (MP3, WAV, Exclusif)</div>
                      <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-cyanNeon/20 text-cyanNeon"><Icon name="check" className="w-4 h-4"/></div> Accédez à nos Plugins VST3 natifs exclusifs</div>
                      <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-pinkNeon/20 text-pinkNeon"><Icon name="check" className="w-4 h-4"/></div> Encaissez directement via BaridiMob & Edahabia</div>
                    </div>
                  </div>

                  {/* Côté Droit : Formulaire de Connexion / Inscription */}
                  <div className="glass-card p-8 rounded-[2rem] border-cyanNeon/20 shadow-2xl">
                    <div className="flex bg-obsidian rounded-xl p-1 mb-8 border border-borderDark">
                      <button onClick={() => setAuthMode('login')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition ${authMode === 'login' ? 'bg-cyanNeon text-black' : 'text-gray-400 hover:text-white'}`}>Se connecter</button>
                      <button onClick={() => setAuthMode('register')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition ${authMode === 'register' ? 'bg-goldAccent text-black' : 'text-gray-400 hover:text-white'}`}>Créer un compte</button>
                    </div>

                    <form onSubmit={handleAuthSubmit} className="space-y-4">
                      <div>
                        <label className="text-xs font-bold text-gray-400 block mb-1">Adresse Email</label>
                        <input type="email" required value={authEmail} onChange={e => setAuthEmail(e.target.value)} placeholder="contact@studio.com" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none" />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-gray-400 block mb-1">Mot de passe</label>
                        <input type="password" required value={authPassword} onChange={e => setAuthPassword(e.target.value)} placeholder="••••••••" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none" />
                      </div>

                      {authMode === 'register' && (
                        <div className="flex items-start gap-3 mt-4">
                          <input type="checkbox" id="cgu" checked={acceptCGU} onChange={e => setAcceptCGU(e.target.checked)} className="mt-1 accent-goldAccent" />
                          <label htmlFor="cgu" className="text-xs text-gray-400 leading-relaxed">
                            J'accepte les <span onClick={(e) => { e.preventDefault(); setShowCGU(true); }} className="text-goldAccent cursor-pointer hover:underline font-bold">Conditions Générales d'Utilisation (CGU)</span> et je certifie que mes créations sont originales.
                          </label>
                        </div>
                      )}

                      <button type="submit" className={`w-full font-black py-3.5 rounded-xl mt-6 transition shadow-lg ${authMode === 'login' ? 'bg-cyanNeon text-black cyan-glow' : 'bg-goldAccent text-black gold-glow'}`}>
                        {authMode === 'login' ? 'CONNEXION' : "S'INSCRIRE MAINTENANT"}
                      </button>
                    </form>

                    <div className="flex items-center gap-4 my-6">
                      <div className="h-px bg-borderDark flex-1"></div>
                      <span className="text-xs font-bold text-gray-500 uppercase">OU</span>
                      <div className="h-px bg-borderDark flex-1"></div>
                    </div>

                    <button onClick={handleGoogleLogin} className="w-full bg-white text-black font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-200 transition">
                      <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                      <span>Continuer avec Google</span>
                    </button>
                  </div>
                </div>

                {/* MODAL CGU */}
                {showCGU && (
                  <div className="fixed inset-0 z-[150] bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="glass-card rounded-2xl max-w-2xl w-full p-8 relative max-h-[85vh] flex flex-col">
                      <h3 className="text-2xl font-black text-goldAccent mb-4">Conditions Générales d'Utilisation (CGU)</h3>
                      <div className="flex-1 overflow-y-auto pr-4 space-y-4 text-sm text-gray-300">
                        <p><strong>1. Objet de la plateforme</strong><br/>YANrecords est une marketplace permettant aux producteurs (Beatmakers) de vendre des licences d'instrumentales et des logiciels VST.</p>
                        <p><strong>2. Propriété Intellectuelle</strong><br/>En publiant un beat, vous garantissez être l'auteur original à 100%. Tout plagiat entraînera la suppression immédiate du compte et le gel des fonds.</p>
                        <p><strong>3. Les Licences (Lease & Exclusive)</strong><br/>- Licences MP3, WAV et Stems : L'instrumentale reste sur la plateforme et peut être revendue à d'autres artistes.<br/>- Licence Exclusive : Une fois achetée, l'instrumentale est automatiquement marquée comme "VENDUE" et retirée du catalogue public. L'acheteur devient le propriétaire exclusif.</p>
                        <p><strong>4. Paiements et Commissions</strong><br/>Les paiements locaux s'effectuent via Edahabia et BaridiMob. La plateforme YANrecords prélève une commission de 15% sur chaque transaction pour couvrir les frais de serveur et de passerelle de paiement. Les retraits sont effectués sous 48h ouvrées sur le compte RIP renseigné dans vos paramètres.</p>
                        <p><strong>5. Achat de Logiciels (VST)</strong><br/>Toute licence logicielle achetée est strictement personnelle. Le partage de clé de licence VST entraînera la révocation définitive de la licence sans remboursement.</p>
                      </div>
                      <button onClick={() => { setAcceptCGU(true); setShowCGU(false); }} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl mt-6 hover:opacity-90">
                        J'AI LU ET J'ACCEPTE LES CGU
                      </button>
                    </div>
                  </div>
                )}
              </div>
            );
          }

          // ==========================================
          // VUE PRINCIPALE DU SITE (SI CONNECTÉ)
          // ==========================================
          return (
            <div className="relative">
              {/* Le reste du site... Navbar, Home, VSTs, Beats, Dashboard */}
              <nav className="glass fixed top-0 w-full z-50 px-6 py-4 flex items-center justify-between">
                <div className="flex items-center gap-4 cursor-pointer" onClick={() => setView('home')}>
                  <div className="w-10 h-10 rounded-lg bg-black border border-goldAccent/50 flex items-center justify-center font-black text-xl text-goldAccent shadow-lg">Y</div>
                  <h1 className="text-2xl font-black tracking-widest text-white hidden sm:block">YAN<span className="text-gradient-gold">RECORDS</span></h1>
                </div>

                <div className="hidden md:flex bg-black/40 border border-borderDark rounded-full p-1">
                  <button onClick={() => setView('home')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'home' ? 'bg-white text-black' : 'text-gray-400 hover:text-white'}`}>Accueil</button>
                  <button onClick={() => setView('vsts')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'vsts' ? 'bg-cyanNeon text-black' : 'text-gray-400 hover:text-white'}`}>Plugins VST</button>
                  <button onClick={() => setView('beats')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'beats' ? 'bg-goldAccent text-black' : 'text-gray-400 hover:text-white'}`}>Beatstore</button>
                </div>

                <div className="flex items-center gap-3 relative z-50">
                  <div className="relative">
                    <button onClick={() => setShowProfileMenu(!showProfileMenu)} className="flex items-center gap-2 bg-cardDark border border-borderDark px-2 py-1.5 rounded-xl cursor-pointer hover:border-cyanNeon transition">
                      <img src={currentUser.avatar} className="w-7 h-7 rounded-full object-cover" />
                      <span className="text-xs font-bold text-white hidden md:block">{currentUser.name}</span>
                    </button>

                    {showProfileMenu && (
                      <div className="absolute right-0 top-12 mt-2 w-48 glass-card rounded-xl border-borderDark shadow-2xl p-2 flex flex-col gap-1">
                        <button onClick={() => setView('dashboard')} className="px-3 py-2.5 rounded-lg text-sm font-bold text-gray-300 hover:bg-white/10 text-left">Dashboard</button>
                        <button onClick={handleLogout} className="px-3 py-2.5 rounded-lg text-sm font-bold text-red-400 hover:bg-red-500/10 text-left">Déconnexion</button>
                      </div>
                    )}
                  </div>
                </div>
              </nav>

              <div className="pt-28 pb-10 px-6 max-w-7xl mx-auto">
                {/* COMPENU DU SITE (HOME / BEATS / VSTS / DASHBOARD) IDENTIQUE A AVANT */}
                {view === 'home' && (
                  <div className="text-center mt-20 mb-20 animate-fade-in">
                    <h2 className="text-5xl md:text-7xl font-black mb-6 tracking-tight leading-tight">
                      LE SON DES <br/><span className="text-gradient-cyan">PRODUCTEURS PRO</span>
                    </h2>
                    <div className="flex flex-col sm:flex-row items-center gap-4 justify-center">
                      <button onClick={() => setView('vsts')} className="w-full sm:w-auto bg-cyanNeon text-black font-black px-8 py-4 rounded-xl text-lg hover:scale-105 transition cyan-glow">DÉCOUVRIR LES VSTS</button>
                      <button onClick={() => setView('beats')} className="w-full sm:w-auto bg-transparent border-2 border-goldAccent text-goldAccent font-black px-8 py-4 rounded-xl text-lg hover:bg-goldAccent/10 transition">ÉCOUTER LE BEATSTORE</button>
                    </div>
                  </div>
                )}
                
                {/* On garde les autres vues intactes pour ne pas alourdir le code ici... */}
                {view === 'vsts' && <div className="text-white text-3xl font-bold text-center mt-20">SECTION VST</div>}
                {view === 'beats' && <div className="text-white text-3xl font-bold text-center mt-20">SECTION BEATS</div>}
                {view === 'dashboard' && <div className="text-white text-3xl font-bold text-center mt-20">DASHBOARD VENDEUR</div>}
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
