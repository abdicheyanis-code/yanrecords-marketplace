function timeAgo(d){
  const s=Math.floor((Date.now()-new Date(d).getTime())/1000);
  if(s<60)return "à l'instant";
  if(s<3600)return Math.floor(s/60)+' min';
  if(s<86400)return Math.floor(s/3600)+' h';
  return Math.floor(s/86400)+' j';
}
async function hashFile(file){
  try{
    const data=await file.arrayBuffer();
    const hash=await crypto.subtle.digest('SHA-256',data);
    return Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }catch(e){return null;}
}

/* ---------- CONTRAT PDF ---------- */
function pdfSafe(value){
  return String(value===null||value===undefined?'':value)
    .replace(/[’‘]/g,"'")
    .replace(/[“”]/g,'"')
    .replace(/[–—]/g,'-')
    .replace(/•/g,'-')
    .replace(/·/g,'-');
}
function addContractPage(doc,pageNo,total){
  doc.setFillColor(5,5,8);doc.rect(0,0,210,27,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(226,176,83);
  doc.text('213WAVE',16,13);
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(190,190,190);
  doc.text('CONTRAT DE LICENCE MUSICALE',16,20);
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,120,120);
  doc.text('YANrecords',178,20);
  doc.setDrawColor(226,176,83);doc.line(16,28,194,28);
}
async function downloadContract(contractNo,toast){
  try{
    if(!window.jspdf||!window.jspdf.jsPDF){toast('La bibliothèque PDF ne se charge pas. Recharge la page.','error');return;}
    const result=await sb.rpc('get_contract',{p_no:contractNo});
    if(result.error)throw result.error;
    const d=result.data;
    if(!d)throw new Error('Contrat introuvable');
    const PDF=window.jspdf.jsPDF;
    const doc=new PDF({unit:'mm',format:'a4'});
    let y=38,page=1;

    function newPage(){
      doc.addPage();page++;addContractPage(doc,page,1);y=38;
    }
    function ensure(h){
      if(y+h>270)newPage();
    }
    function title(text){
      ensure(12);
      doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(20,20,20);
      doc.text(pdfSafe(text),16,y);y+=4;
      doc.setDrawColor(220,220,220);doc.line(16,y,194,y);y+=6;
    }
    function para(text,size){
      const fs=size||9;
      doc.setFont('helvetica','normal');doc.setFontSize(fs);doc.setTextColor(55,55,55);
      const lines=doc.splitTextToSize(pdfSafe(text),174);
      const h=lines.length*4.2;
      ensure(h+2);
      doc.text(lines,18,y);
      y+=h+2;
    }
    function row(label,value){
      ensure(7);
      doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90,90,90);
      doc.text(pdfSafe(label),18,y);
      doc.setFont('helvetica','bold');doc.setTextColor(25,25,25);
      const v=doc.splitTextToSize(pdfSafe(value),105);
      doc.text(v,80,y);
      y+=Math.max(5,v.length*4)+1;
    }

    addContractPage(doc,1,1);
    doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(20,20,20);
    doc.text('REFERENCE : '+pdfSafe(d.no),16,y);y+=8;
    para('Genere automatiquement le '+new Date().toLocaleString('fr-FR')+'.',8);

    title('1. PARTIES');
    row('Producteur / concedant',d.seller_name||'-');
    if(d.license==='exclusive')row('Nom legal du producteur',d.seller_legal||'-');
    row('Acheteur / licencie',d.buyer_name||'-');
    if(d.license==='exclusive')row('Nom legal de l acheteur',d.buyer_legal||'-');
    y+=2;

    title('2. OEUVRE CONCERNEE');
    row('Titre',d.title||'-');
    row('Type',d.type==='vst'?'Plugin VST':'Beat');
    if(d.type!=='vst'){
      row('Genre / BPM / gamme',(d.genre||'-')+' / '+(d.bpm||'-')+' / '+(d.musickey||'-'));
    }
    row('Date de publication',d.created?new Date(d.created).toLocaleString('fr-FR'):'-');
    if(d.hash){
      row('Empreinte SHA-256',d.hash);
    }

    title('3. LICENCE ACCORDEE');
    row('Type de licence',LICENSE_NAMES[d.license]||d.license||'-');
    const limits=d.limits||{};
    if(d.type==='vst'){
      row('Nombre d activations','3 machines maximum');
      row('Partage de cle','Interdit');
    }else{
      row('Streams autorises',unlimited(limits.streams));
      row('Copies vendues',unlimited(limits.copies));
      row('Clips video',unlimited(limits.videos));
      row('Diffusion radio',limits.radio===-1?'Illimitee':(Number(limits.radio)>0?limits.radio+' stations':'Non autorisee'));
      row('Concerts payants',limits.shows?'Autorises':'Non autorises');
      row('Tag producteur',limits.tag?'A conserver':'Retire');
      row('Credit Prod. by','Obligatoire');
      row('Duree',limits.years===-1?'Illimitee':(limits.years||'-')+' ans');
      row('Exclusivite',d.license==='exclusive'?'Oui - beat retire du catalogue':'Non - licence non exclusive');
    }

    title('4. CONDITIONS FINANCIERES');
    row('Prix paye',fmt(d.amount)+' DZD');
    row('Part producteur',fmt(d.seller_amount)+' DZD');
    row('Commission plateforme ('+d.rate+'%)',fmt(d.fee)+' DZD');
    row('Paiement','Virement CCP / BaridiMob, preuve conservee');

    if(d.vst_key){
      title('5. CLE VST');
      row('Cle d activation',d.vst_key);
    }

    title((d.vst_key?'6.':'5.')+' ENGAGEMENTS DES PARTIES');
    para('Le Producteur declare etre l auteur original de l oeuvre et garantir qu elle ne porte atteinte a aucun droit de tiers.');
    para('L Acheteur s engage a respecter les limites de la licence, a ne pas revendre ni redistribuer le fichier source, et a mentionner le Producteur lorsque le credit est requis.');
    para('La licence ne transfere pas la propriete de l oeuvre. Elle accorde uniquement les droits d utilisation enumeres dans le present document.');
    para('Sauf accord ecrit distinct, le publishing est partage a 50% pour le Producteur et 50% pour le beneficiaire.');
    para('Le present contrat est soumis au droit algerien. YANrecords agit comme intermediaire technique et n est pas partie a la licence.');

    title((d.vst_key?'7.':'6.')+' ACCEPTATION ET LIVRAISON');
    row('Acceptation electronique',d.accepted_at?new Date(d.accepted_at).toLocaleString('fr-FR'):'-');
    row('Validation / livraison',d.date?new Date(d.date).toLocaleString('fr-FR'):'-');
    if(d.terms_version)row('Version des conditions',d.terms_version);

    ensure(16);
    doc.setFillColor(248,243,228);doc.rect(16,y,178,12,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(110,80,20);
    doc.text('L acceptation electronique horodatee et le present PDF constituent la trace de la licence.',19,y+7);
    y+=18;
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(110,110,110);
    doc.text('Document genere automatiquement par 213WAVE / YANrecords - reference '+pdfSafe(d.no),16,280);

    const pages=doc.getNumberOfPages();
    for(let i=1;i<=pages;i++){
      doc.setPage(i);
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,120,120);
      doc.text('213WAVE - Document de licence - '+i+'/'+pages,16,289);
    }
    doc.save('Contrat-'+pdfSafe(d.no)+'.pdf');
    toast('Contrat PDF téléchargé');
  }catch(error){
    toast(error.message||'Impossible de générer le PDF','error');
  }
}

/* ---------- ERROR BOUNDARY ---------- */
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={error:null};}
  static getDerivedStateFromError(error){return{error:error};}
  render(){
    if(this.state.error){
      return <div className="min-h-screen flex items-center justify-center p-4">
        <div className="card p-8 rounded-2xl text-center max-w-md">
          <h2 className="text-2xl font-black text-white mb-2">Erreur d'affichage</h2>
          <p className="text-xs text-gray-400 mb-4">{String(this.state.error.message||this.state.error)}</p>
          <button onClick={function(){location.reload();}} className="bg-cyanNeon text-black px-6 py-3 rounded-xl font-bold">Recharger</button>
        </div></div>;
    }
    return this.props.children;
  }
}

function Toasts(props){
  return <div className="fixed top-20 right-4 z-[200] flex flex-col gap-3 max-w-xs">
    {props.items.map(function(t){
      return <div key={t.id} className="toast card rounded-xl p-4 flex items-center gap-3 border-l-4" style={{borderLeftColor:t.type==='error'?'#ef4444':'#10b981'}}>
        <p className="text-sm font-bold text-white flex-1">{t.message}</p>
        <button onClick={function(){props.remove(t.id);}} className="text-gray-500"><Icon name="close" size={16}/></button>
      </div>;
    })}
  </div>;
}

/* ---------- CGU courtes inscription ---------- */
function AuthPage(props){
  const [mode,setMode]=React.useState('login');
  const [email,setEmail]=React.useState('');
  const [pass,setPass]=React.useState('');
  const [name,setName]=React.useState('');
  const [err,setErr]=React.useState('');
  const [busy,setBusy]=React.useState(false);
  const [accepted,setAccepted]=React.useState(false);

  async function submit(e){
    e.preventDefault();
    setErr('');
    if(mode==='register'&&!accepted){setErr('Accepte les CGU pour continuer.');return;}
    setBusy(true);
    try{
      if(mode==='login'){
        const r=await sb.auth.signInWithPassword({email:email,password:pass});
        if(r.error)throw r.error;
        props.toast('Connecté !');
      }else{
        const r=await sb.auth.signUp({
          email:email,
          password:pass,
          options:{data:{full_name:name||email.split('@')[0]}}
        });
        if(r.error)throw r.error;
        if(r.data.user&&!r.data.session)props.toast('Vérifie ton email pour activer ton compte');
        else props.toast('Compte créé !');
      }
    }catch(ex){setErr(ex.message);}
    setBusy(false);
  }

  async function google(){
    const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin}});
    if(r.error)props.toast(r.error.message,'error');
  }

  return <div className="min-h-screen flex items-center justify-center p-4 relative">
    <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1600&q=80')] bg-cover bg-center"></div>
    <div className="absolute inset-0 bg-obsidian/90 backdrop-blur-md"></div>
    <div className="relative z-10 w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-10 items-center fade">
      <div className="text-center lg:text-left space-y-6">
        <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-black border border-goldAccent/50 font-black text-3xl text-goldAccent gg">Y</div>
        <h1 className="text-4xl md:text-5xl font-black text-white leading-tight">BIENVENUE SUR<br/><span className="tgold">YANRECORDS</span></h1>
        <p className="text-gray-400 text-lg">La marketplace musicale n°1 en Algérie.</p>
        <div className="hidden lg:block space-y-3 pt-4 text-sm font-bold text-white">
          <p>📄 Contrat PDF à chaque vente validée</p>
          <p>🔑 Clés VST uniques</p>
          <p>💬 Messagerie directe entre membres</p>
        </div>
      </div>

      <div className="card p-8 rounded-[2rem] border-cyanNeon/20">
        <div className="flex bg-obsidian rounded-xl p-1 mb-8 border border-borderDark">
          <button onClick={function(){setMode('login');setErr('');}} className={'flex-1 py-2.5 text-sm font-bold rounded-lg '+(mode==='login'?'bg-cyanNeon text-black':'text-gray-400')}>Se connecter</button>
          <button onClick={function(){setMode('register');setErr('');}} className={'flex-1 py-2.5 text-sm font-bold rounded-lg '+(mode==='register'?'bg-goldAccent text-black':'text-gray-400')}>Créer un compte</button>
        </div>

        <form onSubmit={submit} className="space-y-4">
          {mode==='register'?<div><label className="text-xs font-bold text-gray-400 block mb-1">Nom d'artiste</label>
            <input type="text" required maxLength="50" value={name} onChange={function(e){setName(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none"/></div>:null}
          <div><label className="text-xs font-bold text-gray-400 block mb-1">Email</label>
            <input type="email" required value={email} onChange={function(e){setEmail(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none"/></div>
          <div><label className="text-xs font-bold text-gray-400 block mb-1">Mot de passe (6+)</label>
            <input type="password" required minLength="6" value={pass} onChange={function(e){setPass(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none"/></div>
          {mode==='register'?<div className="flex items-start gap-3">
            <input type="checkbox" checked={accepted} onChange={function(e){setAccepted(e.target.checked);}} className="mt-1 accent-goldAccent"/>
            <label className="text-xs text-gray-400">J'accepte les <a href="infos.html#cgu" target="_blank" className="text-goldAccent font-bold underline">CGU</a>.</label>
          </div>:null}
          {err?<div className="bg-red-500/10 border border-red-500/40 text-red-400 text-xs p-3 rounded-xl">{err}</div>:null}
          <button type="submit" disabled={busy} className={'w-full font-black py-3.5 rounded-xl disabled:opacity-50 '+(mode==='login'?'bg-cyanNeon text-black gc':'bg-goldAccent text-black gg')}>
            {busy?'...':mode==='login'?'CONNEXION':"S'INSCRIRE"}
          </button>
        </form>

        <div className="flex items-center gap-4 my-6"><div className="h-px bg-borderDark flex-1"></div><span className="text-xs text-gray-500">OU</span><div className="h-px bg-borderDark flex-1"></div></div>
        <button onClick={google} className="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-gray-200 transition">Continuer avec Google</button>
      </div>
    </div>
  </div>;
}

function BeatsView(props){
  const [query,setQuery]=React.useState('');

  let list=props.tracks.filter(function(t){
    if(t.type!=='beat')return false;
    if(genre!=='Tous'&&t.genre!==genre)return false;
    if(query){
      const q=query.toLowerCase();
      if(!(t.title||'').toLowerCase().includes(q)&&!(t.producer_name||'').toLowerCase().includes(q))return false;
    }
    return true;
  });
  if(sort==='popular')list=list.slice().sort(function(a,b){return (b.plays||0)-(a.plays||0);});
  if(sort==='cheap')list=list.slice().sort(function(a,b){return (a.price_mp3||0)-(b.price_mp3||0);});

  const matched=query?props.producers.filter(function(p){return (p.name||'').toLowerCase().includes(query.toLowerCase());}).slice(0,4):[];

        <select value={sort} onChange={function(e){setSort(e.target.value);}} className="bg-cardDark border border-borderDark rounded-xl px-3 text-xs text-white"><option value="recent">Récent</option><option value="popular">Populaire</option><option value="cheap">Prix bas</option></select>

          <img src={p.avatar_url||AV} className="w-8 h-8 rounded-full object-cover" alt=""/><span className="text-xs font-bold">{p.name}</span>

    <div className="card rounded-2xl p-4 space-y-2">{list.slice(0,limit).map(function(t){
      const active=props.current&&props.current.id===t.id;
      return <div key={t.id} className={'grid grid-cols-1 md:grid-cols-12 gap-3 items-center p-3 rounded-xl '+(t.is_sold?'opacity-50':'hover:bg-white/5')}>

/* ---------- MESSAGERIE ---------- */
function MessagesView(props){
  const [conversations,setConversations]=React.useState([]);
  const [peer,setPeer]=React.useState(props.initialPeer||null);
  const [peerName,setPeerName]=React.useState(props.initialName||'');
  const [messages,setMessages]=React.useState([]);
  const [text,setText]=React.useState('');
  const [busy,setBusy]=React.useState(false);
  const endRef=React.useRef(null);

  async function loadConversations(){
    const r=await sb.rpc('my_conversations');
    if(r.data)setConversations(r.data);
  }
  async function loadThread(id){
    const filter='and(sender_id.eq.'+props.userId+',recipient_id.eq.'+id+'),and(sender_id.eq.'+id+',recipient_id.eq.'+props.userId+')';
    const r=await sb.from('messages').select('*').or(filter).order('created_at',{ascending:true}).limit(200);
    if(r.data)setMessages(r.data);
    await sb.rpc('mark_msgs_read',{p_peer:id});
    props.refreshUnread();
  }

  React.useEffect(function(){loadConversations();},[]);
  React.useEffect(function(){
    if(props.initialPeer){
      setPeer(props.initialPeer);
      setPeerName(props.initialName||'');
    }
  },[props.initialPeer]);
  React.useEffect(function(){if(peer)loadThread(peer);},[peer]);
  React.useEffect(function(){if(endRef.current)endRef.current.scrollIntoView({behavior:'smooth'});},[messages]);

  React.useEffect(function(){
    const channel=sb.channel('messages-'+props.userId)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(payload){
        const m=payload.new;
        if(m.sender_id===props.userId||m.recipient_id===props.userId){
          if(peer&&(m.sender_id===peer||m.recipient_id===peer)){
            setMessages(function(old){
              if(old.some(function(x){return x.id===m.id;}))return old;
              return old.concat([m]);
            });
          }
          loadConversations();
          props.refreshUnread();
        }
      }).subscribe();
    return function(){sb.removeChannel(channel);};
  },[peer,props.userId]);

  async function send(e){
    e.preventDefault();
    if(!text.trim()||!peer)return;
    setBusy(true);
    const r=await sb.from('messages').insert({
      sender_id:props.userId,
      recipient_id:peer,
      body:text.trim()
    }).select().single();
    if(r.error)props.toast(r.error.message,'error');
    else{
      setText('');
      if(r.data)setMessages(function(old){return old.some(function(x){return x.id===r.data.id;})?old:old.concat([r.data]);});
      loadConversations();
    }
    setBusy(false);
  }

  return <section className="fade">
    <h2 className="text-3xl font-black border-l-4 border-cyanNeon pl-4 mb-5">MESSAGES</h2>
    <div className="grid md:grid-cols-3 gap-4 h-[560px]">
      <div className={'card rounded-2xl p-3 overflow-y-auto '+(peer?'hidden md:block':'')}>
        <p className="text-[10px] font-black text-gray-500 uppercase px-2 py-2">Conversations</p>
        {conversations.length===0?<p className="text-xs text-gray-500 text-center py-10">Aucune conversation.<br/>Ouvre un profil et clique sur 💬.</p>:
        conversations.map(function(c){
          return <button key={c.peer_id} onClick={function(){setPeer(c.peer_id);setPeerName(c.peer_name);}} className={'w-full flex items-center gap-3 p-2.5 rounded-xl text-left '+(peer===c.peer_id?'bg-cyanNeon/10 border border-cyanNeon/40':'hover:bg-white/5')}>
            <img src={c.peer_avatar||AV} className="w-10 h-10 rounded-full object-cover" alt=""/>
            <div className="min-w-0 flex-1"><p className="text-sm font-bold text-white truncate">{c.peer_name}</p><p className="text-[11px] text-gray-500 truncate">{c.last_body}</p></div>
            {Number(c.unread)>0?<span className="bg-pinkNeon text-black text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center">{c.unread}</span>:null}
          </button>;
        })}
      </div>
      <div className={'md:col-span-2 card rounded-2xl flex flex-col '+(peer?'':'hidden md:flex')}>
        {!peer?<div className="flex-1 flex items-center justify-center text-gray-500 text-sm">Choisis une conversation.</div>:
        <React.Fragment>
          <div className="flex items-center gap-3 p-4 border-b border-borderDark">
            <button onClick={function(){setPeer(null);}} className="md:hidden text-gray-400"><Icon name="back"/></button>
            <p className="font-black text-white flex-1">{peerName}</p>
            <button onClick={function(){props.openProducer(peer);}} className="text-xs font-bold text-cyanNeon">Voir profil</button>
          </div>
          <div className="flex-1 overflow-y-auto p-4 space-y-2">
            {messages.length===0?<p className="text-center text-xs text-gray-500 py-10">Démarre la conversation 👋</p>:
            messages.map(function(m){
              const mine=m.sender_id===props.userId;
              return <div key={m.id} className={'flex '+(mine?'justify-end':'justify-start')}>
                <div className={'bubble '+(mine?'bubble-me':'bubble-peer')}>{m.body}
                  <p className={'text-[9px] mt-1 '+(mine?'text-black/50':'text-gray-500')}>{timeAgo(m.created_at)}</p>
                </div>
              </div>;
            })}
            <div ref={endRef}></div>
          </div>
          <form onSubmit={send} className="p-3 border-t border-borderDark flex gap-2">
            <input value={text} maxLength="1000" onChange={function(e){setText(e.target.value);}} placeholder="Écris ton message..." className="flex-1 bg-obsidian border border-borderDark rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-cyanNeon"/>
            <button disabled={busy||!text.trim()} className="bg-cyanNeon text-black font-black px-5 rounded-xl disabled:opacity-40"><Icon name="send"/></button>
          </form>
        </React.Fragment>}
      </div>
    </div>
  </section>;
}

/* ---------- VÉRIFICATION VST ---------- */
function VerifyView(props){
  const [key,setKey]=React.useState('');
  const [machine,setMachine]=React.useState('PC-'+Math.random().toString(36).slice(2,8).toUpperCase());
  const [result,setResult]=React.useState(null);
  const [busy,setBusy]=React.useState(false);

    e.preventDefault();
    setBusy(true);
    const r=await sb.rpc('verify_vst_key',{p_key:key.trim().toUpperCase(),p_machine_id:machine});
    setResult(r.error?{valid:false,reason:r.error.message}:r.data);

  return <div className="max-w-2xl mx-auto card p-8 rounded-3xl fade border-cyanNeon/30">

      <input required value={machine} onChange={function(e){setMachine(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-white font-mono"/>

      <p className={'font-black '+(result.valid?'text-greenPro':'text-red-400')}>{result.valid?'CLÉ VALIDE':'CLÉ REFUSÉE'}</p>

    </div>:null}
  </div>;
}

/* ---------- PUBLICATION ---------- */
function UploadView(props){
  const [title,setTitle]=React.useState('');
  const [type,setType]=React.useState('beat');
  const [genre,setGenre]=React.useState('Drill');
  const [bpm,setBpm]=React.useState(140);
  const [musicKey,setMusicKey]=React.useState('Am');
  const [p1,setP1]=React.useState(2000),[p2,setP2]=React.useState(4000),[p3,setP3]=React.useState(8000),[p4,setP4]=React.useState(25000);
  const [description,setDescription]=React.useState('');
  const [cover,setCover]=React.useState(null),[file,setFile]=React.useState(null);
  const [busy,setBusy]=React.useState(false),[custom,setCustom]=React.useState(false);
  const [limits,setLimits]=React.useState(JSON.parse(JSON.stringify(DEFAULT_LIMITS)));

  function updateLimit(license,key,value){
    const next=JSON.parse(JSON.stringify(limits));
    next[license][key]=value;
    setLimits(next);
  }
  async function submit(e){
    e.preventDefault();
    setBusy(true);
    const ok=await props.upload({
      title:title,type:type,genre:genre,bpm:bpm,key:musicKey,
      p1:p1,p2:p2,p3:p3,p4:p4,description:description,
      cover:cover,file:file,limits:type==='beat'&&custom?limits:null
    });
    if(ok){setTitle('');setDescription('');setCover(null);setFile(null);}
    setBusy(false);
  }

  function renderCustomLimits(license){
    const l=limits[license];
    return <div key={license} className="p-3 rounded-lg bg-cardDark border border-borderDark">
      <p className="text-[11px] font-black text-goldAccent uppercase mb-2">{LICENSE_NAMES[license]}</p>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
        <div><label className="text-[10px] text-gray-500">Streams</label><input type="number" min="-1" value={l.streams} onChange={function(e){updateLimit(license,'streams',parseInt(e.target.value,10)||0);}} className="w-full bg-obsidian border border-borderDark rounded p-1.5 text-xs text-white"/></div>
        <div><label className="text-[10px] text-gray-500">Copies</label><input type="number" min="-1" value={l.copies} onChange={function(e){updateLimit(license,'copies',parseInt(e.target.value,10)||0);}} className="w-full bg-obsidian border border-borderDark rounded p-1.5 text-xs text-white"/></div>
        <div><label className="text-[10px] text-gray-500">Clips (-1 = illimité)</label><input type="number" min="-1" value={l.videos} onChange={function(e){updateLimit(license,'videos',parseInt(e.target.value,10)||0);}} className="w-full bg-obsidian border border-borderDark rounded p-1.5 text-xs text-white"/></div>
        <div><label className="text-[10px] text-gray-500">Durée en années</label><input type="number" min="-1" value={l.years} onChange={function(e){updateLimit(license,'years',parseInt(e.target.value,10)||0);}} className="w-full bg-obsidian border border-borderDark rounded p-1.5 text-xs text-white"/></div>
        <div><label className="text-[10px] text-gray-500">Stations radio (-1 = illimité)</label><input type="number" min="-1" value={l.radio} onChange={function(e){updateLimit(license,'radio',parseInt(e.target.value,10)||0);}} className="w-full bg-obsidian border border-borderDark rounded p-1.5 text-xs text-white"/></div>
      </div>
      <div className="flex gap-4 mt-2">
        <label className="flex items-center gap-1.5 text-[11px] text-gray-400"><input type="checkbox" checked={l.shows} onChange={function(e){updateLimit(license,'shows',e.target.checked);}} className="accent-goldAccent"/>Concerts payants</label>
        <label className="flex items-center gap-1.5 text-[11px] text-gray-400"><input type="checkbox" checked={l.tag} onChange={function(e){updateLimit(license,'tag',e.target.checked);}} className="accent-goldAccent"/>Tag obligatoire</label>
      </div>
    </div>;
  }

  return <div className="max-w-2xl mx-auto card p-8 rounded-2xl fade">
    <h2 className="text-2xl font-black text-white mb-2">Nouvelle création</h2>
    <p className="text-xs text-gray-400 mb-6">Les fichiers reçoivent une empreinte SHA-256 au moment de la publication.</p>
    <form onSubmit={submit} className="space-y-4">
      <div><label className="text-xs font-bold block mb-1">Titre</label><input required maxLength="100" value={title} onChange={function(e){setTitle(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"/></div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div><label className="text-xs font-bold block mb-1">Type</label><select value={type} onChange={function(e){setType(e.target.value);setFile(null);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"><option value="beat">Beat</option><option value="vst">VST</option></select></div>
        {type==='beat'?<React.Fragment>
          <div><label className="text-xs font-bold block mb-1">Genre</label><select value={genre} onChange={function(e){setGenre(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white">{GENRES.slice(1).map(function(g){return <option key={g} value={g}>{g}</option>;})}</select></div>
          <div><label className="text-xs font-bold block mb-1">BPM</label><input type="number" min="40" max="300" value={bpm} onChange={function(e){setBpm(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"/></div>
          <div><label className="text-xs font-bold block mb-1">Gamme</label><input maxLength="10" value={musicKey} onChange={function(e){setMusicKey(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"/></div>
        </React.Fragment>:null}
      </div>

      {type==='beat'?<React.Fragment>
        <div className="p-4 rounded-xl bg-obsidian border border-borderDark">
          <p className="text-xs font-bold text-goldAccent uppercase mb-3">Prix DZD · commission 5%</p>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-[11px] text-gray-400">MP3</label><input type="number" min="0" value={p1} onChange={function(e){setP1(e.target.value);}} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
            <div><label className="text-[11px] text-gray-400">WAV</label><input type="number" min="0" value={p2} onChange={function(e){setP2(e.target.value);}} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
            <div><label className="text-[11px] text-gray-400">Stems</label><input type="number" min="0" value={p3} onChange={function(e){setP3(e.target.value);}} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
            <div><label className="text-[11px] text-gray-400">Exclusive</label><input type="number" min="0" value={p4} onChange={function(e){setP4(e.target.value);}} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
          </div>
        </div>
        <div className="p-4 rounded-xl bg-obsidian border border-borderDark">
          <label className="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" checked={custom} onChange={function(e){setCustom(e.target.checked);}} className="accent-goldAccent"/>
            <span className="text-xs font-bold">Personnaliser les limites des licences</span>
          </label>
          <p className="text-[11px] text-gray-500 mt-1">Sinon les valeurs standard s'appliquent. Les limites de la vente seront conservées dans le contrat PDF.</p>
          {custom?<div className="mt-4 space-y-3">{['mp3','wav','stems'].map(renderCustomLimits)}<p className="text-[10px] text-gray-500">Pour streams, copies, clips, radio et durée, entre -1 pour « illimité ».</p></div>:null}
        </div>
      </React.Fragment>:<div className="p-4 rounded-xl bg-cyanNeon/10 border border-cyanNeon/30">
        <label className="text-xs font-bold text-cyanNeon block mb-1">Prix VST · commission 8%</label>
        <input type="number" min="0" value={p1} onChange={function(e){setP1(e.target.value);}} className="w-full bg-cardDark border border-cyanNeon/40 rounded-lg p-2 text-white"/>
        <p className="text-[11px] text-gray-400 mt-2">Clé unique par acheteur, 3 machines maximum.</p>
      </div>}

      <div><label className="text-xs font-bold block mb-1">Description</label><textarea maxLength="300" rows="3" value={description} onChange={function(e){setDescription(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white resize-none"/></div>
      <div><label className="text-xs font-bold block mb-1">Pochette (5 Mo max)</label><input type="file" accept="image/*" onChange={function(e){setCover(e.target.files[0]);}} className="w-full text-xs text-gray-400"/></div>
      <div><label className="text-xs font-bold block mb-1">{type==='vst'?'Fichier VST':'Fichier audio'} (50 Mo max)</label><input key={type} type="file" accept={type==='vst'?'.zip,.rar,.7z,.exe,.msi,.dmg,.pkg':'.mp3,.wav'} onChange={function(e){setFile(e.target.files[0]);}} className="w-full text-xs text-gray-400"/></div>
      <button disabled={busy} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl gg disabled:opacity-50">{busy?'PUBLICATION...':'PUBLIER'}</button>
    </form>
  </div>;
}

function SettingsView(props){
  const p=props.profile;
  const [name,setName]=React.useState(p.name||'');
  const [legal,setLegal]=React.useState(p.legal_name||'');
  const [rip,setRip]=React.useState(p.rip||'');
  const [bio,setBio]=React.useState(p.bio||'');
  const [instagram,setInstagram]=React.useState(p.instagram||'');
  const [avatar,setAvatar]=React.useState(null);
  const [preview,setPreview]=React.useState(p.avatar_url||AV);

  async function submit(e){
    e.preventDefault();setBusy(true);
    await props.save({name:name,legal_name:legal,rip:rip,bio:bio,instagram:instagram,avatar:avatar});

  return <div className="max-w-2xl mx-auto card p-8 rounded-3xl fade">

        <div><label className="text-xs font-bold block mb-2">Photo de profil (5 Mo max)</label>

        <input maxLength="80" value={legal} onChange={function(e){setLegal(e.target.value);}} placeholder="Nom et prénom selon ta pièce d'identité" className="w-full bg-obsidian border border-pinkNeon/30 rounded-xl p-3 text-sm text-white"/>
      </div>
      <div><label className="text-xs font-bold block mb-1">Bio publique</label><textarea maxLength="200" rows="3" value={bio} onChange={function(e){setBio(e.target.value);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white resize-none"/></div>
      <div><label className="text-xs font-bold block mb-1">Instagram public</label><input maxLength="40" value={instagram} onChange={function(e){setInstagram(e.target.value);}} placeholder="@tonpseudo" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"/></div>
      <div className="p-4 rounded-xl bg-goldAccent/5 border border-goldAccent/30">
        <label className="text-xs font-bold text-goldAccent block mb-1">CCP / BaridiMob</label>
        <p className="text-[11px] text-gray-400 mb-2">Privé ; visible uniquement dans l'écran d'achat d'un de tes produits.</p>
        <input value={rip} onChange={function(e){setRip(e.target.value);}} className="w-full bg-obsidian border border-goldAccent/30 rounded-xl p-3 text-sm text-white font-mono"/>
      </div>
      <button disabled={busy} className="w-full bg-white text-black font-black py-4 rounded-xl disabled:opacity-50">{busy?'ENREGISTREMENT...':'ENREGISTRER'}</button>
    </form>
  </div>;
}

/* ---------- MODAL D'ACHAT ---------- */
function BuyModal(props){
  const item=props.item;
  const [license,setLicense]=React.useState(item.type==='vst'?'vst':'mp3');
  const [proof,setProof]=React.useState(null);
  const [buyerLegal,setBuyerLegal]=React.useState('');
  const [accepted,setAccepted]=React.useState(false);
  const [seller,setSeller]=React.useState(null);
  const [showLimits,setShowLimits]=React.useState(false);
  const [busy,setBusy]=React.useState(false);

  React.useEffect(function(){
    sb.rpc('get_seller_payment',{p_track_id:item.id}).then(function(r){if(r.data)setSeller(r.data);});
  },[item.id]);

  React.useEffect(function(){setAccepted(false);setBuyerLegal('');},[license]);

  function price(l){
    if(item.type==='vst')return Number(item.price_mp3)||0;
    if(l==='wav')return Number(item.price_wav)||0;
    if(l==='stems')return Number(item.price_stems)||0;
    if(l==='exclusive')return Number(item.price_exclusive)||0;
    return Number(item.price_mp3)||0;
  }

  const rate=item.type==='vst'?8:5;
  const limits=(item.limits&&item.limits[license])?item.limits[license]:DEFAULT_LIMITS[license];
  const needsLegal=license==='exclusive';
  const sellerReady=seller&&seller.legal_name_ready===true;
  const buyerReady=buyerLegal.trim().length>=3;
  const ready=!!proof&&accepted&&(!needsLegal||(buyerReady&&sellerReady));

  async function send(){
    if(!ready)return;
    setBusy(true);
    await props.submit(item,license,price(license),rate,proof,buyerLegal.trim(),accepted);
    setBusy(false);
  }

  return <div className="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4 overflow-y-auto">
    <div className="card rounded-2xl max-w-lg w-full p-6 relative my-8 fade">
      <button onClick={props.close} className="absolute top-4 right-4 text-gray-400"><Icon name="close"/></button>
      <h3 className="text-xl font-black text-white mb-4">Achat : {item.title}</h3>

      {item.type==='beat'?<div className="space-y-2 mb-4">{LICENSES.map(function(l){
        const active=license===l;
        return <button type="button" key={l} onClick={function(){setLicense(l);}} className={'w-full text-left p-3 rounded-xl border '+(active?(l==='exclusive'?'border-pinkNeon bg-pinkNeon/10':'border-goldAccent bg-goldAccent/10'):'border-borderDark')}>
          <span className="flex justify-between font-bold"><span>{l==='exclusive'?'🔥 ':''}{LICENSE_NAMES[l]}</span><span className="text-goldAccent">{fmt(price(l))} DZD</span></span>
        </button>;
      })}</div>:null}

      <div className="p-4 rounded-xl bg-goldAccent/10 border border-goldAccent/30 mb-4 flex justify-between">
        <span className="font-bold">Total à payer</span><span className="font-black text-goldAccent">{fmt(price(license))} DZD</span>
      </div>

      {limits?<div className="mb-4 rounded-xl border border-cyanNeon/25 bg-cyanNeon/5 overflow-hidden">
        <button type="button" onClick={function(){setShowLimits(!showLimits);}} className="w-full flex justify-between px-4 py-3 text-xs font-black text-cyanNeon">
          <span>📋 CE QUE CETTE LICENCE AUTORISE</span><Icon name="chevron" size={16} className={showLimits?'rotate-180':''}/>
        </button>
        {showLimits?<div className="px-4 pb-4 grid grid-cols-2 gap-2 text-[11px] fade">
          <span className="text-gray-400">Streams</span><b className="text-right">{unlimited(limits.streams)}</b>
          <span className="text-gray-400">Copies vendues</span><b className="text-right">{unlimited(limits.copies)}</b>
          <span className="text-gray-400">Clips vidéo</span><b className="text-right">{unlimited(limits.videos)}</b>
          <span className="text-gray-400">Radio</span><b className="text-right">{limits.radio===-1?'Illimitée':(limits.radio>0?limits.radio+' stations':'Non')}</b>
          <span className="text-gray-400">Concerts payants</span><b className="text-right">{limits.shows?'Oui':'Non'}</b>
          <span className="text-gray-400">Tag producteur</span><b className="text-right">{limits.tag?'À conserver':'Retiré'}</b>
          <span className="text-gray-400">Durée</span><b className="text-right">{limits.years===-1?'Illimitée':limits.years+' ans'}</b>
          {license==='exclusive'?<React.Fragment><span className="text-gray-400">Exclusivité</span><b className="text-right text-pinkNeon">Beat retiré du catalogue</b></React.Fragment>:null}
        </div>:null}
      </div>:null}

      {item.type==='vst'?<div className="mb-4 text-xs text-cyanNeon bg-cyanNeon/5 border border-cyanNeon/20 rounded-xl p-3">🔑 Clé unique par achat · 3 machines maximum · partage interdit</div>:null}

      <div className="p-4 rounded-xl bg-obsidian border border-borderDark mb-4">
        <p className="text-xs font-bold text-white mb-2">Paiement CCP / BaridiMob</p>
        {seller&&seller.rip?<React.Fragment><p className="font-mono text-greenPro font-bold select-all">{seller.rip}</p><p className="text-xs text-gray-400 mt-1">Bénéficiaire : {seller.name}</p></React.Fragment>:<p className="text-xs text-yellow-400">Le vendeur n'a pas renseigné son CCP.</p>}
        <p className="text-[10px] text-gray-500 mt-2">Commission plateforme : {rate}% prélevée sur la part du vendeur.</p>
      </div>

      {needsLegal?<div className="p-4 mb-4 rounded-xl bg-pinkNeon/5 border border-pinkNeon/30">
        <label className="text-xs font-bold text-pinkNeon block mb-1">Nom légal complet obligatoire</label>
        <p className="text-[11px] text-gray-400 mb-2">Pour une Exclusive, les deux parties doivent figurer sur le contrat. Ton nom ne sera pas public.</p>
        <input value={buyerLegal} maxLength="80" onChange={function(e){setBuyerLegal(e.target.value);}} placeholder="Nom et prénom selon ta pièce d'identité" className="w-full bg-obsidian border border-pinkNeon/30 rounded-xl p-3 text-sm text-white"/>
        {seller&&!sellerReady?<p className="text-[11px] text-red-400 mt-2">Le producteur doit aussi renseigner son nom légal avant de vendre cette Exclusive.</p>:null}
      </div>:null}

      <div className="mb-4"><label className="text-xs font-bold block mb-1">Capture du paiement · 5 Mo maximum</label>
        <input type="file" accept="image/*" onChange={function(e){setProof(e.target.files[0]||null);}} className="w-full text-xs text-gray-400"/></div>

      <label className="flex items-start gap-3 p-3 mb-4 bg-obsidian rounded-xl border border-borderDark cursor-pointer">
        <input type="checkbox" checked={accepted} onChange={function(e){setAccepted(e.target.checked);}} className="mt-1 accent-goldAccent"/>
        <span className="text-[11px] text-gray-300">J'ai lu les limites affichées et j'accepte la licence <b className="text-white">{LICENSE_NAMES[license]}</b> et les <a href="infos.html#cgu" target="_blank" className="text-goldAccent underline">CGU</a>. Mon acceptation sera horodatée.</span>
      </label>

      <button onClick={send} disabled={busy||!ready} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl gg disabled:opacity-40">
        {busy?'ENVOI...':'ENVOYER LA COMMANDE'}
      </button>
      <p className="text-[10px] text-gray-500 text-center mt-2">Le contrat PDF est généré après validation du paiement par l'administration.</p>
    </div>
  </div>;
}

/* ---------- LECTEUR ---------- */

      </div>
      <div className="flex items-center gap-3">
        <button onClick={props.toggleMute}><Icon name={props.muted?'mute':'volume'} size={18}/></button>
        <input type="range" min="0" max="1" step="0.1" value={props.muted?0:props.volume} onChange={props.setVolume} className="w-16 hidden md:block"/>
        <button onClick={function(){props.play(t);}} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center"><Icon name={props.playing?'pause':'play'} size={20}/></button>
      </div>
      <div className="w-1/3 flex justify-end"><button onClick={function(){props.buy(t);}} className="bg-goldAccent text-black px-3 py-2 rounded-xl text-xs font-bold">Acheter</button></div>
    </div>
  </div>;
}

/* ---------- APP ---------- */
function App(){
  const [loading,setLoading]=React.useState(true);
  const [session,setSession]=React.useState(null);
  const [profile,setProfile]=React.useState(null);
  const [tracks,setTracks]=React.useState([]);
  const [producers,setProducers]=React.useState([]);
  const [purchases,setPurchases]=React.useState([]);
  const [myOrders,setMyOrders]=React.useState([]);
  const [adminOrders,setAdminOrders]=React.useState([]);
  const [withdrawals,setWithdrawals]=React.useState([]);
  const [notifications,setNotifications]=React.useState([]);
  const [followers,setFollowers]=React.useState(0);
  const [messageUnread,setMessageUnread]=React.useState(0);
  const [toasts,setToasts]=React.useState([]);
  const [view,setViewRaw]=React.useState('home');
  const [buyItem,setBuyItem]=React.useState(null);
  const [producerId,setProducerId]=React.useState(null);
  const [chatPeer,setChatPeer]=React.useState(null);
  const [chatName,setChatName]=React.useState('');
  const [current,setCurrent]=React.useState(null);
  const [playing,setPlaying]=React.useState(false);
  const [progress,setProgress]=React.useState(0);
  const [duration,setDuration]=React.useState(0);
  const [currentTime,setCurrentTime]=React.useState(0);
  const [volume,setVolume]=React.useState(1);
  const [muted,setMuted]=React.useState(false);
  const audioRef=React.useRef(null);
  if(!audioRef.current)audioRef.current=new Audio();

  function setView(v){setViewRaw(v);window.scrollTo({top:0,behavior:'smooth'});}
  function toast(message,type){
    const id=Date.now()+Math.random();
    setToasts(function(old){return old.concat([{id:id,message:message,type:type||'success'}]);});
    setTimeout(function(){setToasts(function(old){return old.filter(function(x){return x.id!==id;});});},4000);
  }
  function openProducer(id){
    if(!id)return;
    setProducerId(id);setViewRaw('producer');window.scrollTo({top:0,behavior:'smooth'});
  }
  function openChat(id,name){
    setChatPeer(id);setChatName(name||'');setView('messages');
  }
  async function copy(text){
    try{await navigator.clipboard.writeText(text);toast('Copié !');}
    catch(e){toast('La copie automatique n’est pas disponible. Sélectionne le texte.','error');}
  }
  function pdf(no){downloadContract(no,toast);}
  function share(){copy(window.location.href);}

  React.useEffect(function(){
    let alive=true;
    async function init(){
      const result=await sb.auth.getSession();
      if(!alive)return;
      const s=result.data.session;
      setSession(s);
      if(s){
        loadProfile(s.user.id);
        loadPurchases(s.user.id);
        loadMyOrders(s.user.id);
        loadNotifications(s.user.id);
        loadFollowers(s.user.id);
        loadMessageUnread();
      }
      await loadTracks();
      if(alive)setLoading(false);
    }
    init();

    const auth=sb.auth.onAuthStateChange(function(event,s){
      setSession(s);
      if(s){
        loadProfile(s.user.id);
        loadPurchases(s.user.id);
        loadMyOrders(s.user.id);
        loadNotifications(s.user.id);
        loadFollowers(s.user.id);
        loadMessageUnread();
      }else{
        setProfile(null);setPurchases([]);setMyOrders([]);setAdminOrders([]);
        setNotifications([]);setProducers([]);
      }
    });

    const audio=audioRef.current;
    function ended(){setPlaying(false);setProgress(0);}
    function timeupdate(){setCurrentTime(audio.currentTime);setProgress((audio.currentTime/audio.duration)*100||0);}
    function metadata(){setDuration(audio.duration);}
    function audioError(){if(audio.src){setPlaying(false);toast('Impossible de lire ce fichier audio.','error');}}
    audio.addEventListener('ended',ended);
    audio.addEventListener('timeupdate',timeupdate);
    audio.addEventListener('loadedmetadata',metadata);
    audio.addEventListener('error',audioError);

    return function(){
      alive=false;
      auth.data.subscription.unsubscribe();
      audio.removeEventListener('ended',ended);
      audio.removeEventListener('timeupdate',timeupdate);
      audio.removeEventListener('loadedmetadata',metadata);
      audio.removeEventListener('error',audioError);
    };
  },[]);

  React.useEffect(function(){
    if(profile&&profile.is_admin){loadAdminOrders();loadWithdrawals();}
  },[profile&&profile.is_admin]);

  React.useEffect(function(){
    if(!session)return;
    const channel=sb.channel('213wave-live-'+session.user.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+session.user.id},function(payload){
        setNotifications(function(old){return [payload.new].concat(old).slice(0,40);});
        toast('🔔 '+payload.new.title);
      })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'recipient_id=eq.'+session.user.id},function(){
        loadMessageUnread();
        if(view!=='messages')toast('💬 Nouveau message');
      })
      .subscribe();
    return function(){sb.removeChannel(channel);};
  },[session&&session.user.id,view]);

  async function loadTracks(){
    const result=await sb.from('tracks').select('*').order('created_at',{ascending:false});
    if(!result.data)return;
    setTracks(result.data);
    const publicResult=await sb.from('public_profiles').select('id,name,avatar_url,bio,instagram');
    if(publicResult.data){
      const counts={};
      result.data.forEach(function(t){
        if(!t.producer_id)return;
        if(!counts[t.producer_id])counts[t.producer_id]={count:0,plays:0,name:t.producer_name};
        counts[t.producer_id].count++;
        counts[t.producer_id].plays+=t.plays||0;
      });
      setProducers(publicResult.data.filter(function(p){return !!counts[p.id];}).map(function(p){
        return Object.assign({},p,counts[p.id]);
      }).sort(function(a,b){return (b.count||0)-(a.count||0);}));
    }
  }

  async function loadProfile(uid,attempt){
    attempt=attempt||0;
    const result=await sb.from('profiles').select('*').eq('id',uid).single();
    if(result.data){setProfile(result.data);return;}
    if(attempt<5)setTimeout(function(){loadProfile(uid,attempt+1);},1200);
    else toast('Impossible de charger le profil. Vérifie la table profiles et ses règles RLS.','error');
  }

  async function loadPurchases(uid){
    const r=await sb.from('sales').select('*').eq('buyer_id',uid).order('created_at',{ascending:false});
    if(!r.data)return;
    const ids=r.data.map(function(x){return x.track_id;}).filter(Boolean);
    const map={};
    if(ids.length){
      const q=await sb.from('tracks').select('id,title,cover_url,type,file_path').in('id',ids);
      (q.data||[]).forEach(function(t){map[t.id]=t;});
    }
    setPurchases(r.data.map(function(x){return Object.assign({},x,{track:map[x.track_id]||null});}));
  }

  async function loadMyOrders(uid){
    const r=await sb.from('orders').select('*').eq('buyer_id',uid).order('created_at',{ascending:false});
    if(!r.data)return;
    const ids=r.data.map(function(x){return x.track_id;});
    const map={};
    if(ids.length){
      const q=await sb.from('tracks').select('id,title,cover_url').in('id',ids);
      (q.data||[]).forEach(function(t){map[t.id]=t;});
    }
    setMyOrders(r.data.map(function(x){return Object.assign({},x,{track:map[x.track_id]||null});}));
  }

  async function loadAdminOrders(){
    const r=await sb.from('orders').select('*').order('created_at',{ascending:false});
    if(!r.data)return;
    const buyerIds=r.data.map(function(x){return x.buyer_id;});
    const trackIds=r.data.map(function(x){return x.track_id;});
    const buyers={},titles={};
    if(buyerIds.length){
      const b=await sb.from('public_profiles').select('id,name').in('id',buyerIds);
      (b.data||[]).forEach(function(x){buyers[x.id]=x.name;});
    }
    if(trackIds.length){
      const t=await sb.from('tracks').select('id,title').in('id',trackIds);
      (t.data||[]).forEach(function(x){titles[x.id]=x.title;});
    }
    setAdminOrders(r.data.map(function(x){return Object.assign({},x,{buyer_name:buyers[x.buyer_id]||'Client',track_title:titles[x.track_id]||'—'});}));
  }

  async function loadWithdrawals(){
    const r=await sb.from('withdrawals').select('*').order('created_at',{ascending:false});
    if(r.data)setWithdrawals(r.data);
  }

  async function loadNotifications(uid){
    const r=await sb.from('notifications').select('*').eq('user_id',uid).order('created_at',{ascending:false}).limit(40);
    if(r.data)setNotifications(r.data);
  }

  async function loadFollowers(uid){
    const r=await sb.rpc('get_producer',{p_id:uid});
    if(r.data)setFollowers(r.data.followers||0);
  }

  async function loadMessageUnread(){
    const r=await sb.rpc('my_conversations');
    if(r.data)setMessageUnread(r.data.reduce(function(sum,c){return sum+Number(c.unread||0);},0));
  }

  async function markNotificationsRead(){
    await sb.rpc('mark_notifications_read');
    setNotifications(function(old){return old.map(function(n){return Object.assign({},n,{is_read:true});});});
  }

  async function logout(){
    audioRef.current.pause();setPlaying(false);
    await sb.auth.signOut();
    setView('home');toast('Déconnecté.');
  }

  async function play(track){
    if(!track.audio_url){toast("Pas d'audio disponible.",'error');return;}
    if(current&&current.id===track.id){
      if(playing){audioRef.current.pause();setPlaying(false);}
      else{audioRef.current.play().catch(function(){});setPlaying(true);}
      return;
    }
    setCurrent(track);
    audioRef.current.src=track.audio_url;
    audioRef.current.volume=muted?0:volume;
    audioRef.current.play().catch(function(){});
    setPlaying(true);
    const r=await sb.rpc('increment_plays',{track_id:track.id});
    if(r.error)console.warn('Compteur d’écoutes :',r.error.message);
    loadTracks();
  }

  function seek(e){
    if(duration>0)audioRef.current.currentTime=(Number(e.target.value)/100)*duration;
  }
  function setAudioVolume(e){
    const v=parseFloat(e.target.value);
    setVolume(v);audioRef.current.volume=v;setMuted(v===0);
  }
  function toggleMute(){
    if(muted){audioRef.current.volume=volume||0.5;setMuted(false);}
    else{audioRef.current.volume=0;setMuted(true);}
  }

  async function submitOrder(item,license,amount,rate,proof,buyerLegal,termsAccepted){
    if(!proof){toast('Ajoute la capture du paiement.','error');return;}
    if(proof.size>5*1024*1024){toast('La capture ne doit pas dépasser 5 Mo.','error');return;}
    if(!termsAccepted){toast('Tu dois accepter les conditions de la licence.','error');return;}
    try{
      const sellerAmount=Math.floor(amount*(1-rate/100));
      const fee=amount-sellerAmount;
      let proofUrl='';
      const path=session.user.id+'-'+Date.now()+'-proof.'+(proof.name.split('.').pop()||'jpg');
      const uploaded=await sb.storage.from('covers').upload(path,proof);
      if(uploaded.error)throw uploaded.error;
      proofUrl=sb.storage.from('covers').getPublicUrl(path).data.publicUrl;

      const result=await sb.from('orders').insert({
        buyer_id:session.user.id,
        seller_id:item.producer_id,
        track_id:item.id,
        product_type:item.type,
        license_type:license,
        amount:amount,
        seller_amount:sellerAmount,
        platform_fee:fee,
        rate_percent:rate,
        proof_url:proofUrl,
        terms_accepted:true,
        accepted_at:new Date().toISOString(),
        buyer_legal_name:license==='exclusive'?buyerLegal:null
      });

      if(result.error)throw result.error;
      toast('Commande envoyée. Le PDF sera disponible après validation du paiement.');
      setBuyItem(null);
      loadMyOrders(session.user.id);
      if(profile&&profile.is_admin)loadAdminOrders();
    }catch(error){toast(error.message||'Impossible d’envoyer la commande.','error');}
  }

  async function validateOrder(id){
    if(!confirm('As-tu vérifié que le paiement est réellement arrivé ?'))return;
    const r=await sb.rpc('validate_order',{p_order_id:id,p_admin_id:session.user.id});
    if(r.error){toast(r.error.message,'error');return;}
    if(r.data&&r.data.ok){
      toast('Commande validée · contrat '+r.data.contract);
      loadAdminOrders();loadTracks();loadPurchases(session.user.id);loadMyOrders(session.user.id);
    }else toast((r.data&&r.data.msg)||'La commande n’a pas été livrée.','error');
  }

  async function refuseOrder(id){
    const reason=prompt('Motif du refus :');
    if(reason===null)return;
    const r=await sb.rpc('refuse_order',{p_order_id:id,p_reason:reason||'Paiement non vérifié'});
    if(r.error){toast(r.error.message,'error');return;}
    toast('Commande refusée.');loadAdminOrders();
  }

  async function payWithdrawal(id){
    if(!confirm('As-tu bien effectué le virement au vendeur ?'))return;
    const r=await sb.rpc('pay_withdrawal',{p_id:id});
    if(r.error){toast(r.error.message,'error');return;}
    toast('Retrait marqué comme payé.');loadWithdrawals();
  }

  async function requestWithdrawal(amount){
    const value=parseInt(amount,10);
    if(!value){toast('Montant invalide.','error');return;}
    const r=await sb.rpc('request_withdrawal',{p_amount:value});
    if(r.error){toast(r.error.message,'error');return;}
    toast('Demande de retrait envoyée.');loadProfile(session.user.id);loadWithdrawals();
  }

  async function downloadVst(p){
    if(!p.track||!p.track.file_path){toast('Fichier indisponible.','error');return;}
    const r=await sb.storage.from('vst-files').createSignedUrl(p.track.file_path,120,{download:true});
    if(r.error){toast(r.error.message,'error');return;}
    window.open(r.data.signedUrl,'_blank');
  }

  async function saveProfile(details){
    try{
      let avatarUrl=profile.avatar_url;
      if(details.avatar){
        if(details.avatar.size>5*1024*1024)throw new Error('Photo : maximum 5 Mo.');
        const fileName=profile.id+'-'+Date.now()+'.'+(details.avatar.name.split('.').pop()||'jpg');
        const upload=await sb.storage.from('avatars').upload(fileName,details.avatar,{upsert:true});
        if(upload.error)throw upload.error;
        avatarUrl=sb.storage.from('avatars').getPublicUrl(fileName).data.publicUrl;
      }
      const result=await sb.from('profiles').update({
        name:details.name,
        legal_name:details.legal_name.trim()||null,
        rip:details.rip,
        bio:details.bio,
        instagram:details.instagram,
        avatar_url:avatarUrl
      }).eq('id',profile.id).select().single();

      if(result.error)throw result.error;
      setProfile(result.data);toast('Profil sauvegardé !');setView('dashboard');
    }catch(error){toast(error.message,'error');}
  }

  async function uploadTrack(d){
    try{
      if(!d.title.trim())throw new Error('Le titre est obligatoire.');
      if(d.type==='vst'&&!d.file)throw new Error('Ajoute le fichier du plugin VST.');
      if(d.file&&d.file.size>50*1024*1024)throw new Error('Fichier trop lourd : 50 Mo maximum.');
      if(d.cover&&d.cover.size>5*1024*1024)throw new Error('Pochette trop lourde : 5 Mo maximum.');
      if(d.type==='beat'&&(Number(d.bpm)<40||Number(d.bpm)>300))throw new Error('Le BPM doit être entre 40 et 300.');

      let coverUrl=DC,audioUrl='',filePath=null,fileHash=null;
      if(d.cover){
        const coverName=profile.id+'-'+Date.now()+'-cover.'+(d.cover.name.split('.').pop()||'jpg');
        const upCover=await sb.storage.from('covers').upload(coverName,d.cover);
        if(upCover.error)throw upCover.error;
        coverUrl=sb.storage.from('covers').getPublicUrl(coverName).data.publicUrl;
      }
      if(d.file){
        fileHash=await hashFile(d.file);
        const safeName=d.file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        if(d.type==='vst'){
          filePath=profile.id+'/'+Date.now()+'-'+safeName;
          const up=await sb.storage.from('vst-files').upload(filePath,d.file);
          if(up.error)throw new Error('Upload VST échoué : '+up.error.message);
        }else{
          const audioName=profile.id+'-'+Date.now()+'-audio.'+(d.file.name.split('.').pop()||'mp3');
          const up=await sb.storage.from('audio').upload(audioName,d.file);
          if(up.error)throw new Error('Upload audio échoué : '+up.error.message);
          audioUrl=sb.storage.from('audio').getPublicUrl(audioName).data.publicUrl;
        }
      }

      const row={
        title:d.title.trim(),
        type:d.type,
        genre:d.genre,
        bpm:parseInt(d.bpm,10)||140,
        key:d.key,
        producer_id:profile.id,
        producer_name:profile.name,
        cover_url:coverUrl,
        audio_url:audioUrl,
        price_mp3:parseInt(d.p1,10)||0,
        price_wav:parseInt(d.p2,10)||0,
        price_stems:parseInt(d.p3,10)||0,
        price_exclusive:parseInt(d.p4,10)||0,
        description:d.description.trim()||(d.type==='vst'?'Plugin VST':'Beat '+d.genre)
      };
      if(filePath)row.file_path=filePath;
      if(fileHash)row.file_hash=fileHash;
      if(d.limits)row.limits=d.limits;

      const result=await sb.from('tracks').insert(row);
      if(result.error)throw result.error;
      toast(fileHash?'Publié ! Empreinte SHA-256 enregistrée.':'Publié avec succès !');
      await loadTracks();
      setView('dashboard');
      return true;
    }catch(error){toast(error.message||'Publication impossible.','error');return false;}
  }

  async function removeTrack(id){
    if(!confirm('Supprimer cette publication ?'))return;
    const r=await sb.from('tracks').delete().eq('id',id);
    if(r.error){toast(r.error.code==='23503'?'Ce produit a déjà une vente et ne peut plus être supprimé.':r.error.message,'error');return;}
    toast('Publication supprimée.');loadTracks();
  }

  function openBuy(item){
    if(!session){toast('Connecte-toi pour acheter.','error');return;}
    setBuyItem(item);
  }

  async function share(){
    try{await navigator.clipboard.writeText(window.location.href);toast('Lien copié !');}
    catch(e){toast('Copie le lien depuis la barre d’adresse.','error');}
  }

  if(loading)return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;

  if(!session)return <React.Fragment>
    <Toasts items={toasts} remove={function(id){setToasts(function(old){return old.filter(function(t){return t.id!==id;});});}}/>
    <AuthPage toast={toast}/>
  </React.Fragment>;

  if(!profile)return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;

  const myKeys=purchases.filter(function(p){return p.license_type==='vst'&&p.vst_key;});
  const pendingCount=adminOrders.filter(function(o){return o.status==='pending';}).length+
    withdrawals.filter(function(w){return w.status==='pending';}).length;
  const unread=notifications.filter(function(n){return !n.is_read;}).length;

  return <div className="relative">
    <Toasts items={toasts} remove={function(id){setToasts(function(old){return old.filter(function(t){return t.id!==id;});});}}/>
    <NavBar view={view} setView={setView} profile={profile} pending={pendingCount}
      notifications={notifications} unread={unread} markRead={markNotificationsRead}
      msgUnread={messageUnread} openProducer={openProducer} logout={logout}/>
    <MobileNav view={view} setView={setView} player={!!current}/>

    <main className="pt-28 pb-10 px-4 md:px-6 max-w-7xl mx-auto">
      {view!=='home'?<button onClick={function(){setView('home');}} className="mb-6 flex items-center gap-2 text-sm font-bold text-gray-400 hover:text-white"><Icon name="back" size={16}/>Retour</button>:null}

      {view==='home'?<HomeView setView={setView} producers={producers} openProducer={openProducer}/>:null}
      {view==='artists'?<ArtistsView producers={producers} openProducer={openProducer}/>:null}
      {view==='beats'?<BeatsView tracks={tracks} producers={producers} current={current} playing={playing} play={play} buy={openBuy} openProducer={openProducer}/>:null}
      {view==='vsts'?<VstsView tracks={tracks} keys={myKeys} buy={openBuy} setView={setView} openProducer={openProducer}/>:null}
      {view==='producer'&&producerId?<ProducerPage id={producerId} me={profile.id} tracks={tracks} current={current} playing={playing} play={play} buy={openBuy} toast={toast} setView={setView} share={share} openChat={openChat}/>:null}
      {view==='me'?<ProducerPage id={profile.id} me={profile.id} tracks={tracks} current={current} playing={playing} play={play} buy={openBuy} toast={toast} setView={setView} share={share} openChat={openChat}/>:null}
      {view==='dashboard'?<DashboardView profile={profile} email={session.user.email} tracks={tracks} followers={followers} setView={setView} openProducer={openProducer} withdraw={requestWithdrawal} remove={removeTrack} pdf={pdf}/>:null}
      {view==='upload'?<UploadView upload={uploadTrack}/>:null}
      {view==='settings'?<SettingsView profile={profile} save={saveProfile}/>:null}
      {view==='myorders'?<OrdersView orders={myOrders} pdf={pdf}/>:null}
      {view==='keys'?<KeysView purchases={purchases} pdf={pdf} copy={copy} download={downloadVst}/>:null}
      {view==='messages'?<MessagesView userId={session.user.id} initialPeer={chatPeer} initialName={chatName} toast={toast} openProducer={openProducer} refreshUnread={loadMessageUnread}/>:null}
      {view==='verify'?<VerifyView/>:null}
      {view==='admin'&&profile.is_admin?<AdminView orders={adminOrders} withdrawals={withdrawals} validate={validateOrder} refuse={refuseOrder} payWithdrawal={payWithdrawal} pdf={pdf}/>:null}
    </main>

    {buyItem?<BuyModal item={buyItem} close={function(){setBuyItem(null);}} submit={submitOrder}/>:null}
    {current?<Player track={current} playing={playing} play={play} progress={progress} duration={duration} time={currentTime} seek={seek} volume={volume} muted={muted} setVolume={setAudioVolume} toggleMute={toggleMute} buy={openBuy} openProducer={openProducer}/>:null}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
