<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YANrecords | Premium VST & Beatstore 🇩🇿</title>
    <!-- Tailwind CSS, React 18, Babel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              obsidian: '#050508',
              cardDark: '#131520',
              borderDark: '#222638',
              cyanNeon: '#00f0ff',
              goldAccent: '#e2b053',
              pinkNeon: '#ff007f',
              greenPro: '#10b981'
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #050508; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
      .glass { background: rgba(19, 21, 32, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(34, 38, 56, 0.8); }
      .glass-card { background: linear-gradient(145deg, rgba(20, 22, 35, 0.9), rgba(10, 11, 18, 0.9)); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); }
      .text-gradient-gold { background: linear-gradient(to right, #e2b053, #fff176); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .text-gradient-cyan { background: linear-gradient(to right, #00f0ff, #0080ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .bg-animated-mesh { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: #050508; }
      .mesh-blob { position: absolute; filter: blur(100px); opacity: 0.35; border-radius: 50%; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #050508; }
      ::-webkit-scrollbar-thumb { background: #222638; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen pb-32">

    <div class="bg-animated-mesh">
        <div class="mesh-blob bg-blue-900 w-[500px] h-[500px] top-[-10%] left-[-10%]"></div>
        <div class="mesh-blob bg-purple-900 w-[600px] h-[600px] bottom-[-20%] right-[-10%]"></div>
        <div class="mesh-blob bg-teal-900/30 w-[400px] h-[400px] top-[40%] left-[40%]"></div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        // ===== INITIALISATION SUPABASE =====
        const SUPABASE_URL = 'https://xyz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJ...'; 
        const supabase = (window.supabase && !SUPABASE_URL.includes('xyz.supabase.co')) 
          ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
          : null;

        // Générateur de clés VST authentiques
        function generateRealVstKey() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let part1 = '';
            for (let i = 0; i < 4; i++) part1 += chars.charAt(Math.floor(Math.random() * chars.length));
            let hash = 0;
            for (let i = 0; i < part1.length; i++) hash += part1.charCodeAt(i) * (i + 5);
            let part2 = hash.toString(16).toUpperCase().padStart(4, '0').slice(-4);
            return `SM2-${part1}-${part2}`;
        }

        // Composant d'icônes SVG intégrées
        const Icon = ({ name, className = "w-5 h-5" }) => {
          const icons = {
            play: <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>,
            pause: <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>,
            search: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            upload: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
            user: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            logout: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            dashboard: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
            arrowLeft: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
            x: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            trash: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            dollar: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
            activity: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          };
          return icons[name] || null;
        };

        const INITIAL_TRACKS = [
          { 
            id: 'vst-1', 
            title: 'SmartMaster V2 Pro', 
            type: 'vst', 
            category: 'Mastering', 
            price: 6500, 
            priceMp3: 6500,
            cover: 'https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=800&q=80', 
            audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
            desc: 'Processeur de mastering intelligent 15s avec Resonance Killer 3 Bandes',
            producer: 'YANrecords',
            isSold: false
          },
          { 
            id: 'vst-2', 
            title: 'ChopArcade V2', 
            type: 'vst', 
            category: 'Sampler', 
            price: 4500, 
            priceMp3: 4500,
            cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&q=80', 
            audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3',
            desc: 'Auto-slicer 16 Chops Chromatique avec Mode Gate',
            producer: 'YANrecords',
            isSold: false
          },
          { 
            id: 'vst-3', 
            title: 'PunchClipper V2.1', 
            type: 'vst', 
            category: 'Dynamics', 
            price: 3500, 
            priceMp3: 3500,
            cover: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&q=80', 
            audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3',
            desc: 'Soft Clipper Analogique pour Kick, 808 & Voix',
            producer: 'YANrecords',
            isSold: false
          },
          { 
            id: 'beat-1', 
            title: 'Marseille Vibes', 
            type: 'beat', 
            bpm: 130, 
            key: 'Am', 
            genre: 'Jul Type', 
            producer: 'Slima Beatz', 
            priceMp3: 2000, 
            priceWav: 4000, 
            priceStems: 8000, 
            priceExclusive: 25000, 
            cover: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&q=80', 
            audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3',
            isSold: false,
            plays: 1240
          },
          { 
            id: 'beat-2', 
            title: 'Algiers Drill', 
            type: 'beat', 
            bpm: 142, 
            key: 'C#m', 
            genre: 'Drill', 
            producer: 'YANrecords', 
            priceMp3: 2500, 
            priceWav: 5000, 
            priceStems: 10000, 
            priceExclusive: 35000, 
            cover: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80', 
            audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3',
            isSold: true,
            plays: 3450
          }
        ];

        // Profil connecté par défaut pour tests immédiats
        const DEFAULT_USER = {
          id: 'ceo-user-1',
          name: 'Yanis (CEO)',
          email: 'yanis.records@gmail.com',
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80',
          balance: 84500,
          plays: 18920
        };

        function App() {
          const [view, setView] = React.useState('home'); // 'home', 'vsts', 'beats', 'dashboard', 'upload'
          const [tracks, setTracks] = React.useState(INITIAL_TRACKS);
          const [currentTrack, setCurrentTrack] = React.useState(null);
          const [isPlaying, setIsPlaying] = React.useState(false);
          const [selectedLicenseTrack, setSelectedLicenseTrack] = React.useState(null);
          const [selectedLicenseType, setSelectedLicenseType] = React.useState('mp3');
          const [showAuthModal, setShowAuthModal] = React.useState(false);
          const [currentUser, setCurrentUser] = React.useState(DEFAULT_USER);
          const [purchasedKey, setPurchasedKey] = React.useState(null);
          const [searchQuery, setSearchQuery] = React.useState('');

          // Form Upload States
          const [uploadTitle, setUploadTitle] = React.useState('');
          const [uploadType, setUploadType] = React.useState('beat');
          const [uploadGenre, setUploadGenre] = React.useState('Drill');
          const [uploadBpm, setUploadBpm] = React.useState(140);
          const [uploadKey, setUploadKey] = React.useState('C Minor');
          const [priceMp3, setPriceMp3] = React.useState(2000);
          const [priceWav, setPriceWav] = React.useState(4000);
          const [priceStems, setPriceStems] = React.useState(8000);
          const [priceExclusive, setPriceExclusive] = React.useState(25000);
          const [coverFile, setCoverFile] = React.useState(null);
          const [audioFile, setAudioFile] = React.useState(null);
          const [isUploading, setIsUploading] = React.useState(false);

          const audioRef = React.useRef(new Audio());

          React.useEffect(() => {
            const savedUser = localStorage.getItem('yanrecords_user');
            if (savedUser) {
              try { setCurrentUser(JSON.parse(savedUser)); } catch (e) {}
            }
          }, []);

          const handleGoogleLogin = () => {
            const user = {
              id: 'user-ceo-1',
              name: 'Yanis (CEO)',
              email: 'yanis.records@gmail.com',
              avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80',
              balance: 62500,
              plays: 14890
            };
            localStorage.setItem('yanrecords_user', JSON.stringify(user));
            setCurrentUser(user);
            setShowAuthModal(false);
          };

          const handleLogout = () => {
            localStorage.removeItem('yanrecords_user');
            setCurrentUser(null);
            setView('home');
          };

          const togglePlay = (track) => {
            if (currentTrack?.id === track.id) {
              if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
              else { audioRef.current.play(); setIsPlaying(true); }
            } else {
              setCurrentTrack(track);
              audioRef.current.src = track.audio;
              audioRef.current.play();
              setIsPlaying(true);
              setTracks(prev => prev.map(t => t.id === track.id ? { ...t, plays: (t.plays || 0) + 1 } : t));
            }
          };

          const handlePurchase = (item) => {
            if (item.type === 'vst') {
              setPurchasedKey(generateRealVstKey());
            } else {
              if (selectedLicenseType === 'exclusive') {
                setTracks(prev => prev.map(t => t.id === item.id ? { ...t, isSold: true } : t));
                alert(`LICENCE EXCLUSIVE ACHETÉE ! Le beat "${item.title}" est maintenant VENDU et retiré du marché !`);
              } else {
                alert(`Paiement confirmé ! Votre fichier audio (${selectedLicenseType.toUpperCase()}) et votre contrat PDF sont prêts.`);
              }
              setSelectedLicenseTrack(null);
            }
          };

          const handleDeleteTrack = (id) => {
            if (confirm("Voulez-vous vraiment supprimer cette création de la plateforme ?")) {
              setTracks(prev => prev.filter(t => t.id !== id));
            }
          };

          const handleUploadSubmit = (e) => {
            e.preventDefault();
            const producerName = currentUser ? currentUser.name : 'YANrecords';

            const newTrack = {
              id: `track-${Date.now()}`,
              title: uploadTitle || 'Nouvelle Création',
              producer: producerName,
              bpm: uploadBpm,
              key: uploadKey,
              genre: uploadGenre,
              type: uploadType,
              price: parseInt(priceMp3),
              priceMp3: parseInt(priceMp3),
              priceWav: parseInt(priceWav),
              priceStems: parseInt(priceStems),
              priceExclusive: parseInt(priceExclusive),
              cover: coverFile ? URL.createObjectURL(coverFile) : 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80',
              audio: audioFile ? URL.createObjectURL(audioFile) : 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
              desc: uploadType === 'vst' ? 'Plugin VST3 officiel' : `Beat ${uploadGenre}`,
              isSold: false,
              plays: 0
            };

            setTracks(prev => [newTrack, ...prev]);
            alert("Publié en direct avec succès sur YANrecords !");
            setView('dashboard');
            setUploadTitle('');
          };

          const filteredTracks = tracks.filter(t => {
            if (searchQuery) {
              return t.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                     t.genre.toLowerCase().includes(searchQuery.toLowerCase()) ||
                     t.producer.toLowerCase().includes(searchQuery.toLowerCase());
            }
            return true;
          });

          return (
            <div className="relative">
              {/* ===== NAVBAR ===== */}
              <nav className="glass fixed top-0 w-full z-50 px-6 py-4 flex items-center justify-between">
                <div className="flex items-center gap-4 cursor-pointer" onClick={() => setView('home')}>
                  <div className="w-10 h-10 rounded-lg bg-black border border-goldAccent/50 flex items-center justify-center font-black text-xl text-goldAccent shadow-lg">
                    Y
                  </div>
                  <h1 className="text-2xl font-black tracking-widest text-white">YAN<span className="text-gradient-gold">RECORDS</span></h1>
                </div>

                <div className="hidden md:flex bg-black/40 border border-borderDark rounded-full p-1">
                  <button onClick={() => setView('home')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'home' ? 'bg-white text-black' : 'text-gray-400 hover:text-white'}`}>Accueil</button>
                  <button onClick={() => setView('vsts')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'vsts' ? 'bg-cyanNeon text-black' : 'text-gray-400 hover:text-white'}`}>Plugins VST</button>
                  <button onClick={() => setView('beats')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'beats' ? 'bg-goldAccent text-black' : 'text-gray-400 hover:text-white'}`}>Beatstore</button>
                  <button onClick={() => setView('dashboard')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'dashboard' ? 'bg-pinkNeon text-white' : 'text-gray-400 hover:text-white'}`}>Dashboard Vendeur</button>
                </div>

                <div className="flex items-center gap-3">
                  <button 
                    onClick={() => setView('upload')}
                    className="hidden sm:flex items-center gap-2 bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-bold px-4 py-2 rounded-xl text-xs hover:opacity-90 cyan-glow"
                  >
                    <Icon name="upload" className="w-4 h-4" />
                    <span>Poster Beat / VST</span>
                  </button>

                  {currentUser ? (
                    <div className="flex items-center gap-2 bg-cardDark border border-borderDark px-3 py-1.5 rounded-xl cursor-pointer" onClick={() => setView('dashboard')}>
                      <img src={currentUser.avatar} className="w-7 h-7 rounded-full object-cover" />
                      <span className="text-xs font-bold text-white hidden md:block">{currentUser.name}</span>
                      <button onClick={(e) => { e.stopPropagation(); handleLogout(); }} className="text-gray-400 hover:text-red-400 ml-1">
                        <Icon name="logout" className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => setShowAuthModal(true)} className="bg-cardDark border border-borderDark text-white hover:border-cyanNeon px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                      <Icon name="user" className="w-4 h-4" />
                      <span>Connexion / Gmail</span>
                    </button>
                  )}
                  <div className="text-xs font-bold bg-cardDark border border-borderDark px-3 py-2 rounded-xl text-goldAccent hidden md:block">🇩🇿 DZD</div>
                </div>
              </nav>

              {/* CONTAINER PRINCIPAL */}
              <div className="pt-28 pb-10 px-6 max-w-7xl mx-auto">

                {/* BOUTON RETOUR A L'ACCUEIL */}
                {view !== 'home' && (
                  <button onClick={() => setView('home')} className="mb-6 flex items-center gap-2 text-gray-400 hover:text-white transition text-sm font-bold">
                    <Icon name="arrowLeft" className="w-4 h-4" />
                    <span>Retour à l'accueil</span>
                  </button>
                )}

                {/* ===== VIEW: HOME ===== */}
                {view === 'home' && (
                  <div>
                    <div className="text-center mt-8 mb-16">
                      <span className="inline-block bg-cyanNeon/10 border border-cyanNeon/30 text-cyanNeon text-xs font-bold px-3 py-1 rounded-full mb-4">
                        🇩🇿 Le 1er Marketplace de Beatmaking en Algérie
                      </span>
                      <h2 className="text-4xl md:text-6xl font-black mb-4 tracking-tight leading-tight">
                        BOOSTEZ VOS PRODS AVEC NOS <br/>
                        <span className="text-gradient-cyan">VSTS & BEATS PRO</span>
                      </h2>
                      <p className="text-gray-400 max-w-2xl mx-auto text-sm md:text-base mb-8">
                        Instrumentales uniques avec contrat de licence PDF + Plugins VST3 avec clé d'activation automatique.
                      </p>

                      <div className="flex justify-center items-center bg-obsidian/80 border border-borderDark rounded-2xl px-4 py-3 max-w-lg mx-auto mb-10">
                        <Icon name="search" className="w-5 h-5 text-gray-400 mr-3" />
                        <input 
                          type="text" 
                          placeholder="Chercher un beat, VST, genre, BPM..." 
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          className="bg-transparent text-sm text-white w-full outline-none"
                        />
                      </div>
                    </div>

                    {/* GRILLE VST */}
                    <section className="mb-16">
                      <h3 className="text-2xl font-bold mb-6 text-white border-l-4 border-cyanNeon pl-4">PLUGINS VST3 OFFICIELS</h3>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {filteredTracks.filter(t => t.type === 'vst').map(vst => (
                          <div key={vst.id} className="glass-card rounded-2xl p-5 flex flex-col justify-between relative border-cyanNeon/30">
                            <span className="absolute top-3 right-3 bg-cyanNeon text-black text-[10px] font-black px-2 py-1 rounded">VST3 WINDOWS</span>
                            <img src={vst.cover} className="w-full h-44 object-cover rounded-xl mb-4" />
                            <h4 className="text-xl font-black text-white">{vst.title}</h4>
                            
                            {/* AUTEUR VISIBLE ICI */}
                            <p className="text-xs text-goldAccent font-bold mt-1">Par {vst.producer}</p>
                            
                            <p className="text-xs text-gray-400 my-2 flex-grow">{vst.desc}</p>
                            <div className="flex items-center justify-between pt-4 border-t border-borderDark mt-2">
                              <span className="text-lg font-black text-goldAccent">{vst.price.toLocaleString()} DZD</span>
                              <button onClick={() => { setSelectedLicenseTrack(vst); setPurchasedKey(null); }} className="bg-cyanNeon text-black font-bold px-4 py-2 rounded-xl text-xs hover:opacity-90">
                                Acheter Clé VST
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </section>

                    {/* BEATSTORE */}
                    <section>
                      <h3 className="text-2xl font-bold mb-6 text-white border-l-4 border-goldAccent pl-4">BEATSTORE INSTRUMENTALES</h3>
                      <div className="glass-card rounded-2xl p-4">
                        <div className="space-y-2">
                          {filteredTracks.filter(t => t.type === 'beat').map(beat => (
                            <div key={beat.id} className={`grid grid-cols-1 md:grid-cols-12 gap-4 items-center p-3 rounded-xl transition ${beat.isSold ? 'opacity-50 bg-black/60' : 'hover:bg-white/5'}`}>
                              <div className="col-span-5 flex items-center gap-4">
                                <div className="relative w-12 h-12 rounded-lg overflow-hidden cursor-pointer" onClick={() => !beat.isSold && togglePlay(beat)}>
                                  <img src={beat.cover} className="w-full h-full object-cover" />
                                  {!beat.isSold && (
                                    <div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100">
                                      <Icon name={currentTrack?.id === beat.id && isPlaying ? "pause" : "play"} className="w-5 h-5 text-white" />
                                    </div>
                                  )}
                                </div>
                                <div>
                                  <h4 className="font-bold text-white flex items-center gap-2">
                                    {beat.title}
                                    {beat.isSold && <span className="bg-red-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded">VENDU / SOLD</span>}
                                  </h4>
                                  
                                  {/* AUTEUR VISIBLE ICI */}
                                  <p className="text-xs text-goldAccent font-bold">Par {beat.producer}</p>
                                  <p className="text-[10px] text-gray-400 mt-0.5">{beat.genre}</p>
                                </div>
                              </div>
                              <div className="hidden md:block col-span-2 text-sm text-gray-400">{beat.bpm} BPM • {beat.key}</div>
                              <div className="hidden md:block col-span-2 text-xs text-gray-500">{beat.plays || 0} écoutes</div>
                              <div className="col-span-full md:col-span-3 flex justify-end items-center gap-3">
                                {beat.isSold ? (
                                  <span className="text-xs font-bold text-red-500 bg-red-950/40 border border-red-800/50 px-4 py-2 rounded-xl">EXCLUSIF VENDU</span>
                                ) : (
                                  <button onClick={() => { setSelectedLicenseTrack(beat); setSelectedLicenseType('mp3'); setPurchasedKey(null); }} className="border border-goldAccent text-goldAccent font-bold px-4 py-2 rounded-xl text-xs hover:bg-goldAccent hover:text-black">
                                    Acheter ({beat.priceMp3.toLocaleString()} DZD)
                                  </button>
                                )}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </section>
                  </div>
                )}

                {/* ===== VIEW: VSTS SEULEMENT ===== */}
                {view === 'vsts' && (
                  <section className="mb-16">
                    <h3 className="text-3xl font-black mb-6 text-white border-l-4 border-cyanNeon pl-4">PLUGINS VST3 OFFICIELS</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      {tracks.filter(t => t.type === 'vst').map(vst => (
                        <div key={vst.id} className="glass-card rounded-2xl p-5 flex flex-col justify-between border-cyanNeon/30">
                          <img src={vst.cover} className="w-full h-44 object-cover rounded-xl mb-4" />
                          <h4 className="text-xl font-black text-white">{vst.title}</h4>
                          <p className="text-xs text-goldAccent font-bold mt-1">Par {vst.producer}</p>
                          <p className="text-xs text-gray-400 my-2">{vst.desc}</p>
                          <div className="flex items-center justify-between pt-4 border-t border-borderDark mt-2">
                            <span className="text-lg font-black text-goldAccent">{vst.price.toLocaleString()} DZD</span>
                            <button onClick={() => { setSelectedLicenseTrack(vst); setPurchasedKey(null); }} className="bg-cyanNeon text-black font-bold px-4 py-2 rounded-xl text-xs hover:opacity-90">
                              Acheter Clé VST
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>
                )}

                {/* ===== VIEW: BEATS SEULEMENT ===== */}
                {view === 'beats' && (
                  <section>
                    <h3 className="text-3xl font-black mb-6 text-white border-l-4 border-goldAccent pl-4">BEATSTORE OFFICIEL</h3>
                    <div className="glass-card rounded-2xl p-4">
                      <div className="space-y-2">
                        {tracks.filter(t => t.type === 'beat').map(beat => (
                          <div key={beat.id} className={`grid grid-cols-1 md:grid-cols-12 gap-4 items-center p-3 rounded-xl transition ${beat.isSold ? 'opacity-50 bg-black/60' : 'hover:bg-white/5'}`}>
                            <div className="col-span-5 flex items-center gap-4">
                              <div className="relative w-12 h-12 rounded-lg overflow-hidden cursor-pointer" onClick={() => !beat.isSold && togglePlay(beat)}>
                                <img src={beat.cover} className="w-full h-full object-cover" />
                                {!beat.isSold && (
                                  <div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100">
                                    <Icon name={currentTrack?.id === beat.id && isPlaying ? "pause" : "play"} className="w-5 h-5 text-white" />
                                  </div>
                                )}
                              </div>
                              <div>
                                <h4 className="font-bold text-white flex items-center gap-2">
                                  {beat.title}
                                  {beat.isSold && <span className="bg-red-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded">SOLD</span>}
                                </h4>
                                <p className="text-xs text-goldAccent font-bold">Par {beat.producer}</p>
                                <p className="text-[10px] text-gray-400 mt-0.5">{beat.genre}</p>
                              </div>
                            </div>
                            <div className="hidden md:block col-span-2 text-sm text-gray-400">{beat.bpm} BPM • {beat.key}</div>
                            <div className="hidden md:block col-span-2 text-xs text-gray-500">{beat.plays || 0} écoutes</div>
                            <div className="col-span-full md:col-span-3 flex justify-end items-center gap-3">
                              {beat.isSold ? (
                                <span className="text-xs font-bold text-red-500 border border-red-800/50 px-4 py-2 rounded-xl">EXCLUSIF VENDU</span>
                              ) : (
                                <button onClick={() => { setSelectedLicenseTrack(beat); setSelectedLicenseType('mp3'); setPurchasedKey(null); }} className="border border-goldAccent text-goldAccent font-bold px-4 py-2 rounded-xl text-xs hover:bg-goldAccent hover:text-black">
                                  Acheter ({beat.priceMp3.toLocaleString()} DZD)
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </section>
                )}

                {/* ===== VIEW: DASHBOARD VENDEUR ===== */}
                {view === 'dashboard' && (
                  <div className="space-y-8 animate-fade-in">
                    {currentUser ? (
                      <>
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-cardDark border border-borderDark p-6 rounded-2xl">
                          <div className="flex items-center gap-4">
                            <img src={currentUser.avatar} className="w-16 h-16 rounded-full object-cover border-2 border-goldAccent" />
                            <div>
                              <h2 className="text-2xl font-black text-white">{currentUser.name}</h2>
                              <p className="text-xs text-gray-400">{currentUser.email} • Beatmaker Certifié 🇩🇿</p>
                            </div>
                          </div>
                          <button onClick={() => setView('upload')} className="bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-black px-6 py-3 rounded-xl flex items-center gap-2 cyan-glow">
                            <Icon name="upload" className="w-4 h-4" />
                            <span>Uploader un Beat / VST</span>
                          </button>
                        </div>

                        {/* STATS */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                          <div className="glass-card p-6 rounded-2xl border-cyanNeon/30">
                            <div className="flex justify-between items-center mb-2">
                              <span className="text-xs font-bold text-gray-400">REVENUS TOTAUX</span>
                              <Icon name="dollar" className="w-5 h-5 text-cyanNeon" />
                            </div>
                            <span className="text-3xl font-black text-cyanNeon">{(currentUser.balance || 84500).toLocaleString()} DZD</span>
                          </div>

                          <div className="glass-card p-6 rounded-2xl border-goldAccent/30">
                            <div className="flex justify-between items-center mb-2">
                              <span className="text-xs font-bold text-gray-400">ÉCOUTES TOTALES</span>
                              <Icon name="activity" className="w-5 h-5 text-goldAccent" />
                            </div>
                            <span className="text-3xl font-black text-goldAccent">{(currentUser.plays || 18920).toLocaleString()}</span>
                          </div>

                          <div className="glass-card p-6 rounded-2xl border-pinkNeon/30">
                            <div className="flex justify-between items-center mb-2">
                              <span className="text-xs font-bold text-gray-400">MES CRÉATIONS</span>
                              <Icon name="dashboard" className="w-5 h-5 text-pinkNeon" />
                            </div>
                            <span className="text-3xl font-black text-pinkNeon">{tracks.filter(t => t.producer === currentUser.name || t.producer === 'YANrecords').length}</span>
                          </div>
                        </div>

                        {/* LISTE DES MORCEAUX DU BEATMAKER */}
                        <div className="glass-card rounded-2xl p-6">
                          <h3 className="text-lg font-bold text-white mb-4">Gérer mes beats et VSTs</h3>
                          <div className="space-y-3">
                            {tracks.filter(t => t.producer === currentUser.name || t.producer === 'YANrecords').map(track => (
                              <div key={track.id} className="flex justify-between items-center p-3 rounded-xl bg-obsidian/60 border border-borderDark">
                                <div className="flex items-center gap-4">
                                  <img src={track.cover} className="w-12 h-12 rounded-lg object-cover" />
                                  <div>
                                    <h4 className="font-bold text-white text-sm flex items-center gap-2">
                                      {track.title}
                                      {track.isSold && <span className="bg-red-600 text-white text-[9px] px-1.5 py-0.5 rounded">SOLD</span>}
                                    </h4>
                                    <p className="text-xs text-gray-400">{track.type.toUpperCase()} • {track.genre}</p>
                                  </div>
                                </div>
                                <div className="flex items-center gap-3">
                                  <span className="text-xs font-bold text-goldAccent">{(track.priceMp3 || track.price || 2000).toLocaleString()} DZD</span>
                                  <button onClick={() => handleDeleteTrack(track.id)} className="p-2 bg-red-950/60 border border-red-800 text-red-400 hover:bg-red-600 hover:text-white rounded-lg transition">
                                    <Icon name="trash" className="w-4 h-4" />
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </>
                    ) : (
                      /* SI PAS CONNECTÉ */
                      <div className="glass-card max-w-md mx-auto p-8 rounded-2xl text-center border-cyanNeon/40">
                        <Icon name="user" className="w-12 h-12 text-cyanNeon mx-auto mb-4" />
                        <h3 className="text-2xl font-black text-white mb-2">Espace Vendeur Protégé</h3>
                        <p className="text-xs text-gray-400 mb-6">Connectez-vous avec votre compte Gmail pour accéder à votre Dashboard et uploader vos prods.</p>
                        <button onClick={handleGoogleLogin} className="w-full bg-white text-black font-bold py-3 px-4 rounded-xl flex justify-center items-center gap-3 shadow-lg text-sm">
                          <span>Connexion avec Google (Gmail)</span>
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* ===== VIEW: FORMULAIRE UPLOAD ===== */}
                {view === 'upload' && (
                  <div className="max-w-2xl mx-auto glass-card p-8 rounded-2xl border-goldAccent/40">
                    <h2 className="text-2xl font-black text-white mb-2">Poster une nouvelle création</h2>
                    <p className="text-xs text-gray-400 mb-6">Remplissez les détails et fixez vos prix pour l'Algérie</p>

                    <form onSubmit={handleUploadSubmit} className="space-y-4">
                      <div>
                        <label className="text-xs font-bold text-gray-300 block mb-1">Titre de la prod ou du VST</label>
                        <input type="text" required value={uploadTitle} onChange={(e) => setUploadTitle(e.target.value)} placeholder="ex: Drill Algiers / SmartClipper" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none focus:border-cyanNeon" />
                      </div>

                      <div className="grid grid-cols-3 gap-3">
                        <div>
                          <label className="text-xs font-bold text-gray-300 block mb-1">Type</label>
                          <select value={uploadType} onChange={(e) => setUploadType(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none">
                            <option value="beat">Beat Instrumentale</option>
                            <option value="vst">Plugin VST3 (.exe)</option>
                          </select>
                        </div>
                        <div>
                          <label className="text-xs font-bold text-gray-300 block mb-1">BPM</label>
                          <input type="number" value={uploadBpm} onChange={(e) => setUploadBpm(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none" />
                        </div>
                        <div>
                          <label className="text-xs font-bold text-gray-300 block mb-1">Gamme (Key)</label>
                          <input type="text" value={uploadKey} onChange={(e) => setUploadKey(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none" />
                        </div>
                      </div>

                      {/* CHOIX DES PRIX (Seulement pour les Beats) */}
                      {uploadType === 'beat' ? (
                        <div className="p-4 rounded-xl bg-obsidian/60 border border-borderDark space-y-3">
                          <span className="text-xs font-bold text-goldAccent block uppercase">Configuration des Prix (DZD)</span>
                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="text-[11px] text-gray-400 block">Prix MP3 Lease</label>
                              <input type="number" value={priceMp3} onChange={(e) => setPriceMp3(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-xs text-white" />
                            </div>
                            <div>
                              <label className="text-[11px] text-gray-400 block">Prix WAV Lease</label>
                              <input type="number" value={priceWav} onChange={(e) => setPriceWav(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-xs text-white" />
                            </div>
                            <div>
                              <label className="text-[11px] text-gray-400 block">Prix Stems (Pistes)</label>
                              <input type="number" value={priceStems} onChange={(e) => setPriceStems(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-xs text-white" />
                            </div>
                            <div>
                              <label className="text-[11px] text-gray-400 block">Prix Exclusif (SOLD)</label>
                              <input type="number" value={priceExclusive} onChange={(e) => setPriceExclusive(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-xs text-white" />
                            </div>
                          </div>
                        </div>
                      ) : (
                        <div className="p-4 rounded-xl bg-cyanNeon/10 border border-cyanNeon/30">
                          <label className="text-xs font-bold text-cyanNeon block mb-1">Prix Unique du Logiciel (DZD)</label>
                          <input type="number" value={priceMp3} onChange={(e) => setPriceMp3(e.target.value)} className="w-full bg-cardDark border border-cyanNeon/50 rounded-lg p-2 text-xs text-white" />
                        </div>
                      )}

                      <div>
                        <label className="text-xs font-bold text-gray-300 block mb-1">Pochette (JPG / PNG)</label>
                        <input type="file" accept="image/*" onChange={(e) => setCoverFile(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-cyanNeon file:text-black" />
                      </div>

                      <div>
                        <label className="text-xs font-bold text-gray-300 block mb-1">Fichier Audio (MP3/WAV) ou Installeur VST (.exe)</label>
                        <input type="file" onChange={(e) => setAudioFile(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-goldAccent file:text-black" />
                      </div>

                      <button type="submit" disabled={isUploading} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl gold-glow hover:opacity-90 transition mt-4">
                        {isUploading ? "Upload en cours..." : "PUBLIER EN DIRECT SUR YANRECORDS"}
                      </button>
                    </form>
                  </div>
                )}
              </div>

              {/* MODAL ACHAT */}
              {selectedLicenseTrack && (
                <div className="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="glass-card rounded-2xl max-w-lg w-full p-6 relative">
                    <button onClick={() => setSelectedLicenseTrack(null)} className="absolute top-4 right-4 text-gray-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
                    <h3 className="text-xl font-black text-white mb-4">Achat : {selectedLicenseTrack.title}</h3>

                    {selectedLicenseTrack.type === 'vst' && !purchasedKey && (
                      <div>
                        <div className="p-4 rounded-xl border border-cyanNeon bg-cyanNeon/10 mb-6">
                          <h4 className="font-bold text-white">Licence Complète VST3</h4>
                          <span className="text-xl font-black text-goldAccent block mt-2">{selectedLicenseTrack.priceMp3.toLocaleString()} DZD</span>
                        </div>
                        <button onClick={() => handlePurchase(selectedLicenseTrack)} className="w-full bg-cyanNeon text-black font-black py-3 rounded-xl hover:opacity-90">Payer & Générer la Clé VST</button>
                      </div>
                    )}

                    {selectedLicenseTrack.type === 'vst' && purchasedKey && (
                      <div className="bg-black/80 border border-greenPro rounded-xl p-4 text-center">
                        <span className="text-xs font-bold text-greenPro block mb-2">VOTRE CLÉ VST3 CONFIRMÉE :</span>
                        <input type="text" readOnly value={purchasedKey} className="w-full text-center font-mono text-lg font-bold bg-cardDark border border-greenPro text-white p-2 rounded-lg outline-none select-all" />
                      </div>
                    )}

                    {selectedLicenseTrack.type === 'beat' && (
                      <div className="space-y-3 mb-6">
                        <div onClick={() => setSelectedLicenseType('mp3')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'mp3' ? 'border-goldAccent bg-goldAccent/10' : 'border-borderDark'}`}>
                          <div className="flex justify-between font-bold text-white"><span>MP3 Lease</span><span className="text-goldAccent">{selectedLicenseTrack.priceMp3.toLocaleString()} DZD</span></div>
                        </div>
                        <div onClick={() => setSelectedLicenseType('wav')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'wav' ? 'border-goldAccent bg-goldAccent/10' : 'border-borderDark'}`}>
                          <div className="flex justify-between font-bold text-white"><span>WAV Lease</span><span className="text-goldAccent">{selectedLicenseTrack.priceWav.toLocaleString()} DZD</span></div>
                        </div>
                        <div onClick={() => setSelectedLicenseType('stems')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'stems' ? 'border-goldAccent bg-goldAccent/10' : 'border-borderDark'}`}>
                          <div className="flex justify-between font-bold text-white"><span>Trackout (Stems)</span><span className="text-goldAccent">{selectedLicenseTrack.priceStems.toLocaleString()} DZD</span></div>
                        </div>
                        <div onClick={() => setSelectedLicenseType('exclusive')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'exclusive' ? 'border-red-500 bg-red-500/10' : 'border-borderDark'}`}>
                          <div className="flex justify-between font-bold text-white"><span className="text-red-400">🔥 LICENCE EXCLUSIVE</span><span className="text-goldAccent">{selectedLicenseTrack.priceExclusive.toLocaleString()} DZD</span></div>
                        </div>
                        <button onClick={() => handlePurchase(selectedLicenseTrack)} className="w-full bg-goldAccent text-black font-black py-3 rounded-xl mt-4">Payer {selectedLicenseType === 'exclusive' ? selectedLicenseTrack.priceExclusive.toLocaleString() : selectedLicenseType === 'stems' ? selectedLicenseTrack.priceStems.toLocaleString() : selectedLicenseType === 'wav' ? selectedLicenseTrack.priceWav.toLocaleString() : selectedLicenseTrack.priceMp3.toLocaleString()} DZD</button>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* LECTEUR AUDIO PERSISTANT */}
              {currentTrack && currentTrack.type === 'beat' && (
                <div className="fixed bottom-0 inset-x-0 z-50 glass border-t border-goldAccent/30 px-6 py-3 flex items-center justify-between">
                  <div className="flex items-center gap-4 w-1/4">
                    <img src={currentTrack.cover} className="w-12 h-12 rounded-lg object-cover" />
                    <div className="hidden md:block">
                      <h4 className="font-bold text-sm text-white">{currentTrack.title}</h4>
                      <p className="text-xs text-goldAccent">{currentTrack.producer}</p>
                    </div>
                  </div>
                  <div className="flex-1 flex justify-center"><button onClick={() => togglePlay(currentTrack)} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center"><Icon name={isPlaying ? "pause" : "play"} className="w-5 h-5" /></button></div>
                  <div className="w-1/4 flex justify-end"><button onClick={() => { setSelectedLicenseTrack(currentTrack); setSelectedLicenseType('mp3'); }} className="bg-goldAccent text-black font-bold px-4 py-2 rounded-xl text-xs">Acheter</button></div>
                </div>
              )}

              {/* MODAL CONNEXION GOOGLE */}
              {showAuthModal && (
                <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="glass-card rounded-2xl max-w-sm w-full p-6 text-center relative">
                    <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
                    <h3 className="text-xl font-black text-white mb-2">Rejoindre YANrecords</h3>
                    <p className="text-xs text-gray-400 mb-6">Connectez-vous pour acheter vos VSTs et gérer vos morceaux</p>
                    <button onClick={handleGoogleLogin} className="w-full bg-white text-black font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-100 transition shadow-lg text-sm">
                      <span>Connexion avec Google (Gmail)</span>
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
