      .text-gradient-cyan{background:linear-gradient(135deg,#00f0ff,#0080ff,#00f0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% auto;animation:shimmer 4s linear infinite}

      .bg-animated-mesh{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;background:#050508}
      .mesh-blob{position:absolute;filter:blur(120px);opacity:.3;border-radius:50%;animation:float 20s ease-in-out infinite}
      .mesh-blob:nth-child(2){animation-delay:-7s;animation-duration:25s}
      .mesh-blob:nth-child(3){animation-delay:-14s;animation-duration:30s}
      @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-50px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.9)}}
      ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#050508}::-webkit-scrollbar-thumb{background:#222638;border-radius:4px}
      .dropdown-anim{animation:dropIn .2s ease-out forwards;transform-origin:top right}
      @keyframes dropIn{from{opacity:0;transform:scale(.95) translateY(-10px)}to{opacity:1;transform:scale(1) translateY(0)}}
      .fade-in{animation:fadeIn .4s ease-out forwards}
      @keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
      .glow-cyan{box-shadow:0 0 25px rgba(0,240,255,.35)}
      .glow-gold{box-shadow:0 0 25px rgba(226,176,83,.35)}
      .loader{border:3px solid #222638;border-top:3px solid #00f0ff;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .toast-anim{animation:toastIn .3s ease-out forwards}
      @keyframes toastIn{from{opacity:0;transform:translateX(100px)}to{opacity:1;transform:translateX(0)}}
      input[type=range]{-webkit-appearance:none;background:transparent}
      input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:14px;width:14px;border-radius:50%;background:#00f0ff;margin-top:-5px;cursor:pointer}
      input[type=range]::-webkit-slider-runnable-track{width:100%;height:4px;background:#222638;border-radius:2px}
      .safe-bottom{padding-bottom:env(safe-area-inset-bottom)}

function Toasts({items,onRemove}){
  return <div className="fixed top-20 right-4 z-[200] flex flex-col gap-3 max-w-sm">
    {items.map(t=>(
      <div key={t.id} className="toast-anim glass-card rounded-xl p-4 flex items-center gap-3 border-l-4" style={{borderLeftColor:t.type==='error'?'#ef4444':t.type==='success'?'#10b981':'#00f0ff'}}>
        <div className={`w-8 h-8 rounded-full flex items-center justify-center ${t.type==='error'?'bg-red-500/20 text-red-400':t.type==='success'?'bg-greenPro/20 text-greenPro':'bg-cyanNeon/20 text-cyanNeon'}`}>
          <Icon name={t.type==='error'?'x':t.type==='success'?'check':'activity'} className="w-4 h-4"/>
        </div>
        <p className="text-sm font-bold text-white flex-1">{t.msg}</p>
        <button onClick={()=>onRemove(t.id)} className="text-gray-500 hover:text-white"><Icon name="x" className="w-4 h-4"/></button>
      </div>
    ))}
  </div>;
}

  };

  const handleVolumeChange=(e)=>{const v=parseFloat(e.target.value);setVolume(v);audioRef.current.volume=v;setIsMuted(v===0);};
  const toggleMute=()=>{if(isMuted){audioRef.current.volume=volume||0.5;setIsMuted(false);}else{audioRef.current.volume=0;setIsMuted(true);}};

      let proofUrl='';

      const{error:pe}=await sb.storage.from('covers').upload(pn,orderProof);

        product_type:item.type,license_type:lic,amount,seller_amount:sellerAmt,

              Continuer avec Google

        {showCGU&&<div className="fixed inset-0 z-[150] bg-black/90 backdrop-blur-md flex items-center justify-center p-4"><div className="glass-card rounded-2xl max-w-2xl w-full p-8 max-h-[85vh] flex flex-col"><h3 className="text-2xl font-black text-goldAccent mb-4">CGU YANrecords</h3><div className="flex-1 overflow-y-auto pr-4 space-y-4 text-sm text-gray-300"><p><strong>1.</strong> YANrecords est une marketplace pour beats et VSTs.</p><p><strong>2.</strong> Vous devez être l'auteur original de vos uploads.</p><p><strong>3.</strong> Licence Exclusive = beat retiré du catalogue.</p><p><strong>4.</strong> Commission : 5% beats, 8% VST.</p><p><strong>5.</strong> Chaque clé VST est unique, 3 machines max.</p><p><strong>6.</strong> Paiement par BaridiMob/CCP avec preuve.</p></div><button onClick={()=>{setAcceptCGU(true);setShowCGU(false);}} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl mt-6">J'ACCEPTE</button></div></div>}

          <button onClick={()=>setView('vsts')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view==='vsts'?'bg-cyanNeon text-black':'text-gray-400 hover:text-white'}`}>VSTs</button>

              <span className="text-xs font-bold text-white hidden md:block max-w-[100px] truncate">{profile?.name||'User'}</span>

              {isAdmin()&&<button onClick={()=>{setView('admin');loadAdminOrders(session.user.id);}} className="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-pinkNeon hover:bg-pinkNeon/10"><Icon name="list" className="w-4 h-4"/>Commandes ({pendingOrders.length})</button>}
              <button onClick={()=>setView('settings')} className="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-gray-300 hover:bg-white/10"><Icon name="settings" className="w-4 h-4"/>Paramètres</button>
