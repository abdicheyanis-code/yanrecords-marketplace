            const updateDuration = () => setDuration(audio.duration);
            const onEnd = () => setIsPlaying(false);

            audio.addEventListener('timeupdate', updateTime);
            audio.addEventListener('loadedmetadata', updateDuration);
            audio.addEventListener('ended', onEnd);

            return () => {

              audio.removeEventListener('loadedmetadata', updateDuration);

                              ) : (
                                <button onClick={() => { setSelectedLicenseTrack(beat); setSelectedLicenseType('mp3'); }} className="border border-goldAccent text-goldAccent font-bold px-4 py-2 rounded-xl text-xs hover:bg-goldAccent hover:text-black transition">
                                  {t('buyBeat')} ({beat.priceMp3.toLocaleString()} DZD)
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </section>
                )}

                {/* ===== VIEW: DASHBOARD ===== */}
                {view === 'dashboard' && currentUser && (
                  <div className="space-y-8 fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-cardDark border border-borderDark p-6 rounded-2xl">
                      <div className="flex items-center gap-4">
                        <img src={currentUser.avatar} className="w-16 h-16 rounded-full object-cover border-2 border-goldAccent" />
                        <div><h2 className="text-2xl font-black text-white">{currentUser.name}</h2><p className="text-xs text-gray-400">{currentUser.email} • Beatmaker Certifié 🇩🇿</p></div>
                      </div>
                      <button onClick={() => setView('upload')} className="bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-black px-6 py-3 rounded-xl flex items-center gap-2 glow-cyan">
                        <Icon name="upload" className="w-4 h-4" /> <span>Uploader Beat / VST</span>
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      <div className="glass-card p-6 rounded-2xl border-cyanNeon/30"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400">REVENUS TOTAUX</span><Icon name="dollar" className="w-5 h-5 text-cyanNeon" /></div><span className="text-3xl font-black text-cyanNeon">{(currentUser.balance || 0).toLocaleString()} DZD</span></div>
                      <div className="glass-card p-6 rounded-2xl border-goldAccent/30"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400">ÉCOUTES TOTALES</span><Icon name="activity" className="w-5 h-5 text-goldAccent" /></div><span className="text-3xl font-black text-goldAccent">{(currentUser.plays || 0).toLocaleString()}</span></div>
                      <div className="glass-card p-6 rounded-2xl border-pinkNeon/30"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400">MES CRÉATIONS</span><Icon name="dashboard" className="w-5 h-5 text-pinkNeon" /></div><span className="text-3xl font-black text-pinkNeon">{tracks.filter(t => t.producer === currentUser.name).length}</span></div>
                    </div>

                    <div className="glass-card rounded-2xl p-6">
                      <h3 className="text-lg font-bold text-white mb-4">Mes beats et VSTs en ligne</h3>
                      <div className="space-y-3">
                        {tracks.filter(t => t.producer === currentUser.name).map(track => (
                          <div key={track.id} className="flex justify-between items-center p-3 rounded-xl bg-obsidian/60 border border-borderDark">
                            <div className="flex items-center gap-4">
                              <img src={track.cover} className="w-12 h-12 rounded-lg object-cover" />
                              <div>
                                <h4 className="font-bold text-white text-sm flex items-center gap-2">{track.title} {track.isSold && <span className="bg-red-600 text-white text-[9px] px-1 rounded">SOLD</span>}</h4>
                                <p className="text-xs text-gray-400">{track.type.toUpperCase()} • {track.plays || 0} écoutes</p>
                              </div>
                            </div>
                            <div className="flex items-center gap-3">
                              <span className="text-xs font-bold text-goldAccent">{(track.priceMp3 || track.price).toLocaleString()} DZD</span>
                              <button onClick={() => handleDeleteTrack(track.id)} className="p-2 bg-red-950/60 text-red-400 hover:bg-red-600 hover:text-white rounded-lg transition"><Icon name="trash" className="w-4 h-4" /></button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* ===== VIEW: UPLOAD ===== */}
                {view === 'upload' && currentUser && (
                  <div className="max-w-2xl mx-auto glass-card p-8 rounded-2xl border-goldAccent/40 fade-in">
                    <h2 className="text-2xl font-black text-white mb-2">Poster une nouvelle création</h2>
                    <p className="text-xs text-gray-400 mb-6">Remplissez les détails et fixez vos prix pour le marché algérien</p>
                    <form onSubmit={handleUploadSubmit} className="space-y-4">
                      <div><label className="text-xs font-bold text-gray-300 block mb-1">Titre</label><input type="text" required value={uploadTitle} onChange={e => setUploadTitle(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none" /></div>
                      
                      <div className="grid grid-cols-3 gap-3">
                        <div><label className="text-xs font-bold text-gray-300 block mb-1">Type</label><select value={uploadType} onChange={e => setUploadType(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none"><option value="beat">Beat Instrumentale</option><option value="vst">Plugin VST3 (.exe)</option></select></div>
                        <div><label className="text-xs font-bold text-gray-300 block mb-1">BPM</label><input type="number" value={uploadBpm} onChange={e => setUploadBpm(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none" /></div>
                        <div><label className="text-xs font-bold text-gray-300 block mb-1">Gamme</label><input type="text" value={uploadKey} onChange={e => setUploadKey(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none" /></div>
                      </div>

                      {uploadType === 'beat' ? (
                        <div className="p-4 rounded-xl bg-obsidian/60 border border-borderDark space-y-3">
                          <span className="text-xs font-bold text-goldAccent block uppercase">Prix des Licences (DZD)</span>
                          <div className="grid grid-cols-2 gap-3">
                            <div><label className="text-[11px] text-gray-400">MP3</label><input type="number" value={priceMp3} onChange={e => setPriceMp3(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white" /></div>
                            <div><label className="text-[11px] text-gray-400">WAV</label><input type="number" value={priceWav} onChange={e => setPriceWav(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white" /></div>
                            <div><label className="text-[11px] text-gray-400">Stems (Pistes séparées)</label><input type="number" value={priceStems} onChange={e => setPriceStems(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white" /></div>
                            <div><label className="text-[11px] text-gray-400">Exclusif (Retiré après vente)</label><input type="number" value={priceExclusive} onChange={e => setPriceExclusive(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white" /></div>
                          </div>
                        </div>
                      ) : (
                        <div className="p-4 rounded-xl bg-cyanNeon/10 border border-cyanNeon/30"><label className="text-xs font-bold text-cyanNeon block mb-1">Prix Logiciel (DZD)</label><input type="number" value={priceMp3} onChange={e => setPriceMp3(e.target.value)} className="w-full bg-cardDark border border-cyanNeon/50 rounded-lg p-2 text-white" /></div>
                      )}

                      <div><label className="text-xs font-bold text-gray-300 block mb-1">Pochette (JPG / PNG)</label><input type="file" accept="image/*" onChange={e => setCoverFile(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-cyanNeon file:text-black" /></div>
                      <div><label className="text-xs font-bold text-gray-300 block mb-1">Fichier Audio (MP3) ou VST (.exe)</label><input type="file" onChange={e => setAudioFile(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-goldAccent file:text-black" /></div>
                      
                      <button type="submit" className="w-full bg-goldAccent text-black font-black py-4 rounded-xl glow-gold mt-4">PUBLIER SUR YANRECORDS</button>
                    </form>
                  </div>
                )}

                {/* ===== VIEW: SETTINGS ===== */}
                {view === 'settings' && currentUser && (
                  <div className="max-w-2xl mx-auto glass-card p-8 rounded-3xl border-gray-700/50 fade-in">
                    <div className="flex items-center gap-4 mb-8 border-b border-borderDark pb-6">
                      <div className="w-16 h-16 rounded-full bg-borderDark flex items-center justify-center"><Icon name="settings" className="w-8 h-8 text-gray-400" /></div>
                      <div><h2 className="text-3xl font-black text-white">{t('settingsTitle')}</h2><p className="text-sm text-gray-400">{t('settingsSub')}</p></div>
                    </div>
                    <form onSubmit={(e) => {
                      e.preventDefault();
                      const updated = { ...currentUser, name: editName, avatar: editAvatarBase64 || currentUser.avatar, rip: editRip };
                      setCurrentUser(updated);
                      localStorage.setItem('yanrecords_user', JSON.stringify(updated));
                      alert(lang === 'fr' ? "Modifications enregistrées !" : "Changes saved!");
                      setView('dashboard');
                    }} className="space-y-6">
                      <div className="flex flex-col sm:flex-row items-center gap-6 p-4 bg-obsidian rounded-2xl border border-borderDark">
                        <img src={editAvatarBase64 || currentUser.avatar} className="w-24 h-24 rounded-full object-cover border-4 border-cyanNeon" />
                        <div className="flex-1 w-full">
                          <label className="text-xs font-bold text-gray-400 block mb-2">Changer la Photo de Profil</label>
                          <input type="file" accept="image/*" onChange={(e) => {
                            const file = e.target.files[0];
                            if (file) {
                              const r = new FileReader();
                              r.onloadend = () => setEditAvatarBase64(r.result);
                              r.readAsDataURL(file);
                            }
                          }} className="w-full text-sm text-gray-400 file:bg-cyanNeon file:text-black file:border-0 file:rounded-xl file:px-4 file:py-2 file:mr-4 file:font-bold hover:file:opacity-90 transition cursor-pointer" />
                        </div>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div><label className="text-xs font-bold text-gray-400 block mb-1">Nom d'Artiste</label><input type="text" required value={editName} onChange={e => setEditName(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none" /></div>
                        <div><label className="text-xs font-bold text-gray-400 block mb-1">Email</label><input type="email" disabled value={currentUser.email} className="w-full bg-obsidian/50 border border-borderDark/50 rounded-xl p-3 text-sm text-gray-500 outline-none" /></div>
                      </div>
                      <div className="p-5 rounded-2xl bg-goldAccent/5 border border-goldAccent/30">
                        <label className="text-xs font-bold text-goldAccent block mb-1 uppercase tracking-widest flex items-center gap-2"><Icon name="dollar" className="w-4 h-4"/> Paiement (RIB / RIP BaridiMob)</label>
                        <p className="text-[11px] text-gray-400 mb-3">Votre compte CCP ou BaridiMob pour encaisser vos gains automatiquement.</p>
                        <input type="text" value={editRip} onChange={e => setEditRip(e.target.value)} placeholder="00799999000000000012" className="w-full bg-obsidian border border-goldAccent/40 rounded-xl p-3 text-sm text-white focus:border-goldAccent outline-none font-mono" />
                      </div>
                      <button type="submit" className="w-full bg-white text-black font-black py-4 rounded-xl hover:bg-gray-200 transition mt-4 shadow-lg">{t('saveChanges')}</button>
                    </form>
                  </div>
                )}
              </div>

              {/* MODAL D'ACHAT DE LICENCE */}
              {selectedLicenseTrack && (
                <div className="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4">
                  <div className="glass-card rounded-2xl max-w-lg w-full p-6 relative">
                    <button onClick={() => setSelectedLicenseTrack(null)} className="absolute top-4 right-4 text-gray-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
                    <h3 className="text-xl font-black text-white mb-4">Achat : {selectedLicenseTrack.title}</h3>
                    
                    {selectedLicenseTrack.type === 'vst' && !purchasedKey && (
                      <div>
                        <div className="p-4 rounded-xl border border-cyanNeon bg-cyanNeon/10 mb-6">
                          <h4 className="font-bold text-white">Licence Complète VST3 (Windows)</h4>
                          <p className="text-xs text-gray-300 mt-1">Activation instantanée + support mises à jour à vie.</p>
                          <span className="text-2xl font-black text-goldAccent block mt-3">{selectedLicenseTrack.priceMp3.toLocaleString()} DZD</span>
                        </div>
                        <button onClick={() => handlePurchase(selectedLicenseTrack)} className="w-full bg-cyanNeon text-black font-black py-3.5 rounded-xl hover:opacity-90 glow-cyan">
                          Payer & Générer la Clé VST
                        </button>
                      </div>
                    )}

                    {selectedLicenseTrack.type === 'vst' && purchasedKey && (
                      <div className="bg-black/80 border border-greenPro rounded-xl p-5 text-center space-y-3">
                        <div className="w-10 h-10 rounded-full bg-greenPro/20 text-greenPro mx-auto flex items-center justify-center"><Icon name="check" className="w-6 h-6" /></div>
                        <span className="text-xs font-bold text-greenPro block">VOTRE CLÉ VST3 PERSONNELLE :</span>
                        <input type="text" readOnly value={purchasedKey} className="w-full text-center font-mono text-lg font-bold bg-cardDark border border-greenPro text-white p-3 rounded-xl outline-none select-all" />
                        <p className="text-[11px] text-gray-400">Copiez cette clé pour activer votre plugin dans FL Studio / Ableton.</p>
                      </div>
                    )}

                    {selectedLicenseTrack.type === 'beat' && (
                      <div className="space-y-3 mb-6">
                        <div onClick={() => setSelectedLicenseType('mp3')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'mp3' ? 'border-goldAccent bg-goldAccent/10' : 'border-borderDark'}`}>
                          <div className="flex justify-between font-bold text-white"><span>MP3 Lease (10k streams)</span><span className="text-goldAccent">{selectedLicenseTrack.priceMp3.toLocaleString()} DZD</span></div>
                        </div>
                        <div onClick={() => setSelectedLicenseType('wav')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'wav' ? 'border-goldAccent bg-goldAccent/10' : 'border-borderDark'}`}>
                          <div className="flex justify-between font-bold text-white"><span>WAV Standard (Illimité)</span><span className="text-goldAccent">{selectedLicenseTrack.priceWav.toLocaleString()} DZD</span></div>
                        </div>
                        <div onClick={() => setSelectedLicenseType('stems')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'stems' ? 'border-goldAccent bg-goldAccent/10' : 'border-borderDark'}`}>
                          <div className="flex justify-between font-bold text-white"><span>Trackout Stems (Pistes)</span><span className="text-goldAccent">{selectedLicenseTrack.priceStems.toLocaleString()} DZD</span></div>
                        </div>
                        <div onClick={() => setSelectedLicenseType('exclusive')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'exclusive' ? 'border-red-500 bg-red-500/10' : 'border-borderDark'}`}>
                          <div className="flex justify-between font-bold text-white"><span className="text-red-400">🔥 LICENCE EXCLUSIVE</span><span className="text-goldAccent">{selectedLicenseTrack.priceExclusive.toLocaleString()} DZD</span></div>
                        </div>
                        <button onClick={() => handlePurchase(selectedLicenseTrack)} className="w-full bg-goldAccent text-black font-black py-3.5 rounded-xl mt-4 glow-gold">
                          Payer avec BaridiMob / Carte
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* LECTEUR AUDIO PERSISTANT */}
              {currentTrack && currentTrack.type === 'beat' && (
                <div className="fixed bottom-0 inset-x-0 z-50 glass border-t border-goldAccent/30 px-6 py-3 flex items-center justify-between">
                  <div className="flex items-center gap-4 w-1/4">
                    <img src={currentTrack.cover} className="w-12 h-12 rounded-lg object-cover" />
                    <div className="hidden md:block">
                      <h4 className="font-bold text-sm text-white truncate">{currentTrack.title}</h4>
                      <p className="text-xs text-goldAccent font-bold truncate">{currentTrack.producer}</p>
                    </div>
                  </div>
                  
                  <div className="flex-1 max-w-md flex flex-col items-center gap-1">
                    <button onClick={() => togglePlay(currentTrack)} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition">
                      <Icon name={isPlaying ? "pause" : "play"} className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="w-1/4 flex justify-end">
                    <button onClick={() => { setSelectedLicenseTrack(currentTrack); setSelectedLicenseType('mp3'); }} className="bg-goldAccent text-black font-bold px-4 py-2 rounded-xl text-xs hover:opacity-90">
                      Acheter
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
