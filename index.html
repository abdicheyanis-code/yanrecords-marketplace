<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YANrecords | Premium VST & Beatstore 🇩🇿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#050508',
              surface: 'rgba(15, 17, 26, 0.6)',
              surfaceBorder: 'rgba(255, 255, 255, 0.08)',
              primary: '#00f0ff',
              gold: '#e2b053',
              accent: '#ff007f'
            },
            animation: {
              'blob': 'blob 15s infinite alternate',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #050508; color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }
      .glass { background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--surfaceBorder); }
      .glass-card { background: linear-gradient(145deg, rgba(20, 22, 35, 0.9), rgba(10, 11, 18, 0.9)); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
      .text-gradient-gold { background: linear-gradient(to right, #e2b053, #fff176); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .text-gradient-cyan { background: linear-gradient(to right, #00f0ff, #0080ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .bg-animated-mesh { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: #050508; }
      .mesh-blob { position: absolute; filter: blur(90px); opacity: 0.4; border-radius: 50%; animation: blob 20s infinite alternate; }
      
      /* Cacher la barre de défilement pour faire plus app */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #050508; }
      ::-webkit-scrollbar-thumb { background: #222638; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #e2b053; }
    </style>
</head>
<body class="pb-32">

    <!-- FOND ANIMÉ LUXE -->
    <div class="bg-animated-mesh">
        <div class="mesh-blob bg-blue-900 w-[500px] h-[500px] top-[-10%] left-[-10%]"></div>
        <div class="mesh-blob bg-purple-900 w-[600px] h-[600px] bottom-[-20%] right-[-10%]" style="animation-delay: 2s"></div>
        <div class="mesh-blob bg-teal-900/30 w-[400px] h-[400px] top-[40%] left-[40%]" style="animation-delay: 4s"></div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const DATABASE = [
          // ===== VSTS =====
          { id: 'vst-1', title: 'SmartMaster V2 Pro', type: 'vst', category: 'Mastering', price: 6500, cover: 'https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=800&q=80', desc: 'Le processeur de mastering intelligent. 6 modules matériels (EQ, Comp, Sat, Imager, Maximizer) avec Resonance Killer 3 Bandes et Analyse IA 15s.' },
          { id: 'vst-2', title: 'ChopArcade V2', type: 'vst', category: 'Sampler', price: 4500, cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&q=80', desc: 'Auto-slicer professionnel. Glissez un sample, il le découpe en 16 chops jouables au clavier. FX indépendants par tranche.' },
          { id: 'vst-3', title: 'PunchClipper V2.1', type: 'vst', category: 'Dynamics', price: 3500, cover: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&q=80', desc: 'Soft-clipper analogique. Fait taper vos Kicks et 808s sans détruire la dynamique. Presets inclus.' },
          
          // ===== BEATS =====
          { id: 'beat-1', title: 'Marseille Vibes', type: 'beat', bpm: 130, key: 'Am', genre: 'Jul Type', producer: 'YANrecords', priceMp3: 2000, priceWav: 4000, priceStems: 8000, priceExclusive: 25000, cover: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
          { id: 'beat-2', title: 'Algiers Drill', type: 'beat', bpm: 142, key: 'C#m', genre: 'Drill', producer: 'YANrecords', priceMp3: 2500, priceWav: 5000, priceStems: 10000, priceExclusive: 35000, cover: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
          { id: 'beat-3', title: 'Sahara Nights', type: 'beat', bpm: 105, key: 'Fm', genre: 'Afrobeat', producer: 'YANrecords', priceMp3: 2000, priceWav: 4000, priceStems: 8000, priceExclusive: 25000, cover: 'https://images.unsplash.com/photo-1542204165-65bf26472b9b?w=500&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
        ];

        function App() {
          const [view, setView] = React.useState('home'); // 'home', 'vsts', 'beats'
          const [currentTrack, setCurrentTrack] = React.useState(null);
          const [isPlaying, setIsPlaying] = React.useState(false);
          const [modalItem, setModalItem] = React.useState(null);
          const audioRef = React.useRef(new Audio());

          React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

          const togglePlay = (track) => {
            if (currentTrack?.id === track.id) {
              if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
              else { audioRef.current.play(); setIsPlaying(true); }
            } else {
              setCurrentTrack(track);
              audioRef.current.src = track.audio;
              audioRef.current.play();
              setIsPlaying(true);
            }
          };

          const vsts = DATABASE.filter(i => i.type === 'vst');
          const beats = DATABASE.filter(i => i.type === 'beat');

          return (
            <div className="relative">
              {/* ===== NAVBAR ===== */}
              <nav className="glass fixed top-0 w-full z-50 px-6 py-4 flex items-center justify-between">
                <div className="flex items-center gap-4 cursor-pointer" onClick={() => setView('home')}>
                  <div className="w-10 h-10 rounded-lg bg-black border border-gold/50 flex items-center justify-center font-black text-xl text-gold shadow-[0_0_15px_rgba(226,176,83,0.3)]">
                    Y
                  </div>
                  <h1 className="text-2xl font-black tracking-widest text-white">YAN<span className="text-gradient-gold">RECORDS</span></h1>
                </div>

                <div className="hidden md:flex bg-black/40 border border-surfaceBorder rounded-full p-1">
                  <button onClick={() => setView('home')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'home' ? 'bg-white text-black' : 'text-gray-400 hover:text-white'}`}>Accueil</button>
                  <button onClick={() => setView('vsts')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'vsts' ? 'bg-primary text-black' : 'text-gray-400 hover:text-white'}`}>Plugins VST</button>
                  <button onClick={() => setView('beats')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'beats' ? 'bg-gold text-black' : 'text-gray-400 hover:text-white'}`}>Beatstore</button>
                </div>

                <button className="glass px-4 py-2 rounded-lg text-sm font-bold text-white border-primary/50 hover:bg-primary/10 transition flex items-center gap-2">
                  <i data-lucide="shopping-cart" className="w-4 h-4"></i> Panier
                </button>
              </nav>

              <div className="pt-28 pb-10 px-6 max-w-7xl mx-auto">
                
                {/* ===== VIEW: HOME ===== */}
                {view === 'home' && (
                  <div className="text-center mt-20 mb-20 animate-fade-in">
                    <h2 className="text-5xl md:text-7xl font-black mb-6 tracking-tight leading-tight">
                      L'ARSENAL ULTIME DU <br/>
                      <span className="text-gradient-cyan">PRODUCTEUR PRO</span>
                    </h2>
                    <p className="text-lg text-gray-400 max-w-2xl mx-auto mb-10">
                      Plugins VST innovants et Instrumentales haute qualité. Le son de demain, conçu par YANrecords.
                    </p>
                    <div className="flex justify-center gap-6">
                      <button onClick={() => setView('vsts')} className="bg-primary text-black font-black px-8 py-4 rounded-xl text-lg hover:scale-105 transition shadow-[0_0_30px_rgba(0,240,255,0.4)]">
                        Découvrir les VSTs
                      </button>
                      <button onClick={() => setView('beats')} className="bg-transparent border-2 border-gold text-gold font-black px-8 py-4 rounded-xl text-lg hover:bg-gold/10 transition">
                        Écouter les Beats
                      </button>
                    </div>
                  </div>
                )}

                {/* ===== VIEW: VSTS ===== */}
                {(view === 'vsts' || view === 'home') && (
                  <section className="mb-20">
                    {view === 'home' && <h3 className="text-2xl font-bold mb-8 text-white border-l-4 border-primary pl-4">PLUGINS VST À LA UNE</h3>}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                      {vsts.map(vst => (
                        <div key={vst.id} className="glass-card rounded-2xl overflow-hidden group flex flex-col">
                          <div className="h-48 overflow-hidden relative">
                            <div className="absolute inset-0 bg-black/40 group-hover:bg-transparent transition z-10"></div>
                            <span className="absolute top-3 right-3 z-20 bg-primary text-black text-[10px] font-black px-2 py-1 rounded">WIN / MAC</span>
                            <img src={vst.cover} className="w-full h-full object-cover transform group-hover:scale-110 transition duration-500" />
                          </div>
                          <div className="p-6 flex flex-col flex-grow">
                            <div className="text-xs text-primary font-bold mb-1 uppercase tracking-widest">{vst.category}</div>
                            <h4 className="text-2xl font-black text-white mb-2">{vst.title}</h4>
                            <p className="text-sm text-gray-400 mb-6 flex-grow">{vst.desc}</p>
                            <div className="flex items-center justify-between mt-auto pt-4 border-t border-surfaceBorder">
                              <span className="text-xl font-black text-white">{vst.price.toLocaleString()} DZD</span>
                              <button onClick={() => setModalItem(vst)} className="bg-white text-black font-bold px-4 py-2 rounded-lg text-sm hover:bg-primary transition">
                                Acheter Licence
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>
                )}

                {/* ===== VIEW: BEATS ===== */}
                {(view === 'beats' || view === 'home') && (
                  <section>
                    {view === 'home' && <h3 className="text-2xl font-bold mb-8 text-white border-l-4 border-gold pl-4">BEATSTORE OFFICIEL</h3>}
                    <div className="glass-card rounded-2xl p-2 md:p-4">
                      {/* En-têtes table */}
                      <div className="hidden md:grid grid-cols-12 gap-4 text-xs font-bold text-gray-500 uppercase tracking-wider px-4 pb-3 border-b border-surfaceBorder mb-2">
                        <div className="col-span-5">Titre</div>
                        <div className="col-span-2">BPM / Key</div>
                        <div className="col-span-2">Genre</div>
                        <div className="col-span-3 text-right">Licence</div>
                      </div>
                      
                      {/* Liste des beats */}
                      <div className="space-y-1">
                        {beats.map(beat => (
                          <div key={beat.id} className="grid grid-cols-1 md:grid-cols-12 gap-4 items-center p-3 hover:bg-white/5 rounded-xl transition group">
                            <div className="col-span-5 flex items-center gap-4">
                              <div className="relative w-12 h-12 rounded-lg overflow-hidden cursor-pointer" onClick={() => togglePlay(beat)}>
                                <img src={beat.cover} className="w-full h-full object-cover opacity-80 group-hover:opacity-40 transition" />
                                <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100">
                                  <i data-lucide={currentTrack?.id === beat.id && isPlaying ? "pause" : "play"} className="w-5 h-5 text-white fill-current"></i>
                                </div>
                              </div>
                              <div>
                                <h4 className={`font-bold ${currentTrack?.id === beat.id ? 'text-gold' : 'text-white'}`}>{beat.title}</h4>
                                <p className="text-xs text-gray-400">{beat.producer}</p>
                              </div>
                            </div>
                            <div className="hidden md:block col-span-2 text-sm text-gray-300">
                              {beat.bpm} <span className="text-gray-500">•</span> {beat.key}
                            </div>
                            <div className="hidden md:block col-span-2 text-sm text-gray-300">
                              {beat.genre}
                            </div>
                            <div className="col-span-full md:col-span-3 flex justify-end">
                              <button onClick={() => setModalItem(beat)} className="border border-gold text-gold font-bold px-4 py-1.5 rounded-lg text-xs hover:bg-gold hover:text-black transition w-full md:w-auto flex items-center justify-center gap-2">
                                <i data-lucide="shopping-cart" className="w-3.5 h-3.5"></i>
                                {beat.priceMp3.toLocaleString()} DZD
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </section>
                )}
              </div>

              {/* ===== LECTEUR AUDIO PERSISTANT (POUR BEATS SEULEMENT) ===== */}
              {currentTrack && currentTrack.type === 'beat' && (
                <div className="fixed bottom-0 inset-x-0 z-50 glass border-t border-gold/30 px-6 py-3">
                  <div className="max-w-7xl mx-auto flex items-center justify-between">
                    <div className="flex items-center gap-4 w-1/4">
                      <img src={currentTrack.cover} className="w-14 h-14 rounded-lg object-cover shadow-lg" />
                      <div className="hidden md:block">
                        <h4 className="font-bold text-sm text-white">{currentTrack.title}</h4>
                        <p className="text-xs text-gold">{currentTrack.producer}</p>
                      </div>
                    </div>

                    <div className="flex-1 flex flex-col items-center max-w-xl px-8">
                      <button onClick={() => togglePlay(currentTrack)} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition mb-1">
                        <i data-lucide={isPlaying ? "pause" : "play"} className="w-5 h-5 fill-current"></i>
                      </button>
                      <div className="w-full h-1 bg-gray-800 rounded-full mt-2 relative cursor-pointer">
                        <div className="absolute left-0 top-0 h-full bg-gold rounded-full w-1/3"></div>
                      </div>
                    </div>

                    <div className="w-1/4 flex justify-end">
                      <button onClick={() => setModalItem(currentTrack)} className="bg-gold text-black font-bold px-6 py-2 rounded-lg text-sm hover:opacity-90 shadow-[0_0_15px_rgba(226,176,83,0.4)]">
                        Acheter Licence
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* ===== MODAL D'ACHAT (DYNAMIQUE VST / BEAT) ===== */}
              {modalItem && (
                <div className="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="glass-card rounded-2xl max-w-xl w-full relative overflow-hidden flex flex-col max-h-[90vh]">
                    
                    {/* Header Modal */}
                    <div className={`p-6 border-b border-surfaceBorder flex gap-4 ${modalItem.type === 'vst' ? 'bg-primary/10' : 'bg-gold/10'}`}>
                      <img src={modalItem.cover} className="w-20 h-20 rounded-xl object-cover shadow-xl" />
                      <div>
                        <span className={`text-[10px] font-black uppercase tracking-wider px-2 py-1 rounded bg-black/50 ${modalItem.type === 'vst' ? 'text-primary' : 'text-gold'}`}>
                          {modalItem.type === 'vst' ? 'Licence Logiciel' : 'Licence Instrumentale'}
                        </span>
                        <h3 className="text-2xl font-black text-white mt-1">{modalItem.title}</h3>
                        <p className="text-sm text-gray-300">{modalItem.type === 'vst' ? modalItem.desc : `BPM: ${modalItem.bpm} • Key: ${modalItem.key}`}</p>
                      </div>
                      <button onClick={() => setModalItem(null)} className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-black/50 text-white hover:bg-white hover:text-black transition">
                        <i data-lucide="x" className="w-4 h-4"></i>
                      </button>
                    </div>

                    {/* Contenu Modal Scrollable */}
                    <div className="p-6 overflow-y-auto">
                      <h4 className="text-sm font-bold text-gray-400 mb-4">CHOISISSEZ VOTRE OPTION</h4>
                      
                      <div className="space-y-3">
                        {/* SI C'EST UN VST */}
                        {modalItem.type === 'vst' && (
                          <div className="p-4 rounded-xl border-2 border-primary bg-primary/5 cursor-pointer">
                            <div className="flex justify-between items-center mb-2">
                              <h5 className="font-bold text-white text-lg">Licence Pro à Vie</h5>
                              <span className="font-black text-xl text-primary">{modalItem.price.toLocaleString()} DZD</span>
                            </div>
                            <ul className="text-sm text-gray-400 space-y-1">
                              <li>✔️ Installeur Windows (.exe)</li>
                              <li>✔️ Clé de Licence Unique</li>
                              <li>✔️ Mises à jour gratuites à vie</li>
                            </ul>
                          </div>
                        )}

                        {/* SI C'EST UN BEAT */}
                        {modalItem.type === 'beat' && (
                          <>
                            <div className="p-4 rounded-xl border border-surfaceBorder hover:border-gold bg-black/40 cursor-pointer transition">
                              <div className="flex justify-between items-center mb-1">
                                <h5 className="font-bold text-white">MP3 Lease (Standard)</h5>
                                <span className="font-black text-gold">{modalItem.priceMp3.toLocaleString()} DZD</span>
                              </div>
                              <p className="text-xs text-gray-500">Fichier MP3 • Jusqu'à 10,000 streams</p>
                            </div>
                            <div className="p-4 rounded-xl border-2 border-gold bg-gold/5 cursor-pointer transition">
                              <div className="flex justify-between items-center mb-1">
                                <h5 className="font-bold text-white">WAV Lease (Premium)</h5>
                                <span className="font-black text-gold">{modalItem.priceWav.toLocaleString()} DZD</span>
                              </div>
                              <p className="text-xs text-gray-400">Fichier WAV HQ • Jusqu'à 50,000 streams</p>
                            </div>
                            <div className="p-4 rounded-xl border border-surfaceBorder hover:border-gold bg-black/40 cursor-pointer transition">
                              <div className="flex justify-between items-center mb-1">
                                <h5 className="font-bold text-white">Trackout (Stems)</h5>
                                <span className="font-black text-gold">{modalItem.priceStems.toLocaleString()} DZD</span>
                              </div>
                              <p className="text-xs text-gray-500">Pistes séparées WAV • Streams illimités</p>
                            </div>
                          </>
                        )}
                      </div>

                      <div className="mt-8 pt-6 border-t border-surfaceBorder">
                        <p className="text-xs text-center text-gray-500 mb-4">Paiement 100% sécurisé via Chargily (Edahabia/CIB) ou PayPal.</p>
                        <button className={`w-full font-black py-4 rounded-xl text-lg flex justify-center items-center gap-3 transition ${modalItem.type === 'vst' ? 'bg-primary text-black hover:shadow-[0_0_20px_rgba(0,240,255,0.4)]' : 'bg-gold text-black hover:shadow-[0_0_20px_rgba(226,176,83,0.4)]'}`}>
                          <i data-lucide="lock" className="w-5 h-5"></i>
                          Procéder au Paiement
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
