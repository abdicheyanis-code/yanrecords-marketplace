function vstKey(){const c='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';const r=(n)=>Array.from({length:n},()=>c[Math.floor(Math.random()*c.length)]).join('');return `YAN-${r(4)}-${r(4)}-${r(4)}`;}

function Toasts({items,onRemove}){return <div className="fixed top-20 right-4 z-[200] flex flex-col gap-3 max-w-sm">{items.map(t=>(<div key={t.id} className="toast-anim glass-card rounded-xl p-4 flex items-center gap-3 border-l-4" style={{borderLeftColor:t.type==='error'?'#ef4444':t.type==='success'?'#10b981':'#00f0ff'}}><div className={`w-8 h-8 rounded-full flex items-center justify-center ${t.type==='error'?'bg-red-500/20 text-red-400':'bg-greenPro/20 text-greenPro'}`}><Icon name={t.type==='error'?'x':'check'} className="w-4 h-4"/></div><p className="text-sm font-bold text-white flex-1">{t.msg}</p><button onClick={()=>onRemove(t.id)} className="text-gray-500 hover:text-white"><Icon name="x" className="w-4 h-4"/></button></div>))}</div>;}

function DropZone({label, hint, accept, icon, color, file, onFile, preview}){
  const [dragOver, setDragOver] = React.useState(false);
  const inputRef = React.useRef();
  const colorMap = {cyan:'border-cyanNeon text-cyanNeon bg-cyanNeon/5', gold:'border-goldAccent text-goldAccent bg-goldAccent/5', purple:'border-purple-500 text-purple-400 bg-purple-500/5'};
  const activeColor = colorMap[color]||colorMap.cyan;

  const handleDrop = (e)=>{e.preventDefault();setDragOver(false);const f=e.dataTransfer.files[0];if(f)onFile(f);};
  const handleDrag = (e)=>{e.preventDefault();setDragOver(true);};
  const handleLeave = ()=>setDragOver(false);

  return(
    <div
      className={`drop-zone ${color==='gold'?'drop-zone-gold':color==='purple'?'drop-zone-purple':''} rounded-2xl p-6 text-center cursor-pointer transition-all ${dragOver?activeColor:''} ${file?activeColor+' border-solid':''}`}
      onClick={()=>inputRef.current.click()}
      onDrop={handleDrop}
      onDragOver={handleDrag}
      onDragLeave={handleLeave}
    >
      <input ref={inputRef} type="file" accept={accept} className="hidden" onChange={e=>{if(e.target.files[0])onFile(e.target.files[0]);}}/>
      
      {file ? (
        <div className="space-y-3">
          {preview ? (
            <img src={preview} className="w-24 h-24 rounded-xl object-cover mx-auto border-2 border-white/20"/>
          ) : (
            <div className={`w-16 h-16 rounded-xl mx-auto flex items-center justify-center ${color==='gold'?'bg-goldAccent/20':color==='purple'?'bg-purple-500/20':'bg-cyanNeon/20'}`}>
              <Icon name={icon} className={`w-8 h-8 ${color==='gold'?'text-goldAccent':color==='purple'?'text-purple-400':'text-cyanNeon'}`}/>
            </div>
          )}
          <div>
            <p className="text-sm font-bold text-white truncate max-w-xs mx-auto">{file.name}</p>
            <p className="text-xs text-gray-400 mt-1">{(file.size/1024/1024).toFixed(2)} MB</p>
          </div>
          <button onClick={(e)=>{e.stopPropagation();onFile(null);}} className="text-xs text-red-400 hover:text-red-300 font-bold">✕ Retirer</button>
        </div>
      ) : (
        <div className="space-y-3">
          <div className={`w-16 h-16 rounded-xl mx-auto flex items-center justify-center bg-white/5`}>
            <Icon name={icon} className="w-8 h-8 text-gray-500"/>
          </div>
          <div>
            <p className="text-sm font-bold text-white">{label}</p>
            <p className="text-xs text-gray-500 mt-1">{hint}</p>
          </div>
          <span className={`inline-block text-xs font-bold px-4 py-1.5 rounded-full border ${color==='gold'?'border-goldAccent/50 text-goldAccent':color==='purple'?'border-purple-500/50 text-purple-400':'border-cyanNeon/50 text-cyanNeon'}`}>
            Parcourir les fichiers
          </span>
        </div>
      )}
    </div>
  );
}

  const togglePlay=async(track)=>{if(!track.audio_url){toast("Pas d'audio","error");return;}if(currentTrack?.id===track.id){if(isPlaying){audioRef.current.pause();setIsPlaying(false);}else{audioRef.current.play();setIsPlaying(true);}}else{setCurrentTrack(track);audioRef.current.src=track.audio_url;audioRef.current.play().catch(()=>{});setIsPlaying(true);await sb.from('tracks').update({plays:(track.plays||0)+1}).eq('id',track.id);loadTracks();}};

  const handlePurchase=async(item)=>{if(!session){toast("Connecte-toi d'abord !","error");return;}const priceMap={mp3:item.price_mp3,wav:item.price_wav,stems:item.price_stems,exclusive:item.price_exclusive,vst:item.price_mp3};if(item.type==='vst'){const key=vstKey();setGeneratedKey(key);await sb.from('sales').insert({track_id:item.id,buyer_id:session.user.id,seller_id:item.producer_id,license_type:'vst',amount:item.price_mp3,vst_key:key});toast("Clé VST générée ! 🔑");}else{const amount=priceMap[licenseType]||item.price_mp3;await sb.from('sales').insert({track_id:item.id,buyer_id:session.user.id,seller_id:item.producer_id,license_type:licenseType,amount});if(licenseType==='exclusive'){await sb.from('tracks').update({is_sold:true}).eq('id',item.id);toast(`🔥 "${item.title}" retiré de la vente.`);loadTracks();}else{toast("Achat confirmé ! ✅");}setSelectedTrack(null);}if(item.producer_id){const{data:seller}=await sb.from('profiles').select('balance').eq('id',item.producer_id).single();if(seller){const newBal=(seller.balance||0)+Math.floor((priceMap[licenseType]||item.price_mp3)*0.85);await sb.from('profiles').update({balance:newBal}).eq('id',item.producer_id);}}};

  // ================================================================
  // UPLOAD HANDLER - NOUVEAU
  // ================================================================
  const handleUpload=async(e)=>{
    e.preventDefault();
    if(!session||!profile){toast("Connecte-toi !","error");return;}
    if(!upTitle.trim()){toast("Donne un titre !","error");return;}
    if(!upCover){toast("Ajoute une pochette !","error");return;}
    if(upType==='beat'&&!upAudio){toast("Ajoute un fichier audio !","error");return;}
    if(upType==='vst'&&!upVstFile){toast("Ajoute le fichier VST !","error");return;}

    setUpLoad(true);
    try{
      // Upload Cover
      let coverUrl='';
      const cn=`${profile.id}-${Date.now()}-cover.${upCover.name.split('.').pop()}`;
      const{error:ce}=await sb.storage.from('covers').upload(cn,upCover);
      if(ce)throw ce;
      coverUrl=sb.storage.from('covers').getPublicUrl(cn).data.publicUrl;

      // Upload Audio (beat) ou VST file
      let audioUrl='';
      let fileUrl='';
      if(upType==='beat'&&upAudio){
        const an=`${profile.id}-${Date.now()}-audio.${upAudio.name.split('.').pop()}`;
        const{error:ae}=await sb.storage.from('audio').upload(an,upAudio);
        if(ae)throw ae;
        audioUrl=sb.storage.from('audio').getPublicUrl(an).data.publicUrl;
      }
      if(upType==='vst'&&upVstFile){
        const vn=`${profile.id}-${Date.now()}-vst.${upVstFile.name.split('.').pop()}`;
        const{error:ve}=await sb.storage.from('audio').upload(vn,upVstFile);
        if(ve)throw ve;
        fileUrl=sb.storage.from('audio').getPublicUrl(vn).data.publicUrl;
      }

      const{error}=await sb.from('tracks').insert({
        title:upTitle.trim(),
        type:upType,
        genre:upType==='beat'?upGenre:'VST Plugin',
        bpm:parseInt(upBpm),
        key:upKey,
        producer_id:profile.id,
        producer_name:profile.name,
        cover_url:coverUrl,
        audio_url:audioUrl,
        file_url:fileUrl,
        price_mp3:parseInt(upMp3),
        price_wav:parseInt(upWav),
        price_stems:parseInt(upStems),
        price_exclusive:parseInt(upExcl),
        description:upDesc||( upType==='vst'?'Plugin VST professionnel':'Beat '+upGenre)
      });
      if(error)throw error;

      toast("🎉 Publié avec succès !");
      // Reset form
      setUpTitle('');setUpCover(null);setUpCoverPreview('');setUpAudio(null);setUpVstFile(null);setUpDesc('');setUpStep(1);
      loadTracks();
      setView('dashboard');
    }catch(err){toast(err.message,'error');}
    setUpLoad(false);
  };

  const handleCoverFile=(f)=>{if(f){setUpCover(f);setUpCoverPreview(URL.createObjectURL(f));}else{setUpCover(null);setUpCoverPreview('');}};

  const handleDelete=async(id)=>{if(!confirm("Supprimer ?"))return;await sb.from('tracks').delete().eq('id',id);toast("Supprimé.");loadTracks();};

  const filteredBeats=tracks.filter(t=>{if(t.type!=='beat')return false;if(search){const q=search.toLowerCase();if(!t.title.toLowerCase().includes(q)&&!t.producer_name.toLowerCase().includes(q)&&!(t.genre||'').toLowerCase().includes(q))return false;}if(filterGenre!=='Tous'&&t.genre!==filterGenre)return false;return true;});
  const myTracks=profile?tracks.filter(t=>t.producer_id===profile.id):[];

  if(loading)return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;

  // AUTH GATE
  if(!session){
    return(
      <div className="min-h-screen flex items-center justify-center p-4 relative">
        <Toasts items={toasts} onRemove={(id)=>setToasts(p=>p.filter(t=>t.id!==id))}/>
        <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1600&q=80')] bg-cover bg-center"></div>
        <div className="absolute inset-0 bg-obsidian/90 backdrop-blur-md"></div>
        <div className="relative z-10 w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-12 items-center fade-in">
          <div className="text-center lg:text-left space-y-6">
            <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-black border border-goldAccent/50 font-black text-3xl text-goldAccent glow-gold">Y</div>
            <h1 className="text-4xl md:text-5xl font-black text-white leading-tight">BIENVENUE SUR<br/><span className="text-gradient-gold">YANRECORDS</span></h1>
            <p className="text-gray-400 text-lg">La marketplace musicale n°1 en Algérie.</p>
            <div className="hidden lg:flex flex-col gap-4 mt-8">
              <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-greenPro/20 text-greenPro"><Icon name="check" className="w-4 h-4"/></div>Vendez et achetez des instrumentales</div>
              <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-cyanNeon/20 text-cyanNeon"><Icon name="check" className="w-4 h-4"/></div>Plugins VST professionnels exclusifs</div>
              <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-pinkNeon/20 text-pinkNeon"><Icon name="check" className="w-4 h-4"/></div>Paiement BaridiMob, Edahabia & PayPal</div>
            </div>
          </div>
          <div className="glass-card p-8 rounded-[2rem] border-cyanNeon/20 shadow-2xl">
            <div className="flex bg-obsidian rounded-xl p-1 mb-8 border border-borderDark">
              <button onClick={()=>{setAuthMode('login');setAuthErr('');}} className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition ${authMode==='login'?'bg-cyanNeon text-black':'text-gray-400'}`}>Se connecter</button>
              <button onClick={()=>{setAuthMode('register');setAuthErr('');}} className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition ${authMode==='register'?'bg-goldAccent text-black':'text-gray-400'}`}>Créer un compte</button>
            </div>
            <form onSubmit={handleAuth} className="space-y-4">
              {authMode==='register'&&<div><label className="text-xs font-bold text-gray-400 block mb-1">Nom d'Artiste</label><input type="text" required value={authName} onChange={e=>setAuthName(e.target.value)} placeholder="DJ Yanis" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none"/></div>}
              <div><label className="text-xs font-bold text-gray-400 block mb-1">Email</label><input type="email" required value={authEmail} onChange={e=>setAuthEmail(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none"/></div>
              <div><label className="text-xs font-bold text-gray-400 block mb-1">Mot de passe (6+)</label><input type="password" required minLength="6" value={authPass} onChange={e=>setAuthPass(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none"/></div>
              {authMode==='register'&&<div className="flex items-start gap-3"><input type="checkbox" checked={acceptCGU} onChange={e=>setAcceptCGU(e.target.checked)} className="mt-1 accent-goldAccent"/><label className="text-xs text-gray-400">J'accepte les <span onClick={()=>setShowCGU(true)} className="text-goldAccent cursor-pointer hover:underline font-bold">CGU</span>.</label></div>}
              {authErr&&<div className="bg-red-500/10 border border-red-500/40 text-red-400 text-xs p-3 rounded-xl">{authErr}</div>}
              <button type="submit" disabled={authLoad} className={`w-full font-black py-3.5 rounded-xl mt-4 disabled:opacity-50 ${authMode==='login'?'bg-cyanNeon text-black glow-cyan':'bg-goldAccent text-black glow-gold'}`}>{authLoad?'....':(authMode==='login'?'CONNEXION':"S'INSCRIRE")}</button>
            </form>
            <div className="flex items-center gap-4 my-6"><div className="h-px bg-borderDark flex-1"/><span className="text-xs font-bold text-gray-500">OU</span><div className="h-px bg-borderDark flex-1"/></div>
            <button onClick={handleGoogle} className="w-full bg-white text-black font-bold py-3.5 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-200">
              <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
              Continuer avec Google
            </button>
          </div>
        </div>
        {showCGU&&<div className="fixed inset-0 z-[150] bg-black/90 flex items-center justify-center p-4"><div className="glass-card rounded-2xl max-w-2xl w-full p-8 max-h-[85vh] flex flex-col"><h3 className="text-2xl font-black text-goldAccent mb-4">CGU</h3><div className="flex-1 overflow-y-auto space-y-4 text-sm text-gray-300"><p>1. YANrecords est une marketplace pour beats et VSTs.</p><p>2. Vous devez être l'auteur original.</p><p>3. Licence Exclusive = beat retiré du catalogue.</p><p>4. Commission : 15%.</p></div><button onClick={()=>{setAcceptCGU(true);setShowCGU(false);}} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl mt-6">J'ACCEPTE</button></div></div>}
      </div>
    );
  }

  // MAIN
  return(
    <div className="relative">
      <Toasts items={toasts} onRemove={(id)=>setToasts(p=>p.filter(t=>t.id!==id))}/>
      {showMenu&&<div className="fixed inset-0 z-40" onClick={()=>setShowMenu(false)}/>}

      <nav className="glass fixed top-0 w-full z-50 px-4 md:px-6 py-4 flex items-center justify-between">
        <div className="flex items-center gap-3 cursor-pointer" onClick={()=>setView('home')}>
          <div className="w-10 h-10 rounded-lg bg-black border border-goldAccent/50 flex items-center justify-center font-black text-xl text-goldAccent glow-gold">Y</div>
          <h1 className="text-xl font-black tracking-widest text-white hidden sm:block">YAN<span className="text-gradient-gold">RECORDS</span></h1>
        </div>
        <div className="hidden md:flex bg-black/40 border border-borderDark rounded-full p-1">
          <button onClick={()=>setView('home')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view==='home'?'bg-white text-black':'text-gray-400 hover:text-white'}`}>Accueil</button>
          <button onClick={()=>setView('vsts')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view==='vsts'?'bg-cyanNeon text-black':'text-gray-400 hover:text-white'}`}>VSTs</button>
          <button onClick={()=>setView('beats')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view==='beats'?'bg-goldAccent text-black':'text-gray-400 hover:text-white'}`}>Beats</button>
        </div>
        <div className="flex items-center gap-3 relative z-50">
          <button onClick={()=>setView('upload')} className="hidden sm:flex items-center gap-2 bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-bold px-4 py-2 rounded-xl
