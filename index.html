    <div id="root"></div>

    <script type="text/babel">
        // ===== DONNÉES ET CONFIGURATION =====
        const DICT = {

            settingsTitle: "Profile Settings", settingsSub: "Manage your public information and payment details", saveChanges: "Save Changes", buyLicense: "Buy VST Key", buyBeat: "Purchase"
          }
        };

        const Icon = ({ name, className = "w-5 h-5" }) => {
          const icons = {
            play: <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>,
            pause: <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>,
            search: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,

            dashboard: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,

            dollar: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
            activity: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            cpu: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>,
            shield: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>,
            mic: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>,
            globe: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
            settings: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            chevronDown: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          };
          return icons[name] || null;
        };

        const INITIAL_TRACKS = [
          { id: 'vst-1', title: 'SmartMaster V2 Pro', type: 'vst', category: 'Mastering', price: 6500, priceMp3: 6500, cover: 'https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=800&q=80', audio: '', desc: 'Processeur de mastering intelligent', producer: 'YANrecords', isSold: false },
          { id: 'vst-2', title: 'ChopArcade V2', type: 'vst', category: 'Sampler', price: 4500, priceMp3: 4500, cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&q=80', audio: '', desc: 'Auto-slicer 16 Chops Chromatique', producer: 'YANrecords', isSold: false },
          { id: 'beat-1', title: 'Marseille Vibes', type: 'beat', bpm: 130, key: 'Am', genre: 'Jul Type', producer: 'Slima Beatz', priceMp3: 2000, priceWav: 4000, priceStems: 8000, priceExclusive: 25000, cover: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3', isSold: false, plays: 1240 },
          { id: 'beat-2', title: 'Algiers Drill', type: 'beat', bpm: 142, key: 'C#m', genre: 'Drill', producer: 'YANrecords', priceMp3: 2500, priceWav: 5000, priceStems: 10000, priceExclusive: 35000, cover: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500&q=80', audio: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3', isSold: true, plays: 3450 }
        ];

        const DEFAULT_USER = {
          id: 'ceo-user-1', name: 'Yanis (CEO)', email: 'yanis.records@gmail.com', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80', balance: 84500, plays: 18920, rip: '00799999000000000012'
        };

        function generateRealVstKey() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let part1 = ''; for (let i = 0; i < 4; i++) part1 += chars.charAt(Math.floor(Math.random() * chars.length));
            let hash = 0; for (let i = 0; i < part1.length; i++) hash += part1.charCodeAt(i) * (i + 5);
            let part2 = hash.toString(16).toUpperCase().padStart(4, '0').slice(-4);
            return `SM2-${part1}-${part2}`;
        }

        // ===== APP PRINCIPALE =====
        function App() {
          const [lang, setLang] = React.useState('fr');
          const t = (key) => DICT[lang][key] || key;

          const [view, setViewState] = React.useState('home');
          const [tracks, setTracks] = React.useState(INITIAL_TRACKS);
          const [currentTrack, setCurrentTrack] = React.useState(null);
          const [isPlaying, setIsPlaying] = React.useState(false);
          
          const [selectedLicenseTrack, setSelectedLicenseTrack] = React.useState(null);
          const [selectedLicenseType, setSelectedLicenseType] = React.useState('mp3');
          const [showAuthModal, setShowAuthModal] = React.useState(false);
          const [purchasedKey, setPurchasedKey] = React.useState(null);

          const [currentUser, setCurrentUser] = React.useState(null);
          const [showProfileMenu, setShowProfileMenu] = React.useState(false);

          const [uploadTitle, setUploadTitle] = React.useState('');
          const [uploadType, setUploadType] = React.useState('beat');
          const [uploadGenre, setUploadGenre] = React.useState('Drill');
          const [uploadBpm, setUploadBpm] = React.useState(140);
          const [uploadKey, setUploadKey] = React.useState('C Minor');
          const [priceMp3, setPriceMp3] = React.useState(2000);
          const [priceWav, setPriceWav] = React.useState(4000);
          const [priceStems, setPriceStems] = React.useState(8000);
          const [priceExclusive, setPriceExclusive] = React.useState(25000);
          const [coverFile, setCoverFile] = React.useState(null);
          const [audioFile, setAudioFile] = React.useState(null);

          const [editName, setEditName] = React.useState('');
          const [editAvatarFile, setEditAvatarFile] = React.useState(null);
          const [editRip, setEditRip] = React.useState('');

          const audioRef = React.useRef(new Audio());

          const setView = (newView) => {
            setViewState(newView);
            setShowProfileMenu(false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          React.useEffect(() => {
            const savedUser = localStorage.getItem('yanrecords_user');
            if (savedUser) {
              try { 
                const u = JSON.parse(savedUser);
                setCurrentUser(u); 
                setEditName(u.name);
                setEditRip(u.rip || '');
              } catch (e) {}
            }
          }, []);

          const handleGoogleLogin = () => {
            localStorage.setItem('yanrecords_user', JSON.stringify(DEFAULT_USER));
            setCurrentUser(DEFAULT_USER);
            setEditName(DEFAULT_USER.name);
            setEditRip(DEFAULT_USER.rip);
            setShowAuthModal(false);
          };

          const handleLogout = () => {
            localStorage.removeItem('yanrecords_user');
            setCurrentUser(null);
            setShowProfileMenu(false);
            setView('home');
          };

          const handleSaveSettings = (e) => {
            e.preventDefault();
            let newAvatarUrl = currentUser.avatar;
            if (editAvatarFile) newAvatarUrl = URL.createObjectURL(editAvatarFile);
            const updatedUser = { ...currentUser, name: editName, avatar: newAvatarUrl, rip: editRip };
            setCurrentUser(updatedUser);
            localStorage.setItem('yanrecords_user', JSON.stringify(updatedUser));
            alert(lang === 'fr' ? "Profil mis à jour avec succès !" : "Profile updated successfully!");
            setView('dashboard');
          };

          const togglePlay = (track) => {
            if (currentTrack?.id === track.id) {
              if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
              else { audioRef.current.play(); setIsPlaying(true); }
            } else {
              setCurrentTrack(track);
              audioRef.current.src = track.audio;
              audioRef.current.play();
              setIsPlaying(true);
              setTracks(prev => prev.map(t => t.id === track.id ? { ...t, plays: (t.plays || 0) + 1 } : t));
            }
          };

          const handlePurchase = (item) => {
            if (item.type === 'vst') { setPurchasedKey(generateRealVstKey()); }
            else {
              if (selectedLicenseType === 'exclusive') {
                setTracks(prev => prev.map(t => t.id === item.id ? { ...t, isSold: true } : t));
                alert(lang === 'fr' ? `LICENCE EXCLUSIVE ACHETÉE ! Le beat "${item.title}" est retiré de la vente.` : `EXCLUSIVE LICENSE BOUGHT! Track "${item.title}" is now sold out.`);
              } else {
                alert(lang === 'fr' ? `Paiement confirmé ! Votre fichier audio est prêt.` : `Payment confirmed! Your audio file is ready.`);
              }
              setSelectedLicenseTrack(null);
            }
          };

          const handleDeleteTrack = (id) => {
            if (confirm(lang === 'fr' ? "Voulez-vous supprimer cette création ?" : "Do you want to delete this track?")) {
              setTracks(prev => prev.filter(t => t.id !== id));
            }
          };

          const handleUploadSubmit = (e) => {
            e.preventDefault();
            const newTrack = {
              id: `track-${Date.now()}`,
              title: uploadTitle || 'Nouvelle Création',
              producer: currentUser.name,
              bpm: uploadBpm, key: uploadKey, genre: uploadGenre, type: uploadType,
              price: parseInt(priceMp3), priceMp3: parseInt(priceMp3), priceWav: parseInt(priceWav),
              priceStems: parseInt(priceStems), priceExclusive: parseInt(priceExclusive),
              cover: coverFile ? URL.createObjectURL(coverFile) : 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80',
              audio: audioFile ? URL.createObjectURL(audioFile) : 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
              desc: uploadType === 'vst' ? 'Plugin VST3 officiel' : `Beat ${uploadGenre}`,
              isSold: false, plays: 0
            };
            setTracks(prev => [newTrack, ...prev]);
            alert(lang === 'fr' ? "Publié avec succès !" : "Published successfully!");
            setView('dashboard');
            setUploadTitle('');
          };

          const handlePosterClick = () => {
            if (!currentUser) setShowAuthModal(true);
            else setView('upload');
          };

          return (
            <div className="relative">
              {showProfileMenu && <div className="fixed inset-0 z-40" onClick={() => setShowProfileMenu(false)}></div>}

              {/* NAVBAR */}
              <nav className="glass fixed top-0 w-full z-50 px-6 py-4 flex items-center justify-between">
                <div className="flex items-center gap-4 cursor-pointer" onClick={() => setView('home')}>
                  <div className="w-10 h-10 rounded-lg bg-black border border-goldAccent/50 flex items-center justify-center font-black text-xl text-goldAccent shadow-lg">Y</div>
                  <h1 className="text-2xl font-black tracking-widest text-white hidden sm:block">YAN<span className="text-gradient-gold">RECORDS</span></h1>
                </div>

                <div className="hidden md:flex bg-black/40 border border-borderDark rounded-full p-1">
                  <button onClick={() => setView('home')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'home' ? 'bg-white text-black' : 'text-gray-400 hover:text-white'}`}>{t('home')}</button>
                  <button onClick={() => setView('vsts')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'vsts' ? 'bg-cyanNeon text-black' : 'text-gray-400 hover:text-white'}`}>{t('vsts')}</button>
                  <button onClick={() => setView('beats')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'beats' ? 'bg-goldAccent text-black' : 'text-gray-400 hover:text-white'}`}>{t('beats')}</button>
                </div>

                <div className="flex items-center gap-3 relative z-50">
                  <button onClick={handlePosterClick} className="hidden sm:flex items-center gap-2 bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-bold px-4 py-2 rounded-xl text-xs hover:opacity-90 cyan-glow">
                    <Icon name="upload" className="w-4 h-4" /> <span>{t('uploadBtn')}</span>
                  </button>

                  {currentUser ? (
                    <div className="relative">
                      <button onClick={() => setShowProfileMenu(!showProfileMenu)} className="flex items-center gap-2 bg-cardDark border border-borderDark px-2 py-1.5 rounded-xl cursor-pointer hover:border-cyanNeon transition">
                        <img src={currentUser.avatar} className="w-7 h-7 rounded-full object-cover" />
                        <span className="text-xs font-bold text-white hidden md:block">{currentUser.name}</span>
                        <Icon name="chevronDown" className="w-4 h-4 text-gray-400" />
                      </button>

                      {showProfileMenu && (
                        <div className="absolute right-0 mt-3 w-56 glass-card rounded-xl border-borderDark shadow-2xl p-2 dropdown-anim flex flex-col gap-1">
                          <div className="px-3 py-2 border-b border-borderDark/50 mb-1">
                            <p className="text-xs text-gray-400">Connecté</p>
                            <p className="text-sm font-bold text-white truncate">{currentUser.name}</p>
                          </div>

              )}

              {/* LECTEUR AUDIO */}
              {currentTrack && currentTrack.type === 'beat' && (
                <div className="fixed bottom-0 inset-x-0 z-50 glass border-t border-goldAccent/30 px-6 py-3 flex items-center justify-between">
                  <div className="flex items-center gap-4 w-1/4"><img src={currentTrack.cover} className="w-12 h-12 rounded-lg object-cover" /><div className="hidden md:block"><h4 className="font-bold text-sm text-white">{currentTrack.title}</h4><p className="text-xs text-goldAccent font-bold">{currentTrack.producer}</p></div></div>
                  <div className="flex-1 flex justify-center"><button onClick={() => togglePlay(currentTrack)} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition"><Icon name={isPlaying ? "pause" : "play"} className="w-5 h-5" /></button></div>
                  <div className="w-1/4 flex justify-end"><button onClick={() => { setSelectedLicenseTrack(currentTrack); setSelectedLicenseType('mp3'); }} className="bg-goldAccent text-black font-bold px-4 py-2 rounded-xl text-xs hover:opacity-90">Acheter</button></div>
                </div>
              )}

              {/* MODAL AUTH */}
              {showAuthModal && (
                <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="glass-card rounded-2xl max-w-sm w-full p-6 text-center relative">
                    <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
                    <h3 className="text-xl font-black text-white mb-2">Rejoindre YANrecords</h3>
                    <p className="text-xs text-gray-400 mb-6">Connectez-vous pour accéder au Dashboard et uploader vos prods.</p>
                    <button onClick={handleGoogleLogin} className="w-full bg-white text-black font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-200 transition">
                      <span>Connexion avec Google (Gmail)</span>
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
