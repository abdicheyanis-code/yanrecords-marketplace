        function generateRealVstKey() {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let part1 = '';
            for (let i = 0; i < 4; i++) part1 += chars.charAt(Math.floor(Math.random() * chars.length));
            let hash = 0;
            for (let i = 0; i < part1.length; i++) hash += part1.charCodeAt(i) * (i + 5);
            let part2 = hash.toString(16).toUpperCase().padStart(4, '0').slice(-4);
            return `SM2-${part1}-${part2}`;
        }

                    <div className="hidden lg:flex flex-col gap-4 mt-8">
                      <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-greenPro/20 text-greenPro"><Icon name="check" className="w-4 h-4"/></div> Vendez et achetez des prods (MP3, WAV, Exclusif)</div>
                      <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-cyanNeon/20 text-cyanNeon"><Icon name="check" className="w-4 h-4"/></div> Accédez à nos Plugins VST3 natifs exclusifs</div>
                      <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-pinkNeon/20 text-pinkNeon"><Icon name="check" className="w-4 h-4"/></div> Encaissez directement via BaridiMob & Edahabia</div>
                    </div>
                  </div>

                  <div className="glass-card p-8 rounded-[2rem] border-cyanNeon/20 shadow-2xl">
                    <div className="flex bg-obsidian rounded-xl p-1 mb-8 border border-borderDark">
                      <button onClick={() => setAuthMode('login')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition ${authMode === 'login' ? 'bg-cyanNeon text-black' : 'text-gray-400 hover:text-white'}`}>Se connecter</button>
                      <button onClick={() => setAuthMode('register')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition ${authMode === 'register' ? 'bg-goldAccent text-black' : 'text-gray-400 hover:text-white'}`}>Créer un compte</button>
                    </div>

                    <form onSubmit={handleAuthSubmit} className="space-y-4">
                      <div>
                        <label className="text-xs font-bold text-gray-400 block mb-1">Adresse Email</label>
                        <input type="email" required value={authEmail} onChange={e => setAuthEmail(e.target.value)} placeholder="contact@studio.com" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none" />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-gray-400 block mb-1">Mot de passe</label>
                        <input type="password" required value={authPassword} onChange={e => setAuthPassword(e.target.value)} placeholder="••••••••" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none" />
                      </div>

                      {authMode === 'register' && (
                        <div className="flex items-start gap-3 mt-4">
                          <input type="checkbox" id="cgu" checked={acceptCGU} onChange={e => setAcceptCGU(e.target.checked)} className="mt-1 accent-goldAccent" />
                          <label htmlFor="cgu" className="text-xs text-gray-400 leading-relaxed">
                            J'accepte les <span onClick={(e) => { e.preventDefault(); setShowCGU(true); }} className="text-goldAccent cursor-pointer hover:underline font-bold">Conditions Générales d'Utilisation (CGU)</span>.
                          </label>
                        </div>
                      )}

                      <button type="submit" className={`w-full font-black py-3.5 rounded-xl mt-6 transition shadow-lg ${authMode === 'login' ? 'bg-cyanNeon text-black cyan-glow' : 'bg-goldAccent text-black gold-glow'}`}>
                        {authMode === 'login' ? 'CONNEXION' : "S'INSCRIRE MAINTENANT"}
                      </button>
                    </form>

                    <div className="flex items-center gap-4 my-6">
                      <div className="h-px bg-borderDark flex-1"></div><span className="text-xs font-bold text-gray-500 uppercase">OU</span><div className="h-px bg-borderDark flex-1"></div>
                    </div>

                    <button onClick={handleGoogleLogin} className="w-full bg-white text-black font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-200 transition">
                      <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                      <span>Continuer avec Google</span>
                    </button>
                  </div>
                </div>

                {/* MODAL CGU */}
                {showCGU && (
                  <div className="fixed inset-0 z-[150] bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
                    <div className="glass-card rounded-2xl max-w-2xl w-full p-8 relative max-h-[85vh] flex flex-col">
                      <h3 className="text-2xl font-black text-goldAccent mb-4">Conditions Générales d'Utilisation (CGU)</h3>
                      <div className="flex-1 overflow-y-auto pr-4 space-y-4 text-sm text-gray-300">
                        <p><strong>1. Objet de la plateforme</strong><br/>YANrecords est une marketplace permettant aux producteurs de vendre des licences d'instrumentales et des VST.</p>
                        <p><strong>2. Propriété Intellectuelle</strong><br/>En publiant un beat, vous garantissez être l'auteur original. Tout plagiat entraînera la suppression immédiate du compte.</p>
                        <p><strong>3. Licences</strong><br/>Licence Exclusive : L'instrumentale est automatiquement marquée comme "VENDUE" et retirée du catalogue public.</p>
                        <p><strong>4. Paiements</strong><br/>Les paiements s'effectuent via Edahabia et BaridiMob. La plateforme prélève 15% de commission.</p>
                      </div>
                      <button onClick={() => { setAcceptCGU(true); setShowCGU(false); }} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl mt-6 hover:opacity-90">
                        J'AI LU ET J'ACCEPTE
                      </button>
                    </div>
                  </div>
                )}
              </div>
            );
          }

          // ==========================================
          // VUE PRINCIPALE DU SITE (CONNECTÉ)
          // ==========================================
          return (
            <div className="relative">
              {showProfileMenu && <div className="fixed inset-0 z-40" onClick={() => setShowProfileMenu(false)}></div>}

              <nav className="glass fixed top-0 w-full z-50 px-6 py-4 flex items-center justify-between">
                <div className="flex items-center gap-4 cursor-pointer" onClick={() => setView('home')}>
                  <div className="w-10 h-10 rounded-lg bg-black border border-goldAccent/50 flex items-center justify-center font-black text-xl text-goldAccent shadow-[0_0_15px_rgba(226,176,83,0.3)]">Y</div>
                  <h1 className="text-2xl font-black tracking-widest text-white hidden sm:block">YAN<span className="text-gradient-gold">RECORDS</span></h1>
                </div>

                <div className="hidden md:flex bg-black/40 border border-borderDark rounded-full p-1">
                  <button onClick={() => setView('home')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'home' ? 'bg-white text-black' : 'text-gray-400 hover:text-white'}`}>{t('home')}</button>
                  <button onClick={() => setView('vsts')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'vsts' ? 'bg-cyanNeon text-black' : 'text-gray-400 hover:text-white'}`}>{t('vsts')}</button>
                  <button onClick={() => setView('beats')} className={`px-5 py-2 rounded-full text-sm font-bold transition ${view === 'beats' ? 'bg-goldAccent text-black' : 'text-gray-400 hover:text-white'}`}>{t('beats')}</button>
                </div>

                <div className="flex items-center gap-3 relative z-50">
                  <div className="relative">
                    <button onClick={() => setShowProfileMenu(!showProfileMenu)} className="flex items-center gap-2 bg-cardDark border border-borderDark px-2 py-1.5 rounded-xl cursor-pointer hover:border-cyanNeon transition">
                      <img src={currentUser.avatar} className="w-7 h-7 rounded-full object-cover" />
                      <span className="text-xs font-bold text-white hidden md:block">{currentUser.name}</span>
                    </button>

                    {showProfileMenu && (
                      <div className="absolute right-0 top-12 mt-2 w-48 glass-card rounded-xl border-borderDark shadow-2xl p-2 flex flex-col gap-1">
                        <button onClick={() => setView('dashboard')} className="px-3 py-2.5 rounded-lg text-sm font-bold text-gray-300 hover:bg-white/10 text-left">Dashboard</button>
                        <button onClick={() => setView('settings')} className="px-3 py-2.5 rounded-lg text-sm font-bold text-gray-300 hover:bg-white/10 text-left">Paramètres</button>
                        <div className="h-px bg-borderDark my-1"></div>
                        <button onClick={handleLogout} className="px-3 py-2.5 rounded-lg text-sm font-bold text-red-400 hover:bg-red-500/10 text-left">Déconnexion</button>
                      </div>
                    )}
                  </div>
                </div>
              </nav>

              <div className="pt-28 pb-10 px-6 max-w-7xl mx-auto">
                {view !== 'home' && (
                  <button onClick={() => setView('home')} className="mb-6 flex items-center gap-2 text-gray-400 hover:text-white transition text-sm font-bold">
                    <Icon name="arrowLeft" className="w-4 h-4" /> <span>Retour à l'accueil</span>
                  </button>
                )}

                {/* ===== HOME ===== */}
                {view === 'home' && (
                  <div className="space-y-24 animate-fade-in">
                    <div className="relative glass-card rounded-[2.5rem] p-12 md:p-20 overflow-hidden border-cyanNeon/30 mt-4 flex flex-col md:flex-row items-center justify-between">
                      <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=1200&q=80')] bg-cover bg-center opacity-20 mix-blend-overlay"></div>
                      <div className="absolute inset-0 bg-gradient-to-r from-obsidian via-obsidian/85 to-transparent"></div>
                      <div className="relative z-10 max-w-2xl text-center md:text-left">
                        <span className="inline-block bg-cyanNeon/20 border border-cyanNeon/50 text-cyanNeon text-xs font-bold px-4 py-1.5 rounded-full mb-6 uppercase">{t('heroSub')}</span>
                        <h2 className="text-5xl md:text-7xl font-black mb-6 tracking-tight leading-tight">{t('heroTitle1')} <br/><span className="text-gradient-cyan">{t('heroTitle2')}</span></h2>
                        <p className="text-gray-300 text-lg mb-8 leading-relaxed">{t('heroDesc')}</p>
                        <div className="flex flex-col sm:flex-row items-center gap-4 justify-center md:justify-start">
                          <button onClick={() => setView('vsts')} className="w-full sm:w-auto bg-cyanNeon text-black font-black px-8 py-4 rounded-xl text-lg hover:scale-105 transition cyan-glow">{t('btnVst')}</button>
                          <button onClick={() => setView('beats')} className="w-full sm:w-auto bg-transparent border-2 border-goldAccent text-goldAccent font-black px-8 py-4 rounded-xl text-lg hover:bg-goldAccent/10 transition">{t('btnBeats')}</button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* ===== UPLOAD BEATMAKER ===== */}
                {view === 'upload' && (
                  <div className="max-w-2xl mx-auto glass-card p-8 rounded-2xl border-goldAccent/40 animate-fade-in">
                    <h2 className="text-2xl font-black text-white mb-2">Poster une nouvelle création</h2>
                    <p className="text-xs text-gray-400 mb-6">Remplissez les détails et activez les licences souhaitées</p>
                    <form onSubmit={handleUploadSubmit} className="space-y-4">
                      <div><label className="text-xs font-bold text-gray-300 block mb-1">Titre</label><input type="text" required value={uploadTitle} onChange={e => setUploadTitle(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white outline-none" /></div>
                      
                      <div className="p-4 rounded-xl bg-obsidian/60 border border-borderDark space-y-3">
                        <span className="text-xs font-bold text-goldAccent block uppercase mb-3">Licences & Prix (Cochez celles à activer)</span>
                        <div className="grid grid-cols-2 gap-4">
                          <div className="flex items-center gap-2">
                            <input type="checkbox" checked={true} disabled className="accent-goldAccent" /> 
                            <div className="w-full"><label className="text-[11px] text-gray-400">MP3 Lease</label><input type="number" value={priceMp3} onChange={e => setPriceMp3(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white text-xs" /></div>
                          </div>
                          <div className="flex items-center gap-2">
                            <input type="checkbox" checked={hasWav} onChange={e => setHasWav(e.target.checked)} className="accent-goldAccent" /> 
                            <div className="w-full"><label className="text-[11px] text-gray-400">WAV Lease</label><input type="number" value={priceWav} onChange={e => setPriceWav(e.target.value)} disabled={!hasWav} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white text-xs disabled:opacity-30" /></div>
                          </div>
                          <div className="flex items-center gap-2">
                            <input type="checkbox" checked={hasStems} onChange={e => setHasStems(e.target.checked)} className="accent-goldAccent" /> 
                            <div className="w-full"><label className="text-[11px] text-gray-400">Stems</label><input type="number" value={priceStems} onChange={e => setPriceStems(e.target.value)} disabled={!hasStems} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white text-xs disabled:opacity-30" /></div>
                          </div>
                          <div className="flex items-center gap-2">
                            <input type="checkbox" checked={hasExclusive} onChange={e => setHasExclusive(e.target.checked)} className="accent-goldAccent" /> 
                            <div className="w-full"><label className="text-[11px] text-gray-400">Exclusif</label><input type="number" value={priceExclusive} onChange={e => setPriceExclusive(e.target.value)} disabled={!hasExclusive} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white text-xs disabled:opacity-30" /></div>
                          </div>
                        </div>
                      </div>

                      <button type="submit" className="w-full bg-goldAccent text-black font-black py-4 rounded-xl mt-4">PUBLIER</button>
                    </form>
                  </div>
                )}

                {/* ===== SETTINGS ===== */}
                {view === 'settings' && (
                  <div className="max-w-2xl mx-auto glass-card p-8 rounded-3xl border-gray-700/50 animate-fade-in">
                    <h2 className="text-3xl font-black text-white mb-6">Paramètres du Profil</h2>
                    <form onSubmit={handleSaveSettings} className="space-y-6">
                      <div className="flex items-center gap-6 p-4 bg-obsidian rounded-2xl border border-borderDark">
                        <img src={editAvatarBase64 || currentUser.avatar} className="w-24 h-24 rounded-full object-cover border-4 border-cyanNeon" />
                        <div className="flex-1 w-full">
                          <label className="text-xs font-bold text-gray-400 block mb-2">Changer la Photo (Fichier PC)</label>
                          <input type="file" accept="image/*" onChange={handleFileChange} className="w-full text-sm text-gray-400 file:bg-cyanNeon file:text-black file:rounded-xl file:px-4 file:py-2" />
                        </div>
                      </div>
                      <input type="text" value={editName} onChange={e => setEditName(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-white" placeholder="Nom d'Artiste" />
                      <button type="submit" className="w-full bg-white text-black font-black py-4 rounded-xl">Enregistrer</button>
                    </form>
                  </div>
                )}

                {/* ===== VSTS ===== */}
                {view === 'vsts' && (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {tracks.filter(t => t.type === 'vst').map(vst => (
                      <div key={vst.id} className="glass-card rounded-2xl p-5 flex flex-col justify-between border-cyanNeon/30">
                        <img src={vst.cover} className="w-full h-44 object-cover rounded-xl mb-4" />
                        <h4 className="text-xl font-black text-white">{vst.title}</h4>
                        <div className="flex items-center justify-between pt-4 mt-2">
                          <span className="text-lg font-black text-goldAccent">{vst.price.toLocaleString()} DZD</span>
                          <button onClick={() => { setSelectedLicenseTrack(vst); setPurchasedKey(null); }} className="bg-cyanNeon text-black font-bold px-4 py-2 rounded-xl text-xs">{t('buyLicense')}</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* ===== BEATS ===== */}
                {view === 'beats' && (
                  <div className="glass-card rounded-2xl p-4 space-y-2">
                    {tracks.filter(t => t.type === 'beat').map(beat => (
                      <div key={beat.id} className={`grid grid-cols-1 md:grid-cols-12 gap-4 items-center p-3 rounded-xl transition ${beat.isSold ? 'opacity-50 bg-black/60' : 'hover:bg-white/5'}`}>
                        <div className="col-span-5 flex items-center gap-4">
                          <div className="relative w-12 h-12 rounded-lg overflow-hidden cursor-pointer" onClick={() => !beat.isSold && togglePlay(beat)}>
                            <img src={beat.cover} className="w-full h-full object-cover" />
                            {!beat.isSold && <div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100"><Icon name={currentTrack?.id === beat.id && isPlaying ? "pause" : "play"} className="w-5 h-5 text-white" /></div>}
                          </div>
                          <div><h4 className="font-bold text-white">{beat.title} {beat.isSold && <span className="bg-red-600 text-white text-[9px] px-1.5 py-0.5 rounded">SOLD</span>}</h4><p className="text-xs text-goldAccent font-bold">Par {beat.producer}</p></div>
                        </div>
                        <div className="col-span-full md:col-span-7 flex justify-end">
                          {beat.isSold ? <span className="text-xs font-bold text-red-500 bg-red-950/40 px-4 py-2 rounded-xl">EXCLUSIF VENDU</span> : <button onClick={() => { setSelectedLicenseTrack(beat); setSelectedLicenseType('mp3'); setPurchasedKey(null); }} className="border border-goldAccent text-goldAccent font-bold px-4 py-2 rounded-xl text-xs">{t('buyBeat')} ({beat.priceMp3.toLocaleString()} DZD)</button>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* ===== DASHBOARD ===== */}
                {view === 'dashboard' && (
                  <div className="space-y-8 animate-fade-in">
                    <div className="flex justify-between items-center bg-cardDark border border-borderDark p-6 rounded-2xl">
                      <div className="flex items-center gap-4">
                        <img src={currentUser.avatar} className="w-16 h-16 rounded-full object-cover border-2 border-goldAccent" />
                        <div><h2 className="text-2xl font-black text-white">{currentUser.name}</h2></div>
                      </div>
                      <button onClick={() => setView('upload')} className="bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-black px-6 py-3 rounded-xl">Uploader Beat / VST</button>
                    </div>
                  </div>
                )}
              </div>

              {/* ===== MODAL D'ACHAT DYNAMIQUE ===== */}
              {selectedLicenseTrack && (
                <div className="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4">
                  <div className="glass-card rounded-2xl max-w-lg w-full p-6 relative">
                    <button onClick={() => setSelectedLicenseTrack(null)} className="absolute top-4 right-4 text-gray-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
                    <h3 className="text-xl font-black text-white mb-4">Achat : {selectedLicenseTrack.title}</h3>

                    {selectedLicenseTrack.type === 'vst' && !purchasedKey && (
                      <div><div className="p-4 rounded-xl border border-cyanNeon bg-cyanNeon/10 mb-6"><h4 className="font-bold text-white">Licence Complète VST3</h4><span className="text-xl font-black text-goldAccent block mt-2">{selectedLicenseTrack.price.toLocaleString()} DZD</span></div><button onClick={() => handlePurchase(selectedLicenseTrack)} className="w-full bg-cyanNeon text-black font-black py-3 rounded-xl hover:opacity-90">Payer & Générer la Clé VST</button></div>
                    )}
                    {selectedLicenseTrack.type === 'vst' && purchasedKey && (
                      <div className="bg-black/80 border border-greenPro rounded-xl p-4 text-center"><span className="text-xs font-bold text-greenPro block mb-2">VOTRE CLÉ VST3 CONFIRMÉE :</span><input type="text" readOnly value={purchasedKey} className="w-full text-center font-mono text-lg font-bold bg-cardDark border border-greenPro text-white p-2 rounded-lg" /></div>
                    )}
                    {selectedLicenseTrack.type === 'beat' && (
                      <div className="space-y-3 mb-6">
                        <div onClick={() => setSelectedLicenseType('mp3')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'mp3' ? 'border-goldAccent bg-goldAccent/10' : 'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span>MP3 Lease</span><span className="text-goldAccent">{selectedLicenseTrack.priceMp3.toLocaleString()} DZD</span></div></div>
                        
                        {/* Affiche seulement les licences activées par le vendeur */}
                        {selectedLicenseTrack.hasWav !== false && (
                          <div onClick={() => setSelectedLicenseType('wav')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'wav' ? 'border-goldAccent bg-goldAccent/10' : 'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span>WAV Lease</span><span className="text-goldAccent">{selectedLicenseTrack.priceWav.toLocaleString()} DZD</span></div></div>
                        )}
                        {selectedLicenseTrack.hasStems !== false && (
                          <div onClick={() => setSelectedLicenseType('stems')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'stems' ? 'border-goldAccent bg-goldAccent/10' : 'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span>Trackout (Stems)</span><span className="text-goldAccent">{selectedLicenseTrack.priceStems.toLocaleString()} DZD</span></div></div>
                        )}
                        {selectedLicenseTrack.hasExclusive !== false && (
                          <div onClick={() => setSelectedLicenseType('exclusive')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'exclusive' ? 'border-red-500 bg-red-500/10' : 'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span className="text-red-400">🔥 LICENCE EXCLUSIVE</span><span className="text-goldAccent">{selectedLicenseTrack.priceExclusive.toLocaleString()} DZD</span></div></div>
                        )}

                        <button onClick={() => handlePurchase(selectedLicenseTrack)} className="w-full bg-goldAccent text-black font-black py-3 rounded-xl mt-4">Payer & Télécharger</button>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
