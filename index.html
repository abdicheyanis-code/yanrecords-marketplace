// Error Boundary Component
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error('ErrorBoundary caught:', error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="glass-card p-8 rounded-2xl max-w-md text-center">
            <div className="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg className="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            </div>
            <h2 className="text-2xl font-black text-white mb-2">Oups !</h2>
            <p className="text-gray-400 mb-6">Une erreur est survenue. Veuillez recharger la page.</p>
            <button onClick={() => window.location.reload()} className="bg-cyanNeon text-black font-bold px-6 py-3 rounded-xl">Recharger</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function vstKey(){
  const c='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const r=(n)=>Array.from({length:n},()=>c[Math.floor(Math.random()*c.length)]).join('');
  return `YAN-${r(4)}-${r(4)}-${r(4)}`;
}

function Toasts({items, onRemove}){
  return <div className="fixed top-20 right-4 z-[200] flex flex-col gap-3 max-w-sm">
    {items.map(t=>(
      <div key={t.id} className="toast-anim glass-card rounded-xl p-4 flex items-center gap-3 border-l-4" style={{borderLeftColor: t.type==='error'?'#ef4444':t.type==='success'?'#10b981':'#00f0ff'}}>
        <div className={`w-8 h-8 rounded-full flex items-center justify-center ${t.type==='error'?'bg-red-500/20 text-red-400':t.type==='success'?'bg-greenPro/20 text-greenPro':'bg-cyanNeon/20 text-cyanNeon'}`}>
          <Icon name={t.type==='error'?'x':t.type==='success'?'check':'activity'} className="w-4 h-4"/>
        </div>
        <p className="text-sm font-bold text-white flex-1">{t.msg}</p>
        <button onClick={()=>onRemove(t.id)} className="text-gray-500 hover:text-white"><Icon name="x" className="w-4 h-4"/></button>
      </div>
    ))}
  </div>;
}

  const GENRES = ['Tous','Drill','Trap','Jul Type','Afrobeat','Boom Bap','Raï','Pop','RnB'];

  const setView = (v) => { _setView(v); setShowMenu(false); window.scrollTo({top:0,behavior:'smooth'}); };
  const toast = (msg, type='success') => {
    const id = Date.now();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),4000);
  };

  React.useEffect(()=>{
    const hash = window.location.hash;
    if(hash.includes('error_description')){
      const p = new URLSearchParams(hash.replace('#','?'));
      const err = p.get('error_description');
      if(err) toast(decodeURIComponent(err),'error');
      window.history.replaceState(null,'',window.location.pathname);
    }
    sb.auth.getSession().then(({data:{session:s}})=>{
      setSession(s);
      if(s) loadProfile(s.user.id);
      loadInitialTracks();
      setLoading(false);
    });
    const {data:{subscription}} = sb.auth.onAuthStateChange((ev,s)=>{
      setSession(s);
      if(s) loadProfile(s.user.id);
      else setProfile(null);
    });
    
    // Realtime Subscription for Live Updates
    const channel = sb.channel('public:tracks')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tracks' }, () => {
        loadInitialTracks();
      })
      .subscribe();

    const audio = audioRef.current;
    const onEnd = ()=>{setIsPlaying(false); setAudioProgress(0);};
    const onTimeUpdate = ()=>{
      setAudioCurrentTime(audio.currentTime);
      setAudioProgress((audio.currentTime / audio.duration) * 100 || 0);
    };
    const onLoadedMetadata = ()=>{
      setAudioDuration(audio.duration);
    };
    const onError = ()=>{
      toast("Erreur de lecture audio","error");
      setIsPlaying(false);
    };
    
    audio.addEventListener('ended',onEnd);
    audio.addEventListener('timeupdate',onTimeUpdate);
    audio.addEventListener('loadedmetadata',onLoadedMetadata);
    audio.addEventListener('error',onError);
    
    return ()=>{
      subscription.unsubscribe(); 
      channel.unsubscribe();
      audio.removeEventListener('ended',onEnd);
      audio.removeEventListener('timeupdate',onTimeUpdate);
      audio.removeEventListener('loadedmetadata',onLoadedMetadata);
      audio.removeEventListener('error',onError);
    };
  },[]);

      setHasMore(data.length >= 20);

                <button onClick={()=>setView('beats')} className="w-full sm:w-auto bg-goldAccent text-black font-black px-8 py-4 rounded-xl hover:scale-105 transition glow-gold">BEATSTORE</button>

            </div>
            <div className="hidden md:block relative z-10"><img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=800&q=80" className="w-72 h-72 object-cover rounded-full border-4 border-goldAccent/50 shadow-[0_0_50px_rgba(226,176,83,0.3)]"/></div>
          </div>

        {/* ===== VSTS ===== */}
        {view==='vsts'&&<section className="fade-in">

              <div key={v.id} className="glass-card rounded-2xl p-5 flex flex-col border-cyanNeon/30">

                <div className="flex items-center justify-between pt-4 border-t border-borderDark">
                  <span className="text-lg font-black text-goldAccent">{v.price_mp3.toLocaleString()} DZD</span>
                  <button onClick={()=>{setSelectedTrack(v);setGeneratedKey(null);}} className="bg-cyanNeon text-black font-bold px-4 py-2 rounded-xl text-xs">Acheter</button>
                </div>
              </div>
            ))}
          </div>}
        </section>}

        {/* ===== BEATS ===== */}
        {view==='beats'&&<section className="fade-in space-y-6">

              <input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher..." className="w-full bg-cardDark border border-borderDark rounded-xl pl-9 pr-4 py-2 text-xs text-white focus:border-goldAccent outline-none"/>
              <div className="absolute left-3 top-2.5 text-gray-500"><Icon name="search" className="w-4 h-4"/></div>
            </div>
          </div>
          <div className="flex items-center gap-2 overflow-x-auto pb-2">
            {GENRES.map(g=><button key={g} onClick={()=>setFilterGenre(g)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${filterGenre===g?'bg-goldAccent text-black':'bg-cardDark text-gray-400 hover:text-white border border-borderDark'}`}>{g}</button>)}

                <div className="hidden md:block col-span-2 text-sm text-gray-400">{b.bpm} BPM • {b.key}</div>

                  <button onClick={()=>{setSelectedTrack(b);setLicenseType('mp3');}} className="border border-goldAccent text-goldAccent font-bold px-4 py-2 rounded-xl text-xs hover:bg-goldAccent hover:text-black transition">Acheter ({b.price_mp3.toLocaleString()} DZD)</button>}
                </div>
              </div>
            ))}

              <button onClick={loadMoreTracks} className="w-full py-3 text-sm font-bold text-cyanNeon hover:text-white transition">

          </div>}
        </section>}

            <button onClick={()=>setView('upload')} className="bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-black px-6 py-3 rounded-xl flex items-center gap-2 glow-cyan"><Icon name="upload" className="w-4 h-4"/>Uploader</button>

            <div className="glass-card p-6 rounded-2xl border-cyanNeon/30"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400">REVENUS</span><Icon name="dollar" className="w-5 h-5 text-cyanNeon"/></div><span className="text-3xl font-black text-cyanNeon">{(profile.balance||0).toLocaleString()} DZD</span></div>
            <div className="glass-card p-6 rounded-2xl border-goldAccent/30"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400">ÉCOUTES</span><Icon name="activity" className="w-5 h-5 text-goldAccent"/></div><span className="text-3xl font-black text-goldAccent">{(profile.total_plays||0).toLocaleString()}</span></div>

          </div>

            <h3 className="text-lg font-bold text-white mb-4">Mes publications</h3>
            {myTracks.length===0?<p className="text-gray-400 text-sm text-center py-6">Aucune création. <button onClick={()=>setView('upload')} className="text-cyanNeon underline">Commence !</button></p>:
            <div className="space-y-3">{myTracks.map(t=>(
              <div key={t.id} className="flex justify-between items-center p-3 rounded-xl bg-obsidian/60 border border-borderDark">
                <div className="flex items-center gap-4"><img src={t.cover_url} className="w-12 h-12 rounded-lg object-cover"/><div><h4 className="font-bold text-white text-sm">{t.title}{t.is_sold&&<span className="bg-red-600 text-white text-[9px] px-1 rounded ml-2">SOLD</span>}</h4><p className="text-xs text-gray-400">{t.type.toUpperCase()} • {t.plays||0} écoutes</p></div></div>
                <div className="flex items-center gap-3"><span className="text-xs font-bold text-goldAccent">{t.price_mp3.toLocaleString()} DZD</span><button onClick={()=>handleDelete(t.id)} className="p-2 bg-red-950/60 text-red-400 hover:bg-red-600 hover:text-white rounded-lg"><Icon name="trash" className="w-4 h-4"/></button></div>
              </div>
            ))}</div>}
          </div>
        </div>}

        {/* ===== UPLOAD ===== */}
        {view==='upload'&&profile&&<div className="max-w-2xl mx-auto glass-card p-8 rounded-2xl border-goldAccent/40 fade-in">

          <p className="text-xs text-gray-400 mb-6">Publié par : <span className="text-goldAccent font-bold">{profile.name}</span></p>

            <div><label className="text-xs font-bold text-gray-300 block mb-1">Titre (max 100)</label><input type="text" required maxLength="100" value={upTitle} onChange={e=>setUpTitle(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none"/></div>
            <div className="grid grid-cols-3 gap-3">
              <div><label className="text-xs font-bold text-gray-300 block mb-1">Type</label><select value={upType} onChange={e=>setUpType(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"><option value="beat">Beat</option><option value="vst">VST</option></select></div>
              <div><label className="text-xs font-bold text-gray-300 block mb-1">BPM (40-300)</label><input type="number" min="40" max="300" value={upBpm} onChange={e=>setUpBpm(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"/></div>
              <div><label className="text-xs font-bold text-gray-300 block mb-1">Gamme</label><input type="text" value={upKey} onChange={e=>setUpKey(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"/></div>
            </div>
            {upType==='beat'?<div className="p-4 rounded-xl bg-obsidian/60 border border-borderDark space-y-3"><span className="text-xs font-bold text-goldAccent block uppercase">Prix (DZD)</span><div className="grid grid-cols-2 gap-3">
              <div><label className="text-[11px] text-gray-400">MP3</label><input type="number" min="0" value={upMp3} onChange={e=>setUpMp3(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
              <div><label className="text-[11px] text-gray-400">WAV</label><input type="number" min="0" value={upWav} onChange={e=>setUpWav(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
              <div><label className="text-[11px] text-gray-400">Stems</label><input type="number" min="0" value={upStems} onChange={e=>setUpStems(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
              <div><label className="text-[11px] text-gray-400">Exclusif</label><input type="number" min="0" value={upExcl} onChange={e=>setUpExcl(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
            </div></div>:<div className="p-4 rounded-xl bg-cyanNeon/10 border border-cyanNeon/30"><label className="text-xs font-bold text-cyanNeon block mb-1">Prix VST (DZD)</label><input type="number" min="0" value={upMp3} onChange={e=>setUpMp3(e.target.value)} className="w-full bg-cardDark border border-cyanNeon/50 rounded-lg p-2 text-white"/></div>}
            <div><label className="text-xs font-bold text-gray-300 block mb-1">Pochette (max 5MB)</label><input type="file" accept="image/*" onChange={e=>setUpCover(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-cyanNeon file:text-black"/></div>
            <div><label className="text-xs font-bold text-gray-300 block mb-1">Fichier Audio / VST (max 50MB)</label><input type="file" accept="audio/*,.zip" onChange={e=>setUpAudio(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-goldAccent file:text-black"/></div>
            <button type="submit" disabled={upLoad} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl glow-gold mt-4 disabled:opacity-50">{upLoad?'UPLOAD EN COURS...':'PUBLIER SUR YANRECORDS'}</button>
          </form>
        </div>}

        {/* ===== SETTINGS ===== */}
        {view==='settings'&&profile&&<div className="max-w-2xl mx-auto glass-card p-8 rounded-3xl fade-in">

            <div className="w-16 h-16 rounded-full bg-borderDark flex items-center justify-center"><Icon name="settings" className="w-8 h-8 text-gray-400"/></div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

              <div><label className="text-xs font-bold text-gray-400 block mb-1">Email</label><input type="email" disabled value={session.user.email} className="w-full bg-obsidian/50 border border-borderDark/50 rounded-xl p-3 text-sm text-gray-500"/></div>
            </div>
            <div className="p-5 rounded-2xl bg-goldAccent/5 border border-goldAccent/30">

              <p className="text-[11px] text-gray-400 mb-3">Pour recevoir vos ventes.</p>
              <input type="text" value={editRip} onChange={e=>setEditRip(e.target.value)} placeholder="00799999000000000012" className="w-full bg-obsidian border border-goldAccent/40 rounded-xl p-3 text-sm text-white focus:border-goldAccent outline-none font-mono"/>
            </div>
            <button type="submit" disabled={saving} className="w-full bg-white text-black font-black py-4 rounded-xl hover:bg-gray-200 mt-4 shadow-lg disabled:opacity-50">{saving?'ENREGISTREMENT...':'✅ ENREGISTRER'}</button>
          </form>
        </div>}
      </div>

      {/* MODAL CONFIRMATION ACHAT */}
      {showPurchaseConfirm && (
        <div className="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4">
          <div className="glass-card rounded-2xl max-w-md w-full p-6 relative">
            <button onClick={()=>setShowPurchaseConfirm(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white"><Icon name="x" className="w-5 h-5"/></button>
            <div className="w-12 h-12 bg-goldAccent/20 rounded-full flex items-center justify-center mx-auto mb-4">
              <Icon name="dollar" className="w-6 h-6 text-goldAccent"/>
            </div>
            <h3 className="text-xl font-black text-white text-center mb-2">Confirmer l'achat</h3>
            <p className="text-gray-400 text-center text-sm mb-6">
              Vous êtes sur le point d'acheter <strong>"{pendingPurchase?.title}"</strong> pour <strong className="text-goldAccent">{pendingPurchase?.price_mp3.toLocaleString()} DZD</strong>. Cette action est irréversible.
            </p>
            <div className="flex gap-3">
              <button onClick={()=>setShowPurchaseConfirm(false)} className="flex-1 bg-cardDark text-white font-bold py-3 rounded-xl hover:bg-white/10 transition">Annuler</button>
              <button onClick={confirmPurchase} className="flex-1 bg-goldAccent text-black font-black py-3 rounded-xl glow-gold hover:scale-105 transition">Confirmer</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL ACHAT */}
      {selectedTrack&&<div className="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4">
        <div className="glass-card rounded-2xl max-w-lg w-full p-6 relative">
          <button onClick={()=>{setSelectedTrack(null);setGeneratedKey(null);}} className="absolute top-4 right-4 text-gray-400 hover:text-white"><Icon name="x" className="w-5 h-5"/></button>
          <h3 className="text-xl font-black text-white mb-4">Achat : {selectedTrack.title}</h3>
          {selectedTrack.type==='vst'&&!generatedKey&&<div>
            <div className="p-4 rounded-xl border border-cyanNeon bg-cyanNeon/10 mb-6"><h4 className="font-bold text-white">Licence VST Complète</h4><span className="text-xl font-black text-goldAccent block mt-2">{selectedTrack.price_mp3.toLocaleString()} DZD</span></div>
            <button onClick={()=>handlePurchaseInit(selectedTrack)} className="w-full bg-cyanNeon text-black font-black py-3 rounded-xl glow-cyan">Payer & Générer la Clé</button>
          </div>}
          {selectedTrack.type==='vst'&&generatedKey&&<div className="bg-black/80 border border-greenPro rounded-xl p-5 text-center space-y-3">
            <div className="w-10 h-10 rounded-full bg-greenPro/20 text-greenPro mx-auto flex items-center justify-center"><Icon name="check" className="w-6 h-6"/></div>
            <span className="text-xs font-bold text-greenPro block">VOTRE CLÉ VST :</span>
            <input type="text" readOnly value={generatedKey} className="w-full text-center font-mono text-lg font-bold bg-cardDark border border-greenPro text-white p-3 rounded-xl select-all"/>
            <p className="text-[11px] text-gray-400">Copiez cette clé pour activer votre plugin.</p>
          </div>}
          {selectedTrack.type==='beat'&&<div className="space-y-3">
            <div onClick={()=>setLicenseType('mp3')} className={`p-3 rounded-xl border cursor-pointer ${licenseType==='mp3'?'border-goldAccent bg-goldAccent/10':'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span>MP3 Lease</span><span className="text-goldAccent">{selectedTrack.price_mp3.toLocaleString()} DZD</span></div></div>

            <div onClick={()=>setLicenseType('stems')} className={`p-3 rounded-xl border cursor-pointer ${licenseType==='stems'?'border-goldAccent bg-goldAccent/10':'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span>Trackout Stems</span><span className="text-goldAccent">{selectedTrack.price_stems.toLocaleString()} DZD</span></div></div>
            <div onClick={()=>setLicenseType('exclusive')} className={`p-3 rounded-xl border cursor-pointer ${licenseType==='exclusive'?'border-red-500 bg-red-500/10':'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span className="text-red-400">🔥 EXCLUSIVE</span><span className="text-goldAccent">{selectedTrack.price_exclusive.toLocaleString()} DZD</span></div></div>
            <button onClick={()=>handlePurchaseInit(selectedTrack)} className="w-full bg-goldAccent text-black font-black py-3.5 rounded-xl mt-4 glow-gold">Payer</button>
          </div>}
        </div>
      </div>}

      {/* PLAYER AMÉLIORÉ */}
      {currentTrack&&<div className="fixed bottom-0 inset-x-0 z-50 glass border-t border-goldAccent/30 px-4 md:px-6 py-3 flex flex-col gap-2 safe-bottom">
        {/* Progress Bar */}
        <div className="w-full flex items-center gap-3 text-xs text-gray-400 font-mono">
          <span>{formatTime(audioCurrentTime)}</span>
          <input 
            type="range" 
            min="0" 
            max="100" 
            value={audioProgress} 
            onChange={handleSeek}
            className="flex-1 h-1 bg-borderDark rounded-lg appearance-none cursor-pointer"
            style={{background: `linear-gradient(to right, #00f0ff ${audioProgress}%, #222638 ${audioProgress}%)`}}
          />
          <span>{formatTime(audioDuration)}</span>
        </div>
        
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-3 w-1/3 min-w-0">
            <img src={currentTrack.cover_url} className="w-11 h-11 rounded-lg object-cover"/>
            <div className="min-w-0 hidden md:block">
              <h4 className="font-bold text-sm text-white truncate">{currentTrack.title}</h4>
              <p className="text-xs text-goldAccent font-bold truncate">{currentTrack.producer_name}</p>
            </div>
          </div>
          
          <div className="flex items-center gap-4">
            <button onClick={toggleMute} className="text-gray-400 hover:text-white">
              <Icon name={isMuted?"volumeMute":"volume"} className="w-5 h-5"/>
            </button>
            <input 
              type="range" 
              min="0" 
              max="1" 
              step="0.1" 
              value={isMuted?0:volume} 
              onChange={handleVolumeChange}
              className="w-20 hidden md:block"
            />
            <button onClick={()=>togglePlay(currentTrack)} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-110 transition">
              <Icon name={isPlaying?"pause":"play"} className="w-5 h-5"/>
            </button>
          </div>
          
          <div className="w-1/3 flex justify-end">
            <button onClick={()=>{setSelectedTrack(currentTrack);setLicenseType('mp3');}} className="bg-goldAccent text-black font-bold px-3 md:px-4 py-2 rounded-xl text-xs">Acheter</button>
          </div>
        </div>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary>
    <App/>
  </ErrorBoundary>
);
</script>
</body>
</html>
