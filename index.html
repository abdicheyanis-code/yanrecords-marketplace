<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YANrecords | Premium VST & Beatstore 🇩🇿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              obsidian: '#050508', cardDark: '#131520', borderDark: '#222638',
              cyanNeon: '#00f0ff', goldAccent: '#e2b053', pinkNeon: '#ff007f', greenPro: '#10b981'
            },
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
          }
        }
      }
    </script>
    <style>
      * { font-family: 'Inter', system-ui, sans-serif; box-sizing: border-box; }
      body { background-color: #050508; color: #f8fafc; overflow-x: hidden; scroll-behavior: smooth; }
      .glass { background: rgba(19, 21, 32, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(34, 38, 56, 0.8); }
      .glass-card { background: linear-gradient(145deg, rgba(20, 22, 35, 0.9), rgba(10, 11, 18, 0.9)); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); }
      .text-gradient-gold { background: linear-gradient(135deg, #e2b053, #fff176, #e2b053); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: shimmer 4s linear infinite; }
      .text-gradient-cyan { background: linear-gradient(135deg, #00f0ff, #0080ff, #00f0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: shimmer 4s linear infinite; }
      @keyframes shimmer { to { background-position: 200% center; } }
      .bg-animated-mesh { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background: #050508; }
      .mesh-blob { position: absolute; filter: blur(120px); opacity: 0.3; border-radius: 50%; animation: float 20s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 33% { transform: translate(30px, -50px) scale(1.1); } 66% { transform: translate(-20px, 20px) scale(0.9); } }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #050508; }
      ::-webkit-scrollbar-thumb { background: #222638; border-radius: 4px; }
      .dropdown-anim { animation: dropIn 0.2s ease-out forwards; transform-origin: top right; }
      @keyframes dropIn { from { opacity: 0; transform: scale(0.95) translateY(-10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      .fade-in { animation: fadeIn 0.4s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
      .glow-cyan { box-shadow: 0 0 25px rgba(0, 240, 255, 0.35); }
      .glow-gold { box-shadow: 0 0 25px rgba(226, 176, 83, 0.35); }
      .loader { border: 3px solid #222638; border-top: 3px solid #00f0ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-28">
    <div class="bg-animated-mesh">
        <div class="mesh-blob bg-blue-900 w-[600px] h-[600px] top-[-10%] left-[-10%]"></div>
        <div class="mesh-blob bg-purple-900 w-[700px] h-[700px] bottom-[-20%] right-[-10%]"></div>
        <div class="mesh-blob bg-teal-900/30 w-[400px] h-[400px] top-[40%] left-[40%]"></div>
    </div>
    <div id="root"></div>

    <script type="text/babel">
        // ================================================================
        // ⚠️⚠️⚠️ METS TES VRAIES CLÉS SUPABASE ICI ⚠️⚠️⚠️
        // ================================================================
        const SUPABASE_URL = 'https://TON_PROJET.supabase.co';
        const SUPABASE_ANON_KEY = 'TA_CLE_ANON_ICI';
        // ================================================================

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const DEMO_AVATAR = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&q=80';

        const Icon = ({ name, className = "w-5 h-5" }) => {
          const icons = {
            play: <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>,
            pause: <svg className={className} fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>,
            search: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            upload: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
            logout: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            dashboard: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
            arrowLeft: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
            x: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            trash: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            dollar: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
            activity: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            cpu: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/></svg>,
            shield: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>,
            globe: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
            settings: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            chevronDown: <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>,
            check: <svg className={className} fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          };
          return icons[name] || null;
        };

        function generateVstKey() {
          const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
          const rand = (n) => Array.from({length:n}, () => chars.charAt(Math.floor(Math.random()*chars.length))).join('');
          return `YAN-${rand(4)}-${rand(4)}-${rand(4)}`;
        }

        function App() {
          const [loading, setLoading] = React.useState(true);
          const [session, setSession] = React.useState(null);
          const [profile, setProfile] = React.useState(null);
          const [tracks, setTracks] = React.useState([]);
          
          const [view, setViewState] = React.useState('home');
          const [currentTrack, setCurrentTrack] = React.useState(null);
          const [isPlaying, setIsPlaying] = React.useState(false);
          const [selectedLicenseTrack, setSelectedLicenseTrack] = React.useState(null);
          const [selectedLicenseType, setSelectedLicenseType] = React.useState('mp3');
          const [purchasedKey, setPurchasedKey] = React.useState(null);
          const [showProfileMenu, setShowProfileMenu] = React.useState(false);
          
          const [authMode, setAuthMode] = React.useState('login');
          const [authEmail, setAuthEmail] = React.useState('');
          const [authPassword, setAuthPassword] = React.useState('');
          const [authName, setAuthName] = React.useState('');
          const [acceptCGU, setAcceptCGU] = React.useState(false);
          const [showCGU, setShowCGU] = React.useState(false);
          const [authError, setAuthError] = React.useState('');
          const [authLoading, setAuthLoading] = React.useState(false);

          // Settings
          const [editName, setEditName] = React.useState('');
          const [editRip, setEditRip] = React.useState('');
          const [editAvatarFile, setEditAvatarFile] = React.useState(null);
          const [editAvatarPreview, setEditAvatarPreview] = React.useState('');
          const [savingProfile, setSavingProfile] = React.useState(false);

          // Upload
          const [uploadTitle, setUploadTitle] = React.useState('');
          const [uploadType, setUploadType] = React.useState('beat');
          const [uploadGenre, setUploadGenre] = React.useState('Drill');
          const [uploadBpm, setUploadBpm] = React.useState(140);
          const [uploadKey, setUploadKey] = React.useState('Am');
          const [priceMp3, setPriceMp3] = React.useState(2000);
          const [priceWav, setPriceWav] = React.useState(4000);
          const [priceStems, setPriceStems] = React.useState(8000);
          const [priceExclusive, setPriceExclusive] = React.useState(25000);
          const [coverFile, setCoverFile] = React.useState(null);
          const [audioFile, setAudioFile] = React.useState(null);
          const [uploading, setUploading] = React.useState(false);

          const audioRef = React.useRef(new Audio());

          const setView = (v) => { setViewState(v); setShowProfileMenu(false); window.scrollTo({top:0, behavior:'smooth'}); };

          // ============== INITIALISATION ==============
          React.useEffect(() => {
            // Check session actuelle
            supabase.auth.getSession().then(({ data: { session } }) => {
              setSession(session);
              if (session) loadProfile(session.user.id);
              loadTracks();
              setLoading(false);
            });

            // Écoute les changements d'auth
            const { data: { subscription } } = supabase.auth.onAuthStateChange((event, newSession) => {
              setSession(newSession);
              if (newSession) {
                loadProfile(newSession.user.id);
              } else {
                setProfile(null);
              }
            });

            return () => subscription.unsubscribe();
          }, []);

          // ============== CHARGER PROFIL ==============
          const loadProfile = async (userId) => {
            const { data, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
            if (error) {
              console.error('Erreur profil:', error);
              // Si pas de profil, en créer un
              if (error.code === 'PGRST116') {
                const { data: userData } = await supabase.auth.getUser();
                const newProfile = {
                  id: userId,
                  email: userData.user.email,
                  name: userData.user.user_metadata?.full_name || userData.user.email.split('@')[0],
                  avatar_url: userData.user.user_metadata?.avatar_url || DEMO_AVATAR,
                  rip: '',
                  balance: 0,
                  total_plays: 0,
                  role: 'producer'
                };
                const { data: created } = await supabase.from('profiles').insert(newProfile).select().single();
                if (created) {
                  setProfile(created);
                  setEditName(created.name);
                  setEditRip(created.rip || '');
                  setEditAvatarPreview(created.avatar_url);
                }
              }
            } else {
              setProfile(data);
              setEditName(data.name);
              setEditRip(data.rip || '');
              setEditAvatarPreview(data.avatar_url);
            }
          };

          // ============== CHARGER TRACKS ==============
          const loadTracks = async () => {
            const { data, error } = await supabase.from('tracks').select('*').order('created_at', { ascending: false });
            if (!error && data) setTracks(data);
          };

          // ============== AUTH ==============
          const handleAuth = async (e) => {
            e.preventDefault();
            setAuthError('');
            if (authMode === 'register' && !acceptCGU) {
              setAuthError("Vous devez accepter les CGU.");
              return;
            }
            setAuthLoading(true);
            try {
              if (authMode === 'login') {
                const { error } = await supabase.auth.signInWithPassword({ email: authEmail, password: authPassword });
                if (error) throw error;
              } else {
                const { data, error } = await supabase.auth.signUp({ 
                  email: authEmail, 
                  password: authPassword,
                  options: { data: { full_name: authName || authEmail.split('@')[0] } }
                });
                if (error) throw error;
                if (data.user && !data.session) {
                  alert("Vérifie ton email pour confirmer ton compte !");
                }
              }
            } catch (err) {
              setAuthError(err.message);
            }
            setAuthLoading(false);
          };

          const handleGoogleLogin = async () => {
            const { error } = await supabase.auth.signInWithOAuth({ 
              provider: 'google',
              options: { redirectTo: window.location.origin }
            });
            if (error) alert(error.message);
          };

          const handleLogout = async () => {
            await supabase.auth.signOut();
            if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
            setView('home');
          };

          // ============== SAUVEGARDER PROFIL (AVEC VRAIE PERSISTANCE) ==============
          const handleSaveProfile = async (e) => {
            e.preventDefault();
            setSavingProfile(true);
            try {
              let avatarUrl = profile.avatar_url;

              // Upload nouvelle photo si choisie
              if (editAvatarFile) {
                const fileExt = editAvatarFile.name.split('.').pop();
                const fileName = `${profile.id}-${Date.now()}.${fileExt}`;
                const { error: uploadError } = await supabase.storage
                  .from('avatars')
                  .upload(fileName, editAvatarFile, { upsert: true });
                
                if (uploadError) throw uploadError;

                const { data: { publicUrl } } = supabase.storage.from('avatars').getPublicUrl(fileName);
                avatarUrl = publicUrl;
              }

              // Update profil en DB
              const { data, error } = await supabase
                .from('profiles')
                .update({ name: editName, rip: editRip, avatar_url: avatarUrl })
                .eq('id', profile.id)
                .select()
                .single();

              if (error) throw error;
              
              setProfile(data);
              setEditAvatarPreview(data.avatar_url);
              setEditAvatarFile(null);
              alert("✅ Profil sauvegardé avec succès !");
              setView('dashboard');
            } catch (err) {
              alert("Erreur : " + err.message);
            }
            setSavingProfile(false);
          };

          const handleAvatarChange = (e) => {
            const file = e.target.files[0];
            if (file) {
              setEditAvatarFile(file);
              setEditAvatarPreview(URL.createObjectURL(file));
            }
          };

          // ============== PLAYER ==============
          const togglePlay = async (track) => {
            if (currentTrack?.id === track.id) {
              if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
              else { audioRef.current.play(); setIsPlaying(true); }
            } else {
              setCurrentTrack(track);
              audioRef.current.src = track.audio_url;
              audioRef.current.play();
              setIsPlaying(true);
              await supabase.from('tracks').update({ plays: (track.plays || 0) + 1 }).eq('id', track.id);
              loadTracks();
            }
          };

          // ============== ACHAT ==============
          const handlePurchase = async (item) => {
            if (!session) { alert("Connecte-toi pour acheter !"); return; }
            if (item.type === 'vst') {
              const key = generateVstKey();
              setPurchasedKey(key);
              await supabase.from('sales').insert({
                track_id: item.id, buyer_id: session.user.id,
                license_type: 'vst', amount: item.price_mp3, vst_key: key
              });
            } else {
              if (selectedLicenseType === 'exclusive') {
                await supabase.from('tracks').update({ is_sold: true }).eq('id', item.id);
                loadTracks();
                alert(`🔥 LICENCE EXCLUSIVE : "${item.title}" est désormais à vous !`);
              } else {
                alert("✅ Achat confirmé ! Fichier prêt au téléchargement.");
              }
              const priceMap = { mp3: item.price_mp3, wav: item.price_wav, stems: item.price_stems, exclusive: item.price_exclusive };
              await supabase.from('sales').insert({
                track_id: item.id, buyer_id: session.user.id,
                license_type: selectedLicenseType, amount: priceMap[selectedLicenseType]
              });
              setSelectedLicenseTrack(null);
            }
          };

          // ============== UPLOAD TRACK ==============
          const handleUploadSubmit = async (e) => {
            e.preventDefault();
            if (!session || !profile) { alert("Connecte-toi !"); return; }
            setUploading(true);
            try {
              let coverUrl = 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80';
              let audioUrl = '';

              if (coverFile) {
                const name = `${profile.id}-${Date.now()}-${coverFile.name}`;
                const { error } = await supabase.storage.from('covers').upload(name, coverFile);
                if (!error) coverUrl = supabase.storage.from('covers').getPublicUrl(name).data.publicUrl;
              }
              if (audioFile) {
                const name = `${profile.id}-${Date.now()}-${audioFile.name}`;
                const { error } = await supabase.storage.from('audio').upload(name, audioFile);
                if (!error) audioUrl = supabase.storage.from('audio').getPublicUrl(name).data.publicUrl;
              }

              const { error } = await supabase.from('tracks').insert({
                title: uploadTitle, type: uploadType, genre: uploadGenre, bpm: parseInt(uploadBpm),
                key: uploadKey, producer_id: profile.id, producer_name: profile.name,
                cover_url: coverUrl, audio_url: audioUrl,
                price_mp3: parseInt(priceMp3), price_wav: parseInt(priceWav),
                price_stems: parseInt(priceStems), price_exclusive: parseInt(priceExclusive),
                description: uploadType === 'vst' ? 'Plugin VST3' : `Beat ${uploadGenre}`
              });

              if (error) throw error;
              alert("✅ Publié avec succès !");
              setUploadTitle(''); setCoverFile(null); setAudioFile(null);
              loadTracks();
              setView('dashboard');
            } catch (err) {
              alert("Erreur : " + err.message);
            }
            setUploading(false);
          };

          const handleDeleteTrack = async (id) => {
            if (!confirm("Supprimer cette création ?")) return;
            const { error } = await supabase.from('tracks').delete().eq('id', id);
            if (!error) { alert("Supprimé !"); loadTracks(); }
            else alert(error.message);
          };

          // ============== LOADING ==============
          if (loading) {
            return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;
          }

          // ============== GATE AUTH ==============
          if (!session) {
            return (
              <div className="min-h-screen flex items-center justify-center p-4 relative">
                <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=1600&q=80')] bg-cover bg-center"></div>
                <div className="absolute inset-0 bg-obsidian/90 backdrop-blur-md"></div>
                <div className="relative z-10 w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                  <div className="text-center lg:text-left space-y-6">
                    <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-black border border-goldAccent/50 font-black text-3xl text-goldAccent glow-gold mb-2">Y</div>
                    <h1 className="text-4xl md:text-5xl font-black text-white leading-tight">BIENVENUE SUR <br/><span className="text-gradient-gold">YANRECORDS</span></h1>
                    <p className="text-gray-400 text-lg">La plateforme n°1 en Algérie pour les producteurs et artistes.</p>
                    <div className="hidden lg:flex flex-col gap-4 mt-8">
                      <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-greenPro/20 text-greenPro"><Icon name="check" className="w-4 h-4"/></div> Vendez et achetez des prods</div>
                      <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-cyanNeon/20 text-cyanNeon"><Icon name="check" className="w-4 h-4"/></div> Plugins VST3 natifs exclusifs</div>
                      <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-pinkNeon/20 text-pinkNeon"><Icon name="check" className="w-4 h-4"/></div> Paiement BaridiMob & Edahabia</div>
                    </div>
                  </div>

                  <div className="glass-card p-8 rounded-[2rem] border-cyanNeon/20 shadow-2xl">
                    <div className="flex bg-obsidian rounded-xl p-1 mb-8 border border-borderDark">

                        <div className="p-4 rounded-xl bg-cyanNeon/10 border border-cyanNeon/30"><label className="text-xs font-bold text-cyanNeon block mb-1">Prix VST (DZD)</label><input type="number" value={priceMp3} onChange={e => setPriceMp3(e.target.value)} className="w-full bg-cardDark border border-cyanNeon/50 rounded-lg p-2 text-white" /></div>
                      )}
                      <div><label className="text-xs font-bold text-gray-300 block mb-1">Pochette</label><input type="file" accept="image/*" onChange={e => setCoverFile(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-cyanNeon file:text-black" /></div>
                      <div><label className="text-xs font-bold text-gray-300 block mb-1">Fichier Audio / VST</label><input type="file" onChange={e => setAudioFile(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-goldAccent file:text-black" /></div>
                      <button type="submit" disabled={uploading} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl glow-gold mt-4 disabled:opacity-50">{uploading ? 'UPLOAD EN COURS...' : 'PUBLIER'}</button>
                    </form>
                  </div>
                )}

                {/* ⚙️ SETTINGS AVEC VRAIE PERSISTANCE SUPABASE */}
                {view === 'settings' && profile && (
                  <div className="max-w-2xl mx-auto glass-card p-8 rounded-3xl border-gray-700/50 fade-in">
                    <div className="flex items-center gap-4 mb-8 border-b border-borderDark pb-6">
                      <div className="w-16 h-16 rounded-full bg-borderDark flex items-center justify-center"><Icon name="settings" className="w-8 h-8 text-gray-400" /></div>
                      <div><h2 className="text-3xl font-black text-white">Paramètres</h2><p className="text-sm text-gray-400">Modifications sauvegardées sur le serveur</p></div>
                    </div>
                    <form onSubmit={handleSaveProfile} className="space-y-6">
                      <div className="flex flex-col sm:flex-row items-center gap-6 p-4 bg-obsidian rounded-2xl border border-borderDark">
                        <img src={editAvatarPreview || DEMO_AVATAR} className="w-24 h-24 rounded-full object-cover border-4 border-cyanNeon" />
                        <div className="flex-1 w-full">
                          <label className="text-xs font-bold text-gray-400 block mb-2">Changer la photo de profil</label>
                          <input type="file" accept="image/*" onChange={handleAvatarChange} className="w-full text-sm text-gray-400 file:bg-cyanNeon file:text-black file:border-0 file:rounded-xl file:px-4 file:py-2 file:mr-4 file:font-bold cursor-pointer" />
                        </div>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div><label className="text-xs font-bold text-gray-400 block mb-1">Nom d'Artiste</label><input type="text" required value={editName} onChange={e => setEditName(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none" /></div>
                        <div><label className="text-xs font-bold text-gray-400 block mb-1">Email</label><input type="email" disabled value={session.user.email} className="w-full bg-obsidian/50 border border-borderDark/50 rounded-xl p-3 text-sm text-gray-500" /></div>
                      </div>
                      <div className="p-5 rounded-2xl bg-goldAccent/5 border border-goldAccent/30">
                        <label className="text-xs font-bold text-goldAccent block mb-1 uppercase flex items-center gap-2"><Icon name="dollar" className="w-4 h-4"/> RIP / BaridiMob</label>
                        <p className="text-[11px] text-gray-400 mb-3">Compte pour recevoir vos ventes.</p>
                        <input type="text" value={editRip} onChange={e => setEditRip(e.target.value)} placeholder="00799999000000000012" className="w-full bg-obsidian border border-goldAccent/40 rounded-xl p-3 text-sm text-white focus:border-goldAccent outline-none font-mono" />
                      </div>
                      <button type="submit" disabled={savingProfile} className="w-full bg-white text-black font-black py-4 rounded-xl hover:bg-gray-200 mt-4 shadow-lg disabled:opacity-50">
                        {savingProfile ? 'ENREGISTREMENT...' : '✅ ENREGISTRER'}
                      </button>
                    </form>
                  </div>
                )}
              </div>

              {/* MODAL ACHAT */}
              {selectedLicenseTrack && (
                <div className="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4">
                  <div className="glass-card rounded-2xl max-w-lg w-full p-6 relative">
                    <button onClick={() => { setSelectedLicenseTrack(null); setPurchasedKey(null); }} className="absolute top-4 right-4 text-gray-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
                    <h3 className="text-xl font-black text-white mb-4">Achat : {selectedLicenseTrack.title}</h3>
                    {selectedLicenseTrack.type === 'vst' && !purchasedKey && (
                      <div>
                        <div className="p-4 rounded-xl border border-cyanNeon bg-cyanNeon/10 mb-6"><h4 className="font-bold text-white">Licence VST3</h4><span className="text-xl font-black text-goldAccent block mt-2">{selectedLicenseTrack.price_mp3.toLocaleString()} DZD</span></div>
                        <button onClick={() => handlePurchase(selectedLicenseTrack)} className="w-full bg-cyanNeon text-black font-black py-3 rounded-xl">Payer & Générer la Clé</button>
                      </div>
                    )}
                    {selectedLicenseTrack.type === 'vst' && purchasedKey && (
                      <div className="bg-black/80 border border-greenPro rounded-xl p-4 text-center"><span className="text-xs font-bold text-greenPro block mb-2">VOTRE CLÉ :</span><input type="text" readOnly value={purchasedKey} className="w-full text-center font-mono text-lg font-bold bg-cardDark border border-greenPro text-white p-2 rounded-lg select-all" /></div>
                    )}
                    {selectedLicenseTrack.type === 'beat' && (
                      <div className="space-y-3 mb-6">
                        <div onClick={() => setSelectedLicenseType('mp3')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'mp3' ? 'border-goldAccent bg-goldAccent/10' : 'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span>MP3 Lease</span><span className="text-goldAccent">{selectedLicenseTrack.price_mp3.toLocaleString()} DZD</span></div></div>
                        <div onClick={() => setSelectedLicenseType('wav')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'wav' ? 'border-goldAccent bg-goldAccent/10' : 'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span>WAV</span><span className="text-goldAccent">{selectedLicenseTrack.price_wav.toLocaleString()} DZD</span></div></div>
                        <div onClick={() => setSelectedLicenseType('exclusive')} className={`p-3 rounded-xl border cursor-pointer ${selectedLicenseType === 'exclusive' ? 'border-red-500 bg-red-500/10' : 'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span className="text-red-400">🔥 EXCLUSIVE</span><span className="text-goldAccent">{selectedLicenseTrack.price_exclusive.toLocaleString()} DZD</span></div></div>
                        <button onClick={() => handlePurchase(selectedLicenseTrack)} className="w-full bg-goldAccent text-black font-black py-3 rounded-xl mt-4">Payer</button>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* PLAYER */}
              {currentTrack && currentTrack.type === 'beat' && (
                <div className="fixed bottom-0 inset-x-0 z-50 glass border-t border-goldAccent/30 px-6 py-3 flex items-center justify-between">
                  <div className="flex items-center gap-4 w-1/4"><img src={currentTrack.cover_url} className="w-12 h-12 rounded-lg" /><div className="hidden md:block"><h4 className="font-bold text-sm text-white">{currentTrack.title}</h4><p className="text-xs text-goldAccent font-bold">{currentTrack.producer_name}</p></div></div>
                  <div className="flex-1 flex justify-center"><button onClick={() => togglePlay(currentTrack)} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center"><Icon name={isPlaying ? "pause" : "play"} className="w-5 h-5" /></button></div>
                  <div className="w-1/4 flex justify-end"><button onClick={() => { setSelectedLicenseTrack(currentTrack); setSelectedLicenseType('mp3'); }} className="bg-goldAccent text-black font-bold px-4 py-2 rounded-xl text-xs">Acheter</button></div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
