// Identifiant aléatoire cryptographique (pour simuler un "ID machine")
function randomId(n){
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const a = new Uint32Array(n);
  crypto.getRandomValues(a);
  return Array.from(a, x => c[x % c.length]).join('');
}
function getMachineId(){

  }catch(e){ return 'PC-' + randomId(6); }
}

// Error Boundary
class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = { hasError:false, error:null }; }
  static getDerivedStateFromError(error){ return { hasError:true, error }; }
  componentDidCatch(error, info){ console.error('ErrorBoundary caught:', error, info); }
  render(){
    if(this.state.hasError){
      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="glass-card p-8 rounded-2xl max-w-md text-center">
            <div className="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg className="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            </div>
            <h2 className="text-2xl font-black text-white mb-2">Oups !</h2>
            <p className="text-gray-400 mb-6">Une erreur est survenue. Veuillez recharger la page.</p>
            <button onClick={()=>window.location.reload()} className="bg-cyanNeon text-black font-bold px-6 py-3 rounded-xl">Recharger</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function Toasts({items, onRemove}){
  return <div className="fixed top-20 right-4 z-[200] flex flex-col gap-3 max-w-sm">
    {items.map(t=>(
      <div key={t.id} className="toast-anim glass-card rounded-xl p-4 flex items-center gap-3 border-l-4" style={{borderLeftColor: t.type==='error'?'#ef4444':t.type==='success'?'#10b981':'#00f0ff'}}>
        <div className={`w-8 h-8 rounded-full flex items-center justify-center ${t.type==='error'?'bg-red-500/20 text-red-400':t.type==='success'?'bg-greenPro/20 text-greenPro':'bg-cyanNeon/20 text-cyanNeon'}`}>
          <Icon name={t.type==='error'?'x':t.type==='success'?'check':'activity'} className="w-4 h-4"/>
        </div>
        <p className="text-sm font-bold text-white flex-1">{t.msg}</p>
        <button onClick={()=>onRemove(t.id)} className="text-gray-500 hover:text-white"><Icon name="x" className="w-4 h-4"/></button>
      </div>
    ))}
  </div>;
}

    return ()=>{
      subscription.unsubscribe();
      channel.unsubscribe();
      audio.removeEventListener('ended',onEnd);
      audio.removeEventListener('timeupdate',onTimeUpdate);
      audio.removeEventListener('loadedmetadata',onLoadedMetadata);
      audio.removeEventListener('error',onError);
    };
  },[]);

  const loadInitialTracks = async()=>{
    const {data} = await sb.from('tracks').select('*').order('created_at',{ascending:false}).limit(20);

      setHasMore(data.length >= 20);
      setVisibleTracks(20);
    }
    setTracksLoading(false);
  };

    const {data} = await sb.from('tracks').select('*').order('created_at',{ascending:false}).range(visibleTracks, visibleTracks+19);
    if(data && data.length > 0){
      setTracks(prev => [...prev, ...data]);
      setVisibleTracks(prev => prev + data.length);
      setHasMore(data.length >= 20);
    } else {
      setHasMore(false);
    }
  };

      setProfile(data);
      setEditName(data.name);
      setEditRip(data.rip||'');
      setEditAvatarPreview(data.avatar_url);

      setTimeout(()=>loadProfile(uid),1500);
    }
  };

  const handleAuth = async(e)=>{

      if(authMode==='login'){

        if(error) throw error;
        toast("Connecté ! 🎵");
      } else {
        const {data,error} = await sb.auth.signUp({email:authEmail,password:authPass,options:{data:{full_name:authName||authEmail.split('@')[0]}}});
        if(error) throw error;
        if(data.user && !data.session) toast("Vérifie ton email pour confirmer !","info");
        else toast("Compte créé ! 🎵");
      }
    }catch(err){setAuthErr(err.message);}
    setAuthLoad(false);
  };

  const handleGoogle = async()=>{

    if(error) toast(error.message,'error');

  const handleLogout = async()=>{
    audioRef.current.pause(); setIsPlaying(false);
    await sb.auth.signOut();
    setView('home'); toast("Déconnecté.");
  };

  const handleSaveProfile = async(e)=>{
    e.preventDefault(); setSaving(true);
    try{

      if(editAvatarFile){
        const ext = editAvatarFile.name.split('.').pop();
        const name = `${profile.id}-${Date.now()}.${ext}`;

        if(ue) throw ue;
        avatarUrl = sb.storage.from('avatars').getPublicUrl(name).data.publicUrl;
      }

      if(error) throw error;
      setProfile(data); setEditAvatarPreview(data.avatar_url); setEditAvatarFile(null);
      toast("Profil sauvegardé ! ✅"); setView('dashboard');

    setSaving(false);
  };

  const togglePlay = async(track)=>{
    if(!track.audio_url){toast("Pas d'audio disponible","error");return;}
    if(currentTrack?.id===track.id){
      if(isPlaying){audioRef.current.pause();setIsPlaying(false);}
      else{audioRef.current.play().catch(()=>{});setIsPlaying(true);}
    } else {
      setCurrentTrack(track); audioRef.current.src = track.audio_url;
      audioRef.current.volume = isMuted ? 0 : volume;
      audioRef.current.play().catch(()=>{}); setIsPlaying(true);
      const {error} = await sb.rpc('increment_plays',{track_id:track.id});
      if(!error) setTracks(prev=>prev.map(t=>t.id===track.id?{...t,plays:(t.plays||0)+1}:t));
    }
  };

  const handleSeek = (e) => {
    const time = (e.target.value / 100) * audioDuration;
    audioRef.current.currentTime = time;
    setAudioProgress(e.target.value);
  };

  const handleVolumeChange = (e) => {
    const vol = parseFloat(e.target.value);
    setVolume(vol);
    audioRef.current.volume = vol;
    setIsMuted(vol === 0);
  };

  const toggleMute = () => {
    if(isMuted){ audioRef.current.volume = volume || 0.5; setIsMuted(false); }
    else { audioRef.current.volume = 0; setIsMuted(true); }
  };

  const formatTime = (seconds) => {
    if(!seconds || !isFinite(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs.toString().padStart(2, '0')}`;
  };

    if(!item) return 0;
    if(item.type==='vst') return item.price_mp3||0;
    const map = {mp3:item.price_mp3, wav:item.price_wav, stems:item.price_stems, exclusive:item.price_exclusive};
    return map[lic] ?? item.price_mp3 ?? 0;
  };

  const handlePurchaseInit = (item) => {

    setShowPurchaseConfirm(true);
  };

  const confirmPurchase = async() => {

    const item = pendingPurchase;
    setPurchasing(true);
    try{
      if(item.type==='vst'){

        const {data,error} = await sb.rpc('purchase_vst',{p_track_id:item.id});
        if(error) throw error;
        setGeneratedKey(data.key);
        setKeyAlreadyOwned(!!data.already_owned);
        toast(data.already_owned ? "Tu possèdes déjà ce VST — voici ta clé 🔑" : "Clé VST unique générée ! 🔑", data.already_owned ? 'info' : 'success');

        setSelectedTrack(null);

  const handleUpload = async(e)=>{
    e.preventDefault();

    if(upAudio){
      if(upAudio.size > MAX_FILE_MB*1024*1024){toast(`Fichier trop lourd (max ${MAX_FILE_MB}MB)`,"error");return;}
      if(upType==='beat'){
        if(!/\.(mp3|wav)$/i.test(upAudio.name)){toast("Format audio invalide (MP3/WAV uniquement)","error");return;}
      } else {
        if(!/\.(zip|rar|7z|exe|msi|dmg|pkg)$/i.test(upAudio.name)){toast("Format VST invalide (ZIP, RAR, 7Z, EXE, MSI, DMG, PKG)","error");return;}
      }

    if(upCover && upCover.size > 5*1024*1024){toast("Image trop lourde (max 5MB)","error");return;}

          const {error} = await sb.storage.from('vst-files').upload(path, upAudio);

          filePath = path;
        } else {
          const n=`${profile.id}-${Date.now()}-audio.${upAudio.name.split('.').pop()}`;
          const {error}=await sb.storage.from('audio').upload(n,upAudio);
          if(error) throw new Error("Upload audio échoué : " + error.message);
          audioUrl=sb.storage.from('audio').getPublicUrl(n).data.publicUrl;
        }
      }
      const row = {
        title:upTitle.trim(),type:upType,genre:upGenre,bpm:parseInt(upBpm),key:upKey,
        producer_id:profile.id,producer_name:profile.name,
        cover_url:coverUrl,audio_url:audioUrl,
        price_mp3:parseInt(upMp3),price_wav:parseInt(upWav),
        price_stems:parseInt(upStems),price_exclusive:parseInt(upExcl),
        description: upDesc.trim() || (upType==='vst'?'Plugin VST professionnel':'Beat '+upGenre)
      };
      if(filePath) row.file_path = filePath;
      const {error}=await sb.from('tracks').insert(row);
      if(error) throw error;
      toast("Publié avec succès ! 🎵");
      setUpTitle(''); setUpDesc(''); setUpCover(null); setUpAudio(null);
      loadInitialTracks(); setView(upType==='vst'?'vsts':'dashboard');
    }catch(err){toast(err.message,'error');}
    setUpLoad(false);
  };

  const handleDelete = async(id)=>{
    if(!confirm("Supprimer ?")) return;
    const {error} = await sb.from('tracks').delete().eq('id',id);

      toast(error.code==='23503' ? "Impossible : ce produit a déjà été vendu (les clés des acheteurs doivent rester valides)." : error.message, 'error');
      return;

    toast("Supprimé."); loadInitialTracks();
  };

  const filteredBeats = tracks.filter(t=>{
    if(t.type!=='beat') return false;
    if(search){const q=search.toLowerCase();if(!(t.title||'').toLowerCase().includes(q)&&!(t.producer_name||'').toLowerCase().includes(q)&&!(t.genre||'').toLowerCase().includes(q))return false;}
    if(filterGenre!=='Tous'&&t.genre!==filterGenre) return false;
    return true;
  });
  const vstList = tracks.filter(t=>t.type==='vst');
  const myTracks = profile ? tracks.filter(t=>t.producer_id===profile.id) : [];
  const myVstPurchases = myPurchases.filter(p=>p.license_type==='vst' && p.vst_key);

  if(loading) return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;

  // ============================================
  // PORTAIL AUTH
  // ============================================
  if(!session){

        <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1600&q=80')] bg-cover bg-center"></div>
        <div className="absolute inset-0 bg-obsidian/90 backdrop-blur-md"></div>
        <div className="relative z-10 w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-12 items-center fade-in">
          <div className="text-center lg:text-left space-y-6">
            <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-black border border-goldAccent/50 font-black text-3xl text-goldAccent glow-gold">Y</div>
            <h1 className="text-4xl md:text-5xl font-black text-white leading-tight">BIENVENUE SUR<br/><span className="text-gradient-gold">YANRECORDS</span></h1>
            <p className="text-gray-400 text-lg">La marketplace musicale n°1 en Algérie. Beats, plugins VST et licences exclusives.</p>
            <div className="hidden lg:flex flex-col gap-4 mt-8">

              <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-cyanNeon/20 text-cyanNeon"><Icon name="check" className="w-4 h-4"/></div>Plugins VST professionnels exclusifs</div>
              <div className="flex items-center gap-3 text-sm font-bold text-white"><div className="p-1 rounded-full bg-pinkNeon/20 text-pinkNeon"><Icon name="check" className="w-4 h-4"/></div>Paiement BaridiMob, Edahabia & PayPal</div>
            </div>
          </div>

          <div className="glass-card p-8 rounded-[2rem] border-cyanNeon/20 shadow-2xl">
            <div className="flex bg-obsidian rounded-xl p-1 mb-8 border border-borderDark">

              <button onClick={()=>{setAuthMode('register');setAuthErr('');}} className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition ${authMode==='register'?'bg-goldAccent text-black':'text-gray-400 hover:text-white'}`}>Créer un compte</button>

              <div><label className="text-xs font-bold text-gray-400 block mb-1">Email</label><input type="email" required value={authEmail} onChange={e=>setAuthEmail(e.target.value)} placeholder="contact@studio.com" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none"/></div>
              <div><label className="text-xs font-bold text-gray-400 block mb-1">Mot de passe (6+)</label><input type="password" required minLength="6" maxLength="100" value={authPass} onChange={e=>setAuthPass(e.target.value)} placeholder="••••••••" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none"/></div>
              {authMode==='register'&&<div className="flex items-start gap-3"><input type="checkbox" checked={acceptCGU} onChange={e=>setAcceptCGU(e.target.checked)} className="mt-1 accent-goldAccent"/><label className="text-xs text-gray-400">J'accepte les <span onClick={()=>setShowCGU(true)} className="text-goldAccent cursor-pointer hover:underline font-bold">CGU</span>.</label></div>}

              <button type="submit" disabled={authLoad} className={`w-full font-black py-3.5 rounded-xl mt-4 transition disabled:opacity-50 ${authMode==='login'?'bg-cyanNeon text-black glow-cyan':'bg-goldAccent text-black glow-gold'}`}>{authLoad?'....':(authMode==='login'?'CONNEXION':"S'INSCRIRE")}</button>
            </form>
            <div className="flex items-center gap-4 my-6"><div className="h-px bg-borderDark flex-1"/><span className="text-xs font-bold text-gray-500">OU</span><div className="h-px bg-borderDark flex-1"/></div>

              Continuer avec Google
            </button>
          </div>
        </div>
        {showCGU&&<div className="fixed inset-0 z-[150] bg-black/90 backdrop-blur-md flex items-center justify-center p-4"><div className="glass-card rounded-2xl max-w-2xl w-full p-8 max-h-[85vh] flex flex-col"><h3 className="text-2xl font-black text-goldAccent mb-4">CGU YANrecords</h3><div className="flex-1 overflow-y-auto pr-4 space-y-4 text-sm text-gray-300"><p><strong>1.</strong> YANrecords est une marketplace pour beats et VSTs.</p><p><strong>2.</strong> Vous devez être l'auteur original de vos uploads.</p><p><strong>3.</strong> Licence Exclusive = beat retiré du catalogue.</p><p><strong>4.</strong> Commission plateforme : 15%.</p><p><strong>5.</strong> Chaque clé VST est unique, personnelle et limitée à 3 machines.</p></div><button onClick={()=>{setAcceptCGU(true);setShowCGU(false);}} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl mt-6">J'ACCEPTE</button></div></div>}
      </div>
    );
  }

  // ============================================
  // INTERFACE PRINCIPALE
  // ============================================
  return(
    <div className="relative">
      <Toasts items={toasts} onRemove={(id)=>setToasts(p=>p.filter(t=>t.id!==id))}/>
      {showMenu&&<div className="fixed inset-0 z-40" onClick={()=>setShowMenu(false)}/>}

      {/* NAVBAR */}
      <nav className="glass fixed top-0 w-full z-50 px-4 md:px-6 py-4 flex items-center justify-between">

          <div className="w-10 h-10 rounded-lg bg-black border border-goldAccent/50 flex items-center justify-center font-black text-xl text-goldAccent glow-gold">Y</div>

          <div className="relative">

              <span className="text-xs font-bold text-white hidden md:block max-w-[100px] truncate">{profile?.name||'User'}</span>

            <div className="flex gap-3">
              <button onClick={()=>setView('purchases')} className="border border-greenPro text-greenPro font-black px-5 py-3 rounded-xl flex items-center gap-2 hover:bg-greenPro/10"><Icon name="key" className="w-4 h-4"/>Mes achats</button>
              <button onClick={()=>setView('upload')} className="bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-black px-6 py-3 rounded-xl flex items-center gap-2 glow-cyan"><Icon name="upload" className="w-4 h-4"/>Uploader</button>
            </div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="glass-card p-6 rounded-2xl border-cyanNeon/30"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400">REVENUS</span><Icon name="dollar" className="w-5 h-5 text-cyanNeon"/></div><span className="text-3xl font-black text-cyanNeon">{fmt(profile.balance)} DZD</span></div>
            <div className="glass-card p-6 rounded-2xl border-goldAccent/30"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400">ÉCOUTES</span><Icon name="activity" className="w-5 h-5 text-goldAccent"/></div><span className="text-3xl font-black text-goldAccent">{fmt(myTracks.reduce((s,t)=>s+(t.plays||0),0) || profile.total_plays)}</span></div>
            <div className="glass-card p-6 rounded-2xl border-pinkNeon/30"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400">CRÉATIONS</span><Icon name="dashboard" className="w-5 h-5 text-pinkNeon"/></div><span className="text-3xl font-black text-pinkNeon">{myTracks.length}</span></div>
          </div>
          <div className="glass-card rounded-2xl p-6">
            <h3 className="text-lg font-bold text-white mb-4">Mes publications</h3>
            {myTracks.length===0?<p className="text-gray-400 text-sm text-center py-6">Aucune création. <button onClick={()=>setView('upload')} className="text-cyanNeon underline">Commence !</button></p>:
            <div className="space-y-3">{myTracks.map(t=>(
              <div key={t.id} className="flex justify-between items-center p-3 rounded-xl bg-obsidian/60 border border-borderDark">
                <div className="flex items-center gap-4"><img src={t.cover_url||DEFAULT_COVER} className="w-12 h-12 rounded-lg object-cover"/><div><h4 className="font-bold text-white text-sm">{t.title}{t.is_sold&&<span className="bg-red-600 text-white text-[9px] px-1 rounded ml-2">SOLD</span>}</h4><p className="text-xs text-gray-400">{(t.type||'').toUpperCase()} • {t.type==='vst'?(t.file_path?'Fichier privé ✓':'⚠️ Pas de fichier'):`${t.plays||0} écoutes`}</p></div></div>
                <div className="flex items-center gap-3"><span className="text-xs font-bold text-goldAccent">{fmt(t.price_mp3)} DZD</span><button onClick={()=>handleDelete(t.id)} className="p-2 bg-red-950/60 text-red-400 hover:bg-red-600 hover:text-white rounded-lg"><Icon name="trash" className="w-4 h-4"/></button></div>
              </div>
            ))}</div>}
          </div>
        </div>}

        {/* ===== UPLOAD ===== */}
        {view==='upload'&&profile&&<div className="max-w-2xl mx-auto glass-card p-8 rounded-2xl border-goldAccent/40 fade-in">
          <h2 className="text-2xl font-black text-white mb-2">Nouvelle création</h2>
          <p className="text-xs text-gray-400 mb-6">Publié par : <span className="text-goldAccent font-bold">{profile.name}</span></p>
          <form onSubmit={handleUpload} className="space-y-4">
            <div><label className="text-xs font-bold text-gray-300 block mb-1">Titre (max 100)</label><input type="text" required maxLength="100" value={upTitle} onChange={e=>setUpTitle(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none"/></div>
            <div className={`grid gap-3 ${upType==='beat'?'grid-cols-2 md:grid-cols-4':'grid-cols-1'}`}>
              <div><label className="text-xs font-bold text-gray-300 block mb-1">Type</label><select value={upType} onChange={e=>{setUpType(e.target.value);setUpAudio(null);}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"><option value="beat">Beat</option><option value="vst">VST</option></select></div>
              {upType==='beat'&&<>
                <div><label className="text-xs font-bold text-gray-300 block mb-1">Genre</label><select value={upGenre} onChange={e=>setUpGenre(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white">{GENRES.slice(1).map(g=><option key={g} value={g}>{g}</option>)}</select></div>
                <div><label className="text-xs font-bold text-gray-300 block mb-1">BPM (40-300)</label><input type="number" min="40" max="300" value={upBpm} onChange={e=>setUpBpm(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"/></div>
                <div><label className="text-xs font-bold text-gray-300 block mb-1">Gamme</label><input type="text" maxLength="10" value={upKey} onChange={e=>setUpKey(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"/></div>
              </>}
            </div>
            {upType==='beat'?<div className="p-4 rounded-xl bg-obsidian/60 border border-borderDark space-y-3"><span className="text-xs font-bold text-goldAccent block uppercase">Prix (DZD)</span><div className="grid grid-cols-2 gap-3">
              <div><label className="text-[11px] text-gray-400">MP3</label><input type="number" min="0" value={upMp3} onChange={e=>setUpMp3(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
              <div><label className="text-[11px] text-gray-400">WAV</label><input type="number" min="0" value={upWav} onChange={e=>setUpWav(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
              <div><label className="text-[11px] text-gray-400">Stems</label><input type="number" min="0" value={upStems} onChange={e=>setUpStems(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
              <div><label className="text-[11px] text-gray-400">Exclusif</label><input type="number" min="0" value={upExcl} onChange={e=>setUpExcl(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
            </div></div>:<div className="p-4 rounded-xl bg-cyanNeon/10 border border-cyanNeon/30 space-y-2">
              <label className="text-xs font-bold text-cyanNeon block mb-1">Prix VST (DZD)</label>
              <input type="number" min="0" value={upMp3} onChange={e=>setUpMp3(e.target.value)} className="w-full bg-cardDark border border-cyanNeon/50 rounded-lg p-2 text-white"/>
              <p className="text-[11px] text-gray-400">🔑 Chaque acheteur recevra une clé unique (3 machines max). Le fichier est stocké en privé : seuls les acheteurs peuvent le télécharger.</p>
            </div>}
            <div><label className="text-xs font-bold text-gray-300 block mb-1">Description (optionnel)</label><textarea maxLength="300" rows="2" value={upDesc} onChange={e=>setUpDesc(e.target.value)} placeholder={upType==='vst'?'Ex : Synthé analogique, 200 presets, VST3/AU Windows & Mac':'Ex : Drill sombre, piano + 808 glissés'} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none resize-none"/></div>
            <div><label className="text-xs font-bold text-gray-300 block mb-1">Pochette (max 5MB)</label><input type="file" accept="image/*" onChange={e=>setUpCover(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-cyanNeon file:text-black"/></div>
            <div>
              <label className="text-xs font-bold text-gray-300 block mb-1">{upType==='vst'?`Fichier du plugin — ZIP, RAR, 7Z, EXE, MSI, DMG, PKG (max ${MAX_FILE_MB}MB) *`:`Fichier audio — MP3 / WAV (max ${MAX_FILE_MB}MB)`}</label>
              <input key={upType} type="file" accept={upType==='vst'?'.zip,.rar,.7z,.exe,.msi,.dmg,.pkg':'.mp3,.wav,audio/mpeg,audio/wav'} onChange={e=>setUpAudio(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-goldAccent file:text-black"/>
            </div>
            <button type="submit" disabled={upLoad} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl glow-gold mt-4 disabled:opacity-50">{upLoad?'UPLOAD EN COURS...':'PUBLIER SUR YANRECORDS'}</button>
          </form>
        </div>}

        {/* ===== SETTINGS ===== */}
        {view==='settings'&&profile&&<div className="max-w-2xl mx-auto glass-card p-8 rounded-3xl fade-in">
          <div className="flex items-center gap-4 mb-8 border-b border-borderDark pb-6">
            <div className="w-16 h-16 rounded-full bg-borderDark flex items-center justify-center"><Icon name="settings" className="w-8 h-8 text-gray-400"/></div>
            <div><h2 className="text-3xl font-black text-white">Paramètres</h2><p className="text-sm text-gray-400">Sauvegardé sur le serveur</p></div>
          </div>
          <form onSubmit={handleSaveProfile} className="space-y-6">
            <div className="flex flex-col sm:flex-row items-center gap-6 p-4 bg-obsidian rounded-2xl border border-borderDark">
              <img src={editAvatarPreview||profile.avatar_url} className="w-24 h-24 rounded-full object-cover border-4 border-cyanNeon"/>
              <div className="flex-1 w-full"><label className="text-xs font-bold text-gray-400 block mb-2">Changer la photo</label><input type="file" accept="image/*" onChange={e=>{const f=e.target.files[0];if(f){setEditAvatarFile(f);setEditAvatarPreview(URL.createObjectURL(f));}}} className="w-full text-sm text-gray-400 file:bg-cyanNeon file:text-black file:border-0 file:rounded-xl file:px-4 file:py-2 file:mr-4 file:font-bold cursor-pointer"/></div>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div><label className="text-xs font-bold text-gray-400 block mb-1">Nom d'Artiste</label><input type="text" required maxLength="50" value={editName} onChange={e=>setEditName(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none"/></div>
              <div><label className="text-xs font-bold text-gray-400 block mb-1">Email</label><input type="email" disabled value={session.user.email} className="w-full bg-obsidian/50 border border-borderDark/50 rounded-xl p-3 text-sm text-gray-500"/></div>
            </div>
            <div className="p-5 rounded-2xl bg-goldAccent/5 border border-goldAccent/30">
              <label className="text-xs font-bold text-goldAccent block mb-1 uppercase flex items-center gap-2"><Icon name="dollar" className="w-4 h-4"/>RIP / BaridiMob</label>
              <p className="text-[11px] text-gray-400 mb-3">Pour recevoir vos ventes.</p>
              <input type="text" value={editRip} onChange={e=>setEditRip(e.target.value)} placeholder="00799999000000000012" className="w-full bg-obsidian border border-goldAccent/40 rounded-xl p-3 text-sm text-white focus:border-goldAccent outline-none font-mono"/>
            </div>
            <button type="submit" disabled={saving} className="w-full bg-white text-black font-black py-4 rounded-xl hover:bg-gray-200 mt-4 shadow-lg disabled:opacity-50">{saving?'ENREGISTREMENT...':'✅ ENREGISTRER'}</button>
          </form>
        </div>}
      </div>

      {/* MODAL ACHAT */}
      {selectedTrack&&<div className="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4">
        <div className="glass-card rounded-2xl max-w-lg w-full p-6 relative">
          <button onClick={()=>{setSelectedTrack(null);setGeneratedKey(null);}} className="absolute top-4 right-4 text-gray-400 hover:text-white"><Icon name="x" className="w-5 h-5"/></button>
          <h3 className="text-xl font-black text-white mb-4">{generatedKey?'Licence':'Achat'} : {selectedTrack.title}</h3>
          {selectedTrack.type==='vst'&&!generatedKey&&<div>
            <div className="p-4 rounded-xl border border-cyanNeon bg-cyanNeon/10 mb-6">
              <h4 className="font-bold text-white">Licence VST Complète</h4>
              <p className="text-[11px] text-gray-400 mt-1">🔑 Clé unique • 🖥️ 3 machines • ⬇️ Téléchargement inclus</p>
              <span className="text-xl font-black text-goldAccent block mt-2">{fmt(selectedTrack.price_mp3)} DZD</span>
            </div>
            <button onClick={()=>handlePurchaseInit(selectedTrack)} className="w-full bg-cyanNeon text-black font-black py-3 rounded-xl glow-cyan">Payer & Générer la Clé</button>
          </div>}
          {selectedTrack.type==='vst'&&generatedKey&&<div className="bg-black/80 border border-greenPro rounded-xl p-5 text-center space-y-3">
            <div className="w-10 h-10 rounded-full bg-greenPro/20 text-greenPro mx-auto flex items-center justify-center"><Icon name="check" className="w-6 h-6"/></div>
            <span className="text-xs font-bold text-greenPro block">{keyAlreadyOwned?'TU POSSÈDES DÉJÀ CE VST — TA CLÉ :':'VOTRE CLÉ VST UNIQUE :'}</span>
            <input type="text" readOnly value={generatedKey} onFocus={e=>e.target.select()} className="w-full text-center font-mono text-lg font-bold bg-cardDark border border-greenPro text-white p-3 rounded-xl select-all"/>
            <div className="grid grid-cols-2 gap-2">
              <button onClick={()=>copyText(generatedKey)} className="bg-greenPro text-black font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1"><Icon name="copy" className="w-3 h-3"/>Copier</button>
              <button onClick={()=>{setSelectedTrack(null);setGeneratedKey(null);setView('purchases');}} className="bg-cardDark border border-borderDark text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1"><Icon name="download" className="w-3 h-3"/>Mes achats</button>
            </div>
            <button onClick={()=>{setVerifyKey(generatedKey);setVerifyResult(null);setSelectedTrack(null);setGeneratedKey(null);setView('verify');}} className="w-full text-xs text-cyanNeon font-bold hover:underline">🔍 Tester cette clé maintenant →</button>
            <p className="text-[11px] text-gray-400">Copiez cette clé pour activer votre plugin.</p>
          </div>}
          {selectedTrack.type==='beat'&&<div className="space-y-3">
            <div onClick={()=>setLicenseType('mp3')} className={`p-3 rounded-xl border cursor-pointer ${licenseType==='mp3'?'border-goldAccent bg-goldAccent/10':'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span>MP3 Lease</span><span className="text-goldAccent">{fmt(selectedTrack.price_mp3)} DZD</span></div></div>
            <div onClick={()=>setLicenseType('wav')} className={`p-3 rounded-xl border cursor-pointer ${licenseType==='wav'?'border-goldAccent bg-goldAccent/10':'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span>WAV Standard</span><span className="text-goldAccent">{fmt(selectedTrack.price_wav)} DZD</span></div></div>
            <div onClick={()=>setLicenseType('stems')} className={`p-3 rounded-xl border cursor-pointer ${licenseType==='stems'?'border-goldAccent bg-goldAccent/10':'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span>Trackout Stems</span><span className="text-goldAccent">{fmt(selectedTrack.price_stems)} DZD</span></div></div>
            <div onClick={()=>setLicenseType('exclusive')} className={`p-3 rounded-xl border cursor-pointer ${licenseType==='exclusive'?'border-red-500 bg-red-500/10':'border-borderDark'}`}><div className="flex justify-between font-bold text-white"><span className="text-red-400">🔥 EXCLUSIVE</span><span className="text-goldAccent">{fmt(selectedTrack.price_exclusive)} DZD</span></div></div>
            <button onClick={()=>handlePurchaseInit(selectedTrack)} className="w-full bg-goldAccent text-black font-black py-3.5 rounded-xl mt-4 glow-gold">Payer</button>
          </div>}
        </div>
      </div>}

      {/* MODAL CONFIRMATION ACHAT (au-dessus du modal d'achat) */}
      {showPurchaseConfirm && pendingPurchase && (
        <div className="fixed inset-0 z-[110] bg-black/80 flex items-center justify-center p-4">
          <div className="glass-card rounded-2xl max-w-md w-full p-6 relative">
            <button onClick={()=>{if(!purchasing){setShowPurchaseConfirm(false);setPendingPurchase(null);}}} className="absolute top-4 right-4 text-gray-400 hover:text-white"><Icon name="x" className="w-5 h-5"/></button>
            <div className="w-12 h-12 bg-goldAccent/20 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="dollar" className="w-6 h-6 text-goldAccent"/></div>
            <h3 className="text-xl font-black text-white text-center mb-2">Confirmer l'achat</h3>
            <p className="text-gray-400 text-center text-sm mb-6">
              Licence <strong className="text-white">{pendingPurchase.type==='vst'?'VST':licenseType.toUpperCase()}</strong> pour <strong className="text-white">"{pendingPurchase.title}"</strong> : <strong className="text-goldAccent">{fmt(getPrice(pendingPurchase, licenseType))} DZD</strong>. Cette action est irréversible.
            </p>
            <div className="flex gap-3">
              <button disabled={purchasing} onClick={()=>{setShowPurchaseConfirm(false);setPendingPurchase(null);}} className="flex-1 bg-cardDark text-white font-bold py-3 rounded-xl hover:bg-white/10 transition disabled:opacity-50">Annuler</button>
              <button disabled={purchasing} onClick={confirmPurchase} className="flex-1 bg-goldAccent text-black font-black py-3 rounded-xl glow-gold hover:scale-105 transition disabled:opacity-50">{purchasing?'...':'Confirmer'}</button>
            </div>
          </div>
        </div>
      )}

      {/* PLAYER */}
      {currentTrack&&<div className="fixed bottom-0 inset-x-0 z-50 glass border-t border-goldAccent/30 px-4 md:px-6 py-3 flex flex-col gap-2 safe-bottom">
        <div className="w-full flex items-center gap-3 text-xs text-gray-400 font-mono">
          <span>{formatTime(audioCurrentTime)}</span>
          <input type="range" min="0" max="100" value={audioProgress} onChange={handleSeek} className="flex-1 h-1 bg-borderDark rounded-lg appearance-none cursor-pointer" style={{background:`linear-gradient(to right, #00f0ff ${audioProgress}%, #222638 ${audioProgress}%)`}}/>
          <span>{formatTime(audioDuration)}</span>
        </div>
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-3 w-1/3 min-w-0">
            <img src={currentTrack.cover_url||DEFAULT_COVER} className="w-11 h-11 rounded-lg object-cover"/>
            <div className="min-w-0 hidden md:block">
              <h4 className="font-bold text-sm text-white truncate">{currentTrack.title}</h4>
              <p className="text-xs text-goldAccent font-bold truncate">{currentTrack.producer_name}</p>
            </div>
          </div>
          <div className="flex items-center gap-4">
            <button onClick={toggleMute} className="text-gray-400 hover:text-white"><Icon name={isMuted?"volumeMute":"volume"} className="w-5 h-5"/></button>
            <input type="range" min="0" max="1" step="0.1" value={isMuted?0:volume} onChange={handleVolumeChange} className="w-20 hidden md:block"/>
            <button onClick={()=>togglePlay(currentTrack)} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-110 transition"><Icon name={isPlaying?"pause":"play"} className="w-5 h-5"/></button>
          </div>
          <div className="w-1/3 flex justify-end">
            <button onClick={()=>{setSelectedTrack(currentTrack);setLicenseType('mp3');}} className="bg-goldAccent text-black font-bold px-3 md:px-4 py-2 rounded-xl text-xs">Acheter</button>
          </div>
        </div>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary>
    <App/>
  </ErrorBoundary>
);
</script>
</body>
</html>
