<h3 className="text-3xl font-black mb-6 text-white border-l-4 border-cyanNeon pl-4">PLUGINS VST PROFESSIONNELS</h3>
{vstL.length===0?<p className="text-gray-400 text-center py-12">Aucun VST. <button onClick={()=>{setUType('vst');setView('upload')}} className="text-cyanNeon underline">Publie le premier !</button></p>:
<div className="grid grid-cols-1 md:grid-cols-3 gap-6">{vstL.map(v=>{const owned=myVKeys.find(k=>k.track_id===v.id);return(
<div key={v.id} className="glass-card rounded-2xl p-5 flex flex-col border-cyanNeon/30">
<div className="relative"><img src={v.cover_url||DC} className="w-full h-44 object-cover rounded-xl mb-4"/>{owned&&<span className="absolute top-2 right-2 bg-greenPro text-black text-[10px] font-black px-2 py-1 rounded-lg">✓ POSSÉDÉ</span>}</div>
<h4 className="text-xl font-black text-white">{v.title}</h4>
<p className="text-xs text-goldAccent font-bold mt-1">Par {v.producer_name}</p>
<p className="text-xs text-gray-400 my-3 flex-grow">{v.description}</p>
<div className="flex items-center justify-between pt-4 border-t border-borderDark">
<span className="text-lg font-black text-goldAccent">{fmt(v.price_mp3)} DZD</span>
{owned?<button onClick={()=>setView('purchases')} className="bg-greenPro text-black font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1"><I name="key" c="w-3 h-3"/>Ma clé</button>:<button onClick={()=>{setSel(v);setProof(null);setLic('vst')}} className="bg-cyanNeon text-black font-bold px-4 py-2 rounded-xl text-xs">Acheter</button>}
</div></div>)})}</div>}
</section>}

{/* ============ BEATS ============ */}
{view==='beats'&&<section className="fade-in space-y-6">
<div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
<h3 className="text-3xl font-black text-white border-l-4 border-goldAccent pl-4">BEATSTORE</h3>
<div className="relative w-full md:w-64"><input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher..." className="w-full bg-cardDark border border-borderDark rounded-xl pl-9 pr-4 py-2 text-xs text-white focus:border-goldAccent outline-none"/><div className="absolute left-3 top-2.5 text-gray-500"><I name="search" c="w-4 h-4"/></div></div></div>
<div className="flex items-center gap-2 overflow-x-auto pb-2">{GEN.map(g=><button key={g} onClick={()=>setFilterG(g)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${filterG===g?'bg-goldAccent text-black':'bg-cardDark text-gray-400 hover:text-white border border-borderDark'}`}>{g}</button>)}</div>
{fBeats.length===0?<p className="text-gray-400 text-center py-12">Aucun beat. <button onClick={()=>{setUType('beat');setView('upload')}} className="text-goldAccent underline">Poste le premier !</button></p>:
<div className="glass-card rounded-2xl p-4 space-y-2">{fBeats.map(b=>(
<div key={b.id} className={`grid grid-cols-1 md:grid-cols-12 gap-4 items-center p-3 rounded-xl transition ${b.is_sold?'opacity-50 bg-black/60':'hover:bg-white/5'}`}>
<div className="col-span-5 flex items-center gap-4">
<div className="relative w-12 h-12 rounded-lg overflow-hidden cursor-pointer flex-shrink-0" onClick={()=>!b.is_sold&&b.audio_url&&togglePlay(b)}><img src={b.cover_url||DC} className="w-full h-full object-cover"/>{!b.is_sold&&b.audio_url&&<div className="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100"><I name={cur?.id===b.id&&playing?"pause":"play"} c="w-5 h-5 text-white"/></div>}</div>
<div className="min-w-0"><h4 className="font-bold text-white flex items-center gap-2 truncate">{b.title}{b.is_sold&&<span className="bg-red-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded">SOLD</span>}</h4><p className="text-xs text-goldAccent font-bold truncate">{b.producer_name} • {b.genre}</p></div></div>
<div className="hidden md:block col-span-2 text-sm text-gray-400">{b.bpm} BPM • {b.key}</div>
<div className="hidden md:block col-span-2 text-xs text-gray-500">{b.plays||0} écoutes</div>
<div className="col-span-full md:col-span-3 flex justify-end">
{b.is_sold?<span className="text-xs font-bold text-red-500 border border-red-800/50 px-4 py-2 rounded-xl">VENDU</span>:<button onClick={()=>{setSel(b);setLic('mp3');setProof(null)}} className="border border-goldAccent text-goldAccent font-bold px-4 py-2 rounded-xl text-xs hover:bg-goldAccent hover:text-black transition">Acheter ({fmt(b.price_mp3)} DZD)</button>}
</div></div>))}</div>}
</section>}

{/* ============ PURCHASES ============ */}
{view==='purchases'&&<section className="fade-in space-y-6">
<h3 className="text-3xl font-black text-white border-l-4 border-greenPro pl-4">MES ACHATS & CLÉS</h3>
{purch.length===0?<p className="text-gray-400 text-center py-12">Aucun achat. <button onClick={()=>setView('vsts')} className="text-cyanNeon underline">Voir les VSTs</button></p>:
<div className="space-y-3">{purch.map(p=>(
<div key={p.id||(p.track_id+'-'+p.created_at)} className={`glass-card rounded-2xl p-4 flex flex-col lg:flex-row lg:items-center gap-4 ${p.license_type==='vst'?'border-greenPro/30':''}`}>
<div className="flex items-center gap-4 flex-1 min-w-0">
<img src={p.track?.cover_url||DC} className="w-14 h-14 rounded-lg object-cover flex-shrink-0"/>
<div className="min-w-0">
<h4 className="font-bold text-white truncate">{p.track?.title||'Produit'}</h4>
<p className="text-xs text-gray-400"><span className={p.license_type==='vst'?'text-cyanNeon font-bold':'text-goldAccent font-bold'}>{(p.license_type||'').toUpperCase()}</span> • {fmt(p.amount)} DZD{p.created_at?` • ${new Date(p.created_at).toLocaleDateString('fr-FR')}`:''}</p>
</div></div>
{p.license_type==='vst'&&p.vst_key&&<div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
<code className="font-mono text-sm font-bold bg-obsidian border border-greenPro/50 text-greenPro px-3 py-2 rounded-lg text-center select-all">{p.vst_key}</code>
<span className="text-[11px] text-gray-400 text-center whitespace-nowrap">{(p.activations||[]).length}/{p.max_activations||3} PC</span>
<button onClick={()=>copyT(p.vst_key)} className="bg-cardDark border border-borderDark text-white font-bold px-3 py-2 rounded-lg text-xs hover:border-greenPro flex items-center justify-center gap-1"><I name="copy" c="w-3 h-3"/>Copier</button>
<button onClick={()=>dlVst(p)} className="bg-cyanNeon text-black font-bold px-3 py-2 rounded-lg text-xs flex items-center justify-center gap-1"><I name="dl" c="w-3 h-3"/>Télécharger</button>
</div>}</div>))}</div>}
</section>}

{/* ============ VERIFY ============ */}
{view==='verify'&&<div className="max-w-2xl mx-auto glass-card p-8 rounded-3xl fade-in border-cyanNeon/30">
<div className="flex items-center gap-4 mb-6 border-b border-borderDark pb-6"><div className="w-16 h-16 rounded-full bg-cyanNeon/10 flex items-center justify-center"><I name="key" c="w-8 h-8 text-cyanNeon"/></div><div><h2 className="text-3xl font-black text-white">Vérifier une clé</h2><p className="text-sm text-gray-400">Simule la vérification du plugin.</p></div></div>
<form onSubmit={doVerify} className="space-y-4">
<div><label className="text-xs font-bold text-gray-400 block mb-1">Clé de licence</label><input type="text" value={vKey} onChange={e=>setVKey(e.target.value.toUpperCase())} maxLength="24" placeholder="YAN-XXXX-XXXX-XXXX" className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-lg text-white focus:border-cyanNeon outline-none font-mono tracking-widest text-center"/></div>
<div><label className="text-xs font-bold text-gray-400 block mb-1">ID Machine</label><div className="flex gap-2"><input type="text" value={vMachine} onChange={e=>setVMachine(e.target.value)} maxLength="32" className="flex-1 bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none font-mono"/><button type="button" onClick={()=>setVMachine('PC-'+Math.random().toString(36).substring(2,8).toUpperCase())} className="bg-cardDark border border-borderDark text-white font-bold px-4 rounded-xl text-xs hover:border-cyanNeon whitespace-nowrap">🖥️ Autre PC</button></div>
<p className="text-[11px] text-gray-500 mt-1">Chaque ID différent = 1 activation (3 max). Le même ID ne consomme rien.</p></div>
<button type="submit" disabled={vLoad||!vKey.trim()} className="w-full bg-cyanNeon text-black font-black py-4 rounded-xl glow-cyan disabled:opacity-50">{vLoad?'VÉRIFICATION...':'🔍 VÉRIFIER LA CLÉ'}</button>
</form>
{vResult&&<div className={`mt-6 p-5 rounded-2xl border fade-in ${vResult.valid?'border-greenPro bg-greenPro/10':'border-red-500 bg-red-500/10'}`}>
<div className="flex items-center gap-3 mb-3"><div className={`w-10 h-10 rounded-full flex items-center justify-center ${vResult.valid?'bg-greenPro/20 text-greenPro':'bg-red-500/20 text-red-400'}`}><I name={vResult.valid?'check':'x'} c="w-5 h-5"/></div>
<h4 className={`font-black text-xl ${vResult.valid?'text-greenPro':'text-red-400'}`}>{vResult.valid?'✅ CLÍ VALIDE':'❌ CLÍ REFUSÉE'}</h4></div>
{vResult.product&&<p className="text-sm text-gray-300">Produit : <strong>{vResult.product}</strong></p>}
{vResult.reason&&<p className="text-sm text-red-300 mt-1">{vResult.reason}</p>}
{vResult.max_activations!=null&&<p className="text-sm text-gray-300 mt-1">Activations : <strong>{vResult.activations}/{vResult.max_activations}</strong></p>}
</div>}
{myVKeys.length>0&&<div className="mt-8 pt-6 border-t border-borderDark"><p className="text-xs font-bold text-gray-400 mb-3">Tester avec mes clés :</p><div className="flex flex-wrap gap-2">
{myVKeys.map(p=><button key={p.vst_key} onClick={()=>{setVKey(p.vst_key);setVResult(null)}} className="font-mono text-xs bg-obsidian border border-greenPro/40 text-greenPro px-3 py-1.5 rounded-lg hover:border-greenPro">{p.vst_key}</button>)}
<button onClick={()=>{setVKey('YAN-FAKE-1234-ABCD');setVResult(null)}} className="font-mono text-xs bg-obsidian border border-red-500/40 text-red-400 px-3 py-1.5 rounded-lg hover:border-red-500">Fausse clé (test)</button>
</div></div>}
</div>}

{/* ============ DASHBOARD ============ */}
{view==='dashboard'&&prof&&<div className="space-y-8 fade-in">
<div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-cardDark border border-borderDark p-6 rounded-2xl">
<div className="flex items-center gap-4"><img src={prof.avatar_url} className="w-16 h-16 rounded-full object-cover border-2 border-goldAccent" alt="photo"/><div><h2 className="text-2xl font-black text-white">{prof.name}</h2><p className="text-xs text-gray-400">{sess.user.email}</p></div></div>
<div className="flex gap-3"><button onClick={()=>setView('purchases')} className="border border-greenPro text-greenPro font-black px-5 py-3 rounded-xl flex items-center gap-2 hover:bg-greenPro/10"><I name="key" c="w-4 h-4"/>Mes achats</button><button onClick={()=>setView('upload')} className="bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-black px-6 py-3 rounded-xl flex items-center gap-2 glow-cyan"><I name="upload" c="w-4 h-4"/>Uploader</button></div></div>
<div className="grid grid-cols-1 md:grid-cols-3 gap-6">
<div className="glass-card p-6 rounded-2xl border-cyanNeon/30"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400">REVENUS</span><I name="dollar" c="w-5 h-5 text-cyanNeon"/></div><span className="text-3xl font-black text-cyanNeon">{fmt(prof.balance)} DZD</span></div>
<div className="glass-card p-6 rounded-2xl border-goldAccent/30"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400">ÉCOUTES</span><I name="act" c="w-5 h-5 text-goldAccent"/></div><span className="text-3xl font-black text-goldAccent">{fmt(myT.reduce((s,t)=>s+(t.plays||0),0))}</span></div>
<div className="glass-card p-6 rounded-2xl border-pinkNeon/30"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400">CRÉATIONS</span><I name="dash" c="w-5 h-5 text-pinkNeon"/></div><span className="text-3xl font-black text-pinkNeon">{myT.length}</span></div>
</div>
<div className="glass-card rounded-2xl p-6"><h3 className="text-lg font-bold text-white mb-4">Mes publications</h3>
{myT.length===0?<p className="text-gray-400 text-sm text-center py-6">Aucune création. <button onClick={()=>setView('upload')} className="text-cyanNeon underline">Commence !</button></p>:
<div className="space-y-3">{myT.map(t=>(
<div key={t.id} className="flex justify-between items-center p-3 rounded-xl bg-obsidian/60 border border-borderDark">
<div className="flex items-center gap-4"><img src={t.cover_url||DC} className="w-12 h-12 rounded-lg object-cover"/><div><h4 className="font-bold text-white text-sm">{t.title}{t.is_sold&&<span className="bg-red-600 text-white text-[9px] px-1 rounded ml-2">SOLD</span>}</h4><p className="text-xs text-gray-400">{(t.type||'').toUpperCase()} • {t.type==='vst'?(t.file_path?'Fichier privé ✓':'⚠️ Pas de fichier'):`${t.plays||0} écoutes`}</p></div></div>
<div className="flex items-center gap-3"><span className="text-xs font-bold text-goldAccent">{fmt(t.price_mp3)} DZD</span><button onClick={()=>handleDelete(t.id)} className="p-2 bg-red-950/60 text-red-400 hover:bg-red-600 hover:text-white rounded-lg"><I name="trash" c="w-4 h-4"/></button></div>
</div>))}</div>}</div>
</div>}

{/* ============ UPLOAD ============ */}
{view==='upload'&&prof&&<div className="max-w-2xl mx-auto glass-card p-8 rounded-2xl border-goldAccent/40 fade-in">
<h2 className="text-2xl font-black text-white mb-2">Nouvelle création</h2>
<p className="text-xs text-gray-400 mb-6">Publié par : <span className="text-goldAccent font-bold">{prof.name}</span></p>
<form onSubmit={handleUpload} className="space-y-4">
<div><label className="text-xs font-bold text-gray-300 block mb-1">Titre (max 100)</label><input type="text" required maxLength="100" value={uTitle} onChange={e=>setUTitle(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none"/></div>
<div className="grid grid-cols-2 md:grid-cols-4 gap-3">
<div><label className="text-xs font-bold text-gray-300 block mb-1">Type</label><select value={uType} onChange={e=>{setUType(e.target.value);setUAudio(null)}} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"><option value="beat">Beat</option><option value="vst">VST</option></select></div>
{uType==='beat'&&<>
<div><label className="text-xs font-bold text-gray-300 block mb-1">Genre</label><select value={uGenre} onChange={e=>setUGenre(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white">{GEN.slice(1).map(g=><option key={g}>{g}</option>)}</select></div>
<div><label className="text-xs font-bold text-gray-300 block mb-1">BPM</label><input type="number" min="40" max="300" value={uBpm} onChange={e=>setUBpm(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"/></div>
<div><label className="text-xs font-bold text-gray-300 block mb-1">Gamme</label><input type="text" maxLength="10" value={uKey} onChange={e=>setUKey(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white"/></div>
</>}</div>
{uType==='beat'?<div className="p-4 rounded-xl bg-obsidian/60 border border-borderDark space-y-3"><span className="text-xs font-bold text-goldAccent block uppercase">Prix (DZD)</span><div className="grid grid-cols-2 gap-3">
<div><label className="text-[11px] text-gray-400">MP3</label><input type="number" min="0" value={uMp3} onChange={e=>setUMp3(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
<div><label className="text-[11px] text-gray-400">WAV</label><input type="number" min="0" value={uWav} onChange={e=>setUWav(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
<div><label className="text-[11px] text-gray-400">Stems</label><input type="number" min="0" value={uStems} onChange={e=>setUStems(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
<div><label className="text-[11px] text-gray-400">Exclusif</label><input type="number" min="0" value={uExcl} onChange={e=>setUExcl(e.target.value)} className="w-full bg-cardDark border border-borderDark rounded-lg p-2 text-white"/></div>
</div></div>:<div className="p-4 rounded-xl bg-cyanNeon/10 border border-cyanNeon/30 space-y-2">
<label className="text-xs font-bold text-cyanNeon block">Prix VST (DZD)</label>
<input type="number" min="0" value={uMp3} onChange={e=>setUMp3(e.target.value)} className="w-full bg-cardDark border border-cyanNeon/50 rounded-lg p-2 text-white"/>
<p className="text-[11px] text-gray-400">🔑 Clé unique par acheteur (3 machines max). Fichier en privé.</p></div>}
<div><label className="text-xs font-bold text-gray-300 block mb-1">Description</label><textarea maxLength="300" rows="2" value={uDesc} onChange={e=>setUDesc(e.target.value)} placeholder={uType==='vst'?'Ex : Synthé analogique, 200 presets':'Ex : Drill sombre, piano + 808'} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none resize-none"/></div>
<div><label className="text-xs font-bold text-gray-300 block mb-1">Pochette (max 5MB)</label><input type="file" accept="image/*" onChange={e=>setUCover(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-cyanNeon file:text-black"/></div>
<div><label className="text-xs font-bold text-gray-300 block mb-1">{uType==='vst'?'Fichier du plugin (ZIP/EXE...)':'Fichier audio (MP3/WAV)'} — max 50MB</label>
<input key={uType} type="file" accept={uType==='vst'?'.zip,.rar,.7z,.exe,.msi,.dmg,.pkg':'.mp3,.wav,audio/mpeg,audio/wav'} onChange={e=>setUAudio(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-goldAccent file:text-black"/></div>
<button type="submit" disabled={uLoad} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl glow-gold mt-4 disabled:opacity-50">{uLoad?'UPLOAD EN COURS...':'PUBLIER SUR YANRECORDS'}</button>
</form></div>}

{/* ============ SETTINGS ============ */}
{view==='settings'&&prof&&<div className="max-w-2xl mx-auto glass-card p-8 rounded-3xl fade-in">
<div className="flex items-center gap-4 mb-8 border-b border-borderDark pb-6"><div className="w-16 h-16 rounded-full bg-borderDark flex items-center justify-center"><I name="set" c="w-8 h-8 text-gray-400"/></div><div><h2 className="text-3xl font-black text-white">Paramètres</h2><p className="text-sm text-gray-400">Sauvegardé sur le serveur</p></div></div>
<form onSubmit={handleSave} className="space-y-6">
<div className="flex flex-col sm:flex-row items-center gap-6 p-4 bg-obsidian rounded-2xl border border-borderDark">
<img src={eAvP||prof.avatar_url} className="w-24 h-24 rounded-full object-cover border-4 border-cyanNeon" alt="avatar"/>
<div className="flex-1 w-full"><label className="text-xs font-bold text-gray-400 block mb-2">Changer la photo</label><input type="file" accept="image/*" onChange={e=>{const f=e.target.files[0];if(f){setEAv(f);setEAvP(URL.createObjectURL(f))}}} className="w-full text-sm text-gray-400 file:bg-cyanNeon file:text-black file:border-0 file:rounded-xl file:px-4 file:py-2 file:mr-4 file:font-bold cursor-pointer"/></div></div>
<div className="grid grid-cols-1 md:grid-cols-2 gap-6">
<div><label className="text-xs font-bold text-gray-400 block mb-1">Nom d'Artiste</label><input type="text" required maxLength="50" value={eName} onChange={e=>setEName(e.target.value)} className="w-full bg-obsidian border border-borderDark rounded-xl p-3 text-sm text-white focus:border-cyanNeon outline-none"/></div>
<div><label className="text-xs font-bold text-gray-400 block mb-1">Email</label><input type="email" disabled value={sess.user.email} className="w-full bg-obsidian/50 border border-borderDark/50 rounded-xl p-3 text-sm text-gray-500"/></div></div>
<div className="p-5 rounded-2xl bg-goldAccent/5 border border-goldAccent/30">
<label className="text-xs font-bold text-goldAccent block mb-1 uppercase flex items-center gap-2"><I name="dollar" c="w-4 h-4"/>CCP / BaridiMob (pour recevoir vos ventes)</label>
<input type="text" value={eRip} onChange={e=>setERip(e.target.value)} placeholder="00799999000000000012" className="w-full bg-obsidian border border-goldAccent/40 rounded-xl p-3 text-sm text-white focus:border-goldAccent outline-none font-mono"/></div>
<button type="submit" disabled={saving} className="w-full bg-white text-black font-black py-4 rounded-xl hover:bg-gray-200 mt-4 shadow-lg disabled:opacity-50">{saving?'ENREGISTREMENT...':'✅ ENREGISTRER'}</button>
</form></div>}

{/* ============ ADMIN ============ */}
{view==='admin'&&prof?.is_admin&&<section className="fade-in space-y-6">
<h3 className="text-3xl font-black text-white border-l-4 border-pinkNeon pl-4">COMMANDRES ADMIN</h3>
<div className="grid grid-cols-3 gap-4 mb-4">
<div className="glass-card p-4 rounded-xl border-pinkNeon/30"><p className="text-xs text-gray-400">En attente</p><p className="text-2xl font-black text-pinkNeon">{pendO.length}</p></div>
<div className="glass-card p-4 rounded-xl border-greenPro/30"><p className="text-xs text-gray-400">Commission totale</p><p className="text-2xl font-black text-greenPro">{fmt(orders.filter(o=>o.status==='validated').reduce((s,o)=>s+(o.platform_fee||0),0))} DZD</p></div>
<div className="glass-card p-4 rounded-xl border-cyanNeon/30"><p className="text-xs text-gray-400">Commandes</p><p className="text-2xl font-black text-cyanNeon">{orders.length}</p></div>
</div>
{orders.length===0?<p className="text-gray-400 text-center py-12">Aucune commande.</p>:
<div className="space-y-4">{orders.map(o=>(
<div key={o.id} className={`glass-card rounded-2xl p-4 ${o.status==='pending'?'border-pinkNeon/50':o.status==='validated'?'border-greenPro/30':'border-red-500/30'}`}>
<div className="flex flex-col lg:flex-row lg:items-center gap-4">
<div className="flex items-center gap-3 flex-1 min-w-0">
{o.proof_url&&<img src={o.proof_url} alt="preuve" className="w-16 h-16 rounded-lg object-cover cursor-pointer border border-borderDark" onClick={()=>window.open(o.proof_url,'_blank')} title="Cliquer pour agrandir"/>}
<div className="min-w-0">
<p className="font-bold text-white truncate">{o.buyer_name||'Client'}</p>
<p className="text-xs text-gray-400">{o.product_type.toUpperCase()} • {(o.license_type||'').toUpperCase()} • {fmt(o.amount)} DZD • Commission {o.rate_percent}% : {fmt(o.platform_fee)} DZD</p>
<p className="text-[10px] text-gray-500">{new Date(o.created_at).toLocaleString('fr-FR')}</p>
{o.status==='validated'&&o.vst_key&&<code className="text-xs text-greenPro font-mono bg-obsidian px-2 py-1 rounded inline-block mt-1">{o.vst_key}</code>}
{o.admin_note&&<p className="text-[11px] text-red-400 mt-1">Note : {o.admin_note}</p>}
</div></div>
<div className="flex gap-2 flex-shrink-0">
{o.status==='pending'&&<><button onClick={()=>valOrder(o.id)} className="bg-greenPro text-black font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap">✅ Valider</button><button onClick={()=>refOrder(o.id)} className="bg-red-500 text-white font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap">❌ Refuser</button></>}
{o.status==='validated'&&<span className="text-xs font-bold text-greenPro whitespace-nowrap">✅ Livrée</span>}
{o.status==='refused'&&<span className="text-xs font-bold text-red-400 whitespace-nowrap">❌ Refusé</span>}
</div></div></div>))}</div>}
</section>}
</div>

{/* ============ MODAL ACHAT ============ */}
{sel&&<div className="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4 overflow-y-auto">
<div className="glass-card rounded-2xl max-w-lg w-full p-6 relative my-8">
<button onClick={()=>{setSel(null);setProof(null);setSellerInfo(null)}} className="absolute top-4 right-4 text-gray-400 hover:text-white"><I name="x" c="w-5 h-5"/></button>
<h3 className="text-xl font-black text-white mb-4">Achat : {sel.title}</h3>
{sel.type==='beat'&&<div className="space-y-2 mb-6">
{['mp3','wav','stems','exclusive'].map(l=><div key={l} onClick={()=>setLic(l)} className={`p-3 rounded-xl border cursor-pointer transition ${lic===l?(l==='exclusive'?'border-red-500 bg-red-500/10':'border-goldAccent bg-goldAccent/10'):'border-borderDark hover:border-gray-500'}`}>
<div className="flex justify-between font-bold text-white"><span className={l==='exclusive'?'text-red-400':''}>{l==='mp3'?'MP3 Lease':l==='wav'?'WAV Standard':l==='stems'?'Trackout Stems':'🔥 EXCLUSIVE'}</span><span className="text-goldAccent">{fmt(getPr(sel,l))} DZD</span></div></div>)}
</div>}
<div className="p-4 rounded-xl bg-goldAccent/10 border border-goldAccent/30 mb-4">
<div className="flex justify-between"><span className="font-bold text-white">Total à payer</span><span className="text-xl font-black text-goldAccent">{fmt(getPr(sel,sel.type==='vst'?'vst':lic))} DZD</span></div>
</div>
<div className="p-4 rounded-xl bg-cyanNeon/10 border border-cyanNeon/30 mb-4">
<h4 className="font-bold text-white text-sm mb-2">💳 Paiement par CCP / BaridiMob</h4>
<p className="text-xs text-gray-400 mb-2">Envoyez le montant exact, puis ajoutez la capture d'écran :</p>
{sellerInfo?.rip?><><p className="font-mono text-sm text-greenPro mb-1">CCP : {sellerInfo.rip}</p><p className="font-mono text-sm text-greenPro">BaridiMob : {sellerInfo.rip}</p></>:<p className="text-sm text-yellow-400">Le vendeur n'a pas configuré son CCP. Contactez-le.</p>}
<p className="text-[11px] text-gray-500 mt-2">Commission plateforme : {getRate(sel)}% (prélevée au vendeur)</p>
</div>
<div className="mb-4"><label className="text-xs font-bold text-gray-300 block mb-1">Capture d'écran du paiement *</label>
<input type="file" accept="image/*" onChange={e=>setProof(e.target.files[0])} className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:font-bold file:bg-cyanNeon file:text-black"/></div>
<button onClick={submitOrder} disabled={oLoad||!proof} className="w-full bg-goldAccent text-black font-black py-4 rounded-xl glow-gold disabled:opacity-50">{oLoad?'ENVOI...':'📱 ENVOYER LA COMMANDE'}</button>
<p className="text-[11px] text-gray-500 text-center mt-2">L'admin vérifiera ton paiement et livrera ta commande sous 24h.</p>
</div></div>}

{/* ============ PLAYER ============ */}
{cur&&<div className="fixed bottom-0 inset-x-0 z-50 glass border-t border-goldAccent/30 px-4 md:px-6 py-3 flex flex-col gap-2 safe-bottom">
<div className="w-full flex items-center gap-3 text-xs text-gray-400 font-mono">
<span>{fmtTime(aTime)}</span>
<input type="range" min="0" max="100" value={aProg} onChange={seek} className="flex-1 h-1 bg-borderDark rounded-lg appearance-none cursor-pointer" style={{background:`linear-gradient(to right,#00f0ff ${aProg}%,#222638 ${aProg}%)`}}/>
<span>{fmtTime(aDur)}</span></div>
<div className="flex items-center justify-between">
<div className="flex items-center gap-3 w-1/3 min-w-0"><img src={cur.cover_url||DC} className="w-11 h-11 rounded-lg object-cover"/><div className="min-w-0 hidden md:block"><h4 className="font-bold text-sm text-white truncate">{cur.title}</h4><p className="text-xs text-goldAccent font-bold truncate">{cur.producer_name}</p></div></div>
<div className="flex items-center gap-4">
<button onClick={toggleMute} className="text-gray-400 hover:text-white"><I name={muted?"mute":"vol"} c="w-5 h-5"/></button>
<input type="range" min="0" max="1" step="0.1" value={muted?0:vol} onChange={volCh} className="w-20 hidden md:block"/>
<button onClick={()=>togglePlay(cur)} className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-110 transition"><I name={playing?"pause":"play"} c="w-5 h-5"/></button></div>
<div className="w-1/3 flex justify-end"><button onClick={()=>{setSel(cur);setLic('mp3');setProof(null)}} className="bg-goldAccent text-black font-bold px-3 md:px-4 py-2 rounded-xl text-xs">Acheter</button></div>
</div></div>}
</div>
);
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrB><App/></ErrB>);
</script>
</body>
</html>
