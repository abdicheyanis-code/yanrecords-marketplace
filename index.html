*{font-family:'Space Grotesk','Segoe UI',Tahoma,system-ui,sans-serif;box-sizing:border-box}
body{background:#050508;color:#f8fafc;overflow-x:hidden}
.glass{background:rgba(19,21,32,.85);backdrop-filter:blur(20px);border:1px solid rgba(34,38,56,.8)}
.card{background:linear-gradient(145deg,rgba(20,22,35,.9),rgba(10,11,18,.9));backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.06);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.tgold{background:linear-gradient(135deg,#e2b053,#fff176,#e2b053);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% auto;animation:sh 4s linear infinite}
.tcyan{background:linear-gradient(135deg,#00f0ff,#0080ff,#00f0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% auto;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200% center}}
.mesh{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;background:#050508}
.blob{position:absolute;filter:blur(120px);opacity:.3;border-radius:50%;animation:fl 20s ease-in-out infinite}
.blob:nth-child(2){animation-delay:-7s}.blob:nth-child(3){animation-delay:-14s}
@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-50px) scale(1.1)}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#050508}::-webkit-scrollbar-thumb{background:#222638;border-radius:4px}
.fade{animation:fi .4s ease-out forwards}
@keyframes fi{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.drop{animation:dp .22s cubic-bezier(.2,.9,.3,1.3) forwards;transform-origin:top right}
@keyframes dp{from{opacity:0;transform:scale(.92) translateY(-12px)}to{opacity:1;transform:scale(1) translateY(0)}}
.pop{animation:pp .35s cubic-bezier(.2,.9,.3,1.4) forwards}
@keyframes pp{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.spotlight{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(0,240,255,.13),rgba(138,43,226,.07) 40%,transparent 70%);pointer-events:none;z-index:2;mix-blend-mode:screen;transition:left .08s ease-out,top .08s ease-out}
body{background:linear-gradient(135deg,#050508,#0a0d1a,#050508);background-size:400% 400%;animation:bgshift 18s ease infinite}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.lift{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s;transform-style:preserve-3d}
.lift:hover{transform:perspective(900px) rotateX(4deg) rotateY(-4deg) translateY(-10px);box-shadow:0 28px 60px rgba(0,0,0,.65),0 0 40px rgba(0,240,255,.18)}
.gg{animation:glowpulseG 2.6s ease-in-out infinite}
.gc{animation:glowpulseC 2.6s ease-in-out infinite}
.gp{animation:glowpulseP 2.6s ease-in-out infinite}
@keyframes glowpulseG{0%,100%{box-shadow:0 0 25px rgba(226,176,83,.35)}50%{box-shadow:0 0 45px rgba(226,176,83,.7),0 0 90px rgba(226,176,83,.25)}}
@keyframes glowpulseC{0%,100%{box-shadow:0 0 25px rgba(0,240,255,.35)}50%{box-shadow:0 0 45px rgba(0,240,255,.7),0 0 90px rgba(0,240,255,.25)}}
@keyframes glowpulseP{0%,100%{box-shadow:0 0 25px rgba(255,0,127,.35)}50%{box-shadow:0 0 45px rgba(255,0,127,.7),0 0 90px rgba(255,0,127,.25)}}
.floatnote{position:absolute;font-size:2rem;opacity:.15;animation:floatup 8s linear infinite;pointer-events:none}
@keyframes floatup{0%{transform:translateY(100%) rotate(0deg);opacity:0}10%{opacity:.15}90%{opacity:.15}100%{transform:translateY(-120%) rotate(360deg);opacity:0}}
.neon-text{background:linear-gradient(135deg,#00f0ff,#8a2be2,#ff007f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% auto;animation:sh 4s linear infinite}

/* Mobile / touch optimizations */
@media (hover:none),(pointer:coarse){
  body{cursor:auto}
  .cursor-dot,.cursor-ring,.spotlight{display:none!important}
  a,button,input,textarea,select{cursor:auto}
}
@media (max-width:768px){
  .aurora{display:none}
  .floatnote{display:none}
  canvas.particles-canvas,canvas[style*="opacity: .7"]{display:none}
  .lift:hover{transform:translateY(-4px)}
  .card::before{display:none}
  body{background:#050508}
}
*{touch-action:manipulation}

/* Aurora borealis background */
.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aurora::before,.aurora::after{content:'';position:absolute;width:140%;height:140%;top:-20%;left:-20%;background:radial-gradient(ellipse at 20% 30%,rgba(0,240,255,.12),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(138,43,226,.14),transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(255,0,127,.1),transparent 50%);animation:aurora 22s ease-in-out infinite;filter:blur(40px)}
.aurora::after{animation-delay:-11s;opacity:.7}
@keyframes aurora{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-5%,-3%) scale(1.05)}66%{transform:translate(4%,2%) scale(.98)}}
/* Custom cursor */
body{cursor:none}
a,button,[role=button]{cursor:none}
input,textarea,select{cursor:text}
.cursor-dot{position:fixed;width:8px;height:8px;border-radius:50%;background:#00f0ff;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);box-shadow:0 0 12px #00f0ff,0 0 24px #00f0ff;transition:width .15s,height .15s}
.cursor-ring{position:fixed;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(0,240,255,.5);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:left .12s ease-out,top .12s ease-out,width .2s,height .2s,opacity .2s;mix-blend-mode:screen}
/* Card shine */
.card{position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.12),transparent);transform:skewX(-20deg);transition:left .7s ease;pointer-events:none;z-index:3}
.card:hover::before{left:160%}
/* Scroll reveal */
.reveal{opacity:0;transform:translateY(32px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:translateY(0)}
/* SVG waves */
.wave-svg{position:absolute;bottom:0;left:0;width:100%;height:120px;pointer-events:none}
.wave-svg path{animation:wavepath 6s ease-in-out infinite}
@keyframes wavepath{0%,100%{transform:translateX(0)}50%{transform:translateX(-25px)}}
/* ===== TITRE HÉRO ===== */
.hero-h{
  font-family:'Anton',Impact,'Arial Narrow Bold',sans-serif;
  text-transform:uppercase;font-weight:400;
  line-height:.84;letter-spacing:-.012em;margin:0;
}
.hero-h .hh-1{
  display:block;font-family:inherit;font-size:clamp(2rem,5vw,3.7rem);color:#fff;
  animation:hhIn .7s cubic-bezier(.2,.9,.25,1) both;
}
.hero-h .hh-2{
  display:block;font-family:inherit;margin-top:.05em;
  font-size:clamp(2.5rem,6.6vw,5.3rem);
  animation:hhIn .7s cubic-bezier(.2,.9,.25,1) .1s both;
}
.hero-h em{
  font-style:normal;
  background:linear-gradient(96deg,#00a651 0%,#12c46a 28%,#ffffff 50%,#e33b2b 72%,#d52b1e 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.hero-h.ar{font-family:'Segoe UI',Tahoma,system-ui,sans-serif;text-transform:none;line-height:1.2;letter-spacing:0}
.hero-h.ar .hh-1,.hero-h.ar .hh-2{font-family:inherit}
.hero-h.ar em{background:none;-webkit-text-fill-color:#12c46a;color:#12c46a}
@keyframes hhIn{
  from{opacity:0;transform:translateY(.34em);filter:blur(7px)}
  to{opacity:1;transform:none;filter:blur(0)}
}
/* titres de sections en Anton */
.dsp,.dsp *{font-family:'Anton',Impact,'Arial Narrow Bold',sans-serif;text-transform:uppercase;letter-spacing:.005em;font-weight:400}

.gc{box-shadow:0 0 25px rgba(0,240,255,.35)}.gg{box-shadow:0 0 25px rgba(226,176,83,.35)}.gp{box-shadow:0 0 25px rgba(255,0,127,.35)}
.ringg{background:linear-gradient(135deg,#e2b053,#ff007f,#00f0ff);padding:3px;border-radius:9999px;animation:sh 5s linear infinite;background-size:200% auto}
.banner{background:radial-gradient(900px 260px at 15% -40%,rgba(226,176,83,.35),transparent),radial-gradient(700px 260px at 85% -30%,rgba(0,240,255,.28),transparent),linear-gradient(145deg,#101320,#070910)}
.wavebg{background:linear-gradient(180deg,transparent 0%,rgba(0,240,255,.06) 50%,transparent 100%);animation:wave 6s ease-in-out infinite}
.wavebg::before,.wavebg::after{content:'';position:absolute;left:-50%;width:200%;height:40%;bottom:0;background:radial-gradient(ellipse at center,rgba(138,43,226,.18) 0%,transparent 70%);animation:wavemove 8s linear infinite}
.wavebg::after{animation-delay:-4s;opacity:.6}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes wavemove{0%{transform:translateX(0)}100%{transform:translateX(25%)}}
.loader{border:3px solid #222638;border-top:3px solid #00f0ff;border-radius:50%;width:40px;height:40px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.shake{animation:sk .6s ease-in-out}
@keyframes sk{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-6deg)}}
.tab{position:relative;transition:color .2s}
.tab::after{content:'';position:absolute;left:0;bottom:-2px;height:2px;width:0;background:#e2b053;transition:width .25s}
.tab.on::after{width:100%}
.dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:#ff007f;box-shadow:0 0 0 0 rgba(255,0,127,.7);animation:pu 1.8s infinite}
@keyframes pu{70%{box-shadow:0 0 0 9px rgba(255,0,127,0)}100%{box-shadow:0 0 0 0 rgba(255,0,127,0)}}
.bub{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word}
.bme{background:linear-gradient(135deg,#e2b053,#c99a3f);color:#000;border-bottom-right-radius:5px;margin-left:auto}

async function sha256File(file){
  try{
    const buf=await file.arrayBuffer();
    const h=await crypto.subtle.digest('SHA-256',buf);
    return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }catch(e){return null;}
}


async function resolveAudioUrl(val){
  if(!val)return null;
  let path=val;
  if(val.indexOf('http')===0){
    const m=val.match(/\/audio\/(.+?)(\?|$)/);
    if(m)path=decodeURIComponent(m[1]);
    else return val;
  }
  try{
    const r=await sb.storage.from('audio').createSignedUrl(path,3600);
    if(r.error)return val;
    return r.data.signedUrl;
  }catch(e){return val;}
}
function audioPathFor(t,license){
  if(!t)return null;
  if(license==='wav'&&t.audio_wav_url)return t.audio_wav_url;
  if(license==='stems'&&t.audio_stems_url)return t.audio_stems_url;
  if(license==='exclusive'&&t.audio_exclusive_url)return t.audio_exclusive_url;
  return t.audio_url||null;
}
async function downloadAudio(t,license){
  const path=audioPathFor(t,license||'mp3');
  const url=await resolveAudioUrl(path);
  if(!url){alert('Fichier indisponible');return;}
  window.open(url,'_blank');
}

async function makeContractPdf(no,toast){
  const r=await sb.rpc('get_contract',{p_no:no});
  if(r.error){toast(r.error.message,'error');return;}
  const d=r.data;
  const J=window.jspdf.jsPDF;
  const p=new J({unit:'mm',format:'a4'});
  const W=210,M=16;let y=0;
  function txt(s,x,yy,sz,st,col){p.setFontSize(sz||10);p.setFont('helvetica',st||'normal');
    if(col)p.setTextColor(col[0],col[1],col[2]);else p.setTextColor(30,30,30);p.text(String(s),x,yy);}
  function wrap(s,x,yy,w,sz){p.setFontSize(sz||9);p.setFont('helvetica','normal');p.setTextColor(60,60,60);
    const L=p.splitTextToSize(String(s),w);p.text(L,x,yy);return yy+L.length*(sz===8?3.6:4.3);}
  function line(yy){p.setDrawColor(215,215,215);p.line(M,yy,W-M,yy);}

  p.setFillColor(5,5,8);p.rect(0,0,W,30,'F');
  txt('213WAVE',M,14,19,'bold',[0,240,255]);
  txt('CONTRAT DE LICENCE MUSICALE',M,22,9,'normal',[200,200,200]);
  txt(d.no,W-M-p.getTextWidth(d.no),14,13,'bold',[0,240,255]);
  txt('Marketplace algerienne',W-M-32,22,8,'normal',[150,150,150]);
  y=40;

  txt('1. PARTIES',M,y,11,'bold',[0,0,0]);y+=2;line(y);y+=6;
  txt('LE PRODUCTEUR (concedant)',M,y,8,'bold',[110,110,110]);
  txt('LE BENEFICIAIRE (licencie)',W/2,y,8,'bold',[110,110,110]);y+=5;
  txt(d.seller_name||'-',M,y,10,'bold');txt(d.buyer_name||'-',W/2,y,10,'bold');y+=5;
  if(d.license==='exclusive'){
    txt('Nom legal : '+(d.seller_legal||'-'),M,y,8);
    txt('Nom legal : '+(d.buyer_legal||'-'),W/2,y,8);y+=5;
  }
  y+=3;

  txt('2. OEUVRE CONCERNEE',M,y,11,'bold',[0,0,0]);y+=2;line(y);y+=6;
  txt('Titre : '+(d.title||'-'),M,y,10,'bold');y+=5;
  const meta=d.type==='vst'?'Type : Plugin VST':'Genre : '+(d.genre||'-')+'   |   BPM : '+(d.bpm||'-')+'   |   Gamme : '+(d.musickey||'-');
  txt(meta,M,y,9);y+=5;
  txt('Publiee le : '+(d.created?new Date(d.created).toLocaleDateString('fr-FR'):'-'),M,y,8,'normal',[110,110,110]);y+=4;
  if(d.hash){txt('Empreinte SHA-256 du fichier :',M,y,7,'normal',[130,130,130]);y+=3.2;
    txt(String(d.hash).slice(0,64),M,y,6.4,'normal',[130,130,130]);y+=5;}
  y+=2;

  txt('3. LICENCE ACCORDEE',M,y,11,'bold',[0,0,0]);y+=2;line(y);y+=6;
  p.setFillColor(248,243,228);p.rect(M,y-4.5,W-2*M,9,'F');
  txt('TYPE : '+(LNAME[d.license]||d.license).toUpperCase(),M+3,y+1.5,11,'bold',[150,110,20]);y+=11;

  const L=d.limits||{};
  if(d.type==='vst'){
    const rows=[['Activations autorisees','3 machines maximum'],['Transfert de la cle','Interdit'],
      ['Decompilation / retro-ingenierie','Interdite'],['Revente ou partage','Interdits, revocation sans remboursement'],['Duree','Illimitee']];
    rows.forEach(function(rw){txt(rw[0],M+2,y,9,'normal',[90,90,90]);txt(rw[1],M+78,y,9,'bold');y+=5;});
  }else{
    const rows=[
      ['Streams autorises',inf(L.streams)],['Copies vendues',inf(L.copies)],
      ['Clips video',inf(L.videos)],['Diffusion radio',L.radio===-1?'Illimitee':(L.radio>0?L.radio+' stations':'Non autorisee')],
      ['Concerts payants',L.shows?'Autorises':'Non autorises'],
      ['Tag producteur',L.tag?'A conserver':'Retire'],
      ['Credit "Prod. by"','Obligatoire'],
      ['Duree de la licence',L.years===-1?'Illimitee':(L.years+' ans')],
      ['Exclusivite',d.license==='exclusive'?'OUI - beat retire du catalogue':'Non - licence non exclusive'],
      ['Publishing','50% producteur / 50% beneficiaire (sauf accord ecrit)']
    ];
    rows.forEach(function(rw){txt(rw[0],M+2,y,9,'normal',[90,90,90]);txt(rw[1],M+78,y,9,'bold');y+=5;});
  }
  y+=4;

  txt('4. CONDITIONS FINANCIERES',M,y,11,'bold',[0,0,0]);y+=2;line(y);y+=6;
  txt('Montant total paye',M+2,y,9,'normal',[90,90,90]);txt(fmt(d.amount)+' DZD',M+78,y,11,'bold',[20,130,80]);y+=5;
  txt('Part producteur',M+2,y,9,'normal',[90,90,90]);txt(fmt(d.seller_amount)+' DZD',M+78,y,9,'bold');y+=5;
  txt('Commission plateforme ('+d.rate+'%)',M+2,y,9,'normal',[90,90,90]);txt(fmt(d.fee)+' DZD',M+78,y,9,'bold');y+=5;
  txt('Moyen de paiement',M+2,y,9,'normal',[90,90,90]);txt('Virement CCP / BaridiMob (preuve archivee)',M+78,y,9,'bold');y+=9;

  if(d.vst_key){

  }

  const nn=d.vst_key?'6':'5';
  txt(nn+'. ENGAGEMENTS ET GARANTIES',M,y,11,'bold',[0,0,0]);y+=2;line(y);y+=5.5;

  y=wrap('b) Le Beneficiaire s engage a respecter strictement les limites ci-dessus. Tout depassement impose l acquisition immediate de la licence superieure, a defaut de quoi la presente licence est resiliee de plein droit.',M+2,y,W-2*M-4,8.4)+1;
  y=wrap('c) La revente, la redistribution, le partage et la mise a disposition de l oeuvre sous forme brute sont strictement interdits.',M+2,y,W-2*M-4,8.4)+1;
  y=wrap('d) Le credit "Prod. by '+(d.seller_name||'')+'" doit figurer dans le titre, la description et les metadonnees de distribution.',M+2,y,W-2*M-4,8.4)+1;
  y=wrap('e) 213WAVE intervient exclusivement comme intermediaire technique et n est pas partie au present contrat.',M+2,y,W-2*M-4,8.4)+1;
  y=wrap('f) Le present contrat est soumis au droit algerien. Tout litige releve des juridictions algeriennes competentes.',M+2,y,W-2*M-4,8.4)+3;

  txt((d.vst_key?'7':'6')+'. ACCEPTATION',M,y,11,'bold',[0,0,0]);y+=2;line(y);y+=6;
  txt('Conditions acceptees electroniquement le : '+(d.accepted_at?new Date(d.accepted_at).toLocaleString('fr-FR'):'-'),M+2,y,8.6);y+=4.5;
  txt('Licence validee et livree le : '+(d.date?new Date(d.date).toLocaleString('fr-FR'):'-'),M+2,y,8.6);y+=4.5;
  txt('Contrat genere automatiquement par 213WAVE - reference unique '+d.no,M+2,y,8,'normal',[120,120,120]);

  p.setFillColor(5,5,8);p.rect(0,282,W,15,'F');
  txt('213WAVE - Marketplace musicale algerienne',M,290,8,'normal',[170,170,170]);
  txt('Document genere le '+new Date().toLocaleDateString('fr-FR'),W-M-42,290,8,'normal',[120,120,120]);

  p.save('Contrat-'+d.no+'.pdf');
  toast('Contrat PDF telecharge');
}

class Boundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err)return <div className="min-h-screen flex items-center justify-center p-4"><div className="card p-8 rounded-2xl text-center max-w-md">
      <h2 className="text-2xl font-black text-white mb-2">Erreur</h2>
      <p className="text-xs text-gray-400 mb-4">{String(this.state.err.message||this.state.err)}</p>
      <button onClick={function(){location.reload();}} className="bg-cyanNeon text-black px-6 py-3 rounded-xl font-bold">Recharger</button></div></div>;
    return this.props.children;
  }
}

function ShareBtn(props){
  const [open,setOpen]=React.useState(false),[copied,setCopied]=React.useState(false);
  const b=props.t;
  const url=window.location.origin+window.location.pathname;
  const msg='🎧 '+b.title+' — par '+(b.producer_name||'un producteur 213WAVE')+'\n💰 '+fmt(b.price_mp3)+' DZD sur 213WAVE 🇩🇿\n'+url;
  function close(){setOpen(false);}
  function doShare(e){e.stopPropagation();
    if(navigator.share){navigator.share({title:b.title,text:msg}).catch(function(){});}
    else setOpen(!open);
  }
  function go(u){window.open(u,'_blank','noopener,noreferrer');close();}
  function copyLink(){try{navigator.clipboard.writeText(url);}catch(e){}setCopied(true);setTimeout(function(){setCopied(false);close();},1200);}
  const big=!!props.big;
  return <div className="relative flex-shrink-0">
    {open?<div className="fixed inset-0 z-40" onClick={function(e){e.stopPropagation();close();}}></div>:null}
    <button onClick={doShare} title="Partager" className={big?'h-11 px-5 rounded-xl border border-cyanNeon text-cyanNeon font-black text-xs flex items-center gap-2 hover:bg-cyanNeon/10 transition hover:scale-105':'w-9 h-9 rounded-xl border border-borderDark text-gray-400 hover:text-cyanNeon hover:border-cyanNeon flex items-center justify-center transition hover:scale-110'}>
      <Icon n="share" c="w-4 h-4"/>{big?tr('Partager'):''}
    </button>
    {open?<div className="absolute bottom-12 right-0 z-50 card rounded-2xl border border-borderDark p-2.5 flex items-center gap-2 shadow-2xl">
      <button onClick={function(e){e.stopPropagation();go('https://wa.me/?text='+encodeURIComponent(msg));}} title="WhatsApp" className="w-10 h-10 rounded-xl bg-green-500 text-white font-black text-xs hover:scale-110 transition">WA</button>
      <button onClick={function(e){e.stopPropagation();go('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(msg));}} title="Telegram" className="w-10 h-10 rounded-xl bg-sky-500 text-white font-black text-xs hover:scale-110 transition">TG</button>
      <button onClick={function(e){e.stopPropagation();go('https://twitter.com/intent/tweet?text='+encodeURIComponent(msg));}} title="X" className="w-10 h-10 rounded-xl bg-white text-black font-black text-xs hover:scale-110 transition">X</button>
      <button onClick={function(e){e.stopPropagation();copyLink();}} title="Copier le lien" className={'w-10 h-10 rounded-xl border flex items-center justify-center transition hover:scale-110 '+(copied?'border-greenPro text-greenPro bg-greenPro/10':'border-borderDark text-gray-300 hover:text-cyanNeon hover:border-cyanNeon')}><Icon n={copied?'check':'copy'} c="w-4 h-4"/></button>
    </div>:null}
  </div>;
}
function ReviewsModal(props){
  const t=props.track;
  const [list,setList]=React.useState(null),[rating,setRating]=React.useState(5),[comment,setComment]=React.useState(''),[busy,setBusy]=React.useState(false);
  async function load(){const r=await sb.from('reviews').select('*').eq('track_id',t.id).order('created_at',{ascending:false});setList(r.data||[]);}
  React.useEffect(function(){load();},[t.id]);
  const mine=(list||[]).filter(function(x){return x.user_id===props.me;})[0];
  async function send(){
    setBusy(true);
    const r=await sb.from('reviews').insert({track_id:t.id,user_id:props.me,user_name:(props.profile&&props.profile.name)||'Utilisateur',rating:rating,comment:comment.trim()||null});
    if(r.error)props.toast(r.error.code==='23505'?'Tu as déjà donné ton avis.':r.error.message,'error');
    else{setComment('');props.toast('Merci pour ton avis !');await load();props.refresh();}
    setBusy(false);}
  async function del(id){await sb.from('reviews').delete().eq('id',id);await load();props.refresh();}
  return <div className="fixed inset-0 z-[100] bg-black/90 overflow-y-auto">
    <div className="min-h-full flex items-center justify-center p-4">
    <div className="card rounded-2xl max-w-lg w-full p-6 pop">
      <div className="flex items-center justify-between mb-4">

      </div>
      <h3 className="text-xl font-black text-white">Avis : {t.title}</h3>
      <p className="text-xs text-gray-400 mb-4">Par {t.producer_name}</p>
      {props.bought&&!mine?<div className="p-4 rounded-xl bg-obsidian/70 border border-borderDark mb-4">
        <p className="text-xs font-bold text-gray-300 mb-2">Ta note</p>
        <div className="flex gap-1 mb-3">{[1,2,3,4,5].map(function(i){return <button key={i} onClick={function(){setRating(i);}} className={'text-3xl transition hover:scale-110 '+(i<=rating?'text-goldAccent':'text-gray-700')}>★</button>;})}</div>
        <textarea maxLength="300" rows="2" value={comment} onChange={function(e){setComment(e.target.value);}} placeholder="Ton commentaire (facultatif)" className="w-full bg-cardDark border border-borderDark rounded-xl p-3 text-sm text-white resize-none outline-none"></textarea>

      </div>:null}

      (list.length===0?<p className="text-center text-sm text-gray-500 py-6">Aucun avis pour le moment.</p>:
      <div className="space-y-3 max-h-72 overflow-y-auto">{list.map(function(x){
        return <div key={x.id} className="p-3 rounded-xl bg-obsidian/60 border border-borderDark">
          <div className="flex items-center justify-between"><p className="text-sm font-bold text-white">{x.user_name||'Utilisateur'}</p><Stars n={x.rating}/></div>

        </div>;})}</div>)}
    </div></div></div>;
}

function Particles(){
  const ref=React.useRef(null);
  React.useEffect(function(){
    const c=ref.current; if(!c) return;
    const ctx=c.getContext('2d');
    let w=c.width=c.offsetWidth||800, h=c.height=c.offsetHeight||400;
    const dots=Array.from({length:70},function(){return {x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*1.6+.4,color:Math.random()>.5?'#00f0ff':'#8a2be2'};});
    let raf;
    function resize(){if(!c)return;w=c.width=c.offsetWidth||800;h=c.height=c.offsetHeight||400;}
    window.addEventListener('resize',resize);
    function draw(){
      ctx.clearRect(0,0,w,h);
      dots.forEach(function(d){
        d.x+=d.vx; d.y+=d.vy;
        if(d.x<0||d.x>w)d.vx*=-1;
        if(d.y<0||d.y>h)d.vy*=-1;
        ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
        ctx.fillStyle=d.color;ctx.globalAlpha=.75;ctx.fill();ctx.globalAlpha=1;
      });
      for(let i=0;i<dots.length;i++){for(let j=i+1;j<dots.length;j++){
        const dx=dots[i].x-dots[j].x,dy=dots[i].y-dots[j].y,dist=Math.hypot(dx,dy);
        if(dist<100){ctx.beginPath();ctx.moveTo(dots[i].x,dots[i].y);ctx.lineTo(dots[j].x,dots[j].y);
        ctx.strokeStyle='rgba(0,240,255,'+(1-dist/100)*.18+')';ctx.stroke();}
      }}
      raf=requestAnimationFrame(draw);
    }
    draw();
    return function(){cancelAnimationFrame(raf);window.removeEventListener('resize',resize);};
  },[]);
  return <canvas ref={ref} className="particles-canvas absolute inset-0 w-full h-full pointer-events-none" style={{opacity:.7}}></canvas>;
}


function CountUp(props){
  const [n,setN]=React.useState(0);
  React.useEffect(function(){
    const target=Number(props.to)||0;const dur=props.dur||1200;const start=Date.now();
    const id=setInterval(function(){
      const t=Math.min(1,(Date.now()-start)/dur);
      setN(Math.floor(target*t));
      if(t>=1)clearInterval(id);
    },30);
    return function(){clearInterval(id);};
  },[props.to]);
  return <span>{props.fmt?props.fmt(n):n.toLocaleString('fr-FR')}</span>;
}

function MatrixRain(){
  const ref=React.useRef(null);
  React.useEffect(function(){
    const c=ref.current;if(!c)return;
    const ctx=c.getContext('2d');
    let w=c.width=window.innerWidth,h=c.height=window.innerHeight;
    const cols=Math.floor(w/16);const drops=Array(cols).fill(1);
    const chars='01アイウエオカキクケコサシスセソタチツテトナニヌネノ213WAVE';
    let raf;
    function draw(){
      ctx.fillStyle='rgba(5,5,8,.08)';ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#00a651';ctx.font='14px monospace';
      for(let i=0;i<drops.length;i++){
        const ch=chars[Math.floor(Math.random()*chars.length)];
        ctx.fillText(ch,i*16,drops[i]*16);
        if(drops[i]*16>h&&Math.random()>.975)drops[i]=0;
        drops[i]++;
      }
      raf=requestAnimationFrame(draw);
    }
    draw();
    function onR(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;}
    window.addEventListener('resize',onR);
    return function(){cancelAnimationFrame(raf);window.removeEventListener('resize',onR);};
  },[]);
  return <canvas ref={ref} className="absolute inset-0 w-full h-full"></canvas>;
}

function ProducerPage(props){
  const [data,setData]=React.useState(null),[tab,setTab]=React.useState('beats'),[busy,setBusy]=React.useState(false);
  React.useEffect(function(){
    let alive=true;setData(null);
    sb.rpc('get_producer',{p_id:props.id}).then(function(r){if(alive)setData(r.data||null);});
    return function(){alive=false;};
  },[props.id]);
  const mine=props.tracks.filter(function(t){return t.producer_id===props.id;});
  const beats=mine.filter(function(t){return t.type==='beat';});
  const vsts=mine.filter(function(t){return t.type==='vst';});
  async function follow(){
    setBusy(true);
    const r=await sb.rpc('toggle_follow',{p_id:props.id});
    if(r.error)props.toast(r.error.message,'error');
    else{setData(Object.assign({},data,{is_following:r.data.following,notify:r.data.notify,followers:(data.followers||0)+(r.data.following?1:-1)}));
      props.toast(r.data.following?'Abonné ! 🔔':'Désabonné.');}
    setBusy(false);

  async function bell(){
    const r=await sb.rpc('toggle_bell',{p_id:props.id});
    if(r.error){props.toast(r.error.message,'error');return;}
    setData(Object.assign({},data,{notify:r.data.notify}));
    props.toast(r.data.notify?'Notifications activées 🔔':'Notifications coupées 🔕');

  const list=tab==='beats'?beats:vsts;

          {data.role?<span className={'inline-block mt-2 text-[11px] font-black px-3 py-1 rounded-full '+(data.role==='producer'?'bg-goldAccent/20 text-goldAccent':data.role==='artist'?'bg-pinkNeon/20 text-pinkNeon':'bg-gray-500/20 text-gray-400')}>{data.role==='producer'?'🎹 Producteur':data.role==='artist'?'🎤 Artiste':'👤 Visiteur'}</span>:null}
          {data.bio?<p className="text-sm text-gray-300 mt-3 max-w-xl">{data.bio}</p>:<p className="text-sm text-gray-600 mt-3 italic">Pas encore de bio.</p>}
          {data.instagram?<a href={'https://instagram.com/'+String(data.instagram).replace('@','')} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1.5 mt-3 text-xs font-bold text-pinkNeon hover:underline"><Icon n="insta" c="w-4 h-4"/>@{String(data.instagram).replace('@','')}</a>:null}
        </div>
        <div className="flex gap-2 flex-wrap justify-center">
          {props.me===props.id?<button onClick={function(){props.setView('settings');}} className="bg-white text-black font-black px-6 py-3 rounded-xl text-sm hover:scale-105 transition">Modifier mon profil</button>
          :<React.Fragment>
            <button onClick={follow} disabled={busy} className={'font-black px-6 py-3 rounded-xl text-sm transition hover:scale-105 flex items-center gap-2 '+(data.is_following?'bg-cardDark border border-greenPro text-greenPro':'bg-pinkNeon text-black gp')}>
              <Icon n={data.is_following?'check':'plus'} c="w-4 h-4"/>{data.is_following?'Abonné':"S'abonner"}</button>
            {data.is_following?<button onClick={bell} className={'w-12 h-12 rounded-xl border flex items-center justify-center transition hover:scale-105 '+(data.notify?'border-goldAccent text-goldAccent bg-goldAccent/10':'border-borderDark text-gray-500')}><Icon n={data.notify?'bell':'bellOff'} c="w-5 h-5"/></button>:null}
            <button onClick={function(){props.openChat(props.id,data.name);}} className="w-12 h-12 rounded-xl border border-cyanNeon text-cyanNeon flex items-center justify-center hover:bg-cyanNeon/10 transition" title="Envoyer un message"><Icon n="chat" c="w-5 h-5"/></button>

        </div>
      </div>
      <div className="relative z-10 grid grid-cols-4 gap-3 mt-8">

        <div className="bg-black/40 rounded-2xl p-4 text-center border border-borderDark"><p className="text-2xl font-black text-cyanNeon">{data.vsts_count}</p><p className="text-[10px] text-gray-400 uppercase font-bold">VSTs</p></div>
        <div className="bg-black/40 rounded-2xl p-4 text-center border border-borderDark"><p className="text-2xl font-black text-white">{fmt(data.plays)}</p><p className="text-[10px] text-gray-400 uppercase font-bold">Écoutes</p></div>
        <div className="bg-black/40 rounded-2xl p-4 text-center border border-borderDark"><p className="text-2xl font-black text-pinkNeon">{fmt(data.followers)}</p><p className="text-[10px] text-gray-400 uppercase font-bold">Abonnés</p></div>

      return <div key={t.id} className="card rounded-2xl p-4 lift">
        <div className="relative rounded-xl overflow-hidden mb-3 group">
          <img loading="lazy" src={t.cover_url||DC} className="w-full h-40 object-cover" alt=""/>
          {(t.audio_url&&!t.is_sold)?<button onClick={function(){props.play(t);}} className="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><div className="w-12 h-12 rounded-full bg-white text-black flex items-center justify-center"><Icon n={(isCur&&props.playing)?'pause':'play'} c="w-6 h-6"/></div></button>:null}
          {t.is_sold?<span className="absolute top-2 right-2 bg-red-600 text-white text-[10px] font-black px-2 py-1 rounded">VENDU</span>:null}
        </div>
        <h4 className="font-black text-white truncate">{t.title}</h4>
        <p className="text-xs text-gray-400">{t.type==='vst'?'Plugin VST':t.genre+' · '+t.bpm+' BPM'}</p>
        <div className="flex items-center justify-between mt-3 pt-3 border-t border-borderDark">

        </div></div>;})}
    </div>}

function BeatsView(props){

  if(sort==='pop')list=list.slice().sort(function(a,b){return (b.plays||0)-(a.plays||0);});

      </div></div>:null}

    </div>

function MessagesView(props){
  const [convs,setConvs]=React.useState([]);
  const [peer,setPeer]=React.useState(props.initPeer||null);
  const [peerName,setPeerName]=React.useState(props.initName||'');
  const [msgs,setMsgs]=React.useState([]);
  const [text,setText]=React.useState('');
  const [busy,setBusy]=React.useState(false);
  const endRef=React.useRef(null);

  async function loadConvs(){const r=await sb.rpc('my_conversations');if(r.data)setConvs(r.data);}
  async function loadThread(id){
    const r=await sb.from('messages').select('*')
      .or('and(sender_id.eq.'+props.me+',recipient_id.eq.'+id+'),and(sender_id.eq.'+id+',recipient_id.eq.'+props.me+')')
      .order('created_at',{ascending:true}).limit(200);
    if(r.data)setMsgs(r.data);
    await sb.rpc('mark_msgs_read',{p_peer:id});
    props.refreshUnread();
  }
  React.useEffect(function(){loadConvs();},[]);
  React.useEffect(function(){if(peer)loadThread(peer);},[peer]);
  React.useEffect(function(){if(endRef.current)endRef.current.scrollIntoView({behavior:'smooth'});},[msgs]);
  React.useEffect(function(){
    const ch=sb.channel('msg-live-'+props.me+'-'+Math.random().toString(36).slice(2))
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(p){
        const m=p.new;
        if(m.sender_id===props.me||m.recipient_id===props.me){
          if(peer&&(m.sender_id===peer||m.recipient_id===peer))setMsgs(function(x){return x.concat([m]);});
          loadConvs();props.refreshUnread();
        }}).subscribe();
    return function(){sb.removeChannel(ch);};
  },[peer]);

  async function send(e){
    e.preventDefault();
    if(!text.trim()||!peer)return;
    setBusy(true);
    const r=await sb.from('messages').insert({sender_id:props.me,recipient_id:peer,body:text.trim()});
    if(r.error)props.toast(r.error.message,'error');else{setText('');loadConvs();}
    setBusy(false);
  }

  return <section className="fade">
    <h3 className="text-3xl font-black text-white border-l-4 border-cyanNeon pl-4 mb-6">MESSAGES</h3>
    <div className="grid md:grid-cols-3 gap-4 h-[560px]">
      <div className={'card rounded-2xl p-3 overflow-y-auto '+(peer?'hidden md:block':'')}>
        <p className="text-[10px] font-black text-gray-500 uppercase tracking-widest px-2 py-1">Conversations</p>
        {convs.length===0?<p className="text-xs text-gray-500 text-center py-10">Aucune conversation.<br/>Va sur le profil d'un producteur et clique sur 💬</p>:
        convs.map(function(c){
          return <button key={c.peer_id} onClick={function(){setPeer(c.peer_id);setPeerName(c.peer_name);}} className={'w-full flex items-center gap-3 p-2.5 rounded-xl transition text-left '+(peer===c.peer_id?'bg-cyanNeon/10 border border-cyanNeon/40':'hover:bg-white/5')}>
            <img src={c.peer_avatar||AV} className="w-10 h-10 rounded-full object-cover flex-shrink-0" alt=""/>
            <div className="min-w-0 flex-1"><p className="text-sm font-bold text-white truncate">{c.peer_name}</p>
              <p className="text-[11px] text-gray-500 truncate">{c.last_body}</p></div>
            {c.unread>0?<span className="bg-pinkNeon text-black text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center">{c.unread}</span>:null}
          </button>;})}
      </div>
      <div className={'md:col-span-2 card rounded-2xl flex flex-col '+(peer?'':'hidden md:flex')}>
        {!peer?<div className="flex-1 flex items-center justify-center text-gray-500 text-sm">Sélectionne une conversation</div>:
        <React.Fragment>
          <div className="flex items-center gap-3 p-4 border-b border-borderDark">
            <button onClick={function(){setPeer(null);}} className="md:hidden text-gray-400"><Icon n="back" c="w-5 h-5"/></button>
            <p className="font-black text-white flex-1">{peerName}</p>
            <button onClick={function(){props.openProducer(peer);}} className="text-xs font-bold text-cyanNeon hover:underline">Voir le profil</button>
          </div>
          <div className="flex-1 overflow-y-auto p-4 space-y-2.5">
            {msgs.length===0?<p className="text-center text-xs text-gray-500 py-10">Démarre la conversation 👋</p>:
            msgs.map(function(m){
              const me=m.sender_id===props.me;
              return <div key={m.id} className={'flex '+(me?'justify-end':'justify-start')}>
                <div><div className={'bub '+(me?'bme':'byou')}>{m.body}</div>
                <p className={'text-[9px] text-gray-600 mt-1 '+(me?'text-right':'')}>{ago(m.created_at)}</p></div></div>;})}
            <div ref={endRef}></div>
          </div>
          <form onSubmit={send} className="p-3 border-t border-borderDark flex gap-2">
            <input type="text" value={text} maxLength="1000" onChange={function(e){setText(e.target.value);}} placeholder="Écris ton message..." className="flex-1 bg-obsidian border border-borderDark rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-cyanNeon"/>
            <button type="submit" disabled={busy||!text.trim()} className="bg-cyanNeon text-black font-black px-5 rounded-xl disabled:opacity-40"><Icon n="send" c="w-5 h-5"/></button>
          </form>
        </React.Fragment>}
      </div>
    </div>
  </section>;
}

function infosHtml(sec){
  if(!window.INFOS_B64) return '<html><body style="background:#050508;color:#f8fafc;font-family:Inter,sans-serif;padding:40px"><p>Guide non disponible.</p></body></html>';
  const bytes=Uint8Array.from(atob(window.INFOS_B64),function(c){return c.charCodeAt(0);});
  const h=new TextDecoder('utf-8').decode(bytes);
  const js='<script>window.addEventListener("load",function(){var e=document.getElementById('+JSON.stringify(sec)+');if(e)setTimeout(function(){e.scrollIntoView();},350);});<'+'/script></body>';
  return h.replace('</body>',function(){return js;});
}
function GuideOverlay(){
  const [sec,setSec]=React.useState(null);
  React.useEffect(function(){
    window.openGuide=function(s){setSec(s||'top');};
    function onMsg(e){if(e.data==='yan-close')setSec(null);}
    function onKey(e){if(e.key==='Escape')setSec(null);}
    window.addEventListener('message',onMsg);window.addEventListener('keydown',onKey);
    return function(){window.removeEventListener('message',onMsg);window.removeEventListener('keydown',onKey);};
  },[]);
  if(sec===null)return null;
  return <div className="fixed inset-0 z-[300] bg-obsidian"><iframe key={sec} srcDoc={infosHtml(sec)} title="Guide" className="w-full h-full border-0"></iframe></div>;
}

      else{setProfile(null);setPurchases([]);setMyOrders([]);setAdminOrders([]);setNotifications([]);}});

    function onEnd(){setPlaying(false);setProgress(0);}
    function onTime(){setTime(a.currentTime);setProgress((a.currentTime/a.duration)*100||0);}
    function onMeta(){setDuration(a.duration);}
    a.addEventListener('ended',onEnd);a.addEventListener('timeupdate',onTime);a.addEventListener('loadedmetadata',onMeta);
    return function(){sub.data.subscription.unsubscribe();a.removeEventListener('ended',onEnd);a.removeEventListener('timeupdate',onTime);a.removeEventListener('loadedmetadata',onMeta);};
  },[]);

  React.useEffect(function(){function onMove(e){setSpot({x:e.clientX,y:e.clientY});}window.addEventListener('mousemove',onMove);return function(){window.removeEventListener('mousemove',onMove);};},[]);
  React.useEffect(function(){
    const els=document.querySelectorAll('.reveal');
    const io=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting)e.target.classList.add('in');});},{threshold:.12});

    return function(){io.disconnect();};

    const ch=sb.channel('notif-'+session.user.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+session.user.id},function(p){
        setNotifications(function(prev){return [p.new].concat(prev).slice(0,30);});toast('🔔 '+p.new.title);})

        loadMsgUnread();if(view!=='messages')toast('💬 Nouveau message');})
      .subscribe();
    return function(){sb.removeChannel(ch);};
  },[session&&session.user.id,view]);

  async function loadTracks(){const r=await sb.from('tracks').select('*').order('created_at',{ascending:false});if(r.data)setTracks(r.data);setTracksReady(true);}

    if(r.data){setProfile(r.data);setProfileErr(null);return;}
    if(r.error){setProfileErr(r.error.message);return;}
    if(tries<2){setTimeout(function(){loadProfile(uid,tries+1);},1500);return;}
    const u=(await sb.auth.getUser()).data.user;
    const ins=await sb.from('profiles').insert({id:uid,name:(u.user_metadata&&u.user_metadata.full_name)||u.email.split('@')[0],email:u.email,role:(u.user_metadata&&u.user_metadata.role)||'visitor'}).select().single();

  async function loadFavs(uid){const r=await sb.from('favorites').select('track_id').eq('user_id',uid);if(r.data)setFavs(r.data.map(function(x){return x.track_id;}));}

  async function submitOrder(item,license,amount,rate,proof,legal){
    if(!proof){toast('Ajoute la capture du paiement','error');return;}
    if(proof.size>5*1024*1024){toast('Image max 5MB','error');return;}
    try{
      const sa=Math.floor(amount*(1-rate/100));const fee=amount-sa;
      const pn=session.user.id+'/'+Date.now()+'-proof.'+proof.name.split('.').pop();
      const up=await sb.storage.from('payment-proofs').upload(pn,proof);
      if(up.error)throw new Error('Envoi de la capture échoué : '+up.error.message);
      const url=pn;
      const r=await sb.from('orders').insert({buyer_id:session.user.id,seller_id:item.producer_id,track_id:item.id,
        product_type:item.type,license_type:license,amount:amount,seller_amount:sa,platform_fee:fee,rate_percent:rate,
        proof_url:url,accepted_at:new Date().toISOString(),buyer_legal_name:(legal||'').trim()||null});
      if(r.error)throw r.error;
      toast('Commande envoyée ! Contrat disponible après validation.');
      setBuyItem(null);loadMyOrders(session.user.id);
      if(profile&&profile.is_admin)loadAdminOrders();
    }catch(ex){toast(ex.message,'error');}}

    if(!p.track||!p.track.file_path){toast('Fichier indisponible','error');return;}
    const r=await sb.storage.from('vst-files').createSignedUrl(p.track.file_path,120,{download:true});
    if(r.error){toast(r.error.message,'error');return;}
    window.open(r.data.signedUrl,'_blank');}

  async function saveProfile(d){
    try{
      let url=profile.avatar_url;
      if(d.avatar){
        if(d.avatar.size>5*1024*1024)throw new Error('Image max 5MB');
        const n=profile.id+'-'+Date.now()+'.'+d.avatar.name.split('.').pop();
        const up=await sb.storage.from('avatars').upload(n,d.avatar,{upsert:true});
        if(up.error)throw up.error;
        url=sb.storage.from('avatars').getPublicUrl(n).data.publicUrl;}
      const r=await sb.from('profiles').update({name:d.name,legal_name:(d.legal_name||'').trim()||null,
        rip:d.rip,bio:d.bio,instagram:d.instagram,avatar_url:url,role:d.role||profile.role||'visitor'}).eq('id',profile.id).select().single();
      if(r.error)throw r.error;
      setProfile(r.data);toast('Profil sauvegardé !');setView('dashboard');
    }catch(ex){toast(ex.message,'error');}}

  async function uploadTrack(d){
    try{
      if(!d.title.trim())throw new Error('Titre obligatoire');
      if(d.type==='vst'&&!d.file)throw new Error('Ajoute le fichier du plugin');
      if(d.file&&d.file.size>50*1024*1024)throw new Error('Fichier max 50MB');
      if(d.cover&&d.cover.size>5*1024*1024)throw new Error('Pochette max 5MB');
      let coverUrl=DC,audioUrl='',filePath=null,hash=null;
      if(d.cover){
        const n=profile.id+'-'+Date.now()+'-c.'+d.cover.name.split('.').pop();
        const up=await sb.storage.from('covers').upload(n,d.cover);
        if(!up.error)coverUrl=sb.storage.from('covers').getPublicUrl(n).data.publicUrl;}
      let audioWav='',audioStems='',audioExc='';
      if(d.type==='vst'){
        if(!d.file)throw new Error('Ajoute le fichier du plugin');
        if(d.file.size>50*1024*1024)throw new Error('Fichier max 50MB');
        hash=await sha256File(d.file);
        const safe=d.file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const path=profile.id+'/'+Date.now()+'-'+safe;
        const up=await sb.storage.from('vst-files').upload(path,d.file);
        if(up.error)throw new Error('Upload échoué : '+up.error.message);
        filePath=path;
      }else{
        if(!d.fmp3)throw new Error('Fichier MP3 obligatoire');
        async function upAudio(f,suffix){
          if(!f)return '';
          if(f.size>50*1024*1024)throw new Error('Fichier max 50MB');
          const n=profile.id+'-'+Date.now()+'-'+suffix+'.'+f.name.split('.').pop();
          const up=await sb.storage.from('audio').upload(n,f);
          if(up.error)throw new Error('Upload échoué : '+up.error.message);
          return n;
        }
        audioUrl=await upAudio(d.fmp3,'mp3');
        audioWav=await upAudio(d.fwav,'wav');
        audioStems=await upAudio(d.fstems,'stems');
        audioExc=await upAudio(d.fexc,'exc');
        hash=await sha256File(d.fmp3);
      }
      const row={title:d.title.trim(),type:d.type,genre:d.genre,bpm:parseInt(d.bpm,10)||140,key:d.key,
        producer_id:profile.id,producer_name:profile.name,cover_url:coverUrl,audio_url:audioUrl,
        audio_wav_url:audioWav||null,audio_stems_url:audioStems||null,audio_exclusive_url:audioExc||null,
        price_mp3:parseInt(d.p1,10)||0,price_wav:parseInt(d.p2,10)||0,price_stems:parseInt(d.p3,10)||0,
        price_exclusive:parseInt(d.p4,10)||0,
        description:d.desc.trim()||(d.type==='vst'?'Plugin VST':'Beat '+d.genre)};
      if(filePath)row.file_path=filePath;
      if(hash)row.file_hash=hash;
      if(d.limits)row.limits=d.limits;
      const r=await sb.from('tracks').insert(row);
      if(r.error)throw r.error;
      toast('Publié ! Abonnés notifiés 🔔');
      loadTracks();setView('dashboard');return true;
    }catch(ex){toast(ex.message,'error');return false;}}

  async function removeTrack(id){
    if(!confirm('Supprimer ?'))return;
    const r=await sb.from('tracks').delete().eq('id',id);
    if(r.error){toast(r.error.code==='23503'?'Impossible : ce produit a des ventes.':r.error.message,'error');return;}
    toast('Supprimé.');loadTracks();}

  function openBuy(item){if(!session){toast('Connecte-toi','error');return;}setBuyItem(item);}
  function share(){copy(window.location.href);}

  if(loading)return <div className="min-h-screen flex items-center justify-center relative overflow-hidden"><MatrixRain/><div className="relative z-10 w-16 h-16 rounded-2xl bg-black/60 border border-green-500/50 font-black text-3xl gg flex items-center justify-center animate-pulse backdrop-blur"><span style={{color:'#00a651'}}>٢</span><span style={{color:'#ffffff'}}>١</span><span style={{color:'#d52b1e'}}>٣</span></div></div>;
  if(!session)return <React.Fragment>
    <Toasts items={toasts} remove={function(id){setToasts(function(p){return p.filter(function(t){return t.id!==id;});});}}/>
    <AuthPage toast={toast}/><GuideOverlay/></React.Fragment>;
  if(!profile)return <div className="min-h-screen flex items-center justify-center p-4"><div className="card p-8 rounded-2xl text-center max-w-md">
    {profileErr?<React.Fragment><h2 className="text-xl font-black text-white mb-2">Profil inaccessible</h2>
    <p className="text-xs text-red-400 mb-4">{profileErr}</p>
    <button onClick={logout} className="bg-cyanNeon text-black px-6 py-3 rounded-xl font-bold">Se déconnecter</button></React.Fragment>
    :<div className="loader mx-auto"></div>}</div></div>;

  const myKeys=purchases.filter(function(p){return p.license_type==='vst'&&p.vst_key;});
  const pendingCount=adminOrders.filter(function(o){return o.status==='pending';}).length
    +withdrawals.filter(function(w){return w.status==='pending';}).length;
  const unread=notifications.filter(function(n){return !n.is_read;}).length;
  const pmap={};
  allProfiles.forEach(function(p){pmap[p.id]={id:p.id,name:p.name||'Producteur',avatar_url:p.avatar_url||null,count:0,plays:0,role:p.role||'visitor'};});
  tracks.forEach(function(t){
    if(!t.producer_id)return;
    if(!pmap[t.producer_id])pmap[t.producer_id]={id:t.producer_id,name:t.producer_name||'Producteur',avatar_url:null,count:0,plays:0,role:'producer'};
    pmap[t.producer_id].count++;pmap[t.producer_id].plays+=(t.plays||0);});
  if(pmap[profile.id])pmap[profile.id].avatar_url=profile.avatar_url;
  const producers=Object.keys(pmap).map(function(k){return pmap[k];}).filter(function(p){return p.role==='producer'||(!p.role&&p.count>0);}).sort(function(a,b){return b.count-a.count;});

  return <div className="relative">
    <Toasts items={toasts} remove={function(id){setToasts(function(p){return p.filter(function(t){return t.id!==id;});});}}/>
    <div className="aurora"></div>
    <div className="spotlight" style={{left:spot.x-200,top:spot.y-200}}></div>
    <div className="cursor-dot" style={{left:spot.x,top:spot.y}}></div>
    <div className="cursor-ring" style={{left:spot.x,top:spot.y}}></div>
    <NavBar view={view} setView={setView} profile={profile} email={session.user.email} logout={logout} pending={pendingCount}
      notifications={notifications} unread={unread} markRead={markRead} openProducer={openProducer} msgUnread={msgUnread}/>
    <MobileNav view={view} setView={setView} hasPlayer={!!current} msgUnread={msgUnread} isAdmin={profile.is_admin}/>

    <div key={view} className="pt-28 pb-10 px-4 md:px-6 max-w-7xl mx-auto fade">
      {view!=='home'?<button onClick={function(){setView('home');}} className="mb-6 flex items-center gap-2 text-gray-400 text-sm font-bold hover:text-white transition"><Icon n="back" c="w-4 h-4"/>{tr('Retour')}</button>:null}

      {view==='home'?<HomeView setView={setView} producers={producers} openProducer={openProducer} tracks={tracks} ready={tracksReady} play={play} playing={playing} current={current} buy={openBuy} favs={favs} toggleFav={toggleFav} ratings={ratings} openReviews={setReviewTrack}/>:null}
      {view==='beats'?<BeatsView ready={tracksReady} tracks={tracks} producers={producers} play={play} playing={playing} current={current} buy={openBuy} openProducer={openProducer} favs={favs} toggleFav={toggleFav} ratings={ratings} openReviews={setReviewTrack}/>:null}
      {view==='vsts'?<VstsView tracks={tracks} myKeys={myKeys} buy={openBuy} setView={setView} openProducer={openProducer} favs={favs} toggleFav={toggleFav} ratings={ratings} openReviews={setReviewTrack}/>:null}
      {view==='favs'?<FavsView tracks={tracks} favs={favs} toggleFav={toggleFav} play={play} playing={playing} current={current} buy={openBuy} openProducer={openProducer}/>:null}
      {view==='artists'?<ArtistsView producers={producers} openProducer={openProducer}/>:null}
      {view==='me'?<ProducerPage id={profile.id} me={profile.id} tracks={tracks} play={play} playing={playing} current={current} buy={openBuy} toast={toast} setView={setView} share={share} openChat={openChat}/>:null}
      {(view==='producer'&&producerId)?<ProducerPage id={producerId} me={profile.id} tracks={tracks} play={play} playing={playing} current={current} buy={openBuy} toast={toast} setView={setView} share={share} openChat={openChat}/>:null}
      {view==='myorders'?<MyOrdersView orders={myOrders} copy={copy} pdf={pdf}/>:null}
      {view==='keys'?<KeysView purchases={purchases} copy={copy} download={downloadVst} pdf={pdf}/>:null}
      {view==='messages'?<MessagesView me={session.user.id} initPeer={chatPeer} initName={chatName} toast={toast} openProducer={openProducer} refreshUnread={loadMsgUnread}/>:null}
      {view==='verify'?<VerifyView myKeys={myKeys}/>:null}
      {view==='dashboard'?<DashboardView profile={profile} email={session.user.email} tracks={tracks} setView={setView} withdraw={requestWithdrawal} remove={removeTrack} followers={myFollowers} openProducer={openProducer} pdf={pdf}/>:null}
      {view==='upload'?<UploadView profile={profile} upload={uploadTrack}/>:null}
      {view==='settings'?<SettingsView profile={profile} save={saveProfile}/>:null}
      {(view==='admin'&&profile.is_admin)?<AdminView orders={adminOrders} withdrawals={withdrawals} validate={validateOrder} refuse={refuseOrder} payWd={payWithdrawal} pdf={pdf}/>:null}
    </div>

    {reviewTrack?<ReviewsModal track={reviewTrack} me={session.user.id} profile={profile} bought={purchases.some(function(p){return p.track_id===reviewTrack.id;})} close={function(){setReviewTrack(null);}} toast={toast} refresh={loadRatings}/>:null}
    <GuideOverlay/>
    {buyItem?<BuyModal item={buyItem} close={function(){setBuyItem(null);}} submit={submitOrder}/>:null}
    {current?<Player track={current} playing={playing} play={play} progress={progress} duration={duration} time={time}
      seek={seek} volume={volume} muted={muted} setVolume={changeVolume} toggleMute={toggleMute} buy={openBuy} openProducer={openProducer}/>:null}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Boundary><App/></Boundary>);
</script>
